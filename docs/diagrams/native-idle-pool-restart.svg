<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 892 897" width="892" height="897" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="446" y="40.75">New project share · idle restart</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M550.95,38L550.95,99"/><path class="pele-marker" d="M550.95,106L547.59,98L554.31,98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M534.95,149C534.95,155.13 89.77,167.38 89.77,173.5L89.77,591"/><path class="pele-marker" d="M89.77,598L86.41,590L93.13,590Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M550.95,149C550.95,158.25 512.78,158.25 512.78,167.5L512.78,222"/><path class="pele-marker" d="M512.78,229L509.42,221L516.14,221Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M566.95,149C566.95,159.2 802.32,163.3 802.32,173.5L802.32,641C802.32,675 623.71,675 623.71,709L623.71,714"/><path class="pele-marker" d="M623.71,721L620.35,713L627.07,713Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M512.78,272L512.78,284C512.78,293.25 462.91,293.25 462.91,302.5L462.91,357"/><path class="pele-marker" d="M462.91,364L459.55,356L466.27,356Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M512.78,272L512.78,284C512.78,296.25 623.71,296.25 623.71,308.5L623.71,714"/><path class="pele-marker" d="M623.71,721L620.35,713L627.07,713Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M462.91,407L462.91,461.5C462.91,468.44 406.43,468.44 406.43,475.38L406.43,480"/><path class="pele-marker" d="M406.43,487L403.07,479L409.79,479Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M462.91,407L462.91,419C462.91,431.25 519.38,431.25 519.38,443.5L519.38,677.5C519.38,693.25 623.71,693.25 623.71,709L623.71,714"/><path class="pele-marker" d="M623.71,721L620.35,713L627.07,713Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M406.43,530L406.43,572.5C406.43,575.97 105.77,582.91 105.77,586.38L105.77,591"/><path class="pele-marker" d="M105.77,598L102.41,590L109.13,590Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M93.77,641C93.77,650.25 74.8,650.25 74.8,659.5L74.8,717.5L74.8,714"/><path class="pele-marker" d="M74.8,721L71.44,713L78.16,713Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M109.77,641C109.77,645.63 449.02,654.88 449.02,659.5L449.02,683.5C449.02,696.25 623.71,696.25 623.71,709L623.71,714"/><path class="pele-marker" d="M623.71,721L620.35,713L627.07,713Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M74.8,764L74.8,767.5C74.8,787.25 293.79,787.25 293.79,807L293.79,813"/><path class="pele-marker" d="M293.79,820L290.43,812L297.15,812Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M623.71,764L623.71,776C623.71,787.65 293.79,795.35 293.79,807L293.79,813"/><path class="pele-marker" d="M293.79,820L290.43,812L297.15,812Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="first-first----note-13"><path d="M540.86,250.5L584.86,250.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="second----note-14-second"><path d="M378.73,385.5L422.73,385.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="boot-boot----note-15"><path d="M105.39,742.5L149.39,742.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="refused----note-16-refused"><path d="M538.69,742.5L582.69,742.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="503.23" y="58.5" width="95.44" height="20" rx="3" fill="var(--_bg)"/><text x="550.95" y="73.05" text-anchor="middle">root not shared</text></g><g class="pele-edge-label" data-id="edge1"><rect x="44.93" y="375.5" width="89.67" height="20" rx="3" fill="var(--_bg)"/><text x="89.77" y="390.05" text-anchor="middle">[pool stopped]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="444.84" y="169.5" width="135.88" height="20" rx="3" fill="var(--_bg)"/><text x="512.78" y="184.05" text-anchor="middle">[running, provider live]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="739.43" y="375.5" width="125.78" height="20" rx="3" fill="var(--_bg)"/><text x="802.32" y="390.05" text-anchor="middle">[starting or stopping]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="407.6" y="304.5" width="110.61" height="20" rx="3" fill="var(--_bg)"/><text x="462.91" y="319.05" text-anchor="middle">[idle, under lease]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="598.75" y="498.5" width="49.91" height="20" rx="3" fill="var(--_bg)"/><text x="623.71" y="513.05" text-anchor="middle">[in use]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="433.99" y="439.5" width="57.84" height="20" rx="3" fill="var(--_bg)"/><text x="462.91" y="454.05" text-anchor="middle">[still idle]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="466.61" y="498.5" width="105.54" height="20" rx="3" fill="var(--_bg)"/><text x="519.38" y="513.05" text-anchor="middle">[a start went live]</text></g><g class="pele-edge-label" data-id="edge8"><rect x="361.6" y="550.5" width="89.67" height="20" rx="3" fill="var(--_bg)"/><text x="406.43" y="565.05" text-anchor="middle">guest stopped</text></g><g class="pele-edge-label" data-id="edge9"><rect x="26" y="661.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="74.8" y="676.05" text-anchor="middle">share journaled</text></g><g class="pele-edge-label" data-id="edge10"><rect x="388.66" y="661.5" width="120.72" height="20" rx="3" fill="var(--_bg)"/><text x="449.02" y="676.05" text-anchor="middle">[booted meanwhile]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(550.95,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="status" transform="translate(550.95,127.5)"><rect x="-36.01" y="-21.5" width="72.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">status</text></g><g class="pele-node pele-state" data-id="add" transform="translate(101.77,619.5)"><rect x="-28.51" y="-21.5" width="57.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">add</text></g><g class="pele-node pele-state wait" data-id="stop" transform="translate(406.43,508.5)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stop</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(293.79,829)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="first" transform="translate(512.78,250.5)"><rect x="-28.08" y="-21.5" width="56.17" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">first</text></g><g class="pele-node pele-state fail" data-id="refused" transform="translate(623.71,742.5)"><rect x="-41.01" y="-21.5" width="82.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">refused</text></g><g class="pele-node pele-state" data-id="second" transform="translate(462.91,385.5)"><rect x="-40.18" y="-21.5" width="80.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">second</text></g><g class="pele-node pele-state ok" data-id="boot" transform="translate(74.8,742.5)"><rect x="-30.59" y="-21.5" width="61.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">boot</text></g><g class="pele-note" data-id="first----note-13" transform="translate(679.59,250.5)"><path d="M-94.73,-33.5H86.73L94.73,-25.5V33.5H-94.73Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M86.73,-33.5V-25.5H94.73" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Live run, pending recovery,</tspan><tspan x="0" y="4.55">open session or image build:</tspan><tspan x="0" y="21.55">in use. Unreadable: in use.</tspan></text></g><g class="pele-note" data-id="refused----note-16" transform="translate(446.85,742.5)"><path d="M-91.84,-33.5H83.84L91.84,-25.5V33.5H-91.84Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M83.84,-33.5V-25.5H91.84" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Names up to three projects:</tspan><tspan x="0" y="4.55">down there, then up again.</tspan><tspan x="0" y="21.55">Nothing was released.</tspan></text></g><g class="pele-note" data-id="second----note-14" transform="translate(279.66,385.5)"><path d="M-99.07,-33.5H91.07L99.07,-25.5V33.5H-99.07Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.07,-33.5V-25.5H99.07" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Right before the guest stops,</tspan><tspan x="0" y="4.55">under the provider lease. Host</tspan><tspan x="0" y="21.55">releases follow it.</tspan></text></g><g class="pele-note" data-id="boot----note-15" transform="translate(232.2,742.5)"><path d="M-82.81,-25H74.81L82.81,-17V25H-82.81Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M74.81,-25V-17H82.81" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">One line says so; this up</tspan><tspan x="0" y="13.05">then boots the pool.</tspan></text></g></g></g></svg>