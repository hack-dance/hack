name: pattern-p01
services:
  # One-shot initializer for the immutable dependency payload (HACK-P01).
  install:
    image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
    platform: linux/arm64
    working_dir: /app
    entrypoint: []
    command: ["bun", "install", "--frozen-lockfile"]
    labels:
      hack.dependencies.cache-volume: dependencies
      hack.dependencies.lockfiles: bun.lock
      hack.dependencies.runtime-files: package.json,packages/greeting/package.json,packages/greeting/index.js
      hack.dependencies.cache-protocol: locked-v1
      hack.dependencies.cache-generation: "0"
      hack.dependencies.cache-verify: '["bun", "-e", "require.resolve(\"greeting\")"]'
    volumes:
      - ..:/app
      - dependencies:/app/node_modules

  # Worktree-specific generation: always runs, owns its own output volume.
  generate:
    image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
    platform: linux/arm64
    working_dir: /app
    command: ["bun", "scripts/generate.ts"]
    depends_on:
      install:
        condition: service_completed_successfully
    volumes:
      - ..:/app
      - dependencies:/app/node_modules:ro
      - generated:/generated

  app:
    image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
    platform: linux/arm64
    working_dir: /app
    command: ["bun", "src/server.ts"]
    depends_on:
      install:
        condition: service_completed_successfully
      generate:
        condition: service_completed_successfully
    volumes:
      - ..:/app
      - dependencies:/app/node_modules:ro
      - generated:/generated:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dependencies: {}
  generated: {}
