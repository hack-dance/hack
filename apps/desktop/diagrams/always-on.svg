<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 719 548" width="719" height="548" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="359.5" y="40.75">Always-on · one project</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M416.11,38L416.12,82L416.12,78.5"/><path class="pele-marker" d="M416.12,85.5L412.76,77.5L419.48,77.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M416.12,128.5L416.12,132C416.12,139.77 167.1,146.23 167.1,154L167.1,200L167.1,196.5"/><path class="pele-marker" d="M167.1,203.5L163.74,195.5L170.46,195.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M167.1,203.5L167.1,200C167.1,192.23 416.11,185.77 416.11,178L416.12,132L416.12,135.5"/><path class="pele-marker" d="M416.12,128.5L419.48,136.5L412.76,136.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M167.1,246.5L167.1,250C167.1,267.36 147.99,278 116.8,278C85.61,278 66.49,297.76 66.49,330L66.49,354C66.49,393.68 108.37,418 176.71,418C245.05,418 286.93,423.99 286.93,433.75L286.93,439"/><path class="pele-marker" d="M286.93,446L283.57,438L290.29,438Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M302.93,446L302.93,433C302.93,416.26 277.26,406 235.38,406C193.5,406 167.83,386.24 167.83,354L167.83,330C167.83,310 167.1,310 167.1,290L167.1,250L167.1,253.5"/><path class="pele-marker" d="M167.1,246.5L170.46,254.5L163.74,254.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M318.93,446L318.93,433C318.93,416.26 352.05,406 406.1,406C460.15,406 493.27,383.96 493.27,348L493.27,160C493.27,146 416.12,146 416.12,132L416.12,135.5"/><path class="pele-marker" d="M416.12,128.5L419.48,136.5L412.76,136.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M167.1,246.5L167.1,250C167.1,274.8 186.22,290 217.41,290C248.6,290 267.71,305.2 267.71,330L267.71,354C267.71,378.8 315.17,394 392.6,394C470.04,394 517.49,408.82 517.49,433L517.49,439"/><path class="pele-marker" d="M517.49,446L514.13,438L520.85,438Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M533.49,446L533.49,433C533.49,401.38 499.57,382 444.22,382C388.87,382 354.95,371.36 354.95,354L354.95,330C354.95,297.76 319.26,278 261.03,278C202.79,278 167.1,267.36 167.1,250L167.1,253.5"/><path class="pele-marker" d="M167.1,246.5L170.46,254.5L163.74,254.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M575.46,446L575.46,160C575.46,146 416.12,146 416.12,132L416.12,135.5"/><path class="pele-marker" d="M416.12,128.5L419.48,136.5L412.76,136.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Off-Off----note-9"><path d="M444.12,107L488.12,107"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="On-On----note-10"><path d="M195.1,225L239.1,225"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="127.34" y="156" width="79.53" height="20" rx="3" fill="var(--_bg)"/><text x="167.1" y="170.55" text-anchor="middle">switch on ok</text></g><g class="pele-edge-label" data-id="edge2"><rect x="376.35" y="156" width="79.53" height="20" rx="3" fill="var(--_bg)"/><text x="416.11" y="170.55" text-anchor="middle">switch off ok</text></g><g class="pele-edge-label" data-id="edge3"><rect x="26" y="332" width="80.98" height="20" rx="3" fill="var(--_bg)"/><text x="66.49" y="346.55" text-anchor="middle">manual Stop</text></g><g class="pele-edge-label" data-id="edge4"><rect x="126.98" y="332" width="81.7" height="20" rx="3" fill="var(--_bg)"/><text x="167.83" y="346.55" text-anchor="middle">manual Start</text></g><g class="pele-edge-label" data-id="edge5"><rect x="462.18" y="215" width="62.18" height="20" rx="3" fill="var(--_bg)"/><text x="493.27" y="229.55" text-anchor="middle">switch off</text></g><g class="pele-edge-label" data-id="edge6"><rect x="228.68" y="332" width="78.07" height="20" rx="3" fill="var(--_bg)"/><text x="267.71" y="346.55" text-anchor="middle">max failures</text></g><g class="pele-edge-label" data-id="edge7"><rect x="326.75" y="332" width="56.4" height="20" rx="3" fill="var(--_bg)"/><text x="354.95" y="346.55" text-anchor="middle">Retry ok</text></g><g class="pele-edge-label" data-id="edge8"><rect x="544.36" y="215" width="62.18" height="20" rx="3" fill="var(--_bg)"/><text x="575.46" y="229.55" text-anchor="middle">switch off</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(416.11,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="Paused" transform="translate(302.93,467.5)"><rect x="-41.43" y="-21.5" width="82.87" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:2 2;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Paused</text></g><g class="pele-node pele-state fail" data-id="NeedsAttention" transform="translate(540.77,467.5)"><rect x="-67.28" y="-21.5" width="134.56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:2px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">NeedsAttention</text></g><g class="pele-node pele-state" data-id="Off" transform="translate(416.12,107)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Off</text></g><g class="pele-node pele-state live" data-id="On" transform="translate(167.1,225)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">On</text></g><g class="pele-note" data-id="Off----note-9" transform="translate(591.15,107)"><path d="M-103.04,-25H95.04L103.04,-17V25H-103.04Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.04,-25V-17H103.04" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV a failed autostart command</tspan><tspan x="0" y="13.05">leaves the switch where it was</tspan></text></g><g class="pele-note" data-id="On----note-10" transform="translate(335.64,225)"><path d="M-96.54,-25H88.54L96.54,-17V25H-96.54Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M88.54,-25V-17H96.54" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV global pause holds every</tspan><tspan x="0" y="13.05">project without changing it</tspan></text></g></g></g></svg>