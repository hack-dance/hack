<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 489 1004" width="489" height="1004" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_input_paths_0"><path d="M180.46,71L180.46,112"/><path class="pele-marker" d="M180.46,119L177.1,111L183.82,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_paths_refuse_0"><path d="M155.76,238.36C155.76,256.33 85.77,256.33 85.77,274.3L85.77,318.8"/><path class="pele-marker" d="M85.77,325.8L82.41,317.8L89.13,317.8Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_paths_version_0"><path d="M205.16,238.36C205.16,256.33 275.15,256.33 275.15,274.3L275.15,318.8"/><path class="pele-marker" d="M275.15,325.8L271.79,317.8L278.51,317.8Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_version_projects_0"><path d="M275.15,372.8L275.15,413.8"/><path class="pele-marker" d="M275.15,420.8L271.79,412.8L278.51,412.8Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_projects_blocked_0"><path d="M250.95,539.42C250.95,582.98 183.17,582.98 183.17,626.54L183.17,830.49"/><path class="pele-marker" d="M183.17,837.49L179.81,829.49L186.53,829.49Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_projects_network_0"><path d="M299.35,539.42C299.35,557.23 353.33,557.23 353.33,575.04L353.33,619.54"/><path class="pele-marker" d="M353.33,626.54L349.97,618.54L356.69,618.54Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_network_blocked_0"><path d="M326.63,748.81C326.63,767.4 208.37,767.4 208.37,785.99L208.37,830.49"/><path class="pele-marker" d="M208.37,837.49L205.01,829.49L211.73,829.49Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_network_limited_0"><path d="M377.08,750.65L377.08,830.49"/><path class="pele-marker" d="M377.08,837.49L373.72,829.49L380.44,829.49Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_blocked_stop_0"><path d="M191.17,884.49C191.17,901.99 240.86,901.99 240.86,919.49L240.86,925.49"/><path class="pele-marker" d="M240.86,932.49L237.5,924.49L244.22,924.49Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_limited_stop_0"><path d="M377.08,884.49C377.08,901.99 325.44,901.99 325.44,919.49L325.44,925.49"/><path class="pele-marker" d="M325.44,932.49L322.08,924.49L328.8,924.49Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_paths_refuse_0"><rect x="73.46" y="276.3" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="85.77" y="290.85" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_paths_version_0"><rect x="259.95" y="276.3" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="275.15" y="290.85" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_projects_blocked_0"><rect x="167.97" y="686.02" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="183.17" y="700.57" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_projects_network_0"><rect x="341.02" y="577.04" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="353.33" y="591.59" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_network_blocked_0"><rect x="193.17" y="787.99" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="208.37" y="802.54" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_network_limited_0"><rect x="364.77" y="787.99" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="377.08" y="802.54" text-anchor="middle">No</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="input" transform="translate(180.46,47.5)"><rect x="-81.99" y="-23.5" width="163.98" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Built binary + paths</text></g><g class="pele-node pele-shape-diam" data-id="paths" transform="translate(180.46,186.4)"><polygon points="0,-67.4 107.84,0 0,67.4 -107.84,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Contained new home?</text></g><g class="pele-node pele-shape-rect" data-id="refuse" transform="translate(85.77,349.3)"><rect x="-61.77" y="-23.5" width="123.54" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exit 2: refuse</text></g><g class="pele-node pele-shape-rect" data-id="version" transform="translate(275.15,349.3)"><rect x="-87.61" y="-23.5" width="175.22" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Print isolated version</text></g><g class="pele-node pele-shape-diam" data-id="projects" transform="translate(275.15,487.67)"><polygon points="0,-66.87 107,0 0,66.87 -107,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Shared projects exist?</text></g><g class="pele-node pele-shape-rect" data-id="blocked" transform="translate(191.17,860.99)"><rect x="-66.77" y="-23.5" width="133.55" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exit 3: blocked</text></g><g class="pele-node pele-shape-diam" data-id="network" transform="translate(353.33,696.02)"><polygon points="0,-69.47 111.16,0 0,69.47 -111.16,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Ingress network exists?</text></g><g class="pele-node pele-shape-rect" data-id="limited" transform="translate(377.08,860.99)"><rect x="-77.19" y="-23.5" width="154.38" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exit 4: incomplete</text></g><g class="pele-node pele-shape-rect" data-id="stop" transform="translate(283.15,955.99)"><rect x="-94.29" y="-23.5" width="188.58" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stop before installation</text></g></g></svg>