<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 550 720" width="550" height="720" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="dark"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="275" y="40.75">Env values and plaintext boundaries</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_layers_cli_0"><path d="M127.22,106C127.22,123.5 257.05,123.5 257.05,141L257.05,147"/><path class="pele-marker" d="M257.05,154L253.69,146L260.41,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyFile_cli_0"><path d="M287.61,106L287.61,147"/><path class="pele-marker" d="M287.61,154L284.25,146L290.97,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyEnv_cli_0"><path d="M446.38,106C446.38,123.5 314.93,123.5 314.93,141L314.93,147"/><path class="pele-marker" d="M314.93,154L311.57,146L318.29,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyEnv_child_0"><path d="M464.56,106L464.56,296C464.56,313.5 346.62,313.5 346.62,331L346.62,337" stroke-dasharray="3 4"/><path class="pele-marker" d="M346.62,344L343.26,336L349.98,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cli_child_0"><path d="M244.6,201L244.6,296C244.6,313.5 314.62,313.5 314.62,331L314.62,337"/><path class="pele-marker" d="M314.62,344L311.26,336L317.98,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cli_mux_0"><path d="M330.62,201L330.62,242"/><path class="pele-marker" d="M330.62,249L327.26,241L333.98,241Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_mux_child_0"><path d="M330.62,296L330.62,337"/><path class="pele-marker" d="M330.62,344L327.26,336L333.98,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_child_output_0"><path d="M322.62,391C322.62,415 164.35,415 164.35,439L164.35,581C164.35,608.5 233.53,608.5 233.53,636L233.53,642"/><path class="pele-marker" d="M233.53,649L230.17,641L236.89,641Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_layers_output_0"><path d="M93.61,106L93.61,581C93.61,605.8 117.15,621 155.57,621C193.98,621 217.53,626.99 217.53,636.75L217.53,642" stroke-dasharray="3 4"/><path class="pele-marker" d="M217.53,649L214.17,641L220.89,641Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_child_disk_0"><path d="M338.62,391C338.62,408.5 382.35,408.5 382.35,426L382.35,432"/><path class="pele-marker" d="M382.35,439L378.99,431L385.71,431Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_disk_scan_0"><path d="M371.32,486C371.32,503.5 249.53,503.5 249.53,521L249.53,527"/><path class="pele-marker" d="M249.53,534L246.17,526L252.89,526Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scan_output_0"><path d="M249.53,581L249.53,642"/><path class="pele-marker" d="M249.53,649L246.17,641L252.89,641Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_disk_output_0"><path d="M398.51,486L398.51,581C398.51,608.5 272.11,608.5 272.11,636L272.11,642"/><path class="pele-marker" d="M272.11,649L268.75,641L275.47,641Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_keyEnv_child_0"><rect x="406" y="167.5" width="117.11" height="20" rx="3" fill="var(--_bg)"/><text x="464.56" y="182.05" text-anchor="middle">Open inherited key</text></g><g class="pele-edge-label" data-id="L_layers_output_0"><rect x="39.39" y="357.5" width="108.44" height="20" rx="3" fill="var(--_bg)"/><text x="93.61" y="372.05" text-anchor="middle">Open diagnostics</text></g><g class="pele-edge-label" data-id="L_disk_output_0"><rect x="336.71" y="547.5" width="123.61" height="20" rx="3" fill="var(--_bg)"/><text x="398.51" y="562.05" text-anchor="middle">Native: no redaction</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="layers" transform="translate(101.61,82.5)"><rect x="-77.61" y="-23.5" width="155.22" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Project env inputs</text></g><g class="pele-node pele-shape-rect live" data-id="cli" transform="translate(285.99,177.5)"><rect x="-80.94" y="-23.5" width="161.88" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Resolve env in CLI</text></g><g class="pele-node pele-shape-rect" data-id="keyFile" transform="translate(287.61,82.5)"><rect x="-66.76" y="-23.5" width="133.53" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Project key file</text></g><g class="pele-node pele-shape-rect fail" data-id="keyEnv" transform="translate(456.56,82.5)"><rect x="-62.18" y="-23.5" width="124.37" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Key from env</text></g><g class="pele-node pele-shape-rect live" data-id="child" transform="translate(330.62,367.5)"><rect x="-49.26" y="-23.5" width="98.52" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Child env</text></g><g class="pele-node pele-shape-rect wait" data-id="mux" transform="translate(330.62,272.5)"><rect x="-58.01" y="-23.5" width="116.03" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Mux env file</text></g><g class="pele-node pele-shape-rect wait" data-id="output" transform="translate(251.08,672.5)"><rect x="-73.03" y="-23.5" width="146.06" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Logs and results</text></g><g class="pele-node pele-shape-rect wait" data-id="disk" transform="translate(382.35,462.5)"><rect x="-63.03" y="-23.5" width="126.06" height="47" fill="