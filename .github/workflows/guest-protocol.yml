name: Guest protocol
on:
  workflow_call:
    inputs:
      defer_macos:
        type: boolean
        required: true
concurrency:
  group: guest-protocol-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  guest:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.defer_macos && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model execution recovery
        if: runner.os == 'Linux'
        working-directory: tests/models/tla/guest-execution
        run: |
          curl --fail --location --retry 2 --max-time 60 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tlc.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tlc.jar" | sha256sum --check
          java -cp "$RUNNER_TEMP/tlc.jar" tlc2.TLC -workers 1 -config positive.cfg GuestAgent
      - name: Test bounded guest protocol
        run: |
          cargo fmt --check --manifest-path packages/hack-vm-protocol/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path packages/hack-vm-protocol/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path packages/hack-vm-protocol/Cargo.toml
      - name: Test guest command execution on Linux
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check --manifest-path packages/hack-vm-agent/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path packages/hack-vm-agent/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path packages/hack-vm-agent/Cargo.toml
