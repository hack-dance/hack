<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 1344 856" width="1344" height="856" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;

  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}

.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }

.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_event_full_0"><path d="M545.66,94.91C545.66,101.29 126.63,114.04 126.63,120.41L126.63,174.68"/><path class="pele-marker" d="M126.63,181.68L123.27,173.68L129.99,173.68Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_event_draft_0"><path d="M561.66,94.91C561.66,107.66 678.83,107.66 678.83,120.41L678.83,164.91"/><path class="pele-marker" d="M678.83,171.91L675.47,163.91L682.19,163.91Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_draft_light_0"><path d="M670.83,233.44C670.83,242.06 368.97,250.32 368.97,258.94L368.97,345.25"/><path class="pele-marker" d="M368.97,352.25L365.61,344.25L372.33,344.25Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_light_blocked_0"><path d="M368.97,416.25L368.97,579.06"/><path class="pele-marker" d="M368.97,586.06L365.61,578.06L372.33,578.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_draft_select_0"><path d="M686.83,233.44C686.83,246.19 880.75,246.19 880.75,258.94L880.75,303.44"/><path class="pele-marker" d="M880.75,310.44L877.39,302.44L884.11,302.44Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_select_all_0"><path d="M841.89,433.77C841.89,466.19 790.08,486.06 705.54,486.06C621,486.06 569.19,501.26 569.19,526.06L569.19,579.06"/><path class="pele-marker" d="M569.19,586.06L565.83,578.06L572.55,578.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_select_imports_0"><path d="M857.89,443.77C857.89,477.43 840.2,498.06 811.35,498.06C782.49,498.06 764.81,508.7 764.81,526.06L764.81,570.56"/><path class="pele-marker" d="M764.81,577.56L761.45,569.56L768.17,569.56Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_all_pools_0"><path d="M569.19,633.06C569.19,654.81 639.42,654.81 639.42,676.56L639.42,682.56"/><path class="pele-marker" d="M639.42,689.56L636.06,681.56L642.78,681.56Z" 