art, Publish</tspan><tspan x="0" y="13.05">INV Existing IDs stay</tspan></text></g><g class="pele-note" data-id="Degraded----note-20" transform="translate(709.82,517)"><path d="M-69.45,-25H61.45L69.45,-17V25H-69.45Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M61.45,-25V-17H69.45" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">RefuseConcurrent</tspan><tspan x="0" y="13.05">Keep cleanup intent</tspan></text></g><g class="pele-note" data-id="Cancelling----note-21" transform="translate(456.8,390.5)"><path d="M-99.41,-33.5H91.41L99.41,-25.5V33.5H-99.41Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.41,-33.5V-25.5H99.41" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Client waits for reply</tspan><tspan x="0" y="4.55">Rollback reply confirms</tspan><tspan x="0" y="21.55">Commit or timeout is unknown</tspan></text></g></g></g></svg>