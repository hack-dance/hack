)"/><path d="M99.75,-25V-17H107.75" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">StopHold under Bound: no expiry</tspan><tspan x="0" y="13.05">35 s wait, 31 s project stop</tspan></text></g><g class="pele-note" data-id="leased----note-12" transform="translate(562.78,336)"><path d="M-101.25,-25H93.25L101.25,-17V25H-101.25Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.25,-25V-17H101.25" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">The guard reads the pool here,</tspan><tspan x="0" y="13.05">never mid-boot (HACK-2732)</tspan></text></g></g></g></svg>