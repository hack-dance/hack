name: Bun crash experiment

# HACK-1211 instrument. Nothing here runs on push or on ordinary pull-request
# activity. A run starts only from a manual dispatch (which GitHub registers once
# this file is on the default branch) or when someone adds the
# `bun-crash-experiment` label to a pull request. Every run spends hosted macOS
# minutes (about budget + 15 per Bun version), so start one only with an explicit
# go-ahead.
#
# A labeled pull request runs the matched pair on the pull request's head: the
# 1.3.9 baseline and the 1.4.2 candidate pinned on next, with the same job,
# budget and the default `focused` mode. A dispatch runs one Bun version at a
# chosen source revision and mode.
#
# Modes: `focused` loops tests/native-https-owner.test.ts, the file in which both
# original segfaults happened (about 16 s per run); `full` loops the full
# `bun test` (about 30-35 min per run on hosted macOS); `alternate` alternates
# the two. The loop never starts a run whose estimate exceeds the remaining
# budget; it records the command as skipped for budget instead.
on:
  workflow_dispatch:
    inputs:
      bun_version:
        description: Bun version to loop under (major.minor.patch)
        type: string
        default: "1.3.9"
      source_revision:
        description: Full 40-character commit to test; empty means the dispatched commit
        type: string
        default: ""
      budget_minutes:
        description: Loop budget in minutes (5-240; full mode needs at least 40); the job timeout is budget + 15
        type: number
        default: 30
      mode:
        description: focused loops the owner test file, full loops the full suite, alternate alternates them
        type: choice
        options:
          - focused
          - full
          - alternate
        default: focused
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Only experiment events contend. A label other than `bun-crash-experiment` gets a
# group of its own (keyed by run id), so its no-op run can never queue behind,
# replace or cancel a pending experiment run on the same pull request.
concurrency:
  group: bun-crash-experiment-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.event.label.name == 'bun-crash-experiment' && format('pr-{0}', github.event.pull_request.number) || format('ignored-label-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'bun-crash-experiment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      mode: ${{ steps.plan.outputs.mode }}
      source_revision: ${{ steps.plan.outputs.source_revision }}
      budget_seconds: ${{ steps.plan.outputs.budget_seconds }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
    steps:
      - name: Validate inputs and plan the runs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUN_VERSION: ${{ inputs.bun_version }}
          INPUT_SOURCE_REVISION: ${{ inputs.source_revision }}
          INPUT_BUDGET_MINUTES: ${{ inputs.budget_minutes }}
          INPUT_MODE: ${{ inputs.mode }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_BUN_VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
              echo "Invalid bun_version"
              exit 1
            fi
            runs="[{\"bun_version\":\"$INPUT_BUN_VERSION\",\"role\":\"\"}]"
            revision="${INPUT_SOURCE_REVISION:-$EVENT_SHA}"
            budget="$INPUT_BUDGET_MINUTES"
            mode="$INPUT_MODE"
          else
            runs='[{"bun_version":"1.3.9","role":"baseline"},{"bun_version":"1.4.2","role":"candidate"}]'
            revision="$PR_HEAD_SHA"
            budget=30
            mode=focused
          fi
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source_revision"
            exit 1
          fi
          if ! [[ "$budget" =~ ^[1-9][0-9]{0,2}$ ]] || [ "$budget" -lt 5 ] || [ "$budget" -gt 240 ]; then
            echo "Invalid budget_minutes"
            exit 1
          fi
          case "$mode" in
            focused | full | alternate) ;;
            *)
              echo "Invalid mode"
              exit 1
              ;;
          esac
          # The loop's full-suite prior is 40 minutes (DEFAULT_FULL_ESTIMATE_SECONDS
          # in scripts/bun-crash-loop.ts); a smaller full-mode budget could never
          # start a run and would only spend hosted macOS minutes on setup.
          if [ "$mode" = "full" ] && [ "$budget" -lt 40 ]; then
            echo "full mode needs budget_minutes of at least 40"
            exit 1
          fi
          {
            echo "runs=$runs"
            echo "mode=$mode"
            echo "source_revision=$revision"
            echo "budget_seconds=$((budget * 60))"
            echo "timeout_minutes=$((budget + 15))"
          } >> "$GITHUB_OUTPUT"

  loop:
    name: Bun crash loop (${{ matrix.bun_version }}, ${{ needs.plan.outputs.mode }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}
    permissions:
      contents: read
    steps:
      # The instrument comes from this workflow's commit, so an older source
      # revision without these scripts can still be measured.
      - name: Checkout instrument
        uses: actions/checkout@v4
        with:
          path: .bun-crash-instrument
          persist-credentials: false
          sparse-checkout: |
            scripts/bun-crash-loop.ts
            scripts/lib/bun-crash-classify.ts
          sparse-checkout-cone-mode: false
      - name: Move the instrument outside the tested tree
        run: |
          mkdir -p "$RUNNER_TEMP/bun-crash-instrument"
          mv .bun-crash-instrument/scripts "$RUNNER_TEMP/bun-crash-instrument/scripts"
          rm -rf .bun-crash-instrument
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_revision }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ matrix.bun_version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Prepare matching compiler for private file owner tests
        run: |
          if grep -q '"build:config-compiler":' package.json; then
            bun run build:config-compiler
          else
            echo "Source revision has no config compiler build"
          fi
      - name: Check test preconditions
        run: |
          if grep -q '"test:preflight":' package.json; then
            bun run test:preflight
          else
            echo "Source revision has no test preflight"
          fi
      - name: Loop the selected tests within the budget
        env:
          BUN_ENABLE_CRASH_REPORTING: "0"
          EXPECTED_BUN_VERSION: ${{ matrix.bun_version }}
          SOURCE_REVISION: ${{ needs.plan.outputs.source_revision }}
          BUDGET_SECONDS: ${{ needs.plan.outputs.budget_seconds }}
          LOOP_MODE: ${{ needs.plan.outputs.mode }}
          LOOP_ROLE: ${{ matrix.role }}
        run: >-
          bun "$RUNNER_TEMP/bun-crash-instrument/scripts/bun-crash-loop.ts"
          --budget-seconds="$BUDGET_SECONDS"
          --mode="$LOOP_MODE"
          ${LOOP_ROLE:+"--role=$LOOP_ROLE"}
          --expect-bun-version="$EXPECTED_BUN_VERSION"
          --source-revision="$SOURCE_REVISION"
          --out-dir="$RUNNER_TEMP/bun-crash-loop"
      - name: Preserve iteration logs and Bun crash reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bun-crash-loop-${{ matrix.bun_version }}
          path: ${{ runner.temp }}/bun-crash-loop
          if-no-files-found: ignore
          retention-days: 7
