" transform="translate(693.64,962.5)"><rect x="-37.25" y="-21.5" width="74.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retired</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(693.64,1037)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="captured" transform="translate(288.15,214.5)"><rect x="-45.18" y="-21.5" width="90.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">captured</text></g><g class="pele-node pele-state wait" data-id="signalled" transform="translate(288.15,354.5)"><rect x="-45.59" y="-21.5" width="91.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">signalled</text></g><g class="pele-node pele-state fail" data-id="retained" transform="translate(228.76,839.5)"><rect x="-43.1" y="-21.5" width="86.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retained</text></g><g class="pele-note" data-id="captured----note-16" transform="translate(523.72,214.5)"><path d="M-146.39,-18H138.39L146.39,-10V18H-146.39Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M138.39,-18V-10H146.39" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" x="0" y="4.55" text-anchor="middle">Capture roots only with matching PID and birth</text></g><g class="pele-note" data-id="signalled----note-15" transform="translate(507.15,354.5)"><path d="M-129.4,-50.5H121.4L129.4,-42.5V50.5H-129.4Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M121.4,-50.5V-42.5H129.4" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">Mux acknowledgement is not group exit</tspan><tspan x="0" y="-12.45">FIFO EOF is not group absence</tspan><tspan x="0" y="4.55">Revalidate member identity before KILL</tspan><tspan x="0" y="21.55">Zombie-only groups are retired</tspan><tspan x="0" y="38.55">After KILL allow 2 s to confirm retirement</tspan></text></g><g class="pele-note" data-id="retained----note-14" transform="translate(416,839.5)"><path d="M-100.14,-33.5H92.14L100.14,-25.5V33.5H-100.14Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M92.14,-33.5V-25.5H100.14" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV unknown is retained</tspan><tspan x="0" y="4.55">Report unconfirmed retirement</tspan><tspan x="0" y="21.55">Keep dependent helpers</tspan></text></g></g></g></svg>