services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: null
    volumes:
      - postgres-data:/var/lib/postgresql/data
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: null
    volumes:
      - mysql-data:/var/lib/mysql
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: null
      MINIO_ROOT_PASSWORD: null
    volumes:
      - minio-data:/data
volumes:
  postgres-data: {}
  mysql-data: {}
  minio-data: {}
