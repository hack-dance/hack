<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 742 609" width="742" height="609" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="371" y="40.75">DigestCache · one path in one process</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M339.47,38L339.47,75"/><path class="pele-marker" d="M339.47,82L336.11,74L342.83,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M318.66,125L318.66,133.09C318.66,136.29 183.04,140.31 183.04,143.5L183.04,186"/><path class="pele-marker" d="M183.04,193L179.68,185L186.4,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M296.7,474.5C322.7,466.5 322.7,498.5 303.39,492.56"/><path class="pele-marker" d="M296.7,490.5L305.33,489.64L303.36,496.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M254.85,461L254.85,415C254.85,399.25 175.04,399.25 175.04,383.5L175.04,243"/><path class="pele-marker" d="M175.04,236L178.4,244L171.68,244Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M214.69,236L214.69,278.5C214.69,285.44 318.66,285.44 318.66,292.38L318.66,297"/><path class="pele-marker" d="M318.66,304L315.3,296L322.02,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M330.92,347L330.92,389.5C330.92,402.25 254.85,402.25 254.85,415L254.85,454"/><path class="pele-marker" d="M254.85,461L251.49,453L258.21,453Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M334.66,304L334.66,132"/><path class="pele-marker" d="M334.66,125L338.02,133L331.3,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M350.66,304L350.66,291C350.66,263.5 515.12,263.5 515.12,236L515.12,193C515.12,165.5 350.66,165.5 350.66,138L350.66,132"/><path class="pele-marker" d="M350.66,125L354.02,133L347.3,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Cached-Cached----note-8"><path d="M296.7,482.5L529.71,482.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="146.89" y="145.5" width="72.31" height="20" rx="3" fill="var(--_bg)"/><text x="183.04" y="160.05" text-anchor="middle">BeginRead</text></g><g class="pele-edge-label" data-id="edge2"><rect x="328.7" y="472.5" width="159.01" height="20" rx="3" fill="var(--_bg)"/><text x="408.2" y="487.05" text-anchor="middle">CacheHit [stat equals key]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="103.48" y="315.5" width="143.12" height="20" rx="3" fill="var(--_bg)"/><text x="175.04" y="330.05" text-anchor="middle">BeginRead [stat differs]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="185.04" y="256.5" width="59.3" height="20" rx="3" fill="var(--_bg)"/><text x="214.69" y="271.05" text-anchor="middle">after-stat</text></g><g class="pele-edge-label" data-id="edge5"><rect x="256.84" y="367.5" width="148.15" height="20" rx="3" fill="var(--_bg)"/><text x="330.92" y="382.05" text-anchor="middle">FinishRead [ctime older]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="256.97" y="204.5" width="155.38" height="20" rx="3" fill="var(--_bg)"/><text x="334.66" y="219.05" text-anchor="middle">FinishRead [ctime recent]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="432.35" y="204.5" width="165.53" height="20" rx="3" fill="var(--_bg)"/><text x="515.12" y="219.05" text-anchor="middle">RefuseRead [stat changed]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(339.47,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Empty" transform="translate(339.47,103.5)"><rect x="-37.25" y="-21.5" width="74.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Empty</text></g><g class="pele-node pele-state live" data-id="Reading" transform="translate(183.04,214.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Reading</text></g><g class="pele-node pele-state" data-id="check" transform="translate(330.92,325.5)"><rect x="-35.59" y="-21.5" width="71.18" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">check</text></g><g class="pele-node pele-state ok" data-id="Cached" transform="translate(254.85,482.5)"><rect x="-41.84" y="-21.5" width="83.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Cached</text></g><g class="pele-note" data-id="Cached----note-8" transform="translate(623.72,482.5)"><path d="M-94.01,-67.5H86.01L94.01,-59.5V67.5H-94.01Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M86.01,-67.5V-59.5H94.01" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-46.45">INV CacheNeverStale: a hit</tspan><tspan x="0" y="-29.45">returns the current content's</tspan><tspan x="0" y="-12.45">digest. WriteInPlace and</tspan><tspan x="0" y="4.55">Replace change the stat</tspan><tspan x="0" y="21.55">unless the write lands in the</tspan><tspan x="0" y="38.55">tick the read began, which is</tspan><tspan x="0" y="55.55">never cached.</tspan></text></g></g></g></svg>