Limit]</text></g><g class="pele-edge-label" data-id="edge15"><rect x="825.66" y="726" width="60.01" height="20" rx="3" fill="var(--_bg)"/><text x="855.66" y="740.55" text-anchor="middle">start fails</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(349.47,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="created" transform="translate(349.47,127.5)"><rect x="-41.01" y="-21.5" width="82.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">created</text></g><g class="pele-node pele-state" data-id="doubt" transform="translate(197.47,469)"><rect x="-34.76" y="-21.5" width="69.53" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">doubt</text></g><g class="pele-node pele-state ok" data-id="healthy" transform="translate(444.38,469)"><rect x="-40.18" y="-21.5" width="80.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">healthy</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(855.66,782.5)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="starting" transform="translate(711.88,259)"><rect x="-40.59" y="-21.5" width="81.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">starting</text></g><g class="pele-node pele-state" data-id="limit" transform="translate(855.66,469)"><rect x="-29.33" y="-21.5" width="58.66" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">limit</text></g><g class="pele-node pele-state fail" data-id="unhealthy" transform="translate(855.66,663.5)"><rect x="-48.52" y="-21.5" width="97.04" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">unhealthy</text></g><g class="pele-note" data-id="starting----note-16" transform="translate(1066.13,259)"><path d="M-93.65,-42H85.65L93.65,-34V42H-93.65Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M85.65,-42V-34H93.65" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">Patient: before the first</tspan><tspan x="0" y="-3.95">success, in the grace, one</tspan><tspan x="0" y="13.05">attempt may use the rest of</tspan><tspan x="0" y="30.05">the grace (attempt_timeout).</tspan></text></g><g class="pele-note" data-id="limit----note-17" transform="translate(694.12,469)"><path d="M-88.22,-42H80.22L88.22,-34V42H-88.22Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M80.22,-42V-34H88.22" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">Limit is host time since the</tspan><tspan x="0" y="-3.95">probe started, not the time</tspan><tspan x="0" y="13.05">the sample carries</tspan><tspan x="0" y="30.05">(starting_bound_ms).</tspan></text></g><g class="pele-note" data-id="unhealthy----note-18" transform="translate(1046.52,663.5)"><path d="M-98.33,-42H90.33L98.33,-34V42H-98.33Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M90.33,-42V-34H98.33" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">INV NoFalseFailure</tspan><tspan x="0" y="-3.95">INV BoundedStarting</tspan><tspan x="0" y="13.05">INV NoReadyWithoutSuccess</tspan><tspan x="0" y="30.05">INV OneCompile</tspan></text></g></g></g></svg>