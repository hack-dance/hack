isting_Acquire_0"><rect x="472.86" y="534.56" width="47.03" height="20" rx="3" fill="var(--_bg)"/><text x="496.38" y="549.11" text-anchor="middle">absent</text></g><g class="pele-edge-label" data-id="L_Hash_Retry_0"><rect x="416.21" y="854.2" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="427.44" y="868.75" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_Hash_Prepare_0"><rect x="490.26" y="854.2" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="504.38" y="868.75" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_Retry_Start_0"><rect x="620.67" y="606.06" width="81.68" height="20" rx="3" fill="var(--_bg)"/><text x="661.51" y="620.61" text-anchor="middle">explicit rerun</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Start" transform="translate(213.6,82.5)"><rect x="-63.43" y="-23.5" width="126.87" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">runtime setup</text></g><g class="pele-node pele-shape-diam wait" data-id="Consent" transform="translate(141.84,227.65)"><polygon points="0,-73.65 117.84,0 0,73.65 -117.84,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Offline inputs or consent?</text></g><g class="pele-node pele-shape-rect fail" data-id="Refused" transform="translate(133.84,442.68)"><rect x="-86.77" y="-23.5" width="173.55" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Refuse before writes</text></g><g class="pele-node pele-shape-diam" data-id="Existing" transform="translate(371.62,442.68)"><polygon points="0,-69.38 111.01,0 0,69.38 -111.01,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Complete matching</tspan><tspan x="0" y="15.25">install?</tspan></tex