commands:
  install: bun install
  build: bun run build
  typecheck: bun run typecheck
  check: bun run check
  test: bun run test
  auth_test: bun run auth:test
  auth_targeted_test: bun test ./services/auth-broker/tests/config.test.ts ./services/auth-broker/tests/index.test.ts
  auth_wildcard_handoff_targeted_test: bun test ./services/auth-broker/tests/index.test.ts ./services/auth-broker/tests/session-auth.test.ts
  auth_org_team_store_mode_targeted_test: bun test ./services/auth-broker/tests/index.test.ts ./services/auth-broker/tests/org-team-membership.test.ts
  db_test: bun run db:test
  auth_broker_smoke: curl -sf http://127.0.0.1:8080/health
  runtime_up: hack up -d
  runtime_ps: hack ps --json
  runtime_open: hack open --json
  runtime_open_auth: hack open auth --json
  runtime_web_smoke: curl -ksSf https://hack-cli.hack
  runtime_auth_routed_smoke: curl -ksSf https://auth.hack-cli.hack/health
  runtime_stack_routed_healthcheck: hack ps --json && curl -ksSf https://hack-cli.hack && curl -ksSf https://auth.hack-cli.hack/health
  runtime_auth_provider_metadata_smoke: curl -ksSf https://auth.hack-cli.hack/v1/auth/providers
  runtime_auth_legacy_shell_headers: curl -ksSI https://auth.hack-cli.hack/auth
  linear_status: ./dist/hack linear status --json
  repo_linear_smoke: bun run build && ./dist/hack linear status --json

services:
  auth-broker-local:
    start: PORT=8080 HOST=127.0.0.1 AUTH_BROKER_PUBLIC_BASE_URL=http://127.0.0.1:8080 bun run auth:start
    stop: lsof -ti tcp:8080 | xargs kill
    healthcheck: curl -sf http://127.0.0.1:8080/health
    port: 8080
    depends_on: []

  hack-stack:
    start: hack up -d
    stop: hack down
    healthcheck: hack ps --json
    depends_on: []
