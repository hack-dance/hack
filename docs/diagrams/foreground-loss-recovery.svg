ered" transform="translate(520.6,1038.5)"><rect x="-52.26" y="-21.5" width="104.53" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Recovered</text></g><g class="pele-note" data-id="Preparing----note-16" transform="translate(648.18,115.5)"><path d="M-95.1,-33.5H87.1L95.1,-25.5V33.5H-95.1Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.1,-33.5V-25.5H95.1" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Images, review, restore</tspan><tspan x="0" y="4.55">selection; nothing requested.</tspan><tspan x="0" y="21.55">A restart holds its lock.</tspan></text></g><g class="pele-note" data-id="GraphReady----note-17" transform="translate(364.31,361.5)"><path d="M-96.9,-33.5H88.9L96.9,-25.5V33.5H-96.9Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M88.9,-33.5V-25.5H96.9" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Ready and mapped. A restart</tspan><tspan x="0" y="4.55">still holds its cleaned</tspan><tspan x="0" y="21.55">intent and its lock.</tspan></text></g><g class="pele-note" data-id="Inspect----note-18" transform="translate(142.17,792.5)"><path d="M-103.04,-33.5H95.04L103.04,-25.5V33.5H-103.04Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.04,-33.5V-25.5H103.04" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">No command can retire it</tspan><tspan x="0" y="4.55">yet (HACK-2714): none named.</tspan><tspan x="0" y="21.55">INV NoNeedlessWithholding</tspan></text></g><g class="pele-note" data-id="Recovered----note-19" transform="translate(710.16,1038.5)"><path d="M-93.3,-33.5H85.3L93.3,-25.5V33.5H-93.3Z" fill="var(--_bg)" stroke="var(--_b)"/><pat