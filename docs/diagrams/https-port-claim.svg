2" transform="translate(250.21,266)"><path d="M-90.05,-25H82.05L90.05,-17V25H-90.05Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M82.05,-25V-17H90.05" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">netstat -an -p tcp, fixed</tspan><tspan x="0" y="13.05">path, clean env, 5 s bound.</tspan></text></g><g class="pele-note" data-id="retry----note-13" transform="translate(383.8,495)"><path d="M-94.51,-25H86.51L94.51,-17V25H-94.51Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M86.51,-25V-17H94.51" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Old path: waits out the</tspan><tspan x="0" y="13.05">retired Caddy's TIME_WAIT.</tspan></text></g></g></g></svg>