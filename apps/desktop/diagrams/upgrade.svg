.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:2px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Blocked</text></g><g class="pele-node pele-state" data-id="Ready" transform="translate(229.67,436.5)"><rect x="-37.67" y="-21.5" width="75.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Ready</text></g><g class="pele-node pele-state wait" data-id="Snapshotting" transform="translate(229.67,547.5)"><rect x="-59.78" y="-21.5" width="119.56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:2 2;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Snapshotting</text></g><g class="pele-node pele-state wait" data-id="Applying" transform="translate(221.56,658.5)"><rect x="-44.76" y="-21.5" width="89.53" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:2 2;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Applying</text></g><g class="pele-node pele-state fail" data-id="Failed" transform="translate(349.15,880.5)"><rect x="-36.42" y="-21.5" width="72.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:2px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Failed</text></g><g class="pele-node pele-state wait" data-id="RestartingDaemon" transform="translate(349.15,769.5)"><rect x="-78.52" y="-21.5" width="157.04" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:2 2;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">RestartingDaemon</text></g><g class="pele-node pele-state wait" data-id="RollingBack" transform="translate(413.24,991.5)"><rect x="-55.59" y="-21.5" width="111.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:2 2;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">RollingBack</text></g></g></g></svg>