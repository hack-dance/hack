name: V5 prerelease candidate

# Called through the existing Release entry dispatched on next. Preparing never publishes.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source_revision:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: v5-prerelease-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_CHANNEL: prerelease
  HACK_PRERELEASE_VERSION: ${{ inputs.version }}
  HACK_PRERELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
  HACK_PRERELEASE_PUBLISH: ${{ inputs.publish }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      deployments: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source_revision: ${{ steps.plan.outputs.source_revision }}
      archive: ${{ steps.plan.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Validate immutable plan
        id: plan
        run: bun scripts/prerelease-plan.ts plan
      - name: Require release-full CI on the exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/prerelease-plan.ts verify-ci
      - name: Verify publication prerequisites before scheduling approval
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/prerelease-plan.ts verify

  # HACK-2364: the Compose-only Linux bundle and its manager, built natively on
  # each architecture (there is no cross build), installed and exercised before
  # the macOS job packages the release set. It has no write permission and
  # publishes nothing.
  build-linux:
    name: build-linux (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    env:
      HACK_PRERELEASE_LINUX_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Select isolated build directories
        run: |
          printf 'HACK_PRERELEASE_BUNDLE=%s/compose-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HACK_PRERELEASE_OUTPUT=%s/prerelease-linux\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HACK_PRERELEASE_REHEARSAL=%s/rehearsal\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_revision }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: bun install --frozen-lockfile
      - name: Build the Compose-only bundle for this architecture
        run: scripts/build-compose-candidate.sh "$HACK_PRERELEASE_BUNDLE" "--version=$HACK_PRERELEASE_VERSION"
      - name: Check the candidate starts its own hackd with the release version
        run: bun scripts/check-candidate-daemon-identity.ts "$HACK_PRERELEASE_BUNDLE" "$HACK_PRERELEASE_VERSION"
      - name: Package the verified archive and build this architecture's manager
        run: bun scripts/prerelease-plan.ts package-linux
      # The published installer is rendered once, by the macOS job, from all
      # three manager digests. This one embeds only this job's manager digest;
      # it is the same script otherwise and is never uploaded.
      - name: Render a rehearsal installer for this architecture
        run: bun scripts/prerelease-plan.ts rehearsal-installer
      # The first release with Linux assets has no previous Linux install: the
      # gate then installs, deselects, selects, rolls back and uninstalls the
      # candidate. Later releases upgrade the previous published Linux install.
      - name: Gate the Linux channel (upgrade, or fresh install for the first Linux release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-prerelease-upgrade.ts
      # Installs through the installer into a clean HOME with no sudo, then
      # runs the Linux first-run steps through the installed hack-next.
      - name: Install through the installer and run the Linux first-run check
        run: |
          archive="$HACK_PRERELEASE_OUTPUT/hack-$HACK_PRERELEASE_VERSION-$HACK_PRERELEASE_LINUX_PLATFORM-compose.tar.gz"
          bun scripts/linux-first-run-check.ts \
            --installer "$HACK_PRERELEASE_REHEARSAL/hack-next-install.sh" \
            --archive "$archive" \
            --sha256 "$(sha256sum "$archive" | cut -d ' ' -f 1)" \
            --manager "$HACK_PRERELEASE_OUTPUT/hack-next-manager-$HACK_PRERELEASE_LINUX_PLATFORM" \
            --scratch "$RUNNER_TEMP/first-run"
      - name: Retain this architecture's archive and manager
        uses: actions/upload-artifact@v4
        with:
          name: v5-prerelease-linux-${{ matrix.platform }}-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/prerelease-linux/*
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [plan, build-linux]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HACK_PRERELEASE_MISE_VERSION: "2026.11.14"
    steps:
      - name: Select isolated build directories
        run: |
          printf 'HACK_PRERELEASE_BUNDLE=%s/native-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HACK_PRERELEASE_OUTPUT=%s/prerelease-assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HACK_PRERELEASE_LINUX_ASSETS=%s/prerelease-linux\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_revision }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-unknown-linux-musl
      - name: Cache the mise Zig install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.local/share/mise/installs/zig
          key: prerelease-zig-${{ runner.os }}-${{ runner.arch }}-${{ env.HACK_PRERELEASE_MISE_VERSION }}-${{ hashFiles('mise.toml') }}
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # This version can fetch the archive's signature from another host.
          version: ${{ env.HACK_PRERELEASE_MISE_VERSION }}
          install: false
          add_shims_to_path: false
          cache: false
          env: false
      # A restored pin needs no remote version lookup. On a miss, retry
      # installs so mise can pick another community mirror. Keep this loop
      # inline because source_revision may predate scripts/mise-install-retry.sh.
      - name: Install or use cached Zig
        timeout-minutes: 15
        env:
          MISE_HTTP_TIMEOUT: "90s"
          MISE_HTTP_RETRIES: "4"
        run: |
          if ! mise where zig >/dev/null; then
            for attempt in 1 2 3 4; do
              if mise install zig; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "mise install zig failed 4 times" >&2
                exit 1
              fi
              echo "mise install zig failed (attempt $attempt of 4); retrying in $((attempt * 15))s" >&2
              sleep "$((attempt * 15))"
            done
          fi
          mise exec zig -- zig version
      - run: bun install --frozen-lockfile
      - name: Build and verify complete native bundle
        run: mise exec zig -- scripts/build-native-candidate.sh "$HACK_PRERELEASE_BUNDLE" "--version=$HACK_PRERELEASE_VERSION"
      # HACK-2263: with a fake stable `hack` first on PATH and a temp HOME,
      # the bundle's launcher must start the bundle's own hackd, and the CLI
      # and hackd must report this release version.
      - name: Check the candidate starts its own hackd with the release version
        run: bun scripts/check-candidate-daemon-identity.ts "$HACK_PRERELEASE_BUNDLE" "$HACK_PRERELEASE_VERSION"
      # One step still renders every checksum file and the installer: the Linux
      # jobs' archives and managers are verified here and listed in
      # SHA256SUMS-linux. SHA256SUMS keeps exactly the macOS archive line.
      - name: Fetch the Linux archives and managers
        uses: actions/download-artifact@v4
        with:
          pattern: v5-prerelease-linux-*-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/prerelease-linux
          merge-multiple: true
      - name: Package verified payload and outer checksum
        run: bun scripts/prerelease-plan.ts package
      # HACK-2262: an existing prerelease channel must be able to take this
      # candidate with the documented upgrade command. Install the previous
      # published prerelease with its own manager, then upgrade it with that
      # retained manager; fail before anything is published.
      - name: Upgrade the previous prerelease to this candidate with its retained manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-prerelease-upgrade.ts
      - name: Retain reviewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v5-prerelease-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/prerelease-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: [plan, build]
    # The native installer verifies signatures using macOS codesign.
    runs-on: macos-15
    timeout-minutes: 10
    # The plan checks that this already exists with real required-reviewer protection.
    environment: v5-prerelease
    permissions:
      contents: write
      actions: read
      checks: read
      statuses: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select isolated publication directory
        run: printf 'HACK_PRERELEASE_OUTPUT=%s/prerelease-assets\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_revision }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@v4
        with:
          name: v5-prerelease-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/prerelease-assets
      - name: Recheck exact head, CI, human approval and tag absence; publish once
        run: bun scripts/prerelease-plan.ts publish
