<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 439 524" width="439" height="524" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="219.5" y="40.75">ProjectRemoteSelection · Teardown hooks</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M222.49,38L222.49,75"/><path class="pele-marker" d="M222.49,82L219.13,74L225.85,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M214.49,125C214.49,134.25 139.21,134.25 139.21,143.5L139.21,186"/><path class="pele-marker" d="M139.21,193L135.85,185L142.57,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M230.49,125C230.49,159 305.76,159 305.76,193L305.76,272.5C305.76,278.98 94.42,284.52 94.42,291L94.42,297"/><path class="pele-marker" d="M94.42,304L91.06,296L97.78,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M178.14,206.5C204.14,198.5 204.14,230.5 184.83,224.56"/><path class="pele-marker" d="M178.14,222.5L186.77,221.64L184.8,228.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M131.21,236C131.21,245.25 78.42,245.25 78.42,254.5L78.42,297"/><path class="pele-marker" d="M78.42,304L75.06,296L81.78,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M147.21,236C147.21,270 196,270 196,304L196,383.5C196,399.25 143.21,399.25 143.21,415L143.21,411.5"/><path class="pele-marker" d="M143.21,418.5L139.85,410.5L146.57,410.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M90.42,347C90.42,356.25 143.21,356.25 143.21,365.5L143.21,415L143.21,411.5"/><path class="pele-marker" d="M143.21,418.5L139.85,410.5L146.57,410.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="done-done----note-7"><path d="M175.89,440L219.89,440"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="114.26" y="145.5" width="49.91" height="20" rx="3" fill="var(--_bg)"/><text x="139.21" y="160.05" text-anchor="middle">Started</text></g><g class="pele-edge-label" data-id="edge2"><rect x="284.42" y="204.5" width="42.67" height="20" rx="3" fill="var(--_bg)"/><text x="305.76" y="219.05" text-anchor="middle">Crash</text></g><g class="pele-edge-label" data-id="edge3"><rect x="210.14" y="204.5" width="46.29" height="20" rx="3" fill="var(--_bg)"/><text x="233.28" y="219.05" text-anchor="middle">Switch</text></g><g class="pele-edge-label" data-id="edge4"><rect x="57.09" y="256.5" width="42.67" height="20" rx="3" fill="var(--_bg)"/><text x="78.42" y="271.05" text-anchor="middle">Crash</text></g><g class="pele-edge-label" data-id="edge5"><rect x="163.1" y="315.5" width="65.8" height="20" rx="3" fill="var(--_bg)"/><text x="196" y="330.05" text-anchor="middle">Teardown</text></g><g class="pele-edge-label" data-id="edge6"><rect x="110.31" y="367.5" width="65.8" height="20" rx="3" fill="var(--_bg)"/><text x="143.21" y="382.05" text-anchor="middle">Teardown</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(222.49,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="starting" transform="translate(222.49,103.5)"><rect x="-40.59" y="-21.5" width="81.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">starting</text></g><g class="pele-node pele-state live" data-id="started" transform="translate(139.21,214.5)"><rect x="-38.93" y="-21.5" width="77.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">started</text></g><g class="pele-node pele-state fail" data-id="crashed" transform="translate(90.42,325.5)"><rect x="-42.68" y="-21.5" width="85.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">crashed</text></g><g class="pele-node pele-state ok" data-id="done" transform="translate(143.21,440)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">done</text></g><g class="pele-note" data-id="done----note-7" transform="translate(317.15,440)"><path d="M-97.26,-25H89.26L97.26,-17V25H-97.26Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M89.26,-25V-17H97.26" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV Hook uses started target.</tspan><tspan x="0" y="13.05">INV Active labels win.</tspan></text></g></g></g></svg>