m="translate(433.64,226.5)"><path d="M-87.15,-33.5H79.15L87.15,-25.5V33.5H-87.15Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M79.15,-33.5V-25.5H87.15" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Observe: pid gone or boot</tspan><tspan x="0" y="4.55">ended. Grace 10 s while</tspan><tspan x="0" y="21.55">starting or stopping.</tspan></text></g><g class="pele-note" data-id="Serving----note-13" transform="translate(436.73,349.5)"><path d="M-70.89,-18H62.89L70.89,-10V18H-70.89Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M62.89,-18V-10H70.89" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" x="0" y="4.55" text-anchor="middle">Grace 0 once ready.</text></g><g class="pele-note" data-id="Finishing----note-14" transform="translate(286.99,592)"><path d="M-99.79,-33.5H91.79L99.79,-25.5V33.5H-99.79Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.79,-33.5V-25.5H99.79" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Watch cancelled: a pool</tspan><tspan x="0" y="4.55">stop here is not a lost VM.</tspan><tspan x="0" y="21.55">INV NoExitAfterGraphStopped</tspan></text></g><g class="pele-note" data-id="Exited----note-15" transform="translate(785.31,592)"><path d="M-79.55,-42H71.55L79.55,-34V42H-79.55Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M71.55,-42V-34H79.55" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">INV BoundedExit</tspan><tspan x="0" y="-3.95">Names the lost VM and</tspan><tspan x="0" y="13.05">hack down --recover.</tspan><tspan x="0" y="30.05">Exit code 1.</tspan></text></g></g></g></svg>