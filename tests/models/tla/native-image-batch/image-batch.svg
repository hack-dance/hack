<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 542 690" width="542" height="690" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="271" y="40.75">Bounded image preparation and import</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M392.39,38L392.39,75"/><path class="pele-marker" d="M392.39,82L389.03,74L395.75,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M392.39,125L392.39,186"/><path class="pele-marker" d="M392.39,193L389.03,185L395.75,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M376.39,236C376.39,245.25 239.44,245.25 239.44,254.5L239.44,297"/><path class="pele-marker" d="M239.44,304L236.08,296L242.8,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M392.39,236L392.39,494.5C392.39,503.75 358.41,503.75 358.41,513L358.41,519"/><path class="pele-marker" d="M358.41,526L355.05,518L361.77,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M227.44,347L227.44,408"/><path class="pele-marker" d="M227.44,415L224.08,407L230.8,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M211.44,458C211.44,467.25 92.5,467.25 92.5,476.5L92.5,519"/><path class="pele-marker" d="M92.5,526L89.14,518L95.86,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M243.44,458C243.44,467.25 336.48,467.25 336.48,476.5L336.48,519"/><path class="pele-marker" d="M336.48,526L333.12,518L339.84,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M408.39,236C408.39,270 491.55,270 491.55,304L491.55,408"/><path class="pele-marker" d="M491.55,415L488.19,407L494.91,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M243.44,347C243.44,353.4 457.33,359.1 457.33,365.5L457.33,408"/><path class="pele-marker" d="M457.33,415L453.97,407L460.69,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M227.44,458L227.44,519"/><path class="pele-marker" d="M227.44,526L224.08,518L230.8,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M92.5,569C92.5,584.5 298.61,584.5 298.61,600L298.61,606"/><path class="pele-marker" d="M298.61,613L295.25,605L301.97,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M358.41,569C358.41,584.5 298.61,584.5 298.61,600L298.61,606"/><path class="pele-marker" d="M298.61,613L295.25,605L301.97,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M473.31,458L473.31,569C473.31,584.5 298.61,584.5 298.61,600L298.61,606"/><path class="pele-marker" d="M298.61,613L295.25,605L301.97,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge13"><path d="M227.44,569C227.44,584.5 298.61,584.5 298.61,600L298.61,606"/><path class="pele-marker" d="M298.61,613L295.25,605L301.97,605Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="339.99" y="145.5" width="104.8" height="20" rx="3" fill="var(--_bg)"/><text x="392.39" y="160.05" text-anchor="middle">Worker available</text></g><g class="pele-edge-label" data-id="edge2"><rect x="191.02" y="256.5" width="96.86" height="20" rx="3" fill="var(--_bg)"/><text x="239.44" y="271.05" text-anchor="middle">Archive verified</text></g><g class="pele-edge-label" data-id="edge3"><rect x="337.45" y="315.5" width="109.88" height="20" rx="3" fill="var(--_bg)"/><text x="392.39" y="330.05" text-anchor="middle">Preparation failed</text></g><g class="pele-edge-label" data-id="edge4"><rect x="171.79" y="367.5" width="111.31" height="20" rx="3" fill="var(--_bg)"/><text x="227.44" y="382.05" text-anchor="middle">Importer available</text></g><g class="pele-edge-label" data-id="edge5"><rect x="26" y="478.5" width="133.01" height="20" rx="3" fill="var(--_bg)"/><text x="92.5" y="493.05" text-anchor="middle">Exact guest readback</text></g><g class="pele-edge-label" data-id="edge6"><rect x="290.58" y="478.5" width="91.81" height="20" rx="3" fill="var(--_bg)"/><text x="336.48" y="493.05" text-anchor="middle">Import refused</text></g><g class="pele-edge-label" data-id="edge7"><rect x="467.33" y="315.5" width="48.46" height="20" rx="3" fill="var(--_bg)"/><text x="491.55" y="330.05" text-anchor="middle">Cancel</text></g><g class="pele-edge-label" data-id="edge8"><rect x="433.1" y="367.5" width="48.46" height="20" rx="3" fill="var(--_bg)"/><text x="457.33" y="382.05" text-anchor="middle">Cancel</text></g><g class="pele-edge-label" data-id="edge9"><rect x="203.22" y="478.5" width="48.46" height="20" rx="3" fill="var(--_bg)"/><text x="227.44" y="493.05" text-anchor="middle">Cancel</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(392.39,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="queued" transform="translate(392.39,103.5)"><rect x="-41.02" y="-21.5" width="82.04" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">queued</text></g><g class="pele-node pele-state live" data-id="fetch" transform="translate(392.39,214.5)"><rect x="-32.26" y="-21.5" width="64.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">fetch</text></g><g class="pele-node pele-state wait" data-id="ready" transform="translate(239.44,325.5)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state fail" data-id="failed" transform="translate(358.41,547.5)"><rect x="-33.92" y="-21.5" width="67.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">failed</text></g><g class="pele-node pele-state live" data-id="import" transform="translate(227.44,436.5)"><rect x="-36.83" y="-21.5" width="73.67" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">import</text></g><g class="pele-node pele-state ok" data-id="confirmed" transform="translate(92.5,547.5)"><rect x="-48.92" y="-21.5" width="97.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">confirmed</text></g><g class="pele-node pele-state idle" data-id="stopped" transform="translate(473.31,436.5)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stopped</text></g><g class="pele-node pele-state fail" data-id="unknown" transform="translate(227.44,547.5)"><rect x="-46.01" y="-21.5" width="92.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">unknown</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(298.61,622)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g></g></g></svg>