var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Set up Hack:</tspan><tspan x="0" y="15.25">ordered cards</tspan></text></g><g class="pele-node pele-shape-rect" data-id="F" transform="translate(106.19,816.32)"><rect x="-82.19" y="-32" width="164.39" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Fixed daemon start</tspan><tspan x="0" y="15.25">or install</tspan></text></g><g class="pele-node pele-shape-rect wait" data-id="T" transform="translate(924.52,826.32)"><rect x="-95.52" y="-42" width="191.04" height="84" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-dasharray:2 2;"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-14.75">Own terminal:</tspan><tspan x="0" y="5.25">shows command, waits</tspan><tspan x="0" y="25.25">Enter</tspan></text></g></g></svg>