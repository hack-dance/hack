<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 879 863" width="879" height="863" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="439.5" y="40.75">New project share · idle restart</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M538.7,38L538.7,99"/><path class="pele-marker" d="M538.7,106L535.34,98L542.06,98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M522.7,149C522.7,155.13 87.61,167.38 87.61,173.5L87.61,574"/><path class="pele-marker" d="M87.61,581L84.25,573L90.97,573Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M538.7,149C538.7,158.25 500.53,158.25 500.53,167.5L500.53,222"/><path class="pele-marker" d="M500.53,229L497.17,221L503.89,221Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M554.7,149C554.7,159.2 790.08,163.3 790.08,173.5L790.08,624C790.08,658 611.46,658 611.46,692L611.46,688.5"/><path class="pele-marker" d="M611.46,695.5L608.1,687.5L614.82,687.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M500.53,272L500.53,284C500.53,293.25 450.66,293.25 450.66,302.5L450.66,352L450.66,348.5"/><path class="pele-marker" d="M450.66,355.5L447.3,347.5L454.02,347.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M500.53,272L500.53,284C500.53,296.25 611.46,296.25 611.46,308.5L611.46,692L611.46,688.5"/><path class="pele-marker" d="M611.46,695.5L608.1,687.5L614.82,687.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M450.66,398.5L450.66,444.5C450.66,451.44 394.19,451.44 394.19,458.38L394.19,463"/><path class="pele-marker" d="M394.19,470L390.83,462L397.55,462Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M450.66,398.5L450.66,402C450.66,414.25 507.13,414.25 507.13,426.5L507.13,660.5C507.13,676.25 611.46,676.25 611.46,692L611.46,688.5"/><path class="pele-marker" d="M611.46,695.5L608.1,687.5L614.82,687.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M394.19,513L394.19,555.5C394.19,558.97 103.61,565.91 103.61,569.38L103.61,574"/><path class="pele-marker" d="M103.61,581L100.25,573L106.97,573Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M91.61,624C91.61,633.25 74.8,633.25 74.8,642.5L74.8,692L74.8,688.5"/><path class="pele-marker" d="M74.8,695.5L71.44,687.5L78.16,687.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M107.61,624C107.61,628.63 436.77,637.88 436.77,642.5L436.77,666.5C436.77,679.25 611.46,679.25 611.46,692L611.46,688.5"/><path class="pele-marker" d="M611.46,695.5L608.1,687.5L614.82,687.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M74.8,738.5L74.8,742C74.8,757.5 287.66,757.5 287.66,773L287.66,779"/><path class="pele-marker" d="M287.66,786L284.3,778L291.02,778Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M611.46,738.5L611.46,742C611.46,753.87 287.66,761.13 287.66,773L287.66,779"/><path class="pele-marker" d="M287.66,786L284.3,778L291.02,778Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="first-first----note-13"><path d="M528.61,250.5L572.61,250.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="second----note-14-second"><path d="M366.48,377L410.48,377"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="boot-boot----note-15"><path d="M105.39,717L149.39,717"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="refused----note-16-refused"><path d="M526.45,717L570.45,717"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="490.98" y="58.5" width="95.44" height="20" rx="3" fill="var(--_bg)"/><text x="538.7" y="73.05" text-anchor="middle">root not shared</text></g><g class="pele-edge-label" data-id="edge1"><rect x="42.78" y="367" width="89.67" height="20" rx="3" fill="var(--_bg)"/><text x="87.61" y="381.55" text-anchor="middle">[pool stopped]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="432.59" y="169.5" width="135.88" height="20" rx="3" fill="var(--_bg)"/><text x="500.53" y="184.05" text-anchor="middle">[running, provider live]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="727.19" y="367" width="125.78" height="20" rx="3" fill="var(--_bg)"/><text x="790.08" y="381.55" text-anchor="middle">[starting or stopping]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="395.36" y="304.5" width="110.61" height="20" rx="3" fill="var(--_bg)"/><text x="450.66" y="319.05" text-anchor="middle">[idle, under lease]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="586.5" y="481.5" width="49.91" height="20" rx="3" fill="var(--_bg)"/><text x="611.46" y="496.05" text-anchor="middle">[in use]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="421.74" y="422.5" width="57.84" height="20" rx="3" fill="var(--_bg)"/><text x="450.66" y="437.05" text-anchor="middle">[still idle]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="454.36" y="481.5" width="105.54" height="20" rx="3" fill="var(--_bg)"/><text x="507.13" y="496.05" text-anchor="middle">[a start went live]</text></g><g class="pele-edge-label" data-id="edge8"><rect x="349.35" y="533.5" width="89.67" height="20" rx="3" fill="var(--_bg)"/><text x="394.19" y="548.05" text-anchor="middle">guest stopped</text></g><g class="pele-edge-label" data-id="edge9"><rect x="26" y="644.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="74.8" y="659.05" text-anchor="middle">share journaled</text></g><g class="pele-edge-label" data-id="edge10"><rect x="376.41" y="644.5" width="120.72" height="20" rx="3" fill="var(--_bg)"/><text x="436.77" y="659.05" text-anchor="middle">[booted meanwhile]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(538.7,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="status" transform="translate(538.7,127.5)"><rect x="-36.01" y="-21.5" width="72.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">status</text></g><g class="pele-node pele-state" data-id="add" transform="translate(99.61,602.5)"><rect x="-28.51" y="-21.5" width="57.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">add</text></g><g class="pele-node pele-state wait" data-id="stop" transform="translate(394.19,491.5)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stop</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(287.66,795)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="first" transform="translate(500.53,250.5)"><rect x="-28.08" y="-21.5" width="56.17" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">first</text></g><g class="pele-node pele-state fail" data-id="refused" transform="translate(611.46,717)"><rect x="-41.01" y="-21.5" width="82.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">refused</text></g><g class="pele-node pele-state" data-id="second" transform="translate(450.66,377)"><rect x="-40.18" y="-21.5" width="80.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">second</text></g><g class="pele-node pele-state ok" data-id="boot" transform="translate(74.8,717)"><rect x="-30.59" y="-21.5" width="61.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">boot</text></g><g class="pele-note" data-id="first----note-13" transform="translate(667.34,250.5)"><path d="M-94.73,-33.5H86.73L94.73,-25.5V33.5H-94.73Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M86.73,-33.5V-25.5H94.73" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Live run, pending recovery,</tspan><tspan x="0" y="4.55">open session or image build:</tspan><tspan x="0" y="21.55">in use. Unreadable: in use.</tspan></text></g><g class="pele-note" data-id="refused----note-16" transform="translate(446.52,717)"><path d="M-79.93,-25H71.93L79.93,-17V25H-79.93Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M71.93,-25V-17H79.93" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Says: down in the other</tspan><tspan x="0" y="13.05">projects, then up again.</tspan></text></g><g class="pele-note" data-id="second----note-14" transform="translate(271.38,377)"><path d="M-95.1,-25H87.1L95.1,-17V25H-95.1Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.1,-25V-17H95.1" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Right before the guest stops,</tspan><tspan x="0" y="13.05">still under the provider lease.</tspan></text></g><g class="pele-note" data-id="boot----note-15" transform="translate(238,717)"><path d="M-88.6,-25H80.6L88.6,-17V25H-88.6Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M80.6,-25V-17H88.6" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">This up boots the pool and</tspan><tspan x="0" y="13.05">prints one line, about 30 s.</tspan></text></g></g></g></svg>