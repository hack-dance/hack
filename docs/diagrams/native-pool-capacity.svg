<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 586 704" width="586" height="704" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M299.58,38L299.58,75"/><path class="pele-marker" d="M299.58,82L296.22,74L302.94,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M292.32,125L292.32,134.63C292.32,140.81 194.13,140.81 194.13,147L194.13,186"/><path class="pele-marker" d="M194.13,193L190.77,185L197.49,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M343.51,95.5C369.51,87.5 369.51,119.5 350.2,113.56"/><path class="pele-marker" d="M343.51,111.5L352.14,110.64L350.17,117.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M216.37,193L216.37,183.38C216.37,177.78 325.81,176.6 325.81,171L325.81,147C325.81,141.38 308.32,141.38 308.32,135.75L308.32,132"/><path class="pele-marker" d="M308.32,125L311.68,133L304.96,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M216.37,236L216.37,297"/><path class="pele-marker" d="M216.37,304L213.01,296L219.73,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M216.37,347L216.37,408"/><path class="pele-marker" d="M216.37,415L213.01,407L219.73,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M216.37,458L216.37,519"/><path class="pele-marker" d="M216.37,526L213.01,518L219.73,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M216.37,569L216.37,611.5C216.37,618.44 295.58,618.44 295.58,625.38L295.58,630"/><path class="pele-marker" d="M295.58,637L292.22,629L298.94,629Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M311.58,637L311.58,624C311.58,596.5 499.11,596.5 499.11,569L499.11,153C499.11,147.32 324.32,142.93 324.32,137.25L324.32,132"/><path class="pele-marker" d="M324.32,125L327.68,133L320.96,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M265.3,317.5C291.3,309.5 291.3,341.5 271.99,335.56"/><path class="pele-marker" d="M265.3,333.5L273.94,332.64L271.96,339.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M284.05,428.5C310.05,420.5 310.05,452.5 290.74,446.56"/><path class="pele-marker" d="M284.05,444.5L292.68,443.64L290.71,450.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M278.21,539.5C304.21,531.5 304.21,563.5 284.9,557.56"/><path class="pele-marker" d="M278.21,555.5L286.85,554.64L284.87,561.06Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="136.29" y="149" width="115.67" height="20" rx="3" fill="var(--_bg)"/><text x="194.13" y="163.55" text-anchor="middle">idle at both checks</text></g><g class="pele-edge-label" data-id="edge2"><rect x="375.51" y="93.5" width="112.77" height="20" rx="3" fill="var(--_bg)"/><text x="431.89" y="108.05" text-anchor="middle">active use refuses</text></g><g class="pele-edge-label" data-id="edge3"><rect x="271.96" y="149" width="107.71" height="20" rx="3" fill="var(--_bg)"/><text x="325.81" y="163.55" text-anchor="middle">boot existing size</text></g><g class="pele-edge-label" data-id="edge4"><rect x="162.16" y="256.5" width="108.43" height="20" rx="3" fill="var(--_bg)"/><text x="216.37" y="271.05" text-anchor="middle">sync resize intent</text></g><g class="pele-edge-label" data-id="edge5"><rect x="132.18" y="367.5" width="168.39" height="20" rx="3" fill="var(--_bg)"/><text x="216.37" y="382.05" text-anchor="middle">provider compare and swap</text></g><g class="pele-edge-label" data-id="edge6"><rect x="150.96" y="478.5" width="130.82" height="20" rx="3" fill="var(--_bg)"/><text x="216.37" y="