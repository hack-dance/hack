<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1310 1021" width="1310" height="1021" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="655" y="40.75">PoolStop · run and pool stop</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M313.56,38L313.56,75"/><path class="pele-marker" d="M313.56,82L310.2,74L316.92,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M313.56,125L313.56,215"/><path class="pele-marker" d="M313.56,222L310.2,214L316.92,214Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M313.56,907L313.56,895C313.56,861 176.36,861 176.36,827L176.36,362C176.36,328 313.56,328 313.56,294L313.56,272"/><path class="pele-marker" d="M313.56,265L316.92,273L310.2,273Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M313.56,265L313.56,294C313.56,328 295.41,328 295.41,362L295.41,827C295.41,861 313.56,861 313.56,895L313.56,900"/><path class="pele-marker" d="M313.56,907L310.2,899L316.92,899Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M348.32,235.5C374.32,227.5 374.32,259.5 355.01,253.56"/><path class="pele-marker" d="M348.32,251.5L356.95,250.64L354.98,257.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M313.56,265L313.56,294C313.56,328 379.86,328 379.86,362L379.86,441.5C379.86,454.04 696.46,460.46 696.46,473L696.46,478"/><path class="pele-marker" d="M696.46,485L693.1,477L699.82,477Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M313.56,265L313.56,294C313.56,298.63 780.11,307.88 780.11,312.5L780.11,355"/><path class="pele-marker" d="M780.11,362L776.75,354L783.47,354Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M780.11,405C780.11,414.25 696.46,414.25 696.46,423.5L696.46,478"/><path class="pele-marker" d="M696.46,485L693.1,477L699.82,477Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M696.46,528L696.46,613"/><path class="pele-marker" d="M696.46,620L693.1,612L699.82,612Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M696.46,663L696.46,675C696.46,683.03 397.56,691.47 397.56,699.5L397.56,827C397.56,861 313.56,861 313.56,895L313.56,900"/><path class="pele-marker" d="M313.56,907L310.2,899L316.92,899Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M696.46,663L696.46,675C696.46,684.25 604.33,684.25 604.33,693.5L604.33,756.5"/><path class="pele-marker" d="M604.33,763.5L600.97,755.5L607.69,755.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M696.46,663L696.46,675C696.46,679.63 1005.01,688.88 1005.01,693.5L1005.01,756.5"/><path class="pele-marker" d="M1005.01,763.5L1001.65,755.5L1008.37,755.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M604.33,806.5L604.33,869.5C604.33,878.45 313.56,886.05 313.56,895L313.56,900"/><path class="pele-marker" d="M313.56,907L310.2,899L316.92,899Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="ready-ready----note-13"><path d="M348.32,243.5L555.31,243.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="orphaned----note-14-orphaned"><path d="M604.77,506.5L648.77,506.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="recover-recover----note-15"><path d="M737.46,641.5L781.46,641.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="stranded-stranded----note-16"><path d="M1050.19,785L1094.19,785"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="finalizing-finalizing----note-17"><path d="M649.51,785L693.51,785"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="retained----note-18-retained"><path d="M226.46,928.5L270.46,928.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="286.8" y="145.5" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="313.56" y="160.05" text-anchor="middle">hack up</text></g><g class="pele-edge-label" data-id="edge2"><rect x="149.6" y="631.5" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="176.36" y="646.05" text-anchor="middle">hack up</text></g><g class="pele-edge-label" data-id="edge3"><rect x="260.34" y="496.5" width="70.14" height="20" rx="3" fill="var(--_bg)"/><text x="295.41" y="511.05" text-anchor="middle">hack down</text></g><g class="pele-edge-label" data-id="edge4"><rect x="380.32" y="233.5" width="133" height="20" rx="3" fill="var(--_bg)"/><text x="446.82" y="248.05" text-anchor="middle">runtime down refused</text></g><g class="pele-edge-label" data-id="edge5"><rect x="305.41" y="373.5" width="148.89" height="20" rx="3" fill="var(--_bg)"/><text x="379.86" y="388.05" text-anchor="middle">forced down, owner dies</text></g><g class="pele-edge-label" data-id="edge6"><rect x="719.76" y="314.5" width="120.7" height="20" rx="3" fill="var(--_bg)"/><text x="780.11" y="329.05" text-anchor="middle">VM or provider dies</text></g><g class="pele-edge-label" data-id="edge7"><rect x="636.1" y="425.5" width="120.71" height="20" rx="3" fill="var(--_bg)"/><text x="696.46" y="440.05" text-anchor="middle">hack native recover</text></g><g class="pele-edge-label" data-id="edge8"><rect x="635.01" y="560.5" width="122.89" height="20" rx="3" fill="var(--_bg)"/><text x="696.46" y="575.05" text-anchor="middle">hack up, hack down</text></g><g class="pele-edge-label" data-id="edge9"><rect x="305.41" y="775" width="184.31" height="20" rx="3" fill="var(--_bg)"/><text x="397.56" y="789.55" text-anchor="middle">[boot known, no HTTPS lease]</text></g><g class="pele-edge-label" data-id="edge10"><rect x="521.21" y="695.5" width="166.24" height="20" rx="3" fill="var(--_bg)"/><text x="604.33" y="710.05" text-anchor="middle">[boot known, HTTPS lease]</text></g><g class="pele-edge-label" data-id="edge11"><rect x="953.31" y="695.5" width="103.39" height="20" rx="3" fill="var(--_bg)"/><text x="1005.01" y="710.05" text-anchor="middle">[boot not known]</text></g><g class="pele-edge-label" data-id="edge12"><rect x="524.1" y="847.5" width="160.45" height="20" rx="3" fill="var(--_bg)"/><text x="604.33" y="862.05" text-anchor="middle">lease released or archived</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(313.56,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="none" transform="translate(313.56,103.5)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">none</text></g><g class="pele-node pele-state wait" data-id="crashed" transform="translate(780.11,383.5)"><rect x="-42.68" y="-21.5" width="85.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">crashed</text></g><g class="pele-node pele-state ok" data-id="ready" transform="translate(313.56,243.5)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state" data-id="retained" transform="translate(313.56,928.5)"><rect x="-43.1" y="-21.5" width="86.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retained</text></g><g class="pele-node pele-state wait" data-id="orphaned" transform="translate(696.46,506.5)"><rect x="-47.69" y="-21.5" width="95.38" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">orphaned</text></g><g class="pele-node pele-state" data-id="recover" transform="translate(696.46,641.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">recover</text></g><g class="pele-node pele-state wait" data-id="finalizing" transform="translate(604.33,785)"><rect x="-45.17" y="-21.5" width="90.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">finalizing</text></g><g class="pele-node pele-state fail" data-id="stranded" transform="translate(1005.01,785)"><rect x="-45.18" y="-21.5" width="90.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stranded</text></g><g class="pele-note" data-id="ready----note-13" transform="translate(646.43,243.5)"><path d="M-91.11,-50.5H83.11L91.11,-42.5V50.5H-91.11Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M83.11,-50.5V-42.5H91.11" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">runtime down refuses a live</tspan><tspan x="0" y="-12.45">run and names it; only</tspan><tspan x="0" y="4.55">runtime down --force stops</tspan><tspan x="0" y="21.55">the pool under it.</tspan><tspan x="0" y="38.55">INV NoDownOverLiveRun.</tspan></text></g><g class="pele-note" data-id="retained----note-18" transform="translate(125.23,928.5)"><path d="M-101.23,-33.5H93.23L101.23,-25.5V33.5H-101.23Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.23,-33.5V-25.5H101.23" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV NoDeadEnd: some named</tspan><tspan x="0" y="4.55">command always acts.</tspan><tspan x="0" y="21.55">PROP Recovers.</tspan></text></g><g class="pele-note" data-id="orphaned----note-14" transform="translate(504.97,506.5)"><path d="M-99.8,-33.5H91.8L99.8,-25.5V33.5H-99.8Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.8,-33.5V-25.5H99.8" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Receipt still ready-observed,</tspan><tspan x="0" y="4.55">owner dead, publication left.</tspan><tspan x="0" y="21.55">Pool stopped or in a new boot.</tspan></text></g><g class="pele-note" data-id="recover----note-15" transform="translate(872.93,641.5)"><path d="M-91.47,-33.5H83.47L91.47,-25.5V33.5H-91.47Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M83.47,-33.5V-25.5H91.47" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">runtime up first, then the</tspan><tspan x="0" y="4.55">existing recovery as its own</tspan><tspan x="0" y="21.55">request, data kept.</tspan></text></g><g class="pele-note" data-id="finalizing----note-17" transform="translate(806.66,785)"><path d="M-113.16,-42H105.16L113.16,-34V42H-113.16Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M105.16,-42V-34H113.16" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">Graph stopped, HTTPS lease held.</tspan><tspan x="0" y="-3.95">The old owner retires when its</tspan><tspan x="0" y="13.05">boot ends; up refuses until</tspan><tspan x="0" y="30.05">down --recover finishes.</tspan></text></g><g class="pele-note" data-id="stranded----note-16" transform="translate(1190,785)"><path d="M-95.81,-33.5H87.81L95.81,-25.5V33.5H-95.81Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.81,-33.5V-25.5H95.81" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Refused, data kept: the run's</tspan><tspan x="0" y="4.55">boot left the 16-boot history,</tspan><tspan x="0" y="21.55">or its evidence is ambiguous.</tspan></text></g></g></g></svg>