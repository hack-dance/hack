="0" y="5.25" text-anchor="middle">Packaged</text></g><g class="pele-node pele-state ok" data-id="Tagged" transform="translate(240.81,920)"><rect x="-41.43" y="-21.5" width="82.87" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Tagged</text></g><g class="pele-note" data-id="Packaged----note-17" transform="translate(657.07,580)"><path d="M-107.73,-25H99.73L107.73,-17V25H-107.73Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M99.73,-25V-17H107.73" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV a packaged set lists exactly</tspan><tspan x="0" y="13.05">the platforms whose files it holds.</tspan></text></g><g class="pele-note" data-id="Tagged----note-18" transform="translate(460.36,920)"><path d="M-134.12,-25H126.12L134.12,-17V25H-134.12Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M126.12,-25V-17H134.12" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV publish creates no tag for a set whose</tspan><tspan x="0" y="13.05">platform list differs from its files.</tspan></text></g></g></g></svg>