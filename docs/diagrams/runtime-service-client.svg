"-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">idle</text></g><g class="pele-node pele-state" data-id="oneshot" transform="translate(893.24,344.5)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">oneshot</text></g><g class="pele-node pele-state" data-id="replied" transform="translate(115.87,467.5)"><rect x="-38.51" y="-21.5" width="77.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">replied</text></g><g class="pele-node pele-state wait" data-id="unknown" transform="translate(345.27,467.5)"><rect x="-46.01" y="-21.5" width="92.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">unknown</text></g><g class="pele-node pele-state" data-id="oneshotRunning" transform="translate(893.24,467.5)"><rect x="-70.62" y="-21.5" width="141.23" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">oneshotRunning</text></g><g class="pele-node pele-state ok" data-id="finished" transform="translate(540.87,713.5)"><rect x="-41.84" y="-21.5" width="83.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">finished</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(540.87,788)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="hello" transform="translate(348.92,218)"><rect x="-31.84" y="-21.5" width="63.68" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">hello</text></g><g class="pele-node pele-state live" data-id="sent" transform="translate