name: CI

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
      - name: Install dependencies
        run: bun install
      - name: Typecheck (Turbo)
        run: bun run turbo:typecheck
      - name: Privacy check
        run: bun run privacy:check
      - name: Quality checks (Turbo)
        run: bun run turbo:check
      - name: Tests (Turbo)
        run: bun run turbo:test
      - name: Build CLI
        run: bun run build
      - name: Build release smoke (no tests)
        run: bun run build:release --skip-tests --no-clean --out=dist/release-ci
