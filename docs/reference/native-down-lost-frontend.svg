ed, rerun</text></g><g class="pele-edge-label" data-id="edge6"><rect x="354.01" y="467.5" width="54.25" height="20" rx="3" fill="var(--_bg)"/><text x="381.14" y="482.05" text-anchor="middle">[absent]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="434.44" y="400" width="89.65" height="20" rx="3" fill="var(--_bg)"/><text x="479.27" y="414.55" text-anchor="middle">[exited, ready]</text></g><g class="pele-edge-label" data-id="edge8"><rect x="544.1" y="400" width="104.11" height="20" rx="3" fill="var(--_bg)"/><text x="596.15" y="414.55" text-anchor="middle">[exited, retained]</text></g><g class="pele-edge-label" data-id="edge9"><rect x="878.09" y="400" width="96.14" height="20" rx="3" fill="var(--_bg)"/><text x="926.16" y="414.55" text-anchor="middle">exited mid-stop</text></g><g class="pele-edge-label" data-id="edge10"><rect x="437.33" y="531.5" width="83.88" height="20" rx="3" fill="var(--_bg)"/><text x="479.27" y="546.05" text-anchor="middle">death proved</text></g><g class="pele-edge-label" data-id="edge11"><rect x="554.21" y="531.5" width="83.88" height="20" rx="3" fill="var(--_bg)"/><text x="596.15" y="546.05" text-anchor="middle">death proved</text></g><g class="pele-edge-label" data-id="edge12"><rect x="26" y="685" width="61.48" height="20" rx="3" fill="var(--_bg)"/><text x="56.74" y="699.55" text-anchor="middle">[stopped]</text></g><g class="pele-edge-label" data-id="edge13"><rect x="600.3" y="685" width="83.17" height="20" rx="3" fill="var(--_bg)"/><text x="641.89" y="699.55" text-anchor="middle">[not stopped]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(290.87,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="stop" transform="translate(290.87,127.5)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stop</text></g><g class="pele-node pele-state" data-id="confirm" transform="translate(349.31,643)"><rect x="-40.58" y="-21.5" width="81.17" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">confirm</text></g><g class="pele-node pele-state wait" data-id="exiting" transform="translate(233.25,477.5)"><rect x="-37.67" y="-21.5" width="75.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">exiting</text></g><g class="pele-node pele-state wait" data-id="recover" transform="translate(479.27,477.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">recover</text></g><g class="pele-node pele-state wait" data-id="retire" transform="translate(596.15,477.5)"><rect x="-33.08" y="-21.5" width="66.17" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retire</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(56.74,852.5)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="reselect" transform="translate(430.2,267.5)"><rect x="-42.26" y="-21.5" width="84.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">reselect</text></g><g class="pele-node pele-state fail" data-id="midstop" transform="translate(926.16,477.5)"><rect x="-42.26" y="-21.5" width="84.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">midstop</text></g><g class="pele-node pele-state ok" data-id="done" transform="translate(56.74,766)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">done</text></g><g class="pele-node pele-state fail" data-id="torn" transform="translate(641.89,766)"><rect x="-28.92" y="-21.5" width="57.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">torn</text></g><g class="pele-note" data-id="reselect----note-15" transform="translate(751.78,267.5)"><path d="M-99.06,-50.5H91.06L99.06,-42.5V50.5H-99.06Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.06,-50.5V-42.5H99.06" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">HACK-2097: wait at most 15 s</tspan><tspan x="0" y="-12.45">while the owner finishes its</tspan><tspan x="0" y="4.55">own stop and retires its</tspan><tspan x="0" y="21.55">publication. Never recovered</tspan><tspan x="0" y="38.55">while running or uncertain.</tspan></text></g><g class="pele-note" data-id="midstop----note-17" transform="translate(754.57,477.5)"><path d="M-85.33,-33.5H77.33L85.33,-25.5V33.5H-85.33Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M77.33,-33.5V-25.5H85.33" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Died during its own stop:</tspan><tspan x="0" y="4.55">refusal names the explicit</tspan><tspan x="0" y="21.55">dead-owner cleanup.</tspan></text></g><g class="pele-note" data-id="done----note-16" transform="translate(230.32,766)"><path d="M-96.9,-33.5H88.9L96.9,-25.5V33.5H-96.9Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M88.9,-33.5V-25.5H96.9" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Data retained, frontend</tspan><tspan x="0" y="4.55">shutdown recovered; hack up</tspan><tspan x="0" y="21.55">starts the run again.</tspan></text></g><g class="pele-note" data-id="torn----note-18" transform="translate(468.1,766)"><path d="M-100.87,-25H92.87L100.87,-17V25H-100.87Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M92.87,-25V-17H100.87" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV NoDeadEnd: every refusal</tspan><tspan x="0" y="13.05">names a working step.</tspan></text></g></g></g></svg>