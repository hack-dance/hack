nt_0"><rect x="342.16" y="315.26" width="47.03" height="20" rx="3" fill="var(--_bg)"/><text x="365.67" y="329.81" text-anchor="middle">absent</text></g><g class="pele-edge-label" data-id="L_Hash_Retry_0"><rect x="396.03" y="753.9" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="407.26" y="768.45" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_Hash_Prepare_0"><rect x="470.09" y="753.9" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="484.2" y="768.45" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_Retry_Start_0"><rect x="600.49" y="505.76" width="81.68" height="20" rx="3" fill="var(--_bg)"/><text x="641.33" y="520.31" text-anchor="middle">explicit rerun</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Start" transform="translate(225.96,82.5)"><rect x="-63.43" y="-23.5" width="126.87" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">runtime setup</text></g><g class="pele-node pele-shape-diam" data-id="Existing" transform="translate(154.11,223.38)"><polygon points="0,-69.38 111.01,0 0,69.38 -111.01,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Complete matching</tspan><tspan x="0" y="15.25">install?</tspan></text></g><g class="pele-node pele-shape-rect wait" data-id="Consent" transform="translate(365.67,388.26)"><rect x="-45.93" y="-23.5" width="91.86" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Consent</text></g><g class="pele-node pele-shape-rect fail" data-id="Refused" transform="translate(248.92,515.76)"><rect x="-86.77" y="-23.5" width="173.55" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Refuse before writes</text></g><g cl