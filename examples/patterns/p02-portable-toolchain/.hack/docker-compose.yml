name: pattern-p02
services:
  # One-shot toolchain behind an opt-in profile (HACK-P02). There is no
  # long-running application service in this project.
  toolchain:
    image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    profiles: [toolchain]
    init: true
    working_dir: /app
    cpus: 2
    mem_limit: 2g
    environment:
      BUN_INSTALL_CACHE_DIR: /cache/bun
    volumes:
      - ..:/app
      - toolchain_dependencies:/app/node_modules
      - toolchain_bun_cache:/cache/bun

volumes:
  toolchain_dependencies: {}
  toolchain_bun_cache: {}
