<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 661 1107" width="661" height="1107" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="330.5" y="40.75">BridgeBatch · release a run</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M403.88,38L403.88,87"/><path class="pele-marker" d="M403.88,94L400.52,86L407.24,86Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M403.88,137L403.88,149C403.88,166.36 346.71,177 253.43,177C160.15,177 102.98,192.2 102.98,217L102.98,241C102.98,252 128.96,252 128.96,263L128.96,259.5"/><path class="pele-marker" d="M128.96,266.5L125.6,258.5L132.32,258.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M128.96,309.5L128.96,374"/><path class="pele-marker" d="M128.96,381L125.6,373L132.32,373Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M128.96,424L128.96,466.5C128.96,472.45 258.42,474.43 258.42,480.38L258.42,485"/><path class="pele-marker" d="M258.42,492L255.06,484L261.78,484Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M266.42,535L266.42,596"/><path class="pele-marker" d="M266.42,603L263.06,595L269.78,595Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M266.42,646L266.42,688.5C266.42,695.44 342.31,695.44 342.31,702.38L342.31,707"/><path class="pele-marker" d="M342.31,714L338.95,706L345.67,706Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M350.31,757L350.31,818"/><path class="pele-marker" d="M350.31,825L346.95,817L353.67,817Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M350.31,868L350.31,936L350.31,932.5"/><path class="pele-marker" d="M350.31,939.5L346.95,931.5L353.67,931.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M128.96,266.5L128.96,263C128.96,252 238.26,252 238.26,241L238.26,217C238.26,199.64 269.73,189 321.07,189C372.41,189 403.88,173.8 403.88,149L403.88,144"/><path class="pele-marker" d="M403.88,137L407.24,145L400.52,145Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M274.42,492L274.42,479C274.42,451.5 403.88,451.5 403.88,424L403.88,144"/><path class="pele-marker" d="M403.88,137L407.24,145L400.52,145Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M358.31,714L358.31,701C358.31,691.75 452.19,691.75 452.19,682.5L452.19,263C452.19,206 403.88,206 403.88,149L403.88,144"/><path class="pele-marker" d="M403.88,137L407.24,145L400.52,145Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M350.31,982.5L350.31,1023"/><path class="pele-marker" d="M350.31,1030L346.95,1022L353.67,1022Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="pubs-pubs----note-12"><path d="M161.22,288L205.22,288"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="done-done----note-13"><path d="M382.99,961L426.99,961"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="idle----note-14-idle"><path d="M331.88,115.5L375.88,115.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="26" y="219" width="153.95" height="20" rx="3" fill="var(--_bg)"/><text x="102.98" y="233.55" text-anchor="middle">CleanAcquire [lease free]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="54.53" y="333.5" width="148.87" height="20" rx="3" fill="var(--_bg)"/><text x="128.96" y="348.05" text-anchor="middle">CleanPubs (all listeners)</text></g><g class="pele-edge-label" data-id="edge3"><rect x="49.82" y="444.5" width="158.29" height="20" rx="3" fill="var(--_bg)"/><text x="128.96" y="459.05" text-anchor="middle">CleanStopping (one save)</text></g><g class="pele-edge-label" data-id="edge4"><rect x="185.83" y="555.5" width="161.18" height="20" rx="3" fill="var(--_bg)"/><text x="266.42" y="570.05" text-anchor="middle">CleanStop (one guest call)</text></g><g class="pele-edge-label" data-id="edge5"><rect x="188.72" y="666.5" width="155.41" height="20" rx="3" fill="var(--_bg)"/><text x="266.42" y="681.05" text-anchor="middle">CleanStopped (one save)</text></g><g class="pele-edge-label" data-id="edge6"><rect x="258.89" y="777.5" width="182.84" height="20" rx="3" fill="var(--_bg)"/><text x="350.31" y="792.05" text-anchor="middle">CleanRemove (one guest call)</text></g><g class="pele-edge-label" data-id="edge7"><rect x="282.73" y="888.5" width="135.15" height="20" rx="3" fill="var(--_bg)"/><text x="350.31" y="903.05" text-anchor="middle">CleanDrop (one save)</text></g><g class="pele-edge-label" data-id="edge8"><rect x="199.95" y="219" width="76.63" height="20" rx="3" fill="var(--_bg)"/><text x="238.26" y="233.55" text-anchor="middle">CleanCrash</text></g><g class="pele-edge-label" data-id="edge9"><rect x="365.56" y="392.5" width="76.63" height="20" rx="3" fill="var(--_bg)"/><text x="403.88" y="407.05" text-anchor="middle">CleanCrash</text></g><g class="pele-edge-label" data-id="edge10"><rect x="413.88" y="503.5" width="76.63" height="20" rx="3" fill="var(--_bg)"/><text x="452.19" y="518.05" text-anchor="middle">CleanCrash</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(403.88,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="stopping" transform="translate(128.96,402.5)"><rect x="-44.35" y="-21.5" width="88.7" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stopping</text></g><g class="pele-node pele-state live" data-id="stop" transform="translate(266.42,513.5)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stop</text></g><g class="pele-node pele-state" data-id="stopped" transform="translate(266.42,624.5)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stopped</text></g><g class="pele-node pele-state live" data-id="remove" transform="translate(350.31,735.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">remove</text></g><g class="pele-node pele-state" data-id="drop" transform="translate(350.31,846.5)"><rect x="-31.01" y="-21.5" width="62.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">drop</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(350.31,1039)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="idle" transform="translate(403.88,115.5)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">idle</text></g><g class="pele-node pele-state" data-id="pubs" transform="translate(128.96,288)"><rect x="-32.26" y="-21.5" width="64.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">pubs</text></g><g class="pele-node pele-state ok" data-id="done" transform="translate(350.31,961)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">done</text></g><g class="pele-note" data-id="idle----note-14" transform="translate(241.84,115.5)"><path d="M-90.04,-33.5H82.04L90.04,-25.5V33.5H-90.04Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M82.04,-33.5V-25.5H90.04" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">A crash resumes from the</tspan><tspan x="0" y="4.55">durable phases; every step</tspan><tspan x="0" y="21.55">is idempotent per slot.</tspan></text></g><g class="pele-note" data-id="pubs----note-12" transform="translate(290.55,288)"><path d="M-85.33,-25H77.33L85.33,-17V25H-85.33Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M77.33,-25V-17H85.33" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV: every listener closes</tspan><tspan x="0" y="13.05">before any relay stops</tspan></text></g><g class="pele-note" data-id="done----note-13" transform="translate(531.83,961)"><path d="M-104.84,-25H96.84L104.84,-17V25H-104.84Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M96.84,-25V-17H104.84" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV ReleaseComplete: no relay,</tspan><tspan x="0" y="13.05">no live listener</tspan></text></g></g></g></svg>