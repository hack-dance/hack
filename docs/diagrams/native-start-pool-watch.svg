<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 896 856" width="896" height="856" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="448" y="40.75">Detached start · pool boot ended</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M337.17,38L337.17,99"/><path class="pele-marker" d="M337.17,106L333.81,98L340.53,98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M382.77,119.5C408.77,111.5 408.77,143.5 389.46,137.56"/><path class="pele-marker" d="M382.77,135.5L391.4,134.64L389.43,141.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M337.17,149L337.17,210"/><path class="pele-marker" d="M337.17,217L333.81,209L340.53,209Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M329.17,260C329.17,294 177.73,294 177.73,328L177.73,447.5L177.73,444"/><path class="pele-marker" d="M177.73,451L174.37,443L181.09,443Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M345.17,260C345.17,268.73 501.97,269.77 501.97,278.5L501.97,321"/><path class="pele-marker" d="M501.97,328L498.61,320L505.33,320Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M480.62,371C480.62,376.39 226.78,384.11 226.78,389.5L226.78,413.5C226.78,430.5 177.73,430.5 177.73,447.5L177.73,444"/><path class="pele-marker" d="M177.73,451L174.37,443L181.09,443Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M512.62,371C512.62,375.63 825.25,384.88 825.25,389.5L825.25,444"/><path class="pele-marker" d="M825.25,451L821.89,443L828.61,443Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M177.73,494L177.73,497.5C177.73,535.75 272.8,535.75 272.8,574L272.8,570.5"/><path class="pele-marker" d="M272.8,577.5L269.44,569.5L276.16,569.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M272.8,620.5L272.8,685"/><path class="pele-marker" d="M272.8,692L269.44,684L276.16,684Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M496.62,371L496.62,444"/><path class="pele-marker" d="M496.62,451L493.26,443L499.98,443Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M496.62,494L496.62,548.5C496.62,560.12 272.8,562.38 272.8,574L272.8,570.5"/><path class="pele-marker" d="M272.8,577.5L269.44,569.5L276.16,569.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M825.25,494L825.25,735C825.25,744.9 437.12,756.1 437.12,766L437.12,772"/><path class="pele-marker" d="M437.12,779L433.76,771L440.48,771Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M272.8,735C272.8,750.5 437.12,750.5 437.12,766L437.12,772"/><path class="pele-marker" d="M437.12,779L433.76,771L440.48,771Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="exit-exit----note-13"><path d="M205.73,472.5L249.73,472.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="gone----note-14-gone"><path d="M196.12,599L240.12,599"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="waited-waited----note-15"><path d="M534.29,472.5L578.29,472.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="293.07" y="58.5" width="88.21" height="20" rx="3" fill="var(--_bg)"/><text x="337.17" y="73.05" text-anchor="middle">boot recorded</text></g><g class="pele-edge-label" data-id="edge1"><rect x="414.77" y="117.5" width="123.61" height="20" rx="3" fill="var(--_bg)"/><text x="476.57" y="132.05" text-anchor="middle">every 1 s, boot alive</text></g><g class="pele-edge-label" data-id="edge2"><rect x="297.03" y="169.5" width="80.28" height="20" rx="3" fill="var(--_bg)"/><text x="337.17" y="184.05" text-anchor="middle">[boot ended]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="114.83" y="339.5" width="125.79" height="20" rx="3" fill="var(--_bg)"/><text x="177.73" y="354.05" text-anchor="middle">[ready, not stopping]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="439.08" y="280.5" width="125.78" height="20" rx="3" fill="var(--_bg)"/><text x="501.97" y="295.05" text-anchor="middle">[starting or stopping]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="187.73" y="391.5" width="78.1" height="20" rx="3" fill="var(--_bg)"/><text x="226.78" y="406.05" text-anchor="middle">10 s passed</text></g><g class="pele-edge-label" data-id="edge6"><rect x="780.79" y="391.5" width="88.93" height="20" rx="3" fill="var(--_bg)"/><text x="825.25" y="406.05" text-anchor="middle">[start finished]</text></g><g class="pele-edge-label" data-id="edge8"><rect x="204.85" y="644.5" width="135.91" height="20" rx="3" fill="var(--_bg)"/><text x="272.8" y="659.05" text-anchor="middle">next up proves it gone</text></g><g class="pele-edge-label" data-id="edge9"><rect x="444.93" y="391.5" width="103.37" height="20" rx="3" fill="var(--_bg)"/><text x="496.62" y="406.05" text-anchor="middle">a new up arrives</text></g><g class="pele-edge-label" data-id="edge10"><rect x="436.1" y="526.5" width="121.04" height="20" rx="3" fill="var(--_bg)"/><text x="496.62" y="541.05" text-anchor="middle">owner exited, ≤15 s</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(337.17,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="watching" transform="translate(337.17,127.5)"><rect x="-45.59" y="-21.5" width="91.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">watching</text></g><g class="pele-node pele-state" data-id="ended" transform="translate(337.17,238.5)"><rect x="-36.85" y="-21.5" width="73.7" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ended</text></g><g class="pele-node pele-state wait" data-id="grace" transform="translate(501.97,349.5)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">grace</text></g><g class="pele-node pele-state" data-id="done" transform="translate(825.25,472.5)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">done</text></g><g class="pele-node pele-state ok" data-id="recovered" transform="translate(272.8,713.5)"><rect x="-49.34" y="-21.5" width="98.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">recovered</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(437.12,788)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state fail" data-id="exit" transform="translate(177.73,472.5)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">exit</text></g><g class="pele-node pele-state" data-id="gone" transform="translate(272.8,599)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">gone</text></g><g class="pele-node pele-state" data-id="waited" transform="translate(496.62,472.5)"><rect x="-37.67" y="-21.5" width="75.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">waited</text></g><g class="pele-note" data-id="exit----note-13" transform="translate(334.34,472.5)"><path d="M-84.61,-25H76.61L84.61,-17V25H-84.61Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M76.61,-25V-17H84.61" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Same as a crash: marker</tspan><tspan x="0" y="13.05">released, process exits.</tspan></text></g><g class="pele-note" data-id="gone----note-14" transform="translate(110.06,599)"><path d="M-86.06,-25H78.06L86.06,-17V25H-86.06Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M78.06,-25V-17H86.06" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">The next up waits for this,</tspan><tspan x="0" y="13.05">then recovers the run.</tspan></text></g><g class="pele-note" data-id="waited----note-15" transform="translate(665.43,472.5)"><path d="M-87.14,-33.5H79.14L87.14,-25.5V33.5H-87.14Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M79.14,-33.5V-25.5H87.14" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Only while the pool record</tspan><tspan x="0" y="4.55">shows the pool stopped.</tspan><tspan x="0" y="21.55">One line says so.</tspan></text></g></g></g></svg>