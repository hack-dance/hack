lesystem</text></g><g class="pele-edge-label" data-id="edge3"><rect x="554.94" y="231" width="130.11" height="20" rx="3" fill="var(--_bg)"/><text x="620" y="245.55" text-anchor="middle">explicit snapshot root</text></g><g class="pele-edge-label" data-id="edge4"><rect x="164.94" y="362.5" width="112.77" height="20" rx="3" fill="var(--_bg)"/><text x="221.32" y="377.05" text-anchor="middle">journal target start</text></g><g class="pele-edge-label" data-id="edge5"><rect x="26" y="523" width="166.98" height="20" rx="3" fill="var(--_bg)"/><text x="109.49" y="537.55" text-anchor="middle">record output then outcome</text></g><g class="pele-edge-label" data-id="edge6"><rect x="606.27" y="523" width="84.58" height="20" rx="3" fill="var(--_bg)"/><text x="648.56" y="537.55" text-anchor="middle">closed failure</text></g><g class="pele-edge-label" data-id="edge7"><rect x="780.92" y="523" width="77.36" height="20" rx="3" fill="var(--_bg)"/><text x="819.6" y="537.55" text-anchor="middle">process lost</text></g><g class="pele-edge-label" data-id="edge8"><rect x="794.57" y="421.5" width="147.43" height="20" rx="3" fill="var(--_bg)"/><text x="868.28" y="436.05" text-anchor="middle">explicit resume manifest</text></g><g class="pele-edge-label" data-id="edge9"><rect x="57.44" y="675" width="104.1" height="20" rx="3" fill="var(--_bg)"/><text x="109.49" y="689.55" text-anchor="middle">guarded rollback</text></g><g class="pele-edge-label" data-id="edge10"><rect x="627.14" y="421.5" width="147.43" height="20" rx="3" fill="var(--_bg)"/><text x="700.85" y="436.05" text-anchor="middle">explicit resume manifest</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(684.89,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="checked" transform="translate(684.89,127.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" te