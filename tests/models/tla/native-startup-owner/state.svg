<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1487 1082" width="1487" height="1082" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="743.5" y="40.75">Owner · started to ready</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M713.67,38L713.67,99"/><path class="pele-marker" d="M713.67,106L710.31,98L717.03,98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M705.67,149L705.67,157.09C705.67,159.7 499.57,164.9 499.57,167.5L499.57,210"/><path class="pele-marker" d="M499.57,217L496.21,209L502.93,209Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M499.57,247C499.57,252.48 249.82,260.02 249.82,265.5L249.82,337"/><path class="pele-marker" d="M249.82,344L246.46,336L253.18,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M499.57,247C499.57,251.63 951.81,260.88 951.81,265.5L951.81,337"/><path class="pele-marker" d="M951.81,344L948.45,336L955.17,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M249.82,387L249.82,572C249.82,578.94 236.83,578.94 236.83,585.88L236.83,590.5"/><path class="pele-marker" d="M236.83,597.5L233.47,589.5L240.19,589.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M951.81,387L951.81,407.5C951.81,477.75 770.45,477.75 770.45,548L770.45,572C770.45,575.47 252.83,582.41 252.83,585.88L252.83,590.5"/><path class="pele-marker" d="M252.83,597.5L249.47,589.5L256.19,589.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M249.82,387L249.82,416C249.82,485 62.14,485 62.14,554L62.14,677C62.14,705.52 132.8,723 248.09,723C363.38,723 434.04,755.87 434.04,809.5L434.04,815.5"/><path class="pele-marker" d="M434.04,822.5L430.68,814.5L437.4,814.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M951.81,387L951.81,407.5C951.81,502.5 858.56,502.5 858.56,597.5L858.56,640.5C858.56,725 466.04,725 466.04,809.5L466.04,815.5"/><path class="pele-marker" d="M466.04,822.5L462.68,814.5L469.4,814.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M223.85,640.5L223.85,683C223.85,700.36 266.83,711 336.95,711C407.07,711 450.04,748.43 450.04,809.5L450.04,815.5"/><path class="pele-marker" d="M450.04,822.5L446.68,814.5L453.4,814.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M249.82,387L249.82,416C249.82,485 1072.66,485 1072.66,554L1072.66,677C1072.66,698.08 1087.67,711 1112.15,711C1136.63,711 1151.64,726.2 1151.64,751L1151.64,815.5"/><path class="pele-marker" d="M1151.64,822.5L1148.28,814.5L1155,814.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M239.85,640.5C239.85,645.13 991.82,654.38 991.82,659L991.82,683C991.82,707.8 1022.19,723 1071.73,723C1121.28,723 1151.64,733.64 1151.64,751L1151.64,815.5"/><path class="pele-marker" d="M1151.64,822.5L1148.28,814.5L1155,814.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M951.81,387L951.81,407.5C951.81,502.5 1234.34,502.5 1234.34,597.5L1234.34,640.5C1234.34,695.75 1151.64,695.75 1151.64,751L1151.64,815.5"/><path class="pele-marker" d="M1151.64,822.5L1148.28,814.5L1155,814.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M1151.64,822.5L1151.64,751C1151.64,695.75 1315.18,695.75 1315.18,640.5L1315.18,217C1315.18,196.61 721.67,182.39 721.67,162L721.67,156"/><path class="pele-marker" d="M721.67,149L725.03,157L718.31,157Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge13"><path d="M452.35,865.5L452.35,998"/><path class="pele-marker" d="M452.35,1005L448.99,997L455.71,997Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="warming-warming----note-14"><path d="M341.03,365.5L385.03,365.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="stopped-stopped----note-15"><path d="M1194.33,844L1238.33,844"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="starting----note-16-starting"><path d="M829.94,365.5L873.94,365.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="692.69" y="58.5" width="41.96" height="20" rx="3" fill="var(--_bg)"/><text x="713.67" y="73.05" text-anchor="middle">Serve</text></g><g class="pele-edge-label" data-id="edge1"><rect x="417.53" y="169.5" width="164.08" height="20" rx="3" fill="var(--_bg)"/><text x="499.57" y="184.05" text-anchor="middle">Started [containers started]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="172.67" y="267.5" width="154.3" height="20" rx="3" fill="var(--_bg)"/><text x="249.82" y="282.05" text-anchor="middle">[WaitForReady = FALSE]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="877.56" y="267.5" width="148.5" height="20" rx="3" fill="var(--_bg)"/><text x="951.81" y="282.05" text-anchor="middle">[WaitForReady = TRUE]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="173.38" y="550" width="152.87" height="20" rx="3" fill="var(--_bg)"/><text x="249.82" y="564.55" text-anchor="middle">Ready [pub = committed]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="700.33" y="550" width="140.24" height="20" rx="3" fill="var(--_bg)"/><text x="770.45" y="564.55" text-anchor="middle">Ready, then up returns</text></g><g class="pele-edge-label" data-id="edge6"><rect x="26" y="609" width="72.27" height="20" rx="3" fill="var(--_bg)"/><text x="62.14" y="623.55" text-anchor="middle">Fail (PR C)</text></g><g class="pele-edge-label" data-id="edge7"><rect x="844.09" y="609" width="28.94" height="20" rx="3" fill="var(--_bg)"/><text x="858.56" y="623.55" text-anchor="middle">Fail</text></g><g class="pele-edge-label" data-id="edge8"><rect x="187.71" y="661" width="72.27" height="20" rx="3" fill="var(--_bg)"/><text x="223.85" y="675.55" text-anchor="middle">Fail (PR C)</text></g><g class="pele-edge-label" data-id="edge9"><rect x="1001.82" y="609" width="141.68" height="20" rx="3" fill="var(--_bg)"/><text x="1072.66" y="623.55" text-anchor="middle">AcceptStop, DownStop</text></g><g class="pele-edge-label" data-id="edge10"><rect x="920.98" y="661" width="141.68" height="20" rx="3" fill="var(--_bg)"/><text x="991.82" y="675.55" text-anchor="middle">AcceptStop, DownStop</text></g><g class="pele-edge-label" data-id="edge11"><rect x="1163.5" y="609" width="141.68" height="20" rx="3" fill="var(--_bg)"/><text x="1234.34" y="623.55" text-anchor="middle">AcceptStop, DownStop</text></g><g class="pele-edge-label" data-id="edge12"><rect x="1260.61" y="355.5" width="109.15" height="20" rx="3" fill="var(--_bg)"/><text x="1315.18" y="370.05" text-anchor="middle">restart: a new run</text></g><g class="pele-edge-label" data-id="edge13"><rect x="389.82" y="957.5" width="125.05" height="20" rx="3" fill="var(--_bg)"/><text x="452.35" y="972.05" text-anchor="middle">retained or recorded</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(713.67,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state live" data-id="serving" transform="translate(713.67,127.5)"><rect x="-40.17" y="-21.5" width="80.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">serving</text></g><g class="pele-node pele-state-choice" data-id="started_at" transform="translate(499.57,232)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state ok" data-id="ready" transform="translate(235.85,619)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state fail" data-id="failed" transform="translate(452.35,844)"><rect x="-58.92" y="-21.5" width="117.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">failed (PR C)</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(452.35,1014)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="warming" transform="translate(249.82,365.5)"><rect x="-91.21" y="-21.5" width="182.42" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">warming · up returned</text></g><g class="pele-node pele-state wait" data-id="starting" transform="translate(951.81,365.5)"><rect x="-77.87" y="-21.5" width="155.74" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">starting · up --wait</text></g><g class="pele-node pele-state idle" data-id="stopped" transform="translate(1151.64,844)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stopped</text></g><g class="pele-note" data-id="warming----note-14" transform="translate(484.45,365.5)"><path d="M-99.42,-50.5H91.42L99.42,-42.5V50.5H-99.42Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.42,-50.5V-42.5H99.42" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">up returns here, in order:</tspan><tspan x="0" y="-12.45">PublishMapping, Bookkeep,</tspan><tspan x="0" y="4.55">Notify, OwnerAccept, Return</tspan><tspan x="0" y="21.55">INV NoReturnWithoutMapping</tspan><tspan x="0" y="38.55">INV NoPrematureReturn</tspan></text></g><g class="pele-note" data-id="starting----note-16" transform="translate(726.9,365.5)"><path d="M-103.04,-42H95.04L103.04,-34V42H-103.04Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.04,-42V-34H103.04" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">--wait: mapping saved here too;</tspan><tspan x="0" y="-3.95">bookkeeping and return wait</tspan><tspan x="0" y="13.05">for Ready</tspan><tspan x="0" y="30.05">INV NoReturnWithoutMapping</tspan></text></g><g class="pele-note" data-id="stopped----note-15" transform="translate(1350.39,844)"><path d="M-112.07,-93H104.07L112.07,-85V93H-112.07Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M104.07,-93V-85H112.07" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-71.95">DownRequest queues the stop;</tspan><tspan x="0" y="-54.95">started-chain steps may still</tspan><tspan x="0" y="-37.95">run. AcceptStop, between passes,</tspan><tspan x="0" y="-20.95">cancels the wait. DownStop waits</tspan><tspan x="0" y="-3.95">for the service to commit or</tspan><tspan x="0" y="13.05">withdraw.</tspan><tspan x="0" y="30.05">INV DownCancelsWait: no Ready</tspan><tspan x="0" y="47.05">INV DownHooksOnce: hooks once</tspan><tspan x="0" y="64.05">INV NoHalfPublicationAfterStop</tspan><tspan x="0" y="81.05">INV StoppedOwnerNotWaiting</tspan></text></g></g></g></svg>