<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1322 237" width="1322" height="237" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="661" y="40.75">Removed run · retention chain</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M38,45.5L159.97,45.5"/><path class="pele-marker" d="M166.97,45.5L158.97,48.86L158.97,42.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M238.15,45.5L404.74,45.5"/><path class="pele-marker" d="M411.74,45.5L403.74,48.86L403.74,42.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M500.43,45.5L734.33,45.5"/><path class="pele-marker" d="M741.33,45.5L733.33,48.86L733.33,42.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M820.02,45.5L1109.3,45.5"/><path class="pele-marker" d="M1116.3,45.5L1108.3,48.86L1108.3,42.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M1181.66,45.5L1272.4,45.5"/><path class="pele-marker" d="M1279.4,45.5L1271.4,48.86L1271.4,42.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="archived-archived----note-5"><path d="M456.08,67L456.08,111"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="pruned-pruned----note-6"><path d="M780.67,67L780.67,111"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="gone-gone----note-7"><path d="M1148.98,67L1148.98,111"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="58.5" y="35.5" width="80.97" height="20" rx="3" fill="var(--_bg)"/><text x="98.98" y="50.05" text-anchor="middle">run removed</text></g><g class="pele-edge-label" data-id="edge1"><rect x="258.65" y="35.5" width="101.94" height="20" rx="3" fill="var(--_bg)"/><text x="309.62" y="50.05" text-anchor="middle">64 active, oldest</text></g><g class="pele-edge-label" data-id="edge2"><rect x="544.58" y="35.5" width="124.34" height="20" rx="3" fill="var(--_bg)"/><text x="606.75" y="50.05" text-anchor="middle">256 archived, oldest</text></g><g class="pele-edge-label" data-id="edge3"><rect x="885.43" y="35.5" width="149.64" height="20" rx="3" fill="var(--_bg)"/><text x="960.24" y="50.05" text-anchor="middle">4096 tombstones, oldest</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(31,45.5)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="active" transform="translate(202.56,45.5)"><rect x="-35.59" y="-21.5" width="71.18" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">active</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(1288.4,45.5)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="archived" transform="translate(456.08,45.5)"><rect x="-44.34" y="-21.5" width="88.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">archived</text></g><g class="pele-node pele-state" data-id="pruned" transform="translate(780.67,45.5)"><rect x="-39.35" y="-21.5" width="78.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">pruned</text></g><g class="pele-node pele-state ok" data-id="gone" transform="translate(1148.98,45.5)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">gone</text></g><g class="pele-note" data-id="archived----note-5" transform="translate(456.08,136)"><path d="M-68,-25H60L68,-17V25H-68Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M60,-25V-17H68" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Proof: every owned</tspan><tspan x="0" y="13.05">resource absent.</tspan></text></g><g class="pele-note" data-id="pruned----note-6" transform="translate(780.67,136)"><path d="M-84.25,-25H76.25L84.25,-17V25H-84.25Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M76.25,-25V-17H84.25" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Exported first; tombstone</tspan><tspan x="0" y="13.05">kept; export 7 days.</tspan></text></g><g class="pele-note" data-id="gone----note-7" transform="translate(1148.98,144.5)"><path d="M-86.42,-33.5H78.42L86.42,-25.5V33.5H-86.42Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M78.42,-33.5V-25.5H86.42" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Fresh ids are 128 random</tspan><tspan x="0" y="4.55">bits; restore needs a</tspan><tspan x="0" y="21.55">receipt, long gone.</tspan></text></g></g></g></svg>