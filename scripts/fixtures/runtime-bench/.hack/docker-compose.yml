# Benchmark fixture: a web dev server and an API on shared source, Postgres and Redis.
# Driven by scripts/benchmark-runtime-footprint.ts on both backends; not an example project.
name: hack-runtime-bench
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_DB: bench
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bench -d bench"]
      start_period: 30s
      start_interval: 250ms
      interval: 10s
      timeout: 3s
      retries: 3
  cache:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
      start_interval: 250ms
      interval: 10s
      timeout: 3s
      retries: 3
  api:
    image: oven/bun:1.4.4-alpine
    working_dir: /app
    init: true
    stop_grace_period: 2s
    command: ["bun", "--watch", "server.ts"]
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://bench@db:5432/bench
      REDIS_URL: redis://cache:6379
    volumes:
      - ../api:/app
      - scratch:/scratch
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # No command health check on the routed services: native would replace it with
    # its own route probe, so it would run (and cost CPU) on Compose only. Readiness
    # is the benchmark's own route check on both backends.
    labels:
      caddy: api.hack-runtime-bench.hack
      caddy.reverse_proxy: "{{upstreams 3001}}"
      caddy.tls: internal
    networks:
      - hack-dev
      - default
  web:
    image: oven/bun:1.4.4-alpine
    working_dir: /app
    init: true
    stop_grace_period: 2s
    command: ["bun", "--watch", "dev.ts"]
    environment:
      PORT: "3000"
      API_URL: http://api:3001
    volumes:
      - ../web:/app
      # A named volume for the install-on-volume task: the same install off the shared source.
      - deps:/deps
    # service_started: native probes a routed dependency's route itself, so it
    # refuses service_healthy on one.
    depends_on:
      api:
        condition: service_started
    labels:
      caddy: hack-runtime-bench.hack
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls: internal
    networks:
      - hack-dev
      - default
volumes:
  pgdata:
  scratch:
  deps:
networks:
  hack-dev:
    external: true
