label" x="0" y="5.25" text-anchor="middle">interrupted</text></g><g class="pele-note" data-id="planned----note-12" transform="translate(404.91,308.5)"><path d="M-96.9,-33.5H88.9L96.9,-25.5V33.5H-96.9Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M88.9,-33.5V-25.5H96.9" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Coverage and gaps persisted</tspan><tspan x="0" y="4.55">before target writes</tspan><tspan x="0" y="21.55">Key permission paths frozen</tspan></text></g><g class="pele-note" data-id="interrupted----note-13" transform="translate(1066.31,612.5)"><path d="M-128.32,-42H120.32L128.32,-34V42H-128.32Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M120.32,-42V-34H128.32" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">Unexpected edits refuse resume</tspan><tspan x="0" y="-3.95">No implicit run selection</tspan><tspan x="0" y="13.05">Original key bytes required</tspan><tspan x="0" y="30.05">Interrupted chmod admits masked mode</tspan></text></g></g></svg>