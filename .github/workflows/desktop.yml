# Hack desktop app (HACK-2214): unsupported preview.
# Separate from the default gates and the release workflow, and not a
# required check. Linux and macOS builds plus isolated workspace tests.
# The toolchain comes from apps/desktop/rust-toolchain.toml (1.98.1; macOS
# needs it), not from the repo root pin.
name: Desktop app

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "scripts/lib/fetch-verified.sh"
      - ".github/workflows/desktop.yml"
      - "scripts/install-cargo-nextest.sh"
      - ".config/nextest.toml"
  push:
    branches: [next]
    paths:
      - "apps/desktop/**"
      - "scripts/lib/fetch-verified.sh"
      - ".github/workflows/desktop.yml"
      - "scripts/install-cargo-nextest.sh"
      - ".config/nextest.toml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Desktop app (Linux build, core tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Install pinned per-test process runner
        run: |
          bash ../../scripts/install-cargo-nextest.sh "$RUNNER_TEMP/desktop-nextest"
          echo "$RUNNER_TEMP/desktop-nextest" >> "$GITHUB_PATH"
      - name: Core tests (no daemon, no Docker)
        env:
          HACK_DAEMON_AUTOSTART_DISABLE: "1"
        run: bash scripts/test.sh
      # Both: the screenshots feature turns on gpui test-support, which can
      # hide test-only APIs from a build that only uses that feature.
      - name: Clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (screenshots feature)
        run: cargo clippy --locked --all-targets --features hack-desktop/screenshots,hack-desktop-ui/screenshots -- -D warnings
      - name: Build app
        run: cargo build --locked -p hack-desktop

  macos:
    name: Desktop app (macOS build, core tests)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      # The terminal panel is part of the macOS app (no feature flag), so
      # every build below needs the pinned libghostty-vt inputs: the prebuilt,
      # checksummed XCFramework (no Zig on macOS) and the symbols font.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghostty-inputs
          key: desktop-ghostty-inputs-${{ runner.os }}-${{ hashFiles('apps/desktop/term/scripts/provision-ghostty.sh') }}
      - name: Test the provisioning download fallback (offline, fake curl)
        run: bash term/scripts/test-provision-ghostty.sh
      - name: Provision pinned libghostty-vt inputs (checksummed)
        run: bash term/scripts/provision-ghostty.sh --dir "$RUNNER_TEMP/ghostty-inputs" --emit github >> "$GITHUB_ENV"
      - name: Install pinned per-test process runner
        run: |
          bash ../../scripts/install-cargo-nextest.sh "$RUNNER_TEMP/desktop-nextest"
          echo "$RUNNER_TEMP/desktop-nextest" >> "$GITHUB_PATH"
      - name: Core tests (no daemon, no Docker)
        env:
          HACK_DAEMON_AUTOSTART_DISABLE: "1"
        run: bash scripts/test.sh
      - name: Clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      # The owner's build: no feature flag. Fails if the default macOS app
      # stops depending on the terminal crate.
      - name: Build app (terminal panel included by default)
        run: |
          cargo build --locked -p hack-desktop
          cargo tree --locked -p hack-desktop -e normal --depth 1 --prefix none | grep -q '^hack-desktop-term ' \
            || { echo "the default macOS build no longer includes the terminal panel" >&2; exit 1; }
      # Every hack-desktop-term test, including the render target whose `main`
      # creates GPUI's macOS platform on the main thread (real fonts, Metal
      # offscreen rendering).
      - name: Terminal surface tests (ghostty, real platform)
        env:
          HACK_DAEMON_AUTOSTART_DISABLE: "1"
          HACK_TERM_REQUIRE_RENDERER: "1"
        run: |
          cargo nextest run --locked -p hack-desktop-term --features screenshots \
            --build-jobs 2 --config-file ../../.config/nextest.toml --profile ci --no-fail-fast

  # The terminal surface's libghostty-vt feature (HACK-2252). The provision
  # step is the only one that fetches libghostty-vt, Zig or the symbols font, and it verifies
  # each file against a sha256 committed in the script. The build, lint and
  # tests then run in a network namespace with no interfaces but a down
  # loopback, so they cannot download anything.
  term-ghostty:
    name: Desktop terminal surface (Linux, libghostty-vt, offline build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev pkg-config xz-utils \
            mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-term-ghostty-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-term-ghostty-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghostty-inputs
          key: desktop-ghostty-inputs-${{ runner.os }}-${{ hashFiles('apps/desktop/term/scripts/provision-ghostty.sh') }}
      - name: Test the provisioning download fallback (offline, fake curl)
        run: bash term/scripts/test-provision-ghostty.sh
      - name: Provision pinned Zig and libghostty-vt inputs (checksummed)
        run: bash term/scripts/provision-ghostty.sh --dir "$RUNNER_TEMP/ghostty-inputs" --emit github >> "$GITHUB_ENV"
      - name: Install pinned per-test process runner
        run: |
          bash ../../scripts/install-cargo-nextest.sh "$RUNNER_TEMP/desktop-nextest"
          echo "$RUNNER_TEMP/desktop-nextest" >> "$GITHUB_PATH"
      - name: Fetch locked crates
        run: cargo fetch --locked
      # The render test draws glyphs offscreen and inspects the pixels. Mesa's
      # software Vulkan driver (installed above) is its renderer here.
      - name: Build, lint and test the ghostty feature with networking disabled
        env:
          HACK_TERM_REQUIRE_RENDERER: "1"
        run: bash term/scripts/no-network.sh bash term/scripts/check-ghostty.sh
