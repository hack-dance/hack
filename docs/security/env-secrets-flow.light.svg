<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 549 720" width="549" height="720" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="274.5" y="40.75">Env values and plaintext boundaries</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_layers_cli_0"><path d="M127.2,106C127.2,123.5 257.03,123.5 257.03,141L257.03,147"/><path class="pele-marker" d="M257.03,154L253.67,146L260.39,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyFile_cli_0"><path d="M287.37,106L287.37,147"/><path class="pele-marker" d="M287.37,154L284.01,146L290.73,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyEnv_cli_0"><path d="M446.14,106C446.14,123.5 314.91,123.5 314.91,141L314.91,147"/><path class="pele-marker" d="M314.91,154L311.55,146L318.27,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyEnv_child_0"><path d="M464.32,106L464.32,296C464.32,313.5 346.6,313.5 346.6,331L346.6,337" stroke-dasharray="3 4"/><path class="pele-marker" d="M346.6,344L343.24,336L349.96,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cli_child_0"><path d="M244.59,201L244.59,296C244.59,313.5 314.6,313.5 314.6,331L314.6,337"/><path class="pele-marker" d="M314.6,344L311.24,336L317.96,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cli_mux_0"><path d="M330.6,201L330.6,242"/><path class="pele-marker" d="M330.6,249L327.24,241L333.96,241Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_mux_child_0"><path d="M330.6,296L330.6,337"/><path class="pele-marker" d="M330.6,344L327.24,336L333.96,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_child_output_0"><path d="M322.6,391C322.6,415 167.77,415 167.77,439L167.77,581C167.77,608.5 236.95,608.5 236.95,636L236.95,642"/><path class="pele-marker" d="M236.95,649L233.59,641L240.31,641Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_layers_output_0"><path d="M93.6,106L93.6,581C93.6,605.8 117.8,621 157.28,621C196.76,621 220.95,626.99 220.95,636.75L220.95,642" stroke-dasharray="3 4"/><path class="pele-marker" d="M220.95,649L217.59,641L224.31,641Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_child_disk_0"><path d="M338.6,391C338.6,408.5 385.55,408.5 385.55,426L385.55,432"/><path class="pele-marker" d="M385.55,439L382.19,431L388.91,431Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_disk_scan_0"><path d="M374.52,486C374.52,503.5 252.95,503.5 252.95,521L252.95,527"/><path class="pele-marker" d="M252.95,534L249.59,526L256.31,526Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scan_output_0"><path d="M252.95,581L252.95,642"/><path class="pele-marker" d="M252.95,649L249.59,641L256.31,641Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_disk_output_0"><path d="M401.94,486L401.94,581C401.94,608.5 274.38,608.5 274.38,636L274.38,642"/><path class="pele-marker" d="M274.38,649L271.02,641L277.74,641Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_keyEnv_child_0"><rect x="405.77" y="167.5" width="117.11" height="20" rx="3" fill="var(--_bg)"/><text x="464.32" y="182.05" text-anchor="middle">Open inherited key</text></g><g class="pele-edge-label" data-id="L_layers_output_0"><rect x="32.52" y="357.5" width="122.17" height="20" rx="3" fill="var(--_bg)"/><text x="93.6" y="372.05" text-anchor="middle">Open parse excerpt</text></g><g class="pele-edge-label" data-id="L_disk_output_0"><rect x="340.13" y="547.5" width="123.61" height="20" rx="3" fill="var(--_bg)"/><text x="401.94" y="562.05" text-anchor="middle">Native: no redaction</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="layers" transform="translate(101.6,82.5)"><rect x="-77.6" y="-23.5" width="155.2" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><tex