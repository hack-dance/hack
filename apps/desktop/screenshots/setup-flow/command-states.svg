<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 585 995" width="585" height="995" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="292.5" y="40.75">Desktop setup · Run and recheck</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M278.79,38L278.79,75"/><path class="pele-marker" d="M278.79,82L275.43,74L282.15,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M278.79,125L278.79,186"/><path class="pele-marker" d="M278.79,193L275.43,185L282.15,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M254.79,236L254.79,249C254.79,276.5 186.85,276.5 186.85,304L186.85,343"/><path class="pele-marker" d="M186.85,350L183.49,342L190.21,342Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M217.2,350L217.2,340.38C217.2,335.23 336.28,333.14 336.28,328L336.28,304C336.28,286.64 323.84,276 303.54,276C283.24,276 270.79,265.74 270.79,249L270.79,243"/><path class="pele-marker" d="M270.79,236L274.15,244L267.43,244Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M194.85,393L194.85,454"/><path class="pele-marker" d="M194.85,461L191.49,453L198.21,453Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M286.79,236L286.79,248.25C286.79,258.02 308.19,264 343.11,264C378.02,264 399.42,281.48 399.42,310L399.42,429.5C399.42,436.76 210.85,440.74 210.85,448L210.85,454"/><path class="pele-marker" d="M210.85,461L207.49,453L214.21,453Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M209,504L209,565"/><path class="pele-marker" d="M209,572L205.64,564L212.36,564Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M209,615L209,652"/><path class="pele-marker" d="M209,659L205.64,651L212.36,651Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M209,689C209,706.36 189.68,717 158.16,717C126.63,717 107.31,732.2 107.31,757L107.31,799.5"/><path class="pele-marker" d="M107.31,806.5L103.95,798.5L110.67,798.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M209,689C209,713.8 223.09,729 246.06,729C269.04,729 283.13,739.64 283.13,757L283.13,799.5"/><path class="pele-marker" d="M283.13,806.5L279.77,798.5L286.49,798.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M209,689C209,706.36 254.66,717 329.15,717C403.64,717 449.29,732.2 449.29,757L449.29,781C449.29,787.94 465.37,787.94 465.37,794.88L465.37,799.5"/><path class="pele-marker" d="M465.37,806.5L462.01,798.5L468.73,798.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M299.13,806.5L299.13,793.5C299.13,787.5 527.23,781 527.23,775L527.23,310C527.23,279.5 302.79,279.5 302.79,249L302.79,243"/><path class="pele-marker" d="M302.79,236L306.15,244L299.43,244Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M465.37,849.5L465.37,892C465.37,896.17 280.58,901.71 280.58,905.88L280.58,910.5"/><path class="pele-marker" d="M280.58,917.5L277.22,909.5L283.94,909.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge13"><path d="M107.31,849.5L107.31,892C107.31,896.44 280.58,901.43 280.58,905.88L280.58,910.5"/><path class="pele-marker" d="M280.58,917.5L277.22,909.5L283.94,909.5Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="262.87" y="145.5" width="31.84" height="20" rx="3" fill="var(--_bg)"/><text x="278.79" y="160.05" text-anchor="middle">Run</text></g><g class="pele-edge-label" data-id="edge2"><rect x="112.41" y="306" width="148.89" height="20" rx="3" fill="var(--_bg)"/><text x="186.85" y="320.55" text-anchor="middle">sudo requests password</text></g><g class="pele-edge-label" data-id="edge3"><rect x="283.15" y="306" width="106.27" height="20" rx="3" fill="var(--_bg)"/><text x="336.28" y="320.55" text-anchor="middle">Prompt accepted</text></g><g class="pele-edge-label" data-id="edge4"><rect x="129.8" y="413.5" width="130.11" height="20" rx="3" fill="var(--_bg)"/><text x="194.85" y="428.05" text-anchor="middle">Refused or cancelled</text></g><g class="pele-edge-label" data-id="edge5"><rect x="350.27" y="361.5" width="98.3" height="20" rx="3" fill="var(--_bg)"/><text x="399.42" y="376.05" text-anchor="middle">Command exits</text></g><g class="pele-edge-label" data-id="edge6"><rect x="145.39" y="524.5" width="127.22" height="20" rx="3" fill="var(--_bg)"/><text x="209" y="539.05" text-anchor="middle">Read fresh evidence</text></g><g class="pele-edge-label" data-id="edge8"><rect x="33.22" y="759" width="148.18" height="20" rx="3" fill="var(--_bg)"/><text x="107.31" y="773.55" text-anchor="middle">Exit 0 and check passes</text></g><g class="pele-edge-label" data-id="edge9"><rect x="205.44" y="759" width="155.38" height="20" rx="3" fill="var(--_bg)"/><text x="283.13" y="773.55" text-anchor="middle">Command or check failed</text></g><g class="pele-edge-label" data-id="edge10"><rect x="381.35" y="759" width="135.88" height="20" rx="3" fill="var(--_bg)"/><text x="449.29" y="773.55" text-anchor="middle">Admin access refused</text></g><g class="pele-edge-label" data-id="edge11"><rect x="496.14" y="583.5" width="62.18" height="20" rx="3" fill="var(--_bg)"/><text x="527.23" y="598.05" text-anchor="middle">Try again</text></g><g class="pele-edge-label" data-id="edge12"><rect x="410.07" y="870" width="110.61" height="20" rx="3" fill="var(--_bg)"/><text x="465.37" y="884.55" text-anchor="middle">Hand off to admin</text></g><g class="pele-edge-label" data-id="edge13"><rect x="26" y="870" width="162.62" height="20" rx="3" fill="var(--_bg)"/><text x="107.31" y="884.55" text-anchor="middle">Close drawer and advance</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-choice" data-id="Result" transform="translate(209,674)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state" data-id="Action" transform="translate(278.79,103.5)"><rect x="-59.77" y="-21.5" width="119.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Needs action</text></g><g class="pele-node pele-state wait" data-id="Password" transform="translate(194.85,371.5)"><rect x="-74.35" y="-21.5" width="148.7" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Password prompt</text></g><g class="pele-node pele-state" data-id="NoPermission" transform="translate(465.37,828)"><rect x="-63.92" y="-21.5" width="127.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">No permission</text></g><g class="pele-node pele-state" data-id="Done" transform="translate(107.31,828)"><rect x="-65.78" y="-21.5" width="131.57" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Done · closing</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(278.79,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state live" data-id="Running" transform="translate(278.79,214.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Running</text></g><g class="pele-node pele-state" data-id="Exited" transform="translate(209,482.5)"><rect x="-36.84" y="-21.5" width="73.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exited</text></g><g class="pele-node pele-state" data-id="Recheck" transform="translate(209,593.5)"><rect x="-45.17" y="-21.5" width="90.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Recheck</text></g><g class="pele-node pele-state fail" data-id="Failed" transform="translate(298.59,828)"><rect x="-36.42" y="-21.5" width="72.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Failed</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(280.58,926.5)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g></g></g></svg>