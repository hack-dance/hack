name: pattern-p07
# One shared topology for laptops and headless runners (HACK-P07). The env
# overlays change only auth and helper capabilities, never these services.
services:
  upstream:
    image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
    working_dir: /app
    command: ["bun", "src/upstream.ts"]
    volumes:
      - ..:/app:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:4000/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
    working_dir: /app
    command: ["bun", "src/api.ts"]
    depends_on:
      upstream:
        condition: service_healthy
    volumes:
      - ..:/app:ro
    # Readiness includes the dependency: the API is healthy only when it can
    # reach the upstream through the shared topology.
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 30
