"><rect x="496.74" y="921.18" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="507.97" y="935.72" text-anchor="middle">no</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="S" transform="translate(284.5,47.5)"><rect x="-78.85" y="-23.5" width="157.71" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Registered project</text></g><g class="pele-node pele-shape-diam" data-id="G" transform="translate(284.5,190.56)"><polygon points="0,-71.56 114.5,0 0,71.56 -114.5,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Runtime contact allowed</text></g><g class="pele-node pele-shape-rect" data-id="U" transform="translate(104.94,391.88)"><rect x="-80.94" y="-23.5" width="161.88" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Unknown live state</text></g><g class="pele-node pele-shape-diam" data-id="B" transform="translate(391.18,391.88)"><polygon points="0,-57.76 92.42,0 0,57.76 -92.42,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Selected backend</text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(270.43,553.64)"><rect x="-97.62" y="-32" width="195.24" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Current ps and selected</tspan><tspan x="0" y="15.25">inspect fields</tspan></text></g><g class="pele-node pele-shape-rect" data-id="N" transform="translate(511.93,553.64)"><rect x="-103.88" y="-32" width="207.77" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Owned run and current</tspan><tspan x="0" y="15.25">authenticated