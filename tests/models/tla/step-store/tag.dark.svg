<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 750 570" width="750" height="570" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="dark"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="375" y="40.75">StepStore · one tag record (tag)</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M282.98,38L282.98,128"/><path class="pele-marker" d="M282.98,135L279.62,127L286.34,127Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M282.98,178L282.98,297"/><path class="pele-marker" d="M282.98,304L279.62,296L286.34,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M315.65,317.5C341.65,309.5 341.65,341.5 322.34,335.56"/><path class="pele-marker" d="M315.65,333.5L324.29,332.64L322.31,339.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M315.65,311.5C349.65,297.5 349.65,353.5 322.12,342.17"/><path class="pele-marker" d="M315.65,339.5L324.33,339.44L321.77,345.65Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M315.65,308C357.65,290.5 357.65,360.5 322.11,345.69"/><path class="pele-marker" d="M315.65,343L324.33,342.98L321.74,349.18Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M282.98,347L282.98,376C282.98,387 229.24,387 229.24,398L229.24,422C229.24,433 282.98,433 282.98,444L282.98,449"/><path class="pele-marker" d="M282.98,456L279.62,448L286.34,448Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M282.98,456L282.98,444C282.98,433 336.71,433 336.71,422L336.71,398C336.71,387 282.98,387 282.98,376L282.98,354"/><path class="pele-marker" d="M282.98,347L286.34,355L279.62,355Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M323.57,469.5C349.57,461.5 349.57,493.5 330.26,487.56"/><path class="pele-marker" d="M323.57,485.5L332.21,484.64L330.23,491.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="absent----note-8-absent"><path d="M200.46,156.5L244.46,156.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="fresh-fresh----note-9"><path d="M315.65,325.5L533.58,325.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="expired-expired----note-10"><path d="M323.57,477.5L531.29,477.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="270.31" y="58.5" width="25.34" height="20" rx="3" fill="var(--_bg)"/><text x="282.98" y="73.05" text-anchor="middle">Init</text></g><g class="pele-edge-label" data-id="edge1"><rect x="255.5" y="227.5" width="54.96" height="20" rx="3" fill="var(--_bg)"/><text x="282.98" y="242.05" text-anchor="middle">Resolve</text></g><g class="pele-edge-label" data-id="edge2"><rect x="363.65" y="295.5" width="53.51" height="20" rx="3" fill="var(--_bg)"/><text x="390.41" y="310.05" text-anchor="middle">UseTag</text></g><g class="pele-edge-label" data-id="edge3"><rect x="363.65" y="315.5" width="127.93" height="20" rx="3" fill="var(--_bg)"/><text x="427.61" y="330.05" text-anchor="middle">Tick [age within TTL]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="363.65" y="335.5" width="117.1" height="20" rx="3" fill="var(--_bg)"/><text x="422.2" y="350.05" text-anchor="middle">Resolve [hack pull]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="169.25" y="400" width="119.98" height="20" rx="3" fill="var(--_bg)"/><text x="229.24" y="414.55" text-anchor="middle">Tick [age over TTL]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="309.24" y="400" width="54.96" height="20" rx="3" fill="var(--_bg)"/><text x="336.71" y="414.55" text-anchor="middle">Resolve</text></g><g class="pele-edge-label" data-id="edge7"><rect x="355.57" y="467.5" width="133.72" height="20" rx="3" fill="var(--_bg)"/><text x="422.43" y="482.05" text-anchor="middle">UseTag [offline, stale]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(282.98,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state idle" data-id="absent" transform="translate(282.98,156.5)"><rect x="-38.51" y="-21.5" width="77.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">absent</text></g><g class="pele-node pele-state ok" data-id="fresh" transform="translate(282.98,325.5)"><rect x="-32.67" y="-21.5" width="65.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">fresh</text></g><g class="pele-node pele-state wait" data-id="expired" transform="translate(282.98,477.5)"><rect x="-40.59" y="-21.5" width="81.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">expired</text></g><g class="pele-note" data-id="absent----note-8" transform="translate(112.23,156.5)"><path d="M-88.23,-50.5H80.23L88.23,-42.5V50.5H-88.23Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M80.23,-50.5V-42.5H88.23" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">tag = [d, age] has many</tspan><tspan x="0" y="-12.45">values; states group them:</tspan><tspan x="0" y="4.55">absent d = 0, fresh</tspan><tspan x="0" y="21.55">age within TTL, expired</tspan><tspan x="0" y="38.55">age over TTL</tspan></text></g><g class="pele-note" data-id="fresh----note-9" transform="translate(629.38,325.5)"><path d="M-95.8,-50.5H87.8L95.8,-42.5V50.5H-95.8Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.8,-50.5V-42.5H95.8" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">A command resolves at most</tspan><tspan x="0" y="-12.45">once; every use repeats</tspan><tspan x="0" y="4.55">that digest.</tspan><tspan x="0" y="21.55">INV OneDigestPerCommand</tspan><tspan x="0" y="38.55">INV PullResolves</tspan></text></g><g class="pele-note" data-id="expired----note-10" transform="translate(624.22,477.5)"><path d="M-92.93,-33.5H84.93L92.93,-25.5V33.5H-92.93Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M84.93,-33.5V-25.5H92.93" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV NoSilentStaleTag: used</tspan><tspan x="0" y="4.55">only after a failed resolve</tspan><tspan x="0" y="21.55">in the same command</tspan></text></g></g></g></svg>