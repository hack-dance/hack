name: Docker E2E trial

# Advisory experiment only. Operators choose a ref with a matching four-shard CI run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-e2e-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-e2e-trial:
    # Neither its workflow nor its check names can supply required CI evidence.
    name: docker-e2e trial shard ${{ matrix.shard }}/6
    if: ${{ github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Docker E2E shard
        uses: ./.github/actions/docker-e2e-shard
        with:
          shard: ${{ matrix.shard }}
          count: "6"
          extra-shard: "6"
