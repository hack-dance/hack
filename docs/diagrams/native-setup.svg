x="0" y="-4.75">Verify, sync, publish under</tspan><tspan x="0" y="15.25">lock</tspan></text></g><g class="pele-node pele-shape-rect ok" data-id="Probe" transform="translate(198.6,1361.03)"><rect x="-105.95" y="-23.5" width="211.91" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Development profile probe</text></g><g class="pele-node pele-shape-rect" data-id="Add" transform="translate(229.36,1257.53)"><rect x="-106.79" y="-23.5" width="213.59" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Add the image builder only</text></g><g class="pele-node pele-shape-rect" data-id="Report" transform="translate(441.25,1257.53)"><rect x="-65.1" y="-32" width="130.2" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Report builder</tspan><tspan x="0" y="15.25">not_prepared</tspan></text></g></g></svg>