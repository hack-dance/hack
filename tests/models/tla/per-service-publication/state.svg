<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 716 674" width="716" height="674" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="358" y="40.75">Per-service child admission</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M393.93,38L393.93,75"/><path class="pele-marker" d="M393.93,82L390.57,74L397.29,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M367.42,125L367.42,137.25C367.42,147.01 315.11,153 229.77,153C144.44,153 92.13,168.2 92.13,193L92.13,217C92.13,222.63 125.9,222.63 125.9,228.25L125.9,232"/><path class="pele-marker" d="M125.9,239L122.54,231L129.26,231Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M133.9,282C133.9,291.25 190.69,291.25 190.69,300.5L190.69,343"/><path class="pele-marker" d="M190.69,350L187.33,342L194.05,342Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M190.69,393L190.69,435.5C190.69,440.37 348.94,444.51 348.94,449.38L348.94,454"/><path class="pele-marker" d="M348.94,461L345.58,453L352.3,453Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M356.94,504L356.94,546.5C356.94,553.44 411.74,553.44 411.74,560.38L411.74,565"/><path class="pele-marker" d="M411.74,572L408.38,564L415.1,564Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M456.59,585.5C482.59,577.5 482.59,609.5 463.28,603.56"/><path class="pele-marker" d="M456.59,601.5L465.22,600.64L463.25,607.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M141.9,239L141.9,229.38C141.9,223.19 233.93,223.19 233.93,217L233.93,193C233.93,175.64 261.81,165 307.3,165C352.79,165 380.67,154.74 380.67,138L380.67,132"/><path class="pele-marker" d="M380.67,125L384.03,133L377.31,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M190.69,350L190.69,337C190.69,330.26 393.93,325.24 393.93,318.5L393.93,132"/><path class="pele-marker" d="M393.93,125L397.29,133L390.57,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M364.94,461L364.94,448C364.94,420.5 523.2,420.5 523.2,393L523.2,239C523.2,188.5 407.19,188.5 407.19,138L407.19,132"/><path class="pele-marker" d="M407.19,125L410.55,133L403.83,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M427.74,572L427.74,559C427.74,531.5 640.79,531.5 640.79,504L640.79,239C640.79,188.5 420.44,188.5 420.44,138L420.44,132"/><path class="pele-marker" d="M420.44,125L423.8,133L417.08,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="committed-committed----note-10"><path d="M241.28,371.5L285.28,371.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="26" y="195" width="132.27" height="20" rx="3" fill="var(--_bg)"/><text x="92.13" y="209.55" text-anchor="middle">Admit [ready, current]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="138.65" y="302.5" width="104.07" height="20" rx="3" fill="var(--_bg)"/><text x="190.69" y="317.05" text-anchor="middle">Commit [current]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="133.58" y="413.5" width="114.21" height="20" rx="3" fill="var(--_bg)"/><text x="190.69" y="428.05" text-anchor="middle">Authorize [current]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="304.16" y="524.5" width="105.55" height="20" rx="3" fill="var(--_bg)"/><text x="356.94" y="539.05" text-anchor="middle">Bind [authorized]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="488.59" y="583.5" width="114.21" height="20" rx="3" fill="var(--_bg)"/><text x="545.69" y="598.05" text-anchor="middle">Record [observed]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="178.27" y="195" width="111.32" height="20" rx="3" fill="var(--_bg)"/><text x="233.93" y="209.55" text-anchor="middle">EOFExit [aborted]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="345.13" y="250.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="393.93" y="265.05" text-anchor="middle">Retire [aborted]</text></g><g class="pele-edge-label" data-id="edge8"><rect x="474.4" y="361.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="523.2" y="376.05" text-anchor="middle">Retire [aborted]</text></g><g class="pele-edge-label" data-id="edge9"><rect x="591.99" y="361.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="640.79" y="376.05" text-anchor="middle">Retire [aborted]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(393.93,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state idle" data-id="absent" transform="translate(393.93,103.5)"><rect x="-38.51" y="-21.5" width="77.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">absent</text></g><g class="pele-node pele-state wait" data-id="gated" transform="translate(133.9,260.5)"><rect x="-34.76" y="-21.5" width="69.53" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">gated</text></g><g class="pele-node pele-state live" data-id="authorized" transform="translate(356.94,482.5)"><rect x="-51.02" y="-21.5" width="102.04" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">authorized</text></g><g class="pele-node pele-state ok" data-id="bound" transform="translate(419.74,593.5)"><rect x="-36.85" y="-21.5" width="73.7" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">bound</text></g><g class="pele-node pele-state wait" data-id="committed" transform="translate(190.69,371.5)"><rect x="-50.59" y="-21.5" width="101.18" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">committed</text></g><g class="pele-note" data-id="committed----note-10" transform="translate(364.84,371.5)"><path d="M-79.56,-18H71.56L79.56,-10V18H-79.56Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M71.56,-18V-10H79.56" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" x="0" y="4.55" text-anchor="middle">INV identity before bind</text></g></g></g></svg>