<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 783 627" width="783" height="627" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="391.5" y="40.75">Detached start · pool watch</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M285.56,38L285.56,75"/><path class="pele-marker" d="M285.56,82L282.2,74L288.92,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M285.56,125L285.56,198"/><path class="pele-marker" d="M285.56,205L282.2,197L288.92,197Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M340.75,95.5C366.75,87.5 366.75,119.5 347.44,113.56"/><path class="pele-marker" d="M340.75,111.5L349.39,110.64L347.41,117.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M331.16,218.5C357.16,210.5 357.16,242.5 337.85,236.56"/><path class="pele-marker" d="M331.16,234.5L339.79,233.64L337.82,240.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M285.56,248L285.56,302.5C285.56,309.44 233.85,309.44 233.85,316.38L233.85,321"/><path class="pele-marker" d="M233.85,328L230.49,320L237.21,320Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M225.85,371C225.85,380.25 201.69,380.25 201.69,389.5L201.69,413.5C201.69,425.75 273.56,425.75 273.56,438L273.56,444"/><path class="pele-marker" d="M273.56,451L270.2,443L276.92,443Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M241.85,371C241.85,380.25 295.46,380.25 295.46,389.5L295.46,413.5C295.46,426.25 390.25,426.25 390.25,439L390.25,444"/><path class="pele-marker" d="M390.25,451L386.89,443L393.61,443Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M285.56,248L285.56,260C285.56,272.25 337.28,272.25 337.28,284.5L337.28,407.5C337.28,422.75 289.56,422.75 289.56,438L289.56,444"/><path class="pele-marker" d="M289.56,451L286.2,443L292.92,443Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M281.56,494L281.56,543"/><path class="pele-marker" d="M281.56,550L278.2,542L284.92,542Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M390.25,494L390.25,506C390.25,521.5 281.56,521.5 281.56,537L281.56,543"/><path class="pele-marker" d="M281.56,550L278.2,542L284.92,542Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="watching-watching----note-10"><path d="M331.16,226.5L579.35,226.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="exited-exited----note-11"><path d="M426.26,472.5L470.26,472.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="239.66" y="145.5" width="91.81" height="20" rx="3" fill="var(--_bg)"/><text x="285.56" y="160.05" text-anchor="middle">record running</text></g><g class="pele-edge-label" data-id="edge2"><rect x="372.75" y="93.5" width="176.38" height="20" rx="3" fill="var(--_bg)"/><text x="460.94" y="108.05" text-anchor="middle">starting, stopped, unreadable</text></g><g class="pele-edge-label" data-id="edge3"><rect x="363.16" y="216.5" width="174.19" height="20" rx="3" fill="var(--_bg)"/><text x="450.25" y="231.05" text-anchor="middle">same boot, slow, unreadable</text></g><g class="pele-edge-label" data-id="edge4"><rect x="249.04" y="280.5" width="73.05" height="20" rx="3" fill="var(--_bg)"/><text x="285.56" y="295.05" text-anchor="middle">boot ended</text></g><g class="pele-edge-label" data-id="edge5"><rect x="163.02" y="391.5" width="77.36" height="20" rx="3" fill="var(--_bg)"/><text x="201.69" y="406.05" text-anchor="middle">start returns</text></g><g class="pele-edge-label" data-id="edge6"><rect x="263.64" y="391.5" width="63.64" height="20" rx="3" fill="var(--_bg)"/><text x="295.46" y="406.05" text-anchor="middle">10 s pass</text></g><g class="pele-edge-label" data-id="edge7"><rect x="298.6" y="339.5" width="77.36" height="20" rx="3" fill="var(--_bg)"/><text x="337.28" y="354.05" text-anchor="middle">start returns</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(285.56,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="unobserved" transform="translate(285.56,103.5)"><rect x="-55.19" y="-21.5" width="110.38" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">unobserved</text></g><g class="pele-node pele-state wait" data-id="grace" transform="translate(233.85,349.5)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">grace</text></g><g class="pele-node pele-state" data-id="done" transform="translate(281.56,472.5)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">done</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(281.56,559)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state ok" data-id="watching" transform="translate(285.56,226.5)"><rect x="-45.59" y="-21.5" width="91.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">watching</text></g><g class="pele-node pele-state fail" data-id="exited" transform="translate(390.25,472.5)"><rect x="-36.01" y="-21.5" width="72.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">exited</text></g><g class="pele-note" data-id="watching----note-10" transform="translate(669.04,226.5)"><path d="M-89.69,-33.5H81.69L89.69,-25.5V33.5H-89.69Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M81.69,-33.5V-25.5H89.69" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Pool identity: owner token</tspan><tspan x="0" y="4.55">and guest boot id, checked</tspan><tspan x="0" y="21.55">every 5 s.</tspan></text></g><g class="pele-note" data-id="exited----note-11" transform="translate(558.85,472.5)"><path d="M-88.59,-33.5H80.59L88.59,-25.5V33.5H-88.59Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M80.59,-33.5V-25.5H88.59" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Marker released, process</tspan><tspan x="0" y="4.55">exits as a crash would; the</tspan><tspan x="0" y="21.55">next up recovers the run.</tspan></text></g></g></g></svg>