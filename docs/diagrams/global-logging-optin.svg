 x="-37.25" y="-21.5" width="74.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Wiped</text></g><g class="pele-node pele-state idle" data-id="NewHome" transform="translate(371.11,115.5)"><rect x="-51" y="-21.5" width="102.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">NewHome</text></g><g class="pele-node pele-state idle" data-id="Off" transform="translate(371.11,259)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Off</text></g><g class="pele-node pele-state idle" data-id="Stopped" transform="translate(198.9,580)"><rect x="-43.94" y="-21.5" width="87.88" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stopped</text></g><g class="pele-note" data-id="NewHome----note-16" transform="translate(173.08,115.5)"><path d="M-103.03,-33.5H95.03L103.03,-25.5V33.5H-103.03Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.03,-33.5V-25.5H103.03" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV FreshNeverStartsUnasked:</tspan><tspan x="0" y="4.55">install writes the logging</tspan><tspan x="0" y="21.55">files only while on.</tspan></text></g><g class="pele-note" data-id="Off----note-14" transform="translate(529.17,259)"><path d="M-86.06,-42H78.06L86.06,-34V42H-86.06Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M78.06,-42V-34H86.06" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">No logging files written.</tspan><tspan x="0" y="-3.95">hack logs reads container</tspan><tspan x="0" y="13.05">logs; --loki says how to</tspan><tspan x="0" y="30.05">turn it on.</tspan></text></g><g class="pele-note" data-id="Stopped----note-15" transform="translate(382.29,580)"><path d="M-95.45,-42H87.45L95.45,-34V42H-95.45Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.45,-42V-34H95.45" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">INV NoSurpriseDataLoss: off</tspan><tspan x="0" y="-3.95">stops the containers (found</tspan><tspan x="0" y="13.05">by project label) and keeps</tspan><tspan x="0" y="30.05">their volumes.</tspan></text></g></g></g></svg>