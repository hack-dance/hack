"0" y="-20.95">Dead owner and pinned coordinator</tspan><tspan x="0" y="-3.95">Same or audited successor boot</tspan><tspan x="0" y="13.05">Exact bridge and environment inventory</tspan><tspan x="0" y="30.05">Changed evidence retains this intent</tspan></text></g><g class="pele-note" data-id="bridge_retired----note-13" transform="translate(746.09,481)"><path d="M-135.91,-25H127.91L135.91,-17V25H-135.91Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M127.91,-25V-17H135.91" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Publisher and bridge helper absent</tspan><tspan x="0" y="13.05">Capacity released before compute removal</tspan></text></g><g class="pele-note" data-id="retired----note-14" transform="translate(688.09,710)"><path d="M-101.25,-25H93.25L101.25,-17V25H-101.25Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.25,-25V-17H101.25" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Compute absent, data retained</tspan><tspan x="0" y="13.05">Foreground publication retired</tspan></text></g></g></g></svg>