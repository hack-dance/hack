<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 929 629" width="929" height="629" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_S_R_0"><path d="M459.24,71L459.24,112"/><path class="pele-marker" d="M459.24,119L455.88,111L462.6,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_N_0"><path d="M429.29,229.34C429.29,258.3 370.52,276.05 274.62,276.05C178.72,276.05 119.94,291.25 119.94,316.05L119.94,360.55"/><path class="pele-marker" d="M119.94,367.55L116.58,359.55L123.3,359.55Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_T_0"><path d="M445.29,239.34C445.29,269.54 426.35,288.05 395.44,288.05C364.53,288.05 345.58,298.69 345.58,316.05L345.58,360.55"/><path class="pele-marker" d="M345.58,367.55L342.22,359.55L348.94,359.55Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_C_0"><path d="M473.18,239.34C473.18,269.54 492.13,288.05 523.04,288.05C553.95,288.05 572.89,298.69 572.89,316.05L572.89,360.55"/><path class="pele-marker" d="M572.89,367.55L569.53,359.55L576.25,359.55Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_L_0"><path d="M489.18,229.34C489.18,258.3 549.7,276.05 648.44,276.05C747.17,276.05 807.69,291.25 807.69,316.05L807.69,360.55"/><path class="pele-marker" d="M807.69,367.55L804.33,359.55L811.05,359.55Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_T_E_0"><path d="M345.58,414.55L345.58,455.55"/><path class="pele-marker" d="M345.58,462.55L342.22,454.55L348.94,454.55Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_E_M_0"><path d="M345.58,509.55L345.58,550.55"/><path class="pele-marker" d="M345.58,557.55L342.22,549.55L348.94,549.55Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C_O_0"><path d="M572.89,414.55L572.89,455.55"/><path class="pele-marker" d="M572.89,462.55L569.53,454.55L576.25,454.55Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_R_N_0"><rect x="37.9" y="318.05" width="164.08" height="20" rx="3" fill="var(--_bg)"/><text x="119.94" y="332.6" text-anchor="middle">command and output finish</text></g><g class="pele-edge-label" data-id="L_R_T_0"><rect x="297.15" y="318.05" width="96.87" height="20" rx="3" fill="var(--_bg)"/><text x="345.58" y="332.6" text-anchor="middle">server deadline</text></g><g class="pele-edge-label" data-id="L_R_C_0"><rect x="517.59" y="318.05" width="110.6" height="20" rx="3" fill="var(--_bg)"/><text x="572.89" y="332.6" text-anchor="middle">client cancellation</text></g><g class="pele-edge-label" data-id="L_R_L_0"><rect x="763.94" y="318.05" width="87.51" height="20" rx="3" fill="var(--_bg)"/><text x="807.69" y="332.6" text-anchor="middle">output budget</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="S" transform="translate(459.24,47.5)"><rect x="-90.11" y="-23.5" width="180.23" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Start command group</text></g><g class="pele-node pele-shape-diam" data-id="R" transform="translate(459.24,183.53)"><polygon points="0,-64.53 103.24,0 0,64.53 -103.24,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Observe owned work</text></g><g class="pele-node pele-shape-rect" data-id="N" transform="translate(119.94,391.05)"><rect x="-95.94" y="-23.5" width="191.88" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Return command result</text></g><g class="pele-node pele-shape-rect" data-id="T" transform="translate(345.58,391.05)"><rect x="-89.7" y="-23.5" width="179.4" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stop command group</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(572.89,391.05)"><rect x="-97.61" y="-23.5" width="195.23" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Cancel command group</text></g><g class="pele-node pele-shape-rect" data-id="L" transform="translate(807.69,391.05)"><rect x="-97.18" y="-23.5" width="194.37" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Return output-limit error</text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(345.58,486.05)"><rect x="-85.1" y="-23.5" width="170.21" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Return timeout error</text></g><g class="pele-node pele-shape-rect" data-id="M" transform="translate(345.58,581.05)"><rect x="-63.43" y="-23.5" width="126.87" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">timedOut true</text></g><g class="pele-node pele-shape-rect" data-id="O" transform="translate(572.89,486.05)"><rect x="-79.68" y="-23.5" width="159.36" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">No timeout marker</text></g></g></svg>