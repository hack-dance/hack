g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Off-Off----note-14"><path d="M392.97,259L436.97,259"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Stopped-Stopped----note-15"><path d="M242.84,571.5L286.84,571.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="NewHome----note-16-NewHome"><path d="M269.97,115.5L313.97,115.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge2"><rect x="310.39" y="169.5" width="109.17" height="20" rx="3" fill="var(--_bg)"/><text x="364.97" y="184.05" text-anchor="middle">install / up [unset]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="653.52" y="249" width="109.17" height="20" rx="3" fill="var(--_bg)"/><text x="708.1" y="263.55" text-anchor="middle">install / up [unset]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="267.67" y="321.5" width="76.64" height="20" rx="3" fill="var(--_bg)"/><text x="305.99" y="336.05" text-anchor="middle">up --logging</text></g><g class="pele-edge-label" data-id="edge5"><rect x="372.31" y="321.5" width="119.29" height="20" rx="3" fill="var(--_bg)"/><text x="431.95" y="336.05" text-anchor="middle">config true, then up</text></g><g class="pele-edge-label" data-id="edge6"><rect x="26" y="494" width="95.43" height="20" rx="3" fill="var(--_bg)"/><text x="73.71" y="508.55" text-anchor="middle">up --no-logging</text></g><g class="pele-edge-label" data-id="edge7"><rect x="141.43" y="494" width="124.35" height="20" rx="3" fill="var(--_bg)"/><text x="203.6" y="508.55" text-anchor="middle">config false, then up</text></g><g class="pele-edge-label" data-id="edge8"><rect x="285.78" y="494" width="76.64" height="20" rx="3" fill="var(--_bg)"/><text x="324.1" y="508.55" text-anchor="middle">up --logging</text></g><g class="pele-edge-label" data-id="edge9"><rect x="398.6" y="494" width="77.37" height="20" rx="3" fill="var(