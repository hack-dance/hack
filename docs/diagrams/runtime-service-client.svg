orm="translate(193.98,370)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">sent</text></g><g class="pele-node pele-state wait" data-id="inspect" transform="translate(548.97,624.5)"><rect x="-39.76" y="-21.5" width="79.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">inspect</text></g><g class="pele-note" data-id="hello----note-17" transform="translate(532.12,226.5)"><path d="M-101.78,-33.5H93.78L101.78,-25.5V33.5H-101.78Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.78,-33.5V-25.5H101.78" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Retire only for another build.</tspan><tspan x="0" y="4.55">Send only to the same build.</tspan><tspan x="0" y="21.55">Fallback only when unsure = 0.</tspan></text></g><g class="pele-note" data-id="sent----note-18" transform="translate(377.34,370)"><path d="M-109.18,-42H101.18L109.18,-34V42H-109.18Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M101.18,-42V-34H109.18" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">INV AtMostOnce. A resend keeps</tspan><tspan x="0" y="-3.95">the intent id, on a new</tspan><tspan x="0" y="13.05">connection; a reply comes</tspan><tspan x="0" y="30.05">only on its own connection.</tspan></text></g><g class="pele-note" data-id="inspect----note-19" transform="translate(738.85,624.5)"><path d="M-106.11,-33.5H98.11L106.11,-25.5V33.5H-106.11Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M98.11,-33.5V-25.5H106.11" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Entry from idle needs unsure &gt; 0</tspan><tspan x="0" y="4.55">and service.lock free at entry.</tspan><tspan x="0" y="21.55">Started, not complete: unknown.</tspan></text></g></g></g></svg>