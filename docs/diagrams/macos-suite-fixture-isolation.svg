l="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Isolated environment</text></g><g class="pele-node pele-shape-rect" data-id="L" transform="translate(765.2,237.5)"><rect x="-86.36" y="-23.5" width="172.73" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Mock launchd status</text></g><g class="pele-node pele-shape-rect" data-id="P" transform="translate(972.92,237.5)"><rect x="-81.35" y="-23.5" width="162.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Fixture PID census</text></g><g class="pele-node pele-shape-rect" data-id="I" transform="translate(1177.7,237.5)"><rect x="-83.43" y="-23.5" width="166.86" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Private child HOME</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(972.92,332.5)"><rect x="-84.69" y="-23.5" width="169.38" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Real identity checks</text></g></g></svg>