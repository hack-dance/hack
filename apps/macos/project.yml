name: HackDesktop
options:
  bundleIdPrefix: dance.hack
  deploymentTarget:
    macOS: "14.0"
packages:
  HackDesktop:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.8.1
targets:
  HackDesktop:
    type: application
    platform: macOS
    sources:
      - path: App
        # BundledCLI is populated dynamically by CI (and sometimes locally), and we copy it in a
        # post-build script. Excluding it prevents stale file references in the generated xcodeproj
        # (e.g. lstat failures when a previously-generated project referenced a file that no longer exists).
        excludes:
          - BundledCLI
          - BundledCLI/**
          - GhosttyVT
          - GhosttyVT/**
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    postBuildScripts:
      - name: Copy BundledCLI Resources
        script: |
          set -euo pipefail
          SRC="${PROJECT_DIR}/App/BundledCLI"
          DEST="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/Contents/Resources/BundledCLI"

          if [ ! -d "$SRC" ]; then
            echo "Missing BundledCLI dir: $SRC"
            exit 1
          fi

          mkdir -p "$DEST"
          ditto "$SRC" "$DEST"
      - name: Copy Ghostty VT Resources
        script: |
          set -euo pipefail
          SRC="${PROJECT_DIR}/App/GhosttyVT/ghostty"
          DEST="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/Contents/Resources/ghostty"

          if [ ! -d "$SRC" ]; then
            echo "No Ghostty VT resources to copy: $SRC"
            exit 0
          fi

          if [ "$CONFIGURATION" = "Release" ] && [ ! -f "$SRC/lib/libhack_ghostty_vt.dylib" ]; then
            echo "Missing Ghostty VT dylib for Release build: $SRC/lib/libhack_ghostty_vt.dylib"
            exit 1
          fi

          mkdir -p "$DEST"
          ditto "$SRC" "$DEST"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Avoid XcodeGen rewriting App/Info.plist (it hardcodes the version to 1.0/1).
        # Instead, let Xcode read the plist directly and expand $(MARKETING_VERSION).
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - package: HackDesktop
        product: DashboardFeature
      - package: Sparkle
        product: Sparkle
