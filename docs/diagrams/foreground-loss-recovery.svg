" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.1,-33.5V-25.5H95.1" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Images, review, restore</tspan><tspan x="0" y="4.55">selection; nothing requested.</tspan><tspan x="0" y="21.55">A restart holds its lock.</tspan></text></g><g class="pele-note" data-id="GraphReady----note-19" transform="translate(475.37,361.5)"><path d="M-96.9,-33.5H88.9L96.9,-25.5V33.5H-96.9Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M88.9,-33.5V-25.5H96.9" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Ready and mapped. A restart</tspan><tspan x="0" y="4.55">still holds its cleaned</tspan><tspan x="0" y="21.55">intent and its lock.</tspan></text></g><g class="pele-note" data-id="Dead----note-20" transform="translate(621,607.5)"><path d="M-84.61,-33.5H76.61L84.61,-25.5V33.5H-84.61Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M76.61,-33.5V-25.5H84.61" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">The watch and the start's</tspan><tspan x="0" y="4.55">own error race; both print</tspan><tspan x="0" y="21.55">the stage message.</tspan></text></g><g class="pele-note" data-id="Inspect----note-21" transform="translate(118,994)"><path d="M-94,-42H86L94,-34V42H-94Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M86,-42V-34H94" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">A fresh up has no record</tspan><tspan x="0" y="-3.95">for down to retire yet:</tspan><tspan x="0" y="13.05">none named.</tspan><tspan x="0" y="30.05">INV NoNeedlessWithholding</tspan></text></g><g class="pele-note" data-id="Down----note-22" transform