<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 552 526" width="552" height="526" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_ci_four_0"><path d="M163.78,71L163.78,112"/><path class="pele-marker" d="M163.78,119L160.42,111L167.14,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_four_aggregate_0"><path d="M112.44,166L112.44,215.5"/><path class="pele-marker" d="M112.44,222.5L109.08,214.5L115.8,214.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_aggregate_exact_0"><path d="M112.44,269.5L112.44,319"/><path class="pele-marker" d="M112.44,326L109.08,318L115.8,318Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_manual_six_0"><path d="M429,71L429,112"/><path class="pele-marker" d="M429,119L425.64,111L432.36,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_six_metrics_0"><path d="M429,166L429,207"/><path class="pele-marker" d="M429,214L425.64,206L432.36,206Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_four_compare_0"><path d="M215.13,166L215.13,278C215.13,295.5 340.8,295.5 340.8,313L340.8,319"/><path class="pele-marker" d="M340.8,326L337.44,318L344.16,318Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_metrics_compare_0"><path d="M429,278L429,319"/><path class="pele-marker" d="M429,326L425.64,318L432.36,318Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_compare_decision_0"><path d="M377.24,390L377.24,431"/><path class="pele-marker" d="M377.24,438L373.88,430L380.6,430Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="ci" transform="translate(163.78,47.5)"><rect x="-87.59" y="-23.5" width="175.19" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Ordinary CI workflow</text></g><g class="pele-node pele-shape-rect live" data-id="four" transform="translate(163.78,142.5)"><rect x="-83.85" y="-23.5" width="167.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Four Docker shards</text></g><g class="pele-node pele-shape-rect ok" data-id="aggregate" transform="translate(112.44,246)"><rect x="-74.68" y="-23.5" width="149.37" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Existing CI fan-in</text></g><g class="pele-node pele-shape-rect ok" data-id="exact" transform="translate(112.44,358)"><rect x="-88.44" y="-32" width="176.88" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Exact-source release</tspan><tspan x="0" y="15.25">checks</tspan></text></g><g class="pele-node pele-shape-rect" data-id="manual" transform="translate(429,47.5)"><rect x="-98.44" y="-23.5" width="196.89" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Explicit manual dispatch</text></g><g class="pele-node pele-shape-rect live" data-id="six" transform="translate(429,142.5)"><rect x="-83.02" y="-23.5" width="166.04" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Six advisory shards</text></g><g class="pele-node pele-shape-rect" data-id="metrics" transform="translate(429,246)"><rect x="-75.51" y="-32" width="151.02" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Allowlisted timing</tspan><tspan x="0" y="15.25">summaries</tspan></text></g><g class="pele-node pele-shape-rect wait" data-id="compare" transform="translate(377.24,358)"><rect x="-88.44" y="-32" width="176.88" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Compare same-head</tspan><tspan x="0" y="15.25">evidence</tspan></text></g><g class="pele-node pele-shape-rect wait" data-id="decision" transform="translate(377.24,470)"><rect x="-79.29" y="-32" width="158.58" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Separate adoption</tspan><tspan x="0" y="15.25">decision</tspan></text></g></g></svg>