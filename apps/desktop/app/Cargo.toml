[package]
name = "hack-desktop"
description = "Minimal native desktop app for Hack (unsupported preview)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hack-desktop"
path = "src/main.rs"

[features]
# Offscreen rendering of fixture states to PNG (used for design evidence).
screenshots = ["gpui-kit/test-support", "dep:image"]

[dependencies]
hack-desktop-core.workspace = true
gpui-kit.workspace = true
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
