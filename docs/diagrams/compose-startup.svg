<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 746 616" width="746" height="616" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M298.72,38L298.72,82L298.72,78.5"/><path class="pele-marker" d="M298.72,85.5L295.36,77.5L302.08,77.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M298.72,128.5L298.72,132C298.72,149.36 256.52,160 187.66,160C118.81,160 76.6,182.04 76.6,218L76.6,397.5C76.6,435.75 165.84,435.75 165.84,474L165.84,480"/><path class="pele-marker" d="M165.84,487L162.48,479L169.2,479Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M298.72,128.5L298.72,132C298.72,156.8 270.72,172 225.02,172C179.32,172 151.31,187.2 151.31,212L151.31,236C151.31,241.63 192.73,241.63 192.73,247.25L192.73,251"/><path class="pele-marker" d="M192.73,258L189.37,250L196.09,250Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M298.72,128.5L298.72,132C298.72,156.8 317.67,172 348.57,172C379.48,172 398.42,187.2 398.42,212L398.42,236C398.42,241.63 465.7,241.63 465.7,247.25L465.7,251"/><path class="pele-marker" d="M465.7,258L462.34,250L469.06,250Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M208.73,258L208.73,248.38C208.73,242.19 277.21,242.19 277.21,236L277.21,212C277.21,192 298.72,192 298.72,172L298.72,132L298.72,135.5"/><path class="pele-marker" d="M298.72,128.5L302.08,136.5L295.36,136.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M200.73,301L200.73,407C200.73,440.5 181.84,440.5 181.84,474L181.84,480"/><path class="pele-marker" d="M181.84,487L178.48,479L185.2,479Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M481.7,258L481.7,248.38C481.7,242.19 559.73,242.19 559.73,236L559.73,212C559.73,179.76 510.14,160 429.23,160C348.32,160 298.72,149.36 298.72,132L298.72,135.5"/><path class="pele-marker" d="M298.72,128.5L302.08,136.5L295.36,136.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M467.93,301C467.93,335 353.92,335 353.92,369L353.92,407C353.92,431.8 324.26,447 275.88,447C227.49,447 197.84,457.26 197.84,474L197.84,480"/><path class="pele-marker" d="M197.84,487L194.48,479L201.2,479Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M499.93,301C499.93,318.36 529.44,329 577.58,329C625.72,329 655.22,344.2 655.22,369L655.22,480"/><path class="pele-marker" d="M655.22,487L651.86,479L658.58,479Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M483.93,301L483.93,329C483.93,349 504.4,349 504.4,369L504.4,407C504.4,439.24 449.19,459 359.12,459C269.04,459 213.84,464.99 213.84,474.75L213.84,480"/><path class="pele-marker" d="M213.84,487L210.48,479L217.2,479Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Observe-Observe----note-10"><path d="M343.07,107L387.07,107"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M655.22,530C655.22,542.22 340.63,548.78 340.63,561L340.63,567"/><path class="pele-marker" d="M340.63,574L337.27,566L343.99,566Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M185.98,530C185.98,545.5 340.63,545.5 340.63,561L340.63,567"/><path class="pele-marker" d="M340.63,574L337.27,566L343.99,566Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="26" y="269.5" width="101.21" height="20" rx="3" fill="var(--_bg)"/><text x="76.6" y="284.05" text-anchor="middle">inspection failed</text></g><g class="pele-edge-label" data-id="edge2"><rect x="94.21" y="214" width="114.2" height="20" rx="3" fill="var(--_bg)"/><text x="151.31" y="228.55" text-anchor="middle">created or missing</text></g><g class="pele-edge-label" data-id="edge3"><rect x="346.01" y="214" width="104.82" height="20" rx="3" fill="var(--_bg)"/><text x="398.42" y="228.55" text-anchor="middle">running or exited</text></g><g class="pele-edge-label" data-id="edge4"><rect x="228.41" y="214" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="277.21" y="228.55" text-anchor="middle">budget remains</text></g><g class="pele-edge-label" data-id="edge5"><rect x="145.05" y="378" width="111.35" height="20" rx="3" fill="var(--_bg)"/><text x="200.73" y="392.55" text-anchor="middle">budget exhausted</text></g><g class="pele-edge-label" data-id="edge6"><rect x="470.83" y="214" width="177.81" height="20" rx="3" fill="var(--_bg)"/><text x="559.73" y="228.55" text-anchor="middle">changed IDs, budget remains</text></g><g class="pele-edge-label" data-id="edge7"><rect x="289.94" y="371" width="127.96" height="34" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="353.92" y="384.05">changed IDs, budget</tspan><tspan x="353.92" y="401.05">exhausted</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="590.9" y="371" width="128.65" height="34" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="655.22" y="384.05">same IDs, running or</tspan><tspan x="655.22" y="401.05">recognized exit 0</tspan></text></g><g class="pele-edge-label" data-id="edge9"><rect x="437.9" y="378" width="133" height="20" rx="3" fill="var(--_bg)"/><text x="504.4" y="392.55" text-anchor="middle">same IDs, failed state</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(298.72,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Incomplete" transform="translate(185.98,508.5)"><rect x="-52.68" y="-21.5" width="105.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Incomplete</text></g><g class="pele-node pele-state" data-id="Pending" transform="translate(200.73,279.5)"><rect x="-43.52" y="-21.5" width="87.04" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Pending</text></g><g class="pele-node pele-state" data-id="Corroborate" transform="translate(473.7,279.5)"><rect x="-56.01" y="-21.5" width="112.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Corroborate</text></g><g class="pele-node pele-state" data-id="Complete" transform="translate(655.22,508.5)"><rect x="-48.09" y="-21.5" width="96.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Complete</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(340.63,583)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Observe" transform="translate(298.72,107)"><rect x="-44.34" y="-21.5" width="88.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Observe</text></g><g class="pele-note" data-id="Observe----note-10" transform="translate(478.17,107)"><path d="M-91.11,-25H83.11L91.11,-17V25H-91.11Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M83.11,-25V-17H91.11" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Each read has a 15 s limit.</tspan><tspan x="0" y="13.05">Always allow the initial pair.</tspan></text></g></g></svg>