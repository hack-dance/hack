edge-label" data-id="edge15"><rect x="537.19" y="712.5" width="49.91" height="20" rx="3" fill="var(--_bg)"/><text x="562.15" y="727.05" text-anchor="middle">Inspect</text></g><g class="pele-edge-label" data-id="edge16"><rect x="96.16" y="648.5" width="47.01" height="20" rx="3" fill="var(--_bg)"/><text x="119.66" y="663.05" text-anchor="middle">Report</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(384.6,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="idle" transform="translate(384.6,103.5)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">idle</text></g><g class="pele-node pele-state" data-id="oneshot" transform="translate(929.35,387)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">oneshot</text></g><g class="pele-node pele-state" data-id="replied" transform="translate(119.66,535.5)"><rect x="-38.51" y="-21.5" width="77.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">replied</text></g><g class="pele-node pele-state wait" data-id="unknown" transform="translate(366.55,535.5)"><rect x="-46.01" y="-21.5" width="92.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">unknown</text></g><g class="pele-node pele-state" data-id="oneshotRunning" transform="translate(929.35,535.5)"><rect x="-70.62" y="-21.5" width="141.23" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">oneshotRunning</text></g><g class="pele-node pele-state ok" data-id="finished" transform="translate(562.88,781.5)"><rect x="-41.84" y="-21.5" width="83.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">finished</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(562.88,856)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="hello" transform="translate(351.08,226.5)"><rect x="-31.84" y="-21.5" width="63.68" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">hello</text></g><g class="pele-node pele-state live" data-id="sent" transform="translate(190.01,387)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">sent</text></g><g class="pele-node pele-state wait" data-id="inspect" transform="translate(562.15,658.5)"><rect x="-39.76" y="-21.5" width="79.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">inspect</text></g><g class="pele-note" data-id="hello----note-18" transform="translate(528.7,226.5)"><path d="M-101.78,-33.5H93.78L101.78,-25.5V33.5H-101.78Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.78,-33.5V-25.5H101.78" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Retire only for another build.</tspan><tspan x="0" y="4.55">Send only to the same build.</tspan><tspan x="0" y="21.55">Fallback only when unsure = 0.</tspan></text></g><g class="pele-note" data-id="sent----note-19" transform="translate(373.37,387)"><path d="M-109.18,-59H101.18L109.18,-51V59H-109.18Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M101.18,-59V-51H109.18" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.95">INV AtMostOnce. A resend keeps</tspan><tspan x="0" y="-20.95">the intent id, on a new</tspan><tspan x="0" y="-3.95">connection; a reply comes</tspan><tspan x="0" y="13.05">only on its own connection.</tspan><tspan x="0" y="30.05">A dropped frame stays unsure;</tspan><tspan x="0" y="47.05">RefuseDraining clears it.</tspan></text></g><g class="pele-note" data-id="inspect----note-20" transform="translate(752.02,658.5)"><path d="M-106.11,-33.5H98.11L106.11,-25.5V33.5H-106.11Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M98.11,-33.5V-25.5H106.11" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Entry from idle needs unsure &gt; 0</tspan><tspan x="0" y="4.55">and service.lock free at entry.</tspan><tspan x="0" y="21.55">Started, not complete: unknown.</tspan></text></g></g></g></svg>