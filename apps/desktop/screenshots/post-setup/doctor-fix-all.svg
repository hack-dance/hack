<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 589 777" width="589" height="777" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="294.5" y="40.75">Doctor Fix all</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M272.94,38L272.94,75"/><path class="pele-marker" d="M272.94,82L269.58,74L276.3,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M272.94,125L272.94,186"/><path class="pele-marker" d="M272.94,193L269.58,185L276.3,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M257.96,236L257.96,246.72C257.96,253.61 149.21,253.61 149.21,260.5L149.21,347C149.21,374.5 200.51,374.5 200.51,402L200.51,408"/><path class="pele-marker" d="M200.51,415L197.15,407L203.87,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M273.96,236L273.96,297"/><path class="pele-marker" d="M273.96,304L270.6,296L277.32,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M273.96,347L273.96,389.5C273.96,396.44 216.51,396.44 216.51,403.38L216.51,408"/><path class="pele-marker" d="M216.51,415L213.15,407L219.87,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M208.51,458C208.51,473.5 280.14,473.5 280.14,489L280.14,495"/><path class="pele-marker" d="M280.14,502L276.78,494L283.5,494Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M296.14,502L296.14,489C296.14,473.5 367.76,473.5 367.76,458L367.76,260.5C367.76,253.94 289.96,253.94 289.96,247.38L289.96,243"/><path class="pele-marker" d="M289.96,236L293.32,244L286.6,244Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M272.14,545C272.14,553.23 105.87,555.27 105.87,563.5L105.87,606"/><path class="pele-marker" d="M105.87,613L102.51,605L109.23,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M288.14,545L288.14,606"/><path class="pele-marker" d="M288.14,613L284.78,605L291.5,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M288.14,656L288.14,693"/><path class="pele-marker" d="M288.14,700L284.78,692L291.5,692Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M304.14,545C304.14,552.94 476.55,555.56 476.55,563.5L476.55,606"/><path class="pele-marker" d="M476.55,613L473.19,605L479.91,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M105.87,656C105.87,671.5 288.14,671.5 288.14,687L288.14,693"/><path class="pele-marker" d="M288.14,700L284.78,692L291.5,692Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M476.55,656C476.55,671.5 288.14,671.5 288.14,687L288.14,693"/><path class="pele-marker" d="M288.14,700L284.78,692L291.5,692Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="251.97" y="145.5" width="41.94" height="20" rx="3" fill="var(--_bg)"/><text x="272.94" y="160.05" text-anchor="middle">Fix all</text></g><g class="pele-edge-label" data-id="edge2"><rect x="100.06" y="315.5" width="98.3" height="20" rx="3" fill="var(--_bg)"/><text x="149.21" y="330.05" text-anchor="middle">Command exits</text></g><g class="pele-edge-label" data-id="edge3"><rect x="256.59" y="256.5" width="34.74" height="20" rx="3" fill="var(--_bg)"/><text x="273.96" y="271.05" text-anchor="middle">Stop</text></g><g class="pele-edge-label" data-id="edge4"><rect x="224.81" y="367.5" width="98.3" height="20" rx="3" fill="var(--_bg)"/><text x="273.96" y="382.05" text-anchor="middle">Command exits</text></g><g class="pele-edge-label" data-id="edge6"><rect x="293.69" y="426.5" width="148.14" height="20" rx="3" fill="var(--_bg)"/><text x="367.76" y="441.05" text-anchor="middle">Confirmed, more repairs</text></g><g class="pele-edge-label" data-id="edge7"><rect x="26" y="565.5" width="159.74" height="20" rx="3" fill="var(--_bg)"/><text x="105.87" y="580.05" text-anchor="middle">Confirmed, queue finished</text></g><g class="pele-edge-label" data-id="edge8"><rect x="205.74" y="565.5" width="164.81" height="20" rx="3" fill="var(--_bg)"/><text x="288.14" y="580.05" text-anchor="middle">Confirmed, queue changed</text></g><g class="pele-edge-label" data-id="edge10"><rect x="390.54" y="565.5" width="172.02" height="20" rx="3" fill="var(--_bg)"/><text x="476.55" y="580.05" text-anchor="middle">Failed, unverified or stopped</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(272.94,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Ready" transform="translate(272.94,103.5)"><rect x="-37.67" y="-21.5" width="75.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Ready</text></g><g class="pele-node pele-state live" data-id="Running" transform="translate(272.94,214.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Running</text></g><g class="pele-node pele-state" data-id="Rechecking" transform="translate(208.51,436.5)"><rect x="-55.18" y="-21.5" width="110.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Rechecking</text></g><g class="pele-node pele-state" data-id="Stopping" transform="translate(273.96,325.5)"><rect x="-45.6" y="-21.5" width="91.21" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stopping</text></g><g class="pele-node pele-state" data-id="Outcome" transform="translate(288.14,523.5)"><rect x="-46.43" y="-21.5" width="92.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Outcome</text></g><g class="pele-node pele-state ok" data-id="Complete" transform="translate(105.87,634.5)"><rect x="-48.09" y="-21.5" width="96.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Complete</text></g><g class="pele-node pele-state" data-id="Changed" transform="translate(288.14,634.5)"><rect x="-46.43" y="-21.5" width="92.87" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Changed</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(288.14,709)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state fail" data-id="Retained" transform="translate(476.55,634.5)"><rect x="-46.01" y="-21.5" width="92.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Retained</text></g></g></g></svg>