<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 549 603" width="549" height="603" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="274.5" y="40.75">ExecStopWait · authored exec</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M345.18,38L345.18,75"/><path class="pele-marker" d="M345.18,82L341.82,74L348.54,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M392.86,95.5C418.86,87.5 418.86,119.5 399.55,113.56"/><path class="pele-marker" d="M392.86,111.5L401.5,110.64L399.52,117.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M337.18,125C337.18,134.25 214.75,134.25 214.75,143.5L214.75,186"/><path class="pele-marker" d="M214.75,193L211.39,185L218.11,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M353.18,125C353.18,159 475.62,159 475.62,193L475.62,236C475.62,263.5 438.84,263.5 438.84,291L438.84,297"/><path class="pele-marker" d="M438.84,304L435.48,296L442.2,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M251.17,206.5C277.17,198.5 277.17,230.5 257.86,224.56"/><path class="pele-marker" d="M251.17,222.5L259.8,221.64L257.83,228.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M206.75,236C206.75,245.25 147.64,245.25 147.64,254.5L147.64,297"/><path class="pele-marker" d="M147.64,304L144.28,296L151,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M222.75,236C222.75,245.25 281.85,245.25 281.85,254.5L281.85,278.5C281.85,283.96 422.84,286.91 422.84,292.38L422.84,297"/><path class="pele-marker" d="M422.84,304L419.48,296L426.2,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M147.64,347L147.64,408"/><path class="pele-marker" d="M147.64,415L144.28,407L151,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M430.84,347L430.84,458C430.84,485.5 337.18,485.5 337.18,513L337.18,519"/><path class="pele-marker" d="M337.18,526L333.82,518L340.54,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M147.64,458L147.64,500.5C147.64,504.56 337.18,510.31 337.18,514.38L337.18,519"/><path class="pele-marker" d="M337.18,526L333.82,518L340.54,518Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="424.86" y="93.5" width="101.93" height="20" rx="3" fill="var(--_bg)"/><text x="475.83" y="108.05" text-anchor="middle">Tick [stop holds]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="151.14" y="145.5" width="127.22" height="20" rx="3" fill="var(--_bg)"/><text x="214.75" y="160.05" text-anchor="middle">Acquire [free, sends]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="435.49" y="204.5" width="80.25" height="20" rx="3" fill="var(--_bg)"/><text x="475.62" y="219.05" text-anchor="middle">Expire [35 s]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="283.17" y="204.5" width="124.32" height="20" rx="3" fill="var(--_bg)"/><text x="345.33" y="219.05" text-anchor="middle">Tick [second holder]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="104.98" y="256.5" width="85.31" height="20" rx="3" fill="var(--_bg)"/><text x="147.64" y="271.05" text-anchor="middle">Acquire [free]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="210.29" y="256.5" width="143.12" height="20" rx="3" fill="var(--_bg)"/><text x="281.85" y="271.05" text-anchor="middle">Expire [15 s, own code]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="126.3" y="367.5" width="42.67" height="20" rx="3" fill="var(--_bg)"/><text x="147.64" y="382.05" text-anchor="middl