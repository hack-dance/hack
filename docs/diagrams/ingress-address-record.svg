<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1067 582" width="1067" height="582" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="533.5" y="40.75">IngressRecord · when hack run trusts the record</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M514.75,38L514.75,75"/><path class="pele-marker" d="M514.75,82L511.39,74L518.11,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M498.75,125L498.75,134.63C498.75,137.72 247.92,143.91 247.92,147L247.92,206.5"/><path class="pele-marker" d="M247.92,213.5L244.56,205.5L251.28,205.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M289.35,227C315.35,219 315.35,251 296.04,245.06"/><path class="pele-marker" d="M289.35,243L297.98,242.14L296,248.56Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M247.92,256.5L247.92,319.5C247.92,329.25 514.75,335.25 514.75,345L514.75,350"/><path class="pele-marker" d="M514.75,357L511.39,349L518.11,349Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M530.75,125L530.75,137.25C530.75,141.21 781.57,149.04 781.57,153L781.57,277C781.57,311 514.75,311 514.75,345L514.75,350"/><path class="pele-marker" d="M514.75,357L511.39,349L518.11,349Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M749.39,480L749.39,470.38C749.39,467.28 514.75,461.09 514.75,458L514.75,407"/><path class="pele-marker" d="M514.75,400L518.11,408L511.39,408Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M562.85,370.5C588.85,362.5 588.85,394.5 569.54,388.56"/><path class="pele-marker" d="M562.85,386.5L571.48,385.64L569.5,392.06Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M514.75,400L514.75,412C514.75,419.72 765.39,426.28 765.39,434L765.39,473"/><path class="pele-marker" d="M765.39,480L762.03,472L768.75,472Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M781.39,480L781.39,467.75C781.39,462.92 986.8,456.83 986.8,452L986.8,301.5C986.8,295.38 247.92,283.13 247.92,277L247.92,263.5"/><path class="pele-marker" d="M247.92,256.5L251.28,264.5L244.56,264.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M247.92,213.5L247.92,193C247.92,185.74 514.75,178.26 514.75,171L514.75,132"/><path class="pele-marker" d="M514.75,125L518.11,133L511.39,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Changing-Changing----note-10"><path d="M562.85,378.5L706.97,378.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Trusted-Trusted----note-11"><path d="M289.35,235L515.84,235"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="186.48" y="149" width="122.88" height="20" rx="3" fill="var(--_bg)"/><text x="247.92" y="163.55" text-anchor="middle">Write [settled token]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="321.35" y="225" width="152.5" height="20" rx="3" fill="var(--_bg)"/><text x="397.59" y="239.55" text-anchor="middle">run reads, no Docker call</text></g><g class="pele-edge-label" data-id="edge3"><rect x="212.49" y="297.5" width="70.85" height="20" rx="3" fill="var(--_bg)"/><text x="247.92" y="312.05" text-anchor="middle">HackBegin</text></g><g class="pele-edge-label" data-id="edge4"><rect x="746.15" y="225" width="70.85" height="20" rx="3" fill="var(--_bg)"/><text x="781.57" y="239.55" text-anchor="middle">HackBegin</text></g><g class="pele-edge-label" data-id="edge5"><rect x="479.32" y="436" width="70.85" height="20" rx="3" fill="var(--_bg)"/><text x="514.75" y="450.55" text-anchor="middle">HackBegin</text></g><g class="pele-edge-label" data-id="edge6"><rect x="594.85" y="368.5" width="70.13" height="20" rx="3" fill="var(--_bg)"/><text x="629.91" y="383.05" text-anchor="middle">HackApply</text></g><g class="pele-edge-label" data-id="edge7"><rect x="735.02" y="436" width="60.74" height="20" rx="3" fill="var(--_bg)"/><text x="765.39" y="450.55" text-anchor="middle">HackEnd</text></g><g class="pele-edge-label" data-id="edge8"><rect x="932.95" y="368.5" width="107.7" height="20" rx="3" fill="var(--_bg)"/><text x="986.8" y="383.05" text-anchor="middle">Write [fresh read]</text></g><g class="pele-edge-label" data-id="edge9"><rect x="447.16" y="149" width="135.17" height="20" rx="3" fill="var(--_bg)"/><text x="514.75" y="163.55" text-anchor="middle">Write [container gone]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(514.75,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state idle" data-id="NoRecord" transform="translate(514.75,103.5)"><rect x="-49.76" y="-21.5" width="99.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">NoRecord</text></g><g class="pele-node pele-state idle" data-id="Untrusted" transform="translate(765.39,501.5)"><rect x="-48.51" y="-21.5" width="97.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Untrusted</text></g><g class="pele-node pele-state ok" data-id="Trusted" transform="translate(247.92,235)"><rect x="-41.42" y="-21.5" width="82.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Trusted</text></g><g class="pele-node pele-state wait" data-id="Changing" transform="translate(514.75,378.5)"><rect x="-48.1" y="-21.5" width="96.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Changing</text></g><g class="pele-note" data-id="Trusted----note-11" transform="translate(615.99,235)"><path d="M-100.15,-42H92.15L100.15,-34V42H-100.15Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M92.15,-42V-34H100.15" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">INV TrustedRecordIsCurrent:</tspan><tspan x="0" y="-3.95">a trusted record names the</tspan><tspan x="0" y="13.05">running address, unless a</tspan><tspan x="0" y="30.05">change outside Hack followed.</tspan></text></g><g class="pele-note" data-id="Changing----note-10" transform="translate(804.96,378.5)"><path d="M-97.99,-33.5H89.99L97.99,-25.5V33.5H-97.99Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M89.99,-33.5V-25.5H97.99" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">A crash here leaves the token</tspan><tspan x="0" y="4.55">unsettled: every run reads</tspan><tspan x="0" y="21.55">Docker until the next change.</tspan></text></g></g></g></svg>