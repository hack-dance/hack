# Separate workspace for the Hack desktop app (HACK-2214). It has its own
# lockfile and target directory so it never changes the build, lockfile or
# release of packages/runtime-core or packages/config-compiler.
[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = { version = "=0.9.1" }
hack-desktop-core = { path = "core" }

[profile.release]
strip = true
lto = "thin"
