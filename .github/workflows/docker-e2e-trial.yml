name: Docker E2E trial

on:
  push:
    branches: [next, main]
    tags-ignore: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Trial change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      suite: ${{ steps.scope.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun scripts/ci-change-scope.ts --event="$EVENT_NAME"

  docker-e2e-trial:
    # Separate workflow: no job can enter the CI run consumed by prerelease.
    name: docker-e2e trial shard ${{ matrix.shard }}/6
    needs: changes
    if: >-
      ${{ needs.changes.outputs.suite == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'docker-e2e-trial'))) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Docker E2E shard
        uses: ./.github/actions/docker-e2e-shard
        with:
          shard: ${{ matrix.shard }}
          count: "6"
          # Pinned to the lightest non-network shard by tests/e2e-shard.test.ts.
          extra-shard: "6"
