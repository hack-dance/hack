name: hack-cli
services:
  deps:
    image: imbios/bun-node:latest
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    command: bun install
    networks:
      - default

  web:
    image: imbios/bun-node:latest
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
    command: bun run --cwd apps/web dev -- --hostname 0.0.0.0 --port 3000
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      HACK_WEB_APP_BASE_URL: https://hack-cli.hack
      HACK_AUTH_BROKER_URL: https://auth.hack-cli.hack
      HACK_AUTH_BROKER_INTERNAL_URL: http://auth-broker:8080
      NEXT_PUBLIC_HACK_WEB_APP_BASE_URL: https://hack-cli.hack
      NEXT_PUBLIC_HACK_AUTH_BROKER_URL: https://auth.hack-cli.hack
      BETTER_AUTH_TRUSTED_ORIGINS: https://hack-cli.hack,https://hack-cli.hack.gy
    labels:
      caddy: "hack-cli.hack, hack-cli.hack.gy"
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls: internal
    networks:
      - hack-dev
      - default

  auth-broker:
    image: imbios/bun-node:latest
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
    command: bun run --cwd services/auth-broker start
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      AUTH_BROKER_PUBLIC_BASE_URL: https://auth.hack-cli.hack
      BETTER_AUTH_URL: https://auth.hack-cli.hack
      HACK_WEB_APP_BASE_URL: https://hack-cli.hack
      BETTER_AUTH_TRUSTED_ORIGINS: https://hack-cli.hack,https://hack-cli.hack.gy
      GITHUB_REDIRECT_URI: https://auth.hack-cli.hack/gh/callback
      HACK_LINEAR_REDIRECT_URI: https://auth.hack-cli.hack/linear/callback
    labels:
      caddy: "auth.hack-cli.hack, auth.hack-cli.hack.gy"
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.tls: internal
    networks:
      - hack-dev
      - default

networks:
  hack-dev:
    external: true

volumes:
  node_modules:
