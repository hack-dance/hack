services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: null
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: null
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: null
      MINIO_ROOT_PASSWORD: null
