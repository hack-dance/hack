ansform="translate(605.89,776.5)"><rect x="-36.84" y="-21.5" width="73.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exited</text></g><g class="pele-node pele-state" data-id="Recoverable" transform="translate(863.89,436.5)"><rect x="-58.1" y="-21.5" width="116.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Recoverable</text></g><g class="pele-node pele-state" data-id="Stopping" transform="translate(1068.94,551)"><rect x="-45.6" y="-21.5" width="91.21" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stopping</text></g><g class="pele-node pele-state" data-id="KillPending" transform="translate(945.05,665.5)"><rect x="-53.51" y="-21.5" width="107.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">KillPending</text></g><g class="pele-node pele-state" data-id="StopUnknown" transform="translate(1220.21,776.5)"><rect x="-62.69" y="-21.5" width="125.38" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">StopUnknown</text></g><g class="pele-node pele-state" data-id="Starting" transform="translate(460.17,214.5)"><rect x="-41.84" y="-21.5" width="83.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Starting</text></g><g class="pele-node pele-state" data-id="Orphaned" transform="translate(204.65,551)"><rect x="-49.35" y="-21.5" width="98.71" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Orphaned</text></g><g class="pele-note" data-id="Starting----note-15" transform="translate(650.13,214.5)"><path d="M-104.12,-18H96.12L104.12,-10V18H-104.12Z" fill="var(--_bg)" stroke="var(--_b)"/><path d