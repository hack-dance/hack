[package]
name = "hack-lifecycle-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
# Deterministic crash checkpoints for native qualification; never enable in shipped builds.
test-hooks = []

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
