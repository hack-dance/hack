<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 751 1058" width="751" height="1058" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="375.5" y="40.75">ForegroundLossRecovery</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M378.93,38L378.93,75"/><path class="pele-marker" d="M378.93,82L375.57,74L382.29,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M370.93,125C370.93,134.25 241.45,134.25 241.45,143.5L241.45,198"/><path class="pele-marker" d="M241.45,205L238.09,197L244.81,197Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M241.45,248L241.45,302.5C241.45,309.44 209.92,309.44 209.92,316.38L209.92,321"/><path class="pele-marker" d="M209.92,328L206.56,320L213.28,320Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M386.93,125C386.93,159 569.25,159 569.25,193L569.25,371C569.25,398.5 355.53,398.5 355.53,426L355.53,432"/><path class="pele-marker" d="M355.53,439L352.17,431L358.89,431Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M241.45,248L241.45,260C241.45,272.25 339.53,272.25 339.53,284.5L339.53,432"/><path class="pele-marker" d="M339.53,439L336.17,431L342.89,431Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M209.92,371L209.92,413.5C209.92,420.28 323.53,420.6 323.53,427.38L323.53,432"/><path class="pele-marker" d="M323.53,439L320.17,431L326.89,431Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M339.53,482L339.53,519"/><path class="pele-marker" d="M339.53,526L336.17,518L342.89,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M339.53,556C339.53,565.25 314.26,565.25 314.26,574.5L314.26,629"/><path class="pele-marker" d="M314.26,636L310.9,628L317.62,628Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M339.53,556C339.53,565.25 443.6,565.25 443.6,574.5L443.6,629"/><path class="pele-marker" d="M443.6,636L440.24,628L446.96,628Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M443.6,679L443.6,752"/><path class="pele-marker" d="M443.6,759L440.24,751L446.96,751Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M443.6,802L443.6,875"/><path class="pele-marker" d="M443.6,882L440.24,874L446.96,874Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M314.26,679L314.26,937C314.26,952.5 339.53,952.5 339.53,968L339.53,974"/><path class="pele-marker" d="M339.53,981L336.17,973L342.89,973Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M443.6,925L443.6,937C443.6,952.5 339.53,952.5 339.53,968L339.53,974"/><path class="pele-marker" d="M339.53,981L336.17,973L342.89,973Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="GraphReady-GraphReady----note-13"><path d="M299.97,226.5L343.97,226.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Inspect----note-14-Inspect"><path d="M230.08,657.5L274.08,657.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Recovered-Recovered----note-15"><path d="M495.86,903.5L539.86,903.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="200.6" y="145.5" width="81.7" height="20" rx="3" fill="var(--_bg)"/><text x="241.45" y="160.05" text-anchor="middle">GraphReady</text></g><g class="pele-edge-label" data-id="edge2"><rect x="167.37" y="280.5" width="148.17" height="20" rx="3" fill="var(--_bg)"/><text x="241.45" y="295.05" text-anchor="middle">Serve / retire intent, lock</text></g><g class="pele-edge-label" data-id="edge3"><rect x="551.16" y="216.5" width="36.18" height="20" rx="3" fill="var(--_bg)"/><text x="569.25" y="231.05" text-anchor="middle">Lose</text></g><g class="pele-edge-label" data-id="edge4"><rect x="281.34" y="339.5" width="116.38" height="20" rx="3" fill="var(--_bg)"/><text x="339.53" y="354.05" text-anchor="middle">Lose / release lock</text></g><g class="pele-edge-label" data-id="edge5"><rect x="191.82" y="391.5" width="36.18" height="20" rx="3" fill="var(--_bg)"/><text x="209.92" y="406.05" text-anchor="middle">Lose</text></g><g class="pele-edge-label" data-id="edge7"><rect x="260.58" y="576.5" width="107.36" height="20" rx="3" fill="var(--_bg)"/><text x="314.26" y="591.05" text-anchor="middle">[lostAt = Starting]</text></g><g class="pele-edge-label" data-id="edge8"><rect x="387.94" y="576.5" width="111.32" height="20" rx="3" fill="var(--_bg)"/><text x="443.6" y="591.05" text-anchor="middle">[graph was ready]</text></g><g class="pele-edge-label" data-id="edge9"><rect x="396.26" y="711.5" width="94.68" height="20" rx="3" fill="var(--_bg)"/><text x="443.6" y="726.05" text-anchor="middle">down --recover</text></g><g class="pele-edge-label" data-id="edge10"><rect x="416.84" y="822.5" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="443.6" y="837.05" text-anchor="middle">hack up</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(378.93,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="Starting" transform="translate(378.93,103.5)"><rect x="-41.84" y="-21.5" width="83.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Starting</text></g><g class="pele-node pele-state live" data-id="Serving" transform="translate(209.92,349.5)"><rect x="-41.42" y="-21.5" width="82.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Serving</text></g><g class="pele-node pele-state fail" data-id="Lost" transform="translate(339.53,460.5)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Lost</text></g><g class="pele-node pele-state-choice" data-id="advice" transform="translate(339.53,541)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state wait" data-id="Down" transform="translate(443.6,657.5)"><rect x="-35.17" y="-21.5" width="70.34" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Down</text></g><g class="pele-node pele-state wait" data-id="Up" transform="translate(443.6,780.5)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Up</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(339.53,990)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="GraphReady" transform="translate(241.45,226.5)"><rect x="-58.52" y="-21.5" width="117.04" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">GraphReady</text></g><g class="pele-node pele-state idle" data-id="Inspect" transform="translate(314.26,657.5)"><rect x="-40.18" y="-21.5" width="80.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inspect</text></g><g class="pele-node pele-state ok" data-id="Recovered" transform="translate(443.6,903.5)"><rect x="-52.26" y="-21.5" width="104.53" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Recovered</text></g><g class="pele-note" data-id="GraphReady----note-13" transform="translate(432.56,226.5)"><path d="M-88.6,-33.5H80.6L88.6,-25.5V33.5H-88.6Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M80.6,-33.5V-25.5H88.6" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Receipt ready-observed.</tspan><tspan x="0" y="4.55">A restart still holds its</tspan><tspan x="0" y="21.55">cleaned intent and its lock.</tspan></text></g><g class="pele-note" data-id="Inspect----note-14" transform="translate(127.04,657.5)"><path d="M-103.04,-33.5H95.04L103.04,-25.5V33.5H-103.04Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.04,-33.5V-25.5H103.04" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">No command can retire it</tspan><tspan x="0" y="4.55">yet (HACK-2714): none named.</tspan><tspan x="0" y="21.55">INV NoNeedlessWithholding</tspan></text></g><g class="pele-note" data-id="Recovered----note-15" transform="translate(633.16,903.5)"><path d="M-93.3,-33.5H85.3L93.3,-25.5V33.5H-93.3Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M85.3,-33.5V-25.5H93.3" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV NoRefusedAdvice</tspan><tspan x="0" y="4.55">Every named command is</tspan><tspan x="0" y="21.55">accepted, for up and restart.</tspan></text></g></g></g></svg>