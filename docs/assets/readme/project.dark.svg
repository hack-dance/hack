<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-architecture" viewBox="0 0 642 553" width="642" height="553" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="architecture" data-theme="dark"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #f3efe3;
  --pele-fg: #1d1d1b;
  --pele-muted: #3d3c37;
  --pele-line: #3d3c37;
  --pele-surface: #fbf9f1;
  --pele-surface-alt: #e8e4d8;
  --pele-border: #66625a;
  --pele-accent: #1d1d1b;
  --pele-critical: #c2461f;
  --pele-error: #c2461f;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5;
  --pele-series-2: #0e9f8a;
  --pele-series-3: #e08a00;
  --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1;
  --pele-series-6: #8a5cf6;
  --pele-series-7: #4f9d2d;
  --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4b4790;
  --hd-live-bg: #e6e4f0;
  --hd-wait: #34506e;
  --hd-wait-bg: #d3dbe5;
  --hd-ok: #3a7a2e;
  --hd-ok-bg: #e2ebd9;
  --hd-fail: #c2461f;
  --hd-fail-bg: #f5e0d6;
  --hd-idle: #8a8576;
  --hd-idle-bg: #e8e4d8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"],
[data-theme="dark"] .pele {
  --pele-bg: #11100e;
  --pele-fg: #ede8d9;
  --pele-muted: #c9c3b2;
  --pele-line: #c9c3b2;
  --pele-surface: #191815;
  --pele-surface-alt: #1b1a17;
  --pele-border: #8f897a;
  --pele-accent: #ede8d9;
  --pele-critical: #ff7a52;
  --pele-error: #ff7a52;
  --pele-series-1: #9a86ff;
  --pele-series-2: #3fd1b8;
  --pele-series-3: #ffb547;
  --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff;
  --pele-series-6: #c4a5ff;
  --pele-series-7: #8fd16a;
  --pele-series-8: #d29b7f;
  --hd-live: #a39ce0;
  --hd-live-bg: #24223a;
  --hd-wait: #9db4cf;
  --hd-wait-bg: #22303d;
  --hd-ok: #7cc25e;
  --hd-ok-bg: #1c2a17;
  --hd-fail: #ff7a52;
  --hd-fail-bg: #33190f;
  --hd-idle: #7a7466;
  --hd-idle-bg: #1b1a17;
}
/* polish */
.pele .pele-edge path {
  stroke-width: 1.4px;
  stroke-linecap: round;
}
.pele .pele-edge-label rect {
  fill: var(--pele-bg);
}
.pele .pele-edge-label text {
  fill: var(--pele-muted);
}
.pele .pele-cluster-label,
.pele .pele-title {
  letter-spacing: 0.01em;
}
.pele .pele-node > rect,
.pele .pele-node > path,
.pele .pele-node > polygon,
.pele .pele-node > circle,
.pele .pele-node > ellipse {
  stroke-width: 1.2px;
}
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect,
.pele .live > path,
.pele .live > polygon,
.pele .live > circle,
.pele .live > ellipse {
  fill: var(--hd-live-bg) !important;
  stroke: var(--hd-live) !important;
}
.pele .wait > rect,
.pele .wait > path,
.pele .wait > polygon,
.pele .wait > circle,
.pele .wait > ellipse {
  fill: var(--hd-wait-bg) !important;
  stroke: var(--hd-wait) !important;
}
.pele .ok > rect,
.pele .ok > path,
.pele .ok > polygon,
.pele .ok > circle,
.pele .ok > ellipse {
  fill: var(--hd-ok-bg) !important;
  stroke: var(--hd-ok) !important;
}
.pele .fail > rect,
.pele .fail > path,
.pele .fail > polygon,
.pele .fail > circle,
.pele .fail > ellipse {
  fill: var(--hd-fail-bg) !important;
  stroke: var(--hd-fail) !important;
}
.pele .idle > rect,
.pele .idle > path,
.pele .idle > polygon,
.pele .idle > circle,
.pele .idle > ellipse {
  fill: var(--hd-idle-bg) !important;
  stroke: var(--hd-idle) !important;
  stroke-dasharray: 4 3;
}
.pele .live .pele-label {
  fill: var(--hd-live);
  font-weight: 600;
}
.pele .wait .pele-label {
  fill: var(--hd-wait);
  font-weight: 600;
}
.pele .ok .pele-label {
  fill: var(--hd-ok);
  font-weight: 600;
}
.pele .fail .pele-label {
  fill: var(--hd-fail);
  font-weight: 600;
}
.pele .idle .pele-label {
  fill: var(--hd-idle);
}
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="321" y="40.75">What Hack runs</tspan></text><g transform="translate(24,59)"><g class="pele-clusters"><g class="pele-cluster" data-id="machine"><rect x="0" y="0" width="594" height="470" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="56.27" y="22.75" text-anchor="middle">Your machine</text></g><g class="pele-cluster" data-id="routing"><rect x="20" y="167" width="160" height="283" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="72.94" y="189.75" text-anchor="middle">Local routing</text></g><g class="pele-cluster" data-id="engine"><rect x="220" y="167" width="354" height="283" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="346.94" y="189.75" text-anchor="middle">Project engine</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round" stroke-linejoin="round"><g class="pele-edge" data-id="cli-daemon"><path d="M317,59L471,59"/><path class="pele-marker" d="M478,59L470,62.36L470,55.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="cli-compose"><path d="M293,112L293,195"/><path class="pele-marker" d="M293,202L289.64,194L296.36,194Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="compose-services"><path d="M293,296L293,331"/><path class="pele-marker" d="M293,338L289.64,330L296.36,330Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="native-services"><path d="M478,362L324,362"/><path class="pele-marker" d="M317,362L325,358.64L325,365.36Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="dns-proxy"><path d="M100,279L100,331"/><path class="pele-marker" d="M100,338L96.64,330L103.36,330Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="proxy-services"><path d="M124,362L262,362"/><path class="pele-marker" d="M269,362L261,365.36L261,358.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="cli-daemon"><rect x="355.57" y="49" width="83.87" height="20" rx="3" fill="var(--_bg)"/><text x="397.5" y="63.55" text-anchor="middle">Reads cache</text></g><g class="pele-edge-label" data-id="dns-proxy"><rect x="40.73" y="298.5" width="118.54" height="20" rx="3" fill="var(--_bg)"/><text x="100" y="313.05" text-anchor="middle">Resolves names to</text></g></g><g class="pele-nodes"><g class="pele-node pele-service" data-id="cli" transform="translate(293,35)"><rect x="-24" width="48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="68.75" text-anchor="middle">Hack CLI</text></g><g class="pele-node pele-service" data-id="daemon" transform="translate(502,35)"><rect x="-24" width="48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><svg class="pele-icon" data-icon="disk" x="-12" y="12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5zM12 6.5a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 10.5h.01M8 18h3" stroke="var(--_fg)" stroke-width="1.5"/></svg><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="67.25">Optional</tspan><tspan x="0" y="87.25">daemon</tspan></text></g><g class="pele-node pele-service" data-id="dns" transform="translate(100,202)"><rect x="-24" width="48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><svg class="pele-icon" data-icon="internet" x="-12" y="12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M3 12h18M12 3a13 13 0 0 0 0 18M12 3a1