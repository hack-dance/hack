" text-anchor="middle">Stopping</text></g><g class="pele-node pele-state" data-id=";" transform="translate(972.9,45.5)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">;</text></g><g class="pele-node pele-state" data-id="capture" transform="translate(1081.92,45.5)"><rect x="-41.01" y="-21.5" width="82.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">capture</text></g><g class="pele-node pele-state" data-id="members]" transform="translate(1212.27,45.5)"><rect x="-49.34" y="-21.5" width="98.68" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">members]</text></g><g class="pele-node pele-state" data-id="StopUnknown" transform="translate(346.07,933.5)"><rect x="-62.69" y="-21.5" width="125.38" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">StopUnknown</text></g><g class="pele-node pele-state" data-id="KillPending" transform="translate(581.2,822.5)"><rect x="-53.51" y="-21.5" width="107.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">KillPending</text></g><g class="pele-node pele-state" data-id="Starting" transform="translate(897.9,243.5)"><rect x="-41.84" y="-21.5" width="83.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Starting</text></g><g class="pele-node pele-state" data-id="Orphaned" transform="translate(506.77,588.5)"><rect x="-49.35" y="-21.5" width="98.71" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Orphaned</text></g><g class="pele-note" data-id="Starting----note-18" transform="translate(1087.87,243.5)"><path d="M-104.12,-18H96.12L104.12,-10V18H-104.12Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M96.12,-18V-10H104.12" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" x="0" y="4.55" text-anchor="middle">INV identity precedes command</text></g><g class="pele-note" data-id="Orphaned----note-19" transform="translate(711.47,588.5)"><path d="M-111.35,-33.5H103.35L111.35,-25.5V33.5H-111.35Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M103.35,-33.5V-25.5H111.35" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Unknown health retains ownership</tspan><tspan x="0" y="4.55">No exact witness refuses capture</tspan><tspan x="0" y="21.55">Live session refuses duplicate</tspan></text></g></g></g></svg>