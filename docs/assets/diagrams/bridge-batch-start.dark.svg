153.1,904.5)"><rect x="-37.67" y="-21.5" width="75.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">spawn</text></g><g class="pele-node pele-state ok" data-id="ready" transform="translate(87.44,1150.5)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state fail" data-id="failed" transform="translate(475.64,1150.5)"><rect x="-33.92" y="-21.5" width="67.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">failed</text></g><g class="pele-node pele-state fail" data-id="crashed" transform="translate(937.98,793.5)"><rect x="-42.68" y="-21.5" width="85.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">crashed</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(704.96,1249)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="intent" transform="translate(583.42,559.5)"><rect x="-34.34" y="-21.5" width="68.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">intent</text></g><g class="pele-node pele-state live" data-id="await" transform="translate(153.1,1027.5)"><rect x="-33.5" y="-21.5" width="67.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">await</text></g><g class="pele-note" data-id="intent----note-18" transform="translate(740.96,559.5)"><path d="M-79.2,-33.5H71.2L79.2,-25.5V33.5H-79.2Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M71.2,-33.5V-25.5H79.2" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV IntentBeforeEffect:</tspan><tspan x="0" y="4.55">starting is saved before</tspan><tspan x="0" y="21.55">any relay starts</tspan></text></g><g class="pele-note" data-id="await----note-19" transform="translate(313.06,1027.5)"><path d="M-82.45,-33.5H74.45L82.45,-25.5V33.5H-82.45Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M74.45,-33.5V-25.5H82.45" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Each child: lease, fence,</tspan><tspan x="0" y="4.55">then publish.</tspan><tspan x="0" y="21.55">INV NoStalePublication</tspan></text></g></g></g></svg>