<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 327 1293" width="327" height="1293" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="Recovery"><rect x="56.01" y="82" width="214.54" height="603" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M56.01,117H270.55" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="163.28" y="104.75" text-anchor="middle">Recovery</text></g><g class="pele-cluster pele-state-composite" data-id="Execution"><rect x="24" y="753" width="278.56" height="516" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M24,788H302.56" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="163.28" y="775.75" text-anchor="middle">Execution</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M163.28,38L163.28,75"/><path class="pele-marker" d="M163.28,82L159.92,74L166.64,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M201.91,147L201.91,184"/><path class="pele-marker" d="M201.91,191L198.55,183L205.27,183Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M201.91,234L201.91,271"/><path class="pele-marker" d="M201.91,278L198.55,270L205.27,270Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M201.91,321L201.91,358"/><path class="pele-marker" d="M201.91,365L198.55,357L205.27,357Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M193.91,408L193.91,421C193.91,430 149.28,430 149.28,439L149.28,445"/><path class="pele-marker" d="M149.28,452L145.92,444L152.64,444Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M149.28,495L149.28,532"/><path class="pele-marker" d="M149.28,539L145.92,531L152.64,531Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M149.28,582C149.28,597.5 193.91,597.5 193.91,613L193.91,619"/><path class="pele-marker" d="M193.91,626L190.55,618L197.27,618Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M209.91,626L209.91,613C209.91,597.5 254.55,597.5 254.55,582L254.55,452C254.55,436.5 209.91,436.5 209.91,421L209.91,415"/><path class="pele-marker" d="M209.91,408L213.27,416L206.55,416Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M163.28,685L163.28,694.63C163.28,700.81 98.34,700.81 98.34,707L98.34,731C98.34,736.63 163.28,736.63 163.28,742.25L163.28,746"/><path class="pele-marker" d="M163.28,753L159.92,745L166.64,745Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M163.28,753L163.28,743.38C163.28,737.19 228.22,737.19 228.22,731L228.22,707C228.22,701.38 163.28,701.38 163.28,695.75L163.28,692"/><path class="pele-marker" d="M163.28,685L166.64,693L159.92,693Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M155.57,818L155.57,855"/><path class="pele-marker" d="M155.57,862L152.21,854L158.93,854Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M147.57,905C147.57,920.5 83.93,920.5 83.93,936L83.93,942"/><path class="pele-marker" d="M83.93,949L80.57,941L87.29,941Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M163.57,905C163.57,920.5 227.21,920.5 227.21,936L227.21,942"/><path class="pele-marker" d="M227.21,949L223.85,941L230.57,941Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge13"><path d="M83.93,992L83.93,1029"/><path class="pele-marker" d="M83.93,1036L80.57,1028L87.29,1028Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge14"><path d="M83.93,1079C83.93,1094.5 146.14,1094.5 146.14,1110L146.14,1116"/><path class="pele-marker" d="M146.14,1123L142.78,1115L149.5,1115Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge15"><path d="M227.21,992L227.21,1079C227.21,1094.5 165,1094.5 165,1110L165,1116"/><path class="pele-marker" d="M165,1123L161.64,1115L168.36,1115Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge16"><path d="M155.57,1166L155.57,1203"/><path class="pele-marker" d="M155.57,1210L152.21,1202L158.93,1202Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge8"><rect x="44.85" y="709" width="106.98" height="20" rx="3" fill="var(--_bg)"/><text x="98.34" y="723.55" text-anchor="middle">same incarnation</text></g><g class="pele-edge-label" data-id="edge9"><rect x="171.83" y="709" width="112.77" height="20" rx="3" fill="var(--_bg)"/><text x="228.22" y="723.55" text-anchor="middle">deadline or restart</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(163.28,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state-start" data-id="Recovery_start" transform="translate(201.91,140)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Unknown" transform="translate(201.91,212.5)"><rect x="-47.26" y="-21.5" width="94.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Unknown</text></g><g class="pele-node pele-state" data-id="List" transform="translate(201.91,299.5)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">List</text></g><g class="pele-node pele-state" data-id="Inspect" transform="translate(201.91,386.5)"><rect x="-40.18" y="-21.5" width="80.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inspect</text></g><g class="pele-node pele-state" data-id="Absent" transform="translate(149.28,473.5)"><rect x="-39.35" y="-21.5" width="78.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Absent</text></g><g class="pele-node pele-state" data-id="RetrySameHandle" transform="translate(149.28,560.5)"><rect x="-77.27" y="-21.5" width="154.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">RetrySameHandle</text></g><g class="pele-node pele-state" data-id="Conflict" transform="translate(201.91,647.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Conflict</text></g><g class="pele-node pele-state-start" data-id="Execution_start" transform="translate(155.57,811)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Reserved" transform="translate(155.57,883.5)"><rect x="-48.09" y="-21.5" width="96.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Reserved</text></g><g class="pele-node pele-state" data-id="Running" transform="translate(83.93,970.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Running</text></g><g class="pele-node pele-state" data-id="SpawnFailed" transform="translate(227.21,970.5)"><rect x="-59.35" y="-21.5" width="118.7" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">SpawnFailed</text></g><g class="pele-node pele-state" data-id="Exited" transform="translate(83.93,1057.5)"><rect x="-36.84" y="-21.5" width="73.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exited</text></g><g class="pele-node pele-state" data-id="RecordResult" transform="translate(155.57,1144.5)"><rect x="-61.43" y="-21.5" width="122.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">RecordResult</text></g><g class="pele-node pele-state" data-id="Tombstone" transform="translate(155.57,1231.5)"><rect x="-53.51" y="-21.5" width="107.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Tombstone</text></g></g></svg>