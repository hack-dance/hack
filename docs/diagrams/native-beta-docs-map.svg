<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 856 373" width="856" height="373" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_N_O_0"><path d="M158,71C158,98.5 73.25,98.5 73.25,126L73.25,132"/><path class="pele-marker" d="M73.25,139L69.89,131L76.61,131Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_N_T_0"><path d="M197.17,71L197.17,132"/><path class="pele-marker" d="M197.17,139L193.81,131L200.53,131Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_N_L_0"><path d="M213.17,71C213.17,95.8 235.73,111 272.55,111C309.36,111 331.92,116.99 331.92,126.75L331.92,132"/><path class="pele-marker" d="M331.92,139L328.56,131L335.29,131Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_N_R_0"><path d="M229.17,71C229.17,88.36 280.87,99 365.23,99C449.58,99 501.29,109.26 501.29,126L501.29,132"/><path class="pele-marker" d="M501.29,139L497.92,131L504.65,131Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_I_0"><path d="M460.88,186C460.88,203.36 418.15,214 348.42,214C278.69,214 235.96,242.5 235.96,289L235.96,295"/><path class="pele-marker" d="M235.96,302L232.6,294L239.32,294Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_A_0"><path d="M476.88,186L476.88,226C476.88,257.5 453.77,257.5 453.77,289L453.77,295"/><path class="pele-marker" d="M453.77,302L450.41,294L457.13,294Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_C_0"><path d="M528.46,186L528.46,238C528.46,263.5 554.37,263.5 554.37,289L554.37,295"/><path class="pele-marker" d="M554.37,302L551.01,294L557.73,294Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_R_F_0"><path d="M544.46,186C544.46,218.24 583.1,238 646.16,238C709.21,238 747.85,257.38 747.85,289L747.85,295"/><path class="pele-marker" d="M747.85,302L744.49,294L751.21,294Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_U_D_0"><path d="M676.48,71L676.48,132"/><path class="pele-marker" d="M676.48,139L673.12,131L