[package]
name = "hack-runtime-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Private Hack v5 candidate runtime contracts and local planning"

[features]
environment-launcher = []

[lib]
name = "hack_runtime_core"

[[bin]]
name = "hack-runtime-candidate"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
base64 = "0.22"
serde_yaml_ng = "=0.10.0"
ignore = "0.4"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tar = { version = "=0.4.46", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
caseless = "=0.2.2"
unicode-normalization = "=0.1.25"
notify = "=8.2.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
strip = true
