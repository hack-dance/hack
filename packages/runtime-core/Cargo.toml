[package]
name = "hack-runtime-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Private Hack v5 candidate runtime contracts and local planning"

[features]
guest-agent-client = ["dep:hack-vm-protocol"]
native-config-plan = ["dep:hack-config-compiler"]
installed-candidate = []
environment-launcher = []
native-http-probe = []
native-stream-relay = []
storage-root-witness-tool = []
shared-mcp = []
# Test-only supervisor pause points for the real SIGKILL harness. Refused in
# optimized builds; never listed by a release build script.
node-kill-harness = []
# Test-only service operations (`test.hold`, `test.env`) for the real-process
# drain, signal and environment tests. Refused in optimized builds.
service-test-hooks = []

# `sha2` 0.11.1 raised the declared minimum from Rust 1.85 to 1.88. From 1.87 Clippy asks
# for let-chains and `is_multiple_of` in about fifty places that the upgrade does not touch.
# Rewrite those in their own change and remove these two lines with it.
[lints.clippy]
collapsible_if = "allow"
manual_is_multiple_of = "allow"

[lib]
name = "hack_runtime_core"

[[bin]]
name = "hack-runtime-candidate"
path = "src/main.rs"

[[bin]]
name = "hack-native"
path = "src/native_main.rs"
required-features = ["installed-candidate"]

[[bin]]
name = "hack-mcp-adapter"
path = "src/bin/hack-mcp-adapter.rs"
required-features = ["shared-mcp"]

[dependencies]
hack-config-compiler = { path = "../config-compiler", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Exact: the build guard in src/sha256_guard.rs rests on how this release selects its
# SHA-256 backend, and 0.11.0 still has the unsound aarch64 constant load fixed in 0.11.1.
sha2 = "=0.11.1"
hmac = "=0.13.0"
zeroize = "=1.9.0"
libc = "0.2"
base64 = "0.22"
serde_yaml_ng = "=0.10.0"
ignore = "0.4"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tar = { version = "=0.4.46", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
caseless = "=0.2.2"
unicode-normalization = "=0.1.25"
notify = "=8.2.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
ruzstd = "=0.8.2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

# The detection `sha2` itself uses, to report which SHA-256 backend a process runs.
[target.'cfg(any(target_arch = "aarch64", target_arch = "x86_64"))'.dependencies]
cpufeatures = "0.3"

[build-dependencies]
sha2 = "=0.11.1"

[profile.release]
lto = "thin"
strip = true

[[test]]
name = "node_kill_harness"
required-features = ["node-kill-harness"]

[[test]]
name = "runtime_service_hooks"
required-features = ["installed-candidate", "service-test-hooks"]

[[bin]]
name = "hack-mcp-owner"
path = "src/bin/hack-mcp-owner.rs"
required-features = ["shared-mcp"]

[[bin]]
name = "hack-storage-root-witness"
path = "src/bin/hack-storage-root-witness.rs"
required-features = ["storage-root-witness-tool"]

[dependencies.hack-vm-protocol]
path = "../hack-vm-protocol"
optional = true
