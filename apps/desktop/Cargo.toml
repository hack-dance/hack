# Separate workspace for the Hack desktop app (HACK-2214). It has its own
# lockfile and target directory so it never changes the build, lockfile or
# release of packages/runtime-core or packages/config-compiler.
[workspace]
resolver = "3"
members = ["core", "app", "ui", "term"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = { version = "=0.9.1" }
hack-desktop-core = { path = "core" }
hack-desktop-ui = { path = "ui" }
hack-desktop-term = { path = "term" }
# libghostty-vt 1.0.1 (tag vt-1.0.1). Cargo ignores build metadata in a
# requirement, so the exact pin is `=0.9.0`; the lockfile records
# `0.9.0+ghostty-vt.1.0.1`. See term/DECISION.md.
ghostty-vt = { version = "=0.9.0", default-features = false }
libc = "=0.2.191"

[profile.release]
strip = true
lto = "thin"
