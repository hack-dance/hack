name: hack-cli
services:
  docs:
    profiles: [docs]
    pull_policy: build
    build:
      context: ./docs
    init: true
    working_dir: /app
    cpus: 2
    mem_limit: 6g
    volumes:
      - ..:/app
      - docs_dependencies:/app/site/node_modules
      - docs_build:/app/site/.next
    command:
      - /bin/sh
      - -ec
      - cd site && bun install --frozen-lockfile && cd .. && bun run docs:build && cd site && bun run start -- --hostname 0.0.0.0
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=3072
    labels:
      caddy: docs.hack-cli.hack
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls: internal
    networks:
      - hack-dev
      - default
  deps:
    image: imbios/bun-node:latest
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    command: bun install
    networks:
      - default

  toolchain:
    pull_policy: build
    profiles: [toolchain]
    build:
      context: ..
      dockerfile: .hack/toolchain/Dockerfile
    init: true
    working_dir: /app
    cpus: 2
    mem_limit: 4g
    volumes:
      - ..:/app
      - toolchain_dependencies:/app/node_modules
      - toolchain_dist:/app/dist
      - toolchain_build:/build
      - toolchain_cargo:/opt/cargo/registry
    environment:
      CARGO_TARGET_DIR: /build/rust
      CARGO_BUILD_JOBS: "2"
      HACK_NO_INTERACTIVE: "1"
      HUSKY: "0"

networks:
  hack-dev:
    external: true

volumes:
  docs_dependencies:
  docs_build:
  node_modules:
  toolchain_dependencies:
  toolchain_dist:
  toolchain_build:
  toolchain_cargo:
