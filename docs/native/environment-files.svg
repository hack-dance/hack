<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 551 877" width="551" height="877" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="275.5" y="40.75">Native environment input boundaries</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_Sources_Guard_0"><path d="M281.98,106L281.98,147"/><path class="pele-marker" d="M281.98,154L278.62,146L285.34,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Guard_Normalize_0"><path d="M281.98,201L281.98,242"/><path class="pele-marker" d="M281.98,249L278.62,241L285.34,241Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Normalize_Review_0"><path d="M248.45,313C248.45,323.25 117.79,323.25 117.79,333.5L117.79,378"/><path class="pele-marker" d="M117.79,385L114.43,377L121.15,377Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Normalize_Private_0"><path d="M281.98,313L281.98,514"/><path class="pele-marker" d="M281.98,521L278.62,513L285.34,513Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Normalize_Refuse_0"><path d="M315.51,313C315.51,323.25 432.84,323.25 432.84,333.5L432.84,386.5"/><path class="pele-marker" d="M432.84,393.5L429.48,385.5L436.2,385.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Review_Private_0"><path d="M117.79,449L117.79,514"/><path class="pele-marker" d="M117.79,521L114.43,513L121.15,513Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Private_Stdin_0"><path d="M199.89,568L199.89,609"/><path class="pele-marker" d="M199.89,616L196.53,608L203.25,608Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Stdin_Guest_0"><path d="M199.89,663L199.89,704"/><path class="pele-marker" d="M199.89,711L196.53,703L203.25,703Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Guest_Launch_0"><path d="M199.89,758L199.89,799"/><path class="pele-marker" d="M199.89,806L196.53,798L203.25,798Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Normalize_Review_0"><rect x="26" y="335.5" width="183.58" height="20" rx="3" fill="var(--_bg)"/><text x="117.79" y="350.05" text-anchor="middle">names and public declarations</text></g><g class="pele-edge-label" data-id="L_Normalize_Private_0"><rect x="227.06" y="407" width="109.86" height="20" rx="3" fill="var(--_bg)"/><text x="281.98" y="421.55" text-anchor="middle">values in memory</text></g><g class="pele-edge-label" data-id="L_Normalize_Refuse_0"><rect x="340.7" y="335.5" width="184.29" height="20" rx="3" fill="var(--_bg)"/><text x="432.84" y="350.05" text-anchor="middle">private reference in public field</text></g><g class="pele-edge-label" data-id="L_Review_Private_0"><rect x="44.43" y="471.5" width="146.71" height="20" rx="3" fill="var(--_bg)"/><text x="117.79" y="486.05" text-anchor="middle">admitted active services</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Sources" transform="translate(281.98,82.5)"><rect x="-104.28" y="-23.5" width="208.56" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Files and allowed sources</text></g><g class="pele-node pele-shape-rect" data-id="Guard" transform="translate(281.98,177.5)"><rect x="-92.62" y="-23.5" width="185.24" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Guarded source reads</text></g><g class="pele-node pele-shape-rect" data-id="Normalize" transform="translate(281.98,281)"><rect x="-85.53" y="-32" width="171.06" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Shared environment</tspan><tspan x="0" y="15.25">preparation</tspan></text></g><g class="pele-node pele-shape-rect ok" data-id="Review" transform="translate(117.79,417)"><rect x="-79.27" y="-32" width="158.54" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Read-only runtime</tspan><tspan x="0" y="15.25">admission</tspan></text></g><g class="pele-node pele-shape-rect" data-id="Private" transform="translate(199.89,544.5)"><rect x="-100.54" y="-23.5" width="201.08" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Bounded private delivery</text></g><g class="pele-node pele-shape-rect fail" data-id="Refuse" transform="translate(432.84,417)"><rect x="-65.93" y="-23.5" width="131.87" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Closed refusal</text></g><g class="pele-node pele-shape-rect" data-id="Stdin" transform="translate(199.89,639.5)"><rect x="-91.78" y="-23.5" width="183.57" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Private stdin envelope</text></g><g class="pele-node pele-shape-rect" data-id="Guest" transform="translate(199.89,734.5)"><rect x="-99.28" y="-23.5" width="198.57" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Expiring guest allocation</text></g><g class="pele-node pele-shape-rect ok" data-id="Launch" transform="translate(199.89,829.5)"><rect x="-73.85" y="-23.5" width="147.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Service launcher</text></g></g></svg>