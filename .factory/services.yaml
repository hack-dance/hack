commands:
  install: bun install --frozen-lockfile
  build: bun run build
  typecheck: bun run typecheck
  check: bun run check
  test: bun run test
  db_test: bun run db:test
  runtime_up: ./dist/hack up -d
  runtime_ps: ./dist/hack ps --json
  runtime_open: ./dist/hack open --json
  runtime_doctor: ./dist/hack doctor
  runtime_down: ./dist/hack down
  lifecycle_tests: bun test tests/project-lifecycle-processes.test.ts tests/project-lifecycle-singleton.test.ts tests/project-lifecycle-hygiene.test.ts
  env_list_json: ./dist/hack env list --json
  env_tests: bun test tests/project-env-config.test.ts tests/env-command-modern.test.ts tests/run-exec-branch-default.test.ts
  setup_docs_tests: bun test tests/setup.test.ts tests/mcp.test.ts

services:
  hack-stack:
    start: ./dist/hack up -d
    stop: ./dist/hack down
    healthcheck: ./dist/hack ps --json
    depends_on: []
