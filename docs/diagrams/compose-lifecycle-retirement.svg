le="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">attached</text></g><g class="pele-node pele-state wait" data-id="commandsRetired" transform="translate(640.95,636.5)"><rect x="-76.85" y="-21.5" width="153.7" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">commandsRetired</text></g><g class="pele-node pele-state wait" data-id="escalated" transform="translate(167.36,525.5)"><rect x="-48.1" y="-21.5" width="96.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">escalated</text></g><g class="pele-node pele-state ok" data-id="wrappersRetired" transform="translate(736.72,870.5)"><rect x="-71.01" y="-21.5" width="142.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">wrappersRetired</text></g><g class="pele-node pele-state wait" data-id="wrapperEscalated" transform="translate(533.53,747.5)"><rect x="-76.02" y="-21.5" width="152.05" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">wrapperEscalated</text></g><g class="pele-node pele-state ok" data-id="retired" transform="translate(736.72,993.5)"><rect x="-37.25" y="-21.5" width="74.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retired</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(736.72,1068)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="captured" transform="translate(288.98,214.5)"><rect x="-45.18" y="-21.5" width="90.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">captured</text></g><g class="pele-node pele-state wait" data-id="signalled" transform="translate(288.98,363)"><rect x="-45.59" y="-21.5" width="91.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">signalled</text></g><g class="pele-node pele-state fail" data-id="retained" transform="translate(261.42,870.5)"><rect x="-43.1" y="-21.5" width="86.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retained</text></g><g class="pele-note" data-id="captured----note-18" transform="translate(524.55,214.5)"><path d="M-146.39,-18H138.39L146.39,-10V18H-146.39Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M138.39,-18V-10H146.39" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" x="0" y="4.55" text-anchor="middle">Capture roots only with matching PID and birth</text></g><g class="pele-note" data-id="signalled----note-17" transform="translate(720.1,363)"><path d="M-153.97,-59H145.97L153.97,-51V59H-153.97Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M145.97,-59V-51H153.97" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.95">Mux acknowledgement is not group exit</tspan><tspan x="0" y="-20.95">FIFO EOF is not group absence</tspan><tspan x="0" y="-3.95">TERM separately grouped descendants</tspan><tspan x="0" y="13.05">Revalidate member identity before TERM or KILL</tspan><tspan x="0" y="30.05">Zombie-only groups are retired</tspan><tspan x="0" y="47.05">After KILL allow 2 s to confirm retirement</tspan></text></g><g class="pele-note" data-id="retained----note-16" transform="translate(448.66,870.5)"><path d="M-100.14,-33.5H92.14L100.14,-25.5V33.5H-100.14Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M92.14,-33.5V-25.5H100.14" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.