jobs_reject_0"><rect x="592.04" y="1001.67" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="604.35" y="1016.22" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_exact_reject_0"><rect x="614.35" y="875.2" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="626.66" y="889.75" text-anchor="middle">No</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-diam" data-id="event" transform="translate(141.66,61.96)"><polygon points="0,-37.96 60.73,0 0,37.96 -60.73,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">CI event</text></g><g class="pele-node pele-shape-rect live" data-id="full" transform="translate(137.66,381.01)"><rect x="-83.85" y="-32" width="167.7" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Eight unit shards</tspan><tspan x="0" y="15.25">Four Docker shards</tspan></text></g><g class="pele-node pele-shape-diam" data-id="scope" transform="translate(416.38,224.46)"><polygon points="0,-52.55 84.08,0 0,52.55 -84.08,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Suite in scope?</text></g><g class="pele-node pele-shape-rect live" data-id="focus" transform="translate(455.88,381.01)"><rect x="-79.27" y="-32" width="158.54" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Focused tests</tspan><tspan x="0" y="15.25">Docker scope skip</tspan></text></g><g class="pele-node pele-shape-rect" data-id="aggregates" transform="translate(127.87,638.12)"><rect x="-78.03" y="-23.5" width="156.06" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Aggregate checks</text></g><g class="pele-node pele-shape-rect wait" data-i