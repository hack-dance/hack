.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Wiped</text></g><g class="pele-node pele-state idle" data-id="NewHome" transform="translate(364.97,115.5)"><rect x="-51" y="-21.5" width="102.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">NewHome</text></g><g class="pele-node pele-state idle" data-id="Off" transform="translate(364.97,259)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Off</text></g><g class="pele-node pele-state idle" data-id="Stopped" transform="translate(198.9,571.5)"><rect x="-43.94" y="-21.5" width="87.88" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stopped</text></g><g class="pele-note" data-id="NewHome----note-16" transform="translate(166.94,115.5)"><path d="M-103.03,-33.5H95.03L103.03,-25.5V33.5H-103.03Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.03,-33.5V-25.5H103.03" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV FreshNeverStartsUnasked:</tspan><tspan x="0" y="4.55">install writes the logging</tspan><tspan x="0" y="21.55">files only while on.</tspan></text></g><g class="pele-note" data-id="Off----note-14" transform="translate(530.25,259)"><path d="M-93.28,-42H85.28L93.28,-34V42H-93.28Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M85.28,-42V-34H93.28" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">No logging files, no logging</tspan><tspan x="0" y="-3.95">Docker call. hack logs reads</tspan><tspan x="0" y="13.05">container logs; --loki says</tspan><tspan x="0" y="30.05">how to turn it on.</tspan></text></g><g class="pele-note" data-id="Stopped----note-15" transform="translate(382.29,571.5)"><path d="M-95.45,-33.5H87.45L95.45,-25.5V33.5H-95.45Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.45,-33.5V-25.5H95.45" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV NoSurpriseDataLoss: off</tspan><tspan x="0" y="4.55">stops the containers and</tspan><tspan x="0" y="21.55">keeps their volumes.</tspan></text></g></g></g></svg>