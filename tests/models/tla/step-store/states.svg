<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1117 453" width="1117" height="453" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="558.5" y="40.75">StepStore · one step and its record (pc)</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M564.89,38L564.89,119.5"/><path class="pele-marker" d="M564.89,126.5L561.53,118.5L568.25,118.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M592.89,140C618.89,132 618.89,164 599.58,158.06"/><path class="pele-marker" d="M592.89,156L601.53,155.14L599.55,161.56Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M564.89,169.5L564.89,190C564.89,219.68 89.98,219.68 89.98,249.36L89.98,273.36C89.98,291.48 275.07,291.48 275.07,309.59L275.07,323.09"/><path class="pele-marker" d="M275.07,330.09L271.71,322.09L278.43,322.09Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M275.07,330.09L275.07,309.59C275.07,291.48 248.76,291.48 248.76,273.36L248.76,249.36C248.76,219.68 564.89,219.68 564.89,190L564.89,176.5"/><path class="pele-marker" d="M564.89,169.5L568.25,177.5L561.53,177.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M275.07,330.09L275.07,309.59C275.07,291.48 418.39,291.48 418.39,273.36L418.39,249.36C418.39,219.68 564.89,219.68 564.89,190L564.89,176.5"/><path class="pele-marker" d="M564.89,169.5L568.25,177.5L561.53,177.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M275.07,330.09L275.07,309.59C275.07,291.48 564.89,291.48 564.89,273.36L564.89,176.5"/><path class="pele-marker" d="M564.89,169.5L568.25,177.5L561.53,177.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M564.89,169.5L564.89,190C564.89,219.68 703.07,219.68 703.07,249.36L703.07,273.36C703.07,299.98 879.66,299.98 879.66,326.59L879.66,323.09"/><path class="pele-marker" d="M879.66,330.09L876.3,322.09L883.02,322.09Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M879.66,330.09L879.66,326.59C879.66,299.98 844.86,299.98 844.86,273.36L844.86,249.36C844.86,219.68 564.89,219.68 564.89,190L564.89,176.5"/><path class="pele-marker" d="M564.89,169.5L568.25,177.5L561.53,177.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M879.66,330.09L879.66,326.59C879.66,299.98 1039.23,299.98 1039.23,273.36L1039.23,249.36C1039.23,219.68 564.89,219.68 564.89,190L564.89,176.5"/><path class="pele-marker" d="M564.89,169.5L568.25,177.5L561.53,177.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="idle-idle----note-9"><path d="M592.89,148L751.47,148"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="effected-effected----note-10"><path d="M317.75,351.59L361.75,351.59"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="recorded----note-11-recorded"><path d="M790.07,351.59L834.07,351.59"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="552.22" y="58.5" width="25.34" height="20" rx="3" fill="var(--_bg)"/><text x="564.89" y="73.05" text-anchor="middle">Init</text></g><g class="pele-edge-label" data-id="edge1"><rect x="624.89" y="138" width="84.58" height="20" rx="3" fill="var(--_bg)"/><text x="667.18" y="152.55" text-anchor="middle">Skip [Usable]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="26" y="251.36" width="127.95" height="20" rx="3" fill="var(--_bg)"/><text x="89.98" y="265.91" text-anchor="middle">Execute [not Usable]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="173.95" y="251.36" width="149.62" height="20" rx="3" fill="var(--_bg)"/><text x="248.76" y="265.91" text-anchor="middle">Record [effect observed]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="343.57" y="251.36" width="149.64" height="20" rx="3" fill="var(--_bg)"/><text x="418.39" y="265.91" text-anchor="middle">RecordLost [effect gone]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="513.21" y="251.36" width="103.37" height="20" rx="3" fill="var(--_bg)"/><text x="564.89" y="265.91" text-anchor="middle">Crash or Reboot</text></g><g class="pele-edge-label" data-id="edge6"><rect x="636.58" y="251.36" width="132.98" height="20" rx="3" fill="var(--_bg)"/><text x="703.07" y="265.91" text-anchor="middle">Execute [RecordFirst]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="789.56" y="251.36" width="110.6" height="20" rx="3" fill="var(--_bg)"/><text x="844.86" y="265.91" text-anchor="middle">EffectAfterRecord</text></g><g class="pele-edge-label" data-id="edge8"><rect x="987.55" y="251.36" width="103.37" height="20" rx="3" fill="var(--_bg)"/><text x="1039.23" y="265.91" text-anchor="middle">Crash or Reboot</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(564.89,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="idle" transform="translate(564.89,148)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">idle</text></g><g class="pele-node pele-state live" data-id="effected" transform="translate(275.07,351.59)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">effected</text></g><g class="pele-node pele-state fail" data-id="recorded" transform="translate(879.66,351.59)"><rect x="-45.59" y="-21.5" width="91.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">recorded</text></g><g class="pele-note" data-id="idle----note-9" transform="translate(841.16,148)"><path d="M-89.69,-42H81.69L89.69,-34V42H-89.69Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M81.69,-42V-34H89.69" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">Usable: a record for the</tspan><tspan x="0" y="-3.95">current input and boot, and</tspan><tspan x="0" y="13.05">for slot and boot classes</tspan><tspan x="0" y="30.05">the output is observed</tspan></text></g><g class="pele-note" data-id="effected----note-10" transform="translate(455.04,351.59)"><path d="M-93.28,-42H85.28L93.28,-34V42H-93.28Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M85.28,-42V-34H93.28" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">INV NoUnsoundSkip: a Skip</tspan><tspan x="0" y="-3.95">has a record for its exact</tspan><tspan x="0" y="13.05">input and the output is</tspan><tspan x="0" y="30.05">present</tspan></text></g><g class="pele-note" data-id="recorded----note-11" transform="translate(720.62,351.59)"><path d="M-69.45,-25H61.45L69.45,-17V25H-69.45Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M61.45,-25V-17H69.45" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Reached only in the</tspan><tspan x="0" y="13.05">RecordFirst control</tspan></text></g></g></g></svg>