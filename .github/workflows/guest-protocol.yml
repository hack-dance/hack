name: Guest protocol
on:
  pull_request:
    paths:
      - "packages/hack-vm-protocol/**"
      - ".github/workflows/guest-protocol.yml"
  push:
    branches: [next, main]
    paths:
      - "packages/hack-vm-protocol/**"
      - ".github/workflows/guest-protocol.yml"
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model execution recovery
        working-directory: packages/hack-vm-protocol/model
        run: |
          curl --fail --location --retry 2 --max-time 60 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tlc.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tlc.jar" | sha256sum --check
          java -cp "$RUNNER_TEMP/tlc.jar" tlc2.TLC -workers 1 GuestAgent
      - name: Test bounded guest protocol
        run: |
          cargo test --locked --manifest-path packages/hack-vm-protocol/Cargo.toml
