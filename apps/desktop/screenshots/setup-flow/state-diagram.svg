 x="422.21" y="782" width="130.84" height="20" rx="3" fill="var(--_bg)"/><text x="487.63" y="796.55" text-anchor="middle">Evidence unavailable</text></g><g class="pele-edge-label" data-id="edge13"><rect x="522.92" y="687" width="80.25" height="20" rx="3" fill="var(--_bg)"/><text x="563.05" y="701.55" text-anchor="middle">Check again</text></g><g class="pele-edge-label" data-id="edge14"><rect x="309.85" y="687" width="158.27" height="20" rx="3" fill="var(--_bg)"/><text x="388.98" y="701.55" text-anchor="middle">Recheck or command exit</text></g><g class="pele-edge-label" data-id="edge15"><rect x="299.49" y="893" width="85.31" height="20" rx="3" fill="var(--_bg)"/><text x="342.14" y="907.55" text-anchor="middle">Skip this step</text></g><g class="pele-edge-label" data-id="edge16"><rect x="487.08" y="893" width="85.31" height="20" rx="3" fill="var(--_bg)"/><text x="529.74" y="907.55" text-anchor="middle">Skip this step</text></g><g class="pele-edge-label" data-id="edge17"><rect x="202.04" y="841" width="34.01" height="20" rx="3" fill="var(--_bg)"/><text x="219.04" y="855.55" text-anchor="middle">Stay</text></g><g class="pele-edge-label" data-id="edge18"><rect x="63.98" y="893" width="130.1" height="20" rx="3" fill="var(--_bg)"/><text x="129.03" y="907.55" text-anchor="middle">Two seconds or Next</text></g><g class="pele-edge-label" data-id="edge19"><rect x="627.61" y="841" width="84.58" height="20" rx="3" fill="var(--_bg)"/><text x="669.9" y="855.55" text-anchor="middle">Step remains</text></g><g class="pele-edge-label" data-id="edge20"><rect x="368.52" y="1033.5" width="126.5" height="20" rx="3" fill="var(--_bg)"/><text x="431.76" y="1048.05" text-anchor="middle">No unresolved steps</text></g><g class="pele-edge-label" data-id="edge21"><rect x="732.19" y="841" width="115.65" height="20" rx="3" fill="var(--_bg)"/><text x="790.02" y="855.55" text-anchor="middle">Reopen or regress</text></g><g class="pele-edge-label" data-id="edge22"><rect x="525.39" y="1144.5" width="73.03" height="20" rx="3" fill="var(--_bg)"/><text x="561.9" y="1159.05" text-anchor="middle">Open Hack</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-choice" data-id="Connection" transform="translate(447.03,97)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state-choice" data-id="Result" transform="translate(264.85,697)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state-choice" data-id="Progress" transform="translate(431.76,998)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state wait" data-id="NotConnected" transform="translate(434.91,259.5)"><rect x="-64.36" y="-21.5" width="128.72" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Not connected</text></g><g class="pele-node pele-state" data-id="Cli" transform="translate(562.21,481.5)"><rect x="-82.87" y="-21.5" width="165.74" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Hack CLI · required</text></g><g class="pele-node pele-state" data-id="NeedsAction" transform="translate(342.14,851)"><rect x="-59.77" y="-21.5" width="119.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Needs action</text></g><g class="pele-node pele-state" data-id="Unchecked" transform="translate(529.74,851)"><rect x="-67.87" y="-21.5" width="135.74" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Couldn’t check</text></g><g class="pele-node pele-state ok" data-id="Done" transform="translate(561.9,1102.5)"><rect x="-43.1" y="-21.5" width="86.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">All done</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(447.03,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="Offline" transform="translate(292.87,259.5)"><rect x="-37.67" y="-21.5" width="75.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Offline</text></g><g class="pele-node pele-state" data-id="Welcome" transform="translate(562.21,370.5)"><rect x="-47.25" y="-21.5" width="94.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Welcome</text></g><g class="pele-node pele-state" data-id="Checking" transform="translate(562.21,592.5)"><rect x="-47.26" y="-21.5" width="94.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Checking</text></g><g class="pele-node pele-state" data-id="Passed" transform="translate(129.03,851)"><rect x="-41.01" y="-21.5" width="82.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Passed</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(561.9,1201)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g></g></g></svg>