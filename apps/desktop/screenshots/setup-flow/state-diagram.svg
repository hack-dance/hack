 width="119.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Needs action</text></g><g class="pele-node pele-state" data-id="Unchecked" transform="translate(556.35,452.83)"><rect x="-67.87" y="-21.5" width="135.74" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Couldn’t check</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(648.19,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Welcome" transform="translate(648.19,103.5)"><rect x="-47.25" y="-21.5" width="94.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Welcome</text></g><g class="pele-node pele-state" data-id="Checking" transform="translate(648.19,214.5)"><rect x="-47.26" y="-21.5" width="94.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Checking</text></g><g class="pele-node pele-state" data-id="Passed" transform="translate(129.03,452.83)"><rect x="-41.01" y="-21.5" width="82.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Passed</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(624.73,802.83)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g></g></g></svg>