width="91.21" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stopping</text></g><g class="pele-node pele-state fail" data-id="NeedsAttention" transform="translate(384.68,605.5)"><rect x="-67.28" y="-21.5" width="134.56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:2px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">NeedsAttention</text></g><g class="pele-node pele-state fail" data-id="Unknown" transform="translate(310.14,107)"><rect x="-47.26" y="-21.5" width="94.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:2px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Unknown</text></g><g class="pele-note" data-id="Unknown----note-13" transform="translate(490.72,107)"><path d="M-89.32,-25H81.32L89.32,-17V25H-89.32Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M81.32,-25V-17H89.32" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV a failed or timed-out</tspan><tspan x="0" y="13.05">read never shows Stopped</tspan></text></g></g></g></svg>