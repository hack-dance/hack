anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_Settled_Refuse_0"><rect x="346.35" y="690.22" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="357.58" y="704.77" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_Settled_Admission_0"><rect x="573.7" y="690.22" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="587.82" y="704.77" text-anchor="middle">yes</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Down" transform="translate(234.34,56)"><rect x="-78.03" y="-32" width="156.06" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">plain down / down</tspan><tspan x="0" y="15.25">--recover</tspan></text></g><g class="pele-node pele-shape-diam" data-id="Live" transform="translate(234.34,199.75)"><polygon points="0,-63.75 102,0 0,63.75 -102,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Live stop reachable?</text></g><g class="pele-node pele-shape-rect" data-id="Stop" transform="translate(113.69,405.25)"><rect x="-89.69" y="-23.5" width="179.39" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Owner-mediated stop</text></g><g class="pele-node pele-shape-diam" data-id="Ready" transform="translate(354.98,405.25)"><polygon points="0,-69.75 111.6,0 0,69.75 -111.59,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Saved frontend Ready?</text></g><g class="pele-node pele-shape-rect" data-id="Proof" transform="translate(181.47,607.36)"><rect x="-98.86" y="-32" width="197.72" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Existing Ready recovery</tspan><tspan x="0" y="15.25">proof</tsp