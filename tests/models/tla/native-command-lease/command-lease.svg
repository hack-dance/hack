y [old, held once]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="330.18" y="254" width="154.65" height="20" rx="3" fill="var(--_bg)"/><text x="407.5" y="268.55" text-anchor="middle">OwnerYield [owner skips]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="188.37" y="306" width="130.08" height="20" rx="3" fill="var(--_bg)"/><text x="253.42" y="320.55" text-anchor="middle">CmdFinish [releases]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(644.3,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="waiting" transform="translate(644.3,103.5)"><rect x="-39.34" y="-21.5" width="78.68" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">waiting</text></g><g class="pele-node pele-state live" data-id="admitted" transform="translate(253.42,264)"><rect x="-44.76" y="-21.5" width="89.53" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">admitted</text></g><g class="pele-node pele-state idle" data-id="cancelled" transform="translate(570.51,264)"><rect x="-47.68" y="-21.5" width="95.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">cancelled</text></g><g class="pele-node pele-state fail" data-id="refused" transform="translate(763.53,264)"><rect x="-41.01" y="-21.5" width="82.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">refused</text></g><g class="pele-node pele-state ok" data-id="done" transform="translate(253.42,375)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">done</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(533.3,44