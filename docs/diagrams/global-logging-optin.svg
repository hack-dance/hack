troke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Wiped</text></g><g class="pele-node pele-state idle" data-id="NewHome" transform="translate(351.85,115.5)"><rect x="-51" y="-21.5" width="102.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">NewHome</text></g><g class="pele-node pele-state idle" data-id="ExistingHome" transform="translate(734.96,115.5)"><rect x="-62.26" y="-21.5" width="124.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ExistingHome</text></g><g class="pele-node pele-state idle" data-id="Off" transform="translate(351.85,259)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Off</text></g><g class="pele-node pele-state idle" data-id="Stopped" transform="translate(198.9,580)"><rect x="-43.94" y="-21.5" width="87.88" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:4 3;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stopped</text></g><g class="pele-note" data-id="NewHome----note-17" transform="translate(153.82,115.5)"><path d="M-103.03,-33.5H95.03L103.03,-25.5V33.5H-103.03Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.03,-33.5V-25.5H103.03" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV FreshNeverStartsUnasked:</tspan><tspan x="0" y="4.55">install writes the logging</tspan><tspan x="0" y="21.55">files only while on.</tspan></text></g><g class="pele-note" data-id="ExistingHome----note-16" transform="translate(535.78,115.5)"><path d="M-92.93,-33.5H84.93L92.93,-25.5V33.5H-92.93Z" fill="var(--_bg)" s