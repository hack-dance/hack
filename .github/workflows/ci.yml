name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      full:
        description: Run every test and release compiler host at this ref
        type: boolean
        required: true
        default: true

concurrency:
  # Let the active next run finish, including jobs waiting for macOS capacity.
  # New next pushes replace only the pending run. PRs still cancel stale runs;
  # main pushes and explicit release qualification keep unique groups.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/next' && 'push-next') || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # PRs and next pushes use trusted base policy over their actual diff.
    # Main and explicit release qualification stay full; uncertainty widens.
    # PR tiers layer over selection (scripts/ci-pr-plan.ts). Light PRs defer
    # platform pools; drafts also cannot pass the
    # required fan-in. The fan-ins report even when a scoped job does not run.
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      compiler_hosts: ${{ steps.scope.outputs.compiler_hosts }}
      compiler_rust: ${{ steps.scope.outputs.compiler_rust }}
      runtime_core: ${{ steps.scope.outputs.runtime_core }}
      suite: ${{ steps.scope.outputs.suite }}
      test_layout: ${{ steps.scope.outputs.test_layout }}
      test_focus: ${{ steps.scope.outputs.test_focus }}
      docs_site: ${{ steps.scope.outputs.docs_site }}
      draft: ${{ steps.scope.outputs.draft }}
      test_files: ${{ steps.scope.outputs.test_files }}
      test_shards: ${{ steps.scope.outputs.test_shards }}
      selection_mode: ${{ steps.scope.outputs.selection_mode }}
      ci_evidence: ${{ steps.scope.outputs.ci_evidence }}
      docker_suite: ${{ steps.scope.outputs.docker_suite }}
      defer_macos: ${{ steps.scope.outputs.defer_macos }}
      build_smoke: ${{ steps.scope.outputs.build_smoke }}
    steps:
      # A pull-request checkout is GitHub's merge commit; its first parent is
      # the base tip, so HEAD^1..HEAD is exactly the pull request's change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' && '0' || '2' }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          PR_MAC: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:mac') }}
          PR_E2E: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:e2e') }}
          CI_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          CI_READ_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        shell: bash
        run: |
          set -euo pipefail
          read_token="${CI_READ_TOKEN:-}"
          unset CI_READ_TOKEN
          # This guard is independent of the selector and its fallback list.
          full=false
          linux_rust=false
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            parents=$(git rev-list --parents -n 1 HEAD) || parents=""
            read -r tip base head extra <<< "$parents"
            if [ "$PR_FULL" = "true" ] || [ "$PR_BASE_REF" = "main" ] || [ -z "$base" ] || [ -z "$head" ] || [ -n "$extra" ]; then
              full=true
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ "$CI_REF" = "refs/heads/next" ]; then
            base="$BEFORE_SHA"
            if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]] ||
               ! git merge-base --is-ancestor "$base" HEAD; then full=true; fi
          else
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_FULL" != "true" ]; then
              echo 'Explicit CI dispatch requires full=true for release qualification.' >&2
              exit 2
            fi
            full=true
          fi
          if [ "$full" != "true" ]; then
            if ! git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/ci-paths"; then
              full=true
            else
              if [ ! -s "$RUNNER_TEMP/ci-paths" ]; then full=true; fi
              while IFS= read -r -d '' path; do
                case "$path" in
                  packages/runtime-core/*.md|packages/config-compiler/*.md) ;;
                  packages/runtime-core/*|packages/config-compiler/*|packages/relay-guest/*)
                    linux_rust=true ;;
                esac
                case "$path" in
                  scripts/*|.github/*|tests/preload.ts|tests/helpers/*|src/lib/guards.ts|src/lib/cli-result.ts|\
                  package.json|*/package.json|bun.lock|*/bun.lock|bun.lockb|*/bun.lockb|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|\
                  rust-toolchain|*/rust-toolchain|rust-toolchain.toml|*/rust-toolchain.toml|\
                  bunfig.toml|*/bunfig.toml|tsconfig*.json|*/tsconfig*.json|mise.toml)
                    full=true ;;
                esac
              done < "$RUNNER_TEMP/ci-paths"
            fi
            # Bootstrap safely when the base predates dependency selection.
            if ! git show "$base:scripts/ci-change-scope.ts" 2>/dev/null | grep -- '--repo-root=' > /dev/null; then full=true; fi
            if [ "$EVENT_NAME" = "push" ] &&
               ! git show "$base:scripts/ci-change-scope.ts" 2>/dev/null | grep -- '--base-revision=' > /dev/null; then full=true; fi
            # A cancelled/failed predecessor leaves untested changes behind.
            # Only a successful before revision is a valid selection baseline.
            if [ "$EVENT_NAME" = "push" ] && [ "$full" != "true" ]; then
              if ! GH_TOKEN="$read_token" gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=next&head_sha=$base&per_page=1" > "$RUNNER_TEMP/ci-before-run.json" ||
                 ! jq -e --arg base "$base" '.workflow_runs[0] | .head_sha == $base and .head_branch == "next" and .event == "push" and .path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/ci-before-run.json" > /dev/null; then
                full=true
              fi
            fi
          fi
          if [ "$full" = "true" ]; then
            evidence=scoped
            compiler='[{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"macos-latest","platform":"darwin","arch":"arm64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}]'
            if { [ "$EVENT_NAME" = "push" ] && [ "$CI_REF" = "refs/heads/main" ]; } || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              evidence=release-full
            fi
            if [ "$evidence" = "release-full" ] || { [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_BASE_REF" = "main" ]; }; then
              compiler='[{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"macos-latest","platform":"darwin","arch":"arm64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"},{"os":"macos-15-intel","platform":"darwin","arch":"x64"}]'
            fi
            native=true
            shards='[1,2,3,4,5,6,7,8]'
            draft=false
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_DRAFT" = "true" ]; then
              draft=true; compiler='[]'; native=false; shards='[4,5,6,7,8]'
            fi
            cat >> "$GITHUB_OUTPUT" <<EOF
          scope=full
          compiler_hosts=$compiler
          compiler_rust=true
          runtime_core=$native
          suite=true
          test_layout=pooled
          test_focus=
          docs_site=true
          draft=$draft
          test_files=
          test_shards=$shards
          selection_mode=full
          ci_evidence=$evidence
          docker_suite=true
          defer_macos=false
          build_smoke=true
          EOF
            echo 'Full selection: main, explicit dispatch, protected input, unavailable diff, or policy bootstrap. Intel runs for main and explicit dispatch.' >> "$GITHUB_STEP_SUMMARY"
          else
            # Only base code and base dependencies execute; the merge tree is data.
            policy="$RUNNER_TEMP/ci-policy"
            mkdir "$policy"
            git archive "$base" | tar -x -C "$policy"
            cd "$policy"
            bun --no-env-file install --cwd "$policy" --frozen-lockfile --ignore-scripts
            bun --no-env-file "$policy/scripts/ci-change-scope.ts" --event="$EVENT_NAME" --repo-root="$GITHUB_WORKSPACE" --ref="$CI_REF" --base-revision="$base"
            echo 'ci_evidence=scoped' >> "$GITHUB_OUTPUT"
          fi
          # The independent full guard must also qualify the heavy tiers on ready
          # PRs, including policy changes and stable-line PRs. Drafts stay light.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mac=false; e2e=false; builds=false
            if [ "$PR_DRAFT" != "true" ]; then
              if [ "$full" = "true" ] || [ "$PR_MAC" = "true" ]; then mac=true; fi
              if [ "$full" = "true" ] || [ "$PR_E2E" = "true" ]; then e2e=true; fi
              if [ "$full" = "true" ]; then builds=true; fi
            fi
            if [ "$mac" != "true" ]; then
              compiler='[]'; native=false
              if [ "$PR_DRAFT" != "true" ] && [ "$linux_rust" = "true" ]; then
                compiler='[{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}]'
                native=true
                echo 'compiler_rust=true' >> "$GITHUB_OUTPUT"
              fi
              printf 'compiler_hosts=%s\nruntime_core=%s\ntest_shards=[4,5,6,7,8]\ndefer_macos=true\n' "$compiler" "$native" >> "$GITHUB_OUTPUT"
            else
              echo 'defer_macos=false' >> "$GITHUB_OUTPUT"
              if [ "$linux_rust" = "true" ] && [ "$full" != "true" ]; then
                compiler=$(sed -n 's/^compiler_hosts=//p' "$GITHUB_OUTPUT" | tail -n 1)
                compiler=$(jq -c '. + [{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}] | unique_by(.os) | map(select(.os != "macos-15-intel"))' <<< "${compiler:-[]}")
                printf 'compiler_hosts=%s\ncompiler_rust=true\nruntime_core=true\n' "$compiler" >> "$GITHUB_OUTPUT"
              fi
            fi
            if [ "$e2e" != "true" ]; then echo 'docker_suite=false' >> "$GITHUB_OUTPUT"; fi
            printf 'build_smoke=%s\n' "$builds" >> "$GITHUB_OUTPUT"
            echo 'Light PRs defer macOS, Docker and build smoke to integration; Rust crate inputs keep Linux candidate/compiler checks. Labels opt in; protected inputs, unavailable policy/diff and ready PRs into main automatically run full tiers.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'defer_macos=false\nbuild_smoke=true\n' >> "$GITHUB_OUTPUT"
          fi

  config-compiler:
    name: Config compiler (${{ matrix.os }})
    needs: changes
    # Relevant compiler/toolchain/CI changes check native hosts on ready PRs.
    # Intel qualifies explicit release-full dispatches and stable main PRs/pushes.
    if: ${{ needs.changes.outputs.compiler_hosts != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.compiler_hosts) }}
    runs-on: ${{ matrix.os }}
    # Intel needs time for full compiler, schema and bundle verification.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 30 || 15 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/ci-dependency-cache
      - uses: ./.github/actions/ci-dependency-cache
        with:
          mode: rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Verify release host architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bun -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected compiler release host");'
      # TypeScript-only pull requests cannot change the compiler crate, which
      # reads nothing outside packages/config-compiler.
      - name: Check and test the compiler crate
        if: ${{ needs.changes.outputs.compiler_rust == 'true' }}
        run: bun run check:config-compiler && bun run test:config-compiler
      - run: bun run build:config-compiler
      # Intentionally permanent: the owner test emits closed stage tokens only, never values.
      - name: Test private file sources and owner with the matching compiler
        env:
          HACK_TEST_NATIVE_FILE_OWNER_DIAGNOSTICS: "1"
        run: bun test tests/native-compose-file-sources.test.ts tests/native-compose-file-owner.test.ts
      - name: Test explicit imported jobs and readiness with the matching compiler
        run: HACK_TEST_NATIVE_COMPILER_BINARY="$PWD/dist/hack-config-compiler" bun test tests/native-config-import-jobs.test.ts tests/native-config-import-readiness.test.ts
      # The test shards run on macOS, where this test skips. Fail if it skips here too.
      - name: Test the native Linux primary-checkout listing refusal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bun test tests/project-env-local-inheritance.test.ts --test-name-pattern 'on Linux, a primary checkout' 2>&1 | tee "$RUNNER_TEMP/listing-refusal.log"
          grep -Eq '^ *1 pass$' "$RUNNER_TEMP/listing-refusal.log"
      - name: Independently validate generated schema shape corpus
        run: |
          python3 -m venv "$RUNNER_TEMP/config-schema"
          "$RUNNER_TEMP/config-schema/bin/python" -m pip install -r scripts/config-schema-requirements.txt
          "$RUNNER_TEMP/config-schema/bin/python" scripts/check-config-schema.py
      - name: Test transport, projections and compiled bundle without host toolchains
        run: |
          bunx ultracite check scripts/build-lifecycle-supervisor.ts scripts/check-release-lifecycle-supervisor.ts scripts/build-config-compiler.ts scripts/build-release.ts scripts/check-release-config-compiler.ts scripts/check-config-compiler-cli.ts tests/config-compiler-build.test.ts tests/native-config-compiler.test.ts tests/native-config-command.test.ts tests/native-config-dto.test.ts tests/native-project-inputs.test.ts tests/native-project-inputs-acquisition-race.test.ts tests/release-download-installer.test.ts
          bun test tests/config-compiler-build.test.ts tests/native-config-compiler.test.ts tests/native-config-command.test.ts tests/native-config-dto.test.ts tests/native-project-inputs.test.ts tests/native-project-inputs-acquisition-race.test.ts
          bun run --cwd packages/cli typecheck
          bun test tests/release-download-installer.test.ts
          bun run build:release --skip-tests --out=dist/config-compiler-release
          bun scripts/check-release-config-compiler.ts dist/config-compiler-release
          bun scripts/check-release-lifecycle-supervisor.ts dist/config-compiler-release
          bun scripts/check-config-compiler-cli.ts
          bunx ultracite check scripts/check-native-env-plan-cli.ts tests/native-env-plan-transport.test.ts tests/native-env-metadata.test.ts
          bun test tests/native-env-plan-transport.test.ts tests/native-env-metadata.test.ts tests/project-env-config.test.ts tests/project-env-metadata.test.ts
          bun scripts/check-native-env-plan-cli.ts
          bunx ultracite check scripts/check-native-host-plan-cli.ts tests/native-host-plan-transport.test.ts src/lib/native-host-plan-protocol.ts
          bun test tests/native-host-plan-transport.test.ts
          bun scripts/check-native-host-plan-cli.ts
          bunx ultracite check scripts/check-native-routing-plan-cli.ts src/lib/native-routing-plan-protocol.ts src/lib/native-routing-inputs.ts tests/native-routing-plan-transport.test.ts tests/native-routing-inputs.test.ts tests/native-routing-input-race.test.ts tests/native-routing-project.test.ts
          bun test tests/native-routing-plan-transport.test.ts tests/native-routing-inputs.test.ts tests/native-routing-input-race.test.ts tests/native-routing-project.test.ts
          bun scripts/check-native-routing-plan-cli.ts
          bunx ultracite check scripts/check-native-endpoint-plan-cli.ts src/lib/native-endpoint-plan-protocol.ts tests/native-endpoint-plan-transport.test.ts tests/native-endpoint-project.test.ts
          bun test tests/native-endpoint-plan-transport.test.ts tests/native-endpoint-project.test.ts
          bun scripts/check-native-endpoint-plan-cli.ts
          bunx ultracite check scripts/check-native-process-plan-cli.ts src/lib/native-process-plan-protocol.ts tests/native-process-plan-transport.test.ts tests/native-process-project.test.ts
          bun test tests/native-process-plan-transport.test.ts tests/native-process-project.test.ts
          bun scripts/check-native-process-plan-cli.ts
          bunx ultracite check scripts/check-native-acquisition-plan-cli.ts src/lib/native-acquisition-plan-protocol.ts tests/native-acquisition-plan-transport.test.ts tests/native-acquisition-project.test.ts
          bun test tests/native-acquisition-plan-transport.test.ts tests/native-acquisition-project.test.ts
          bun scripts/check-native-acquisition-plan-cli.ts
          bunx ultracite check scripts/check-native-config-import-cli.ts tests/native-config-import-plan.test.ts tests/native-config-import-preview.test.ts
          bun test tests/native-config-import-plan.test.ts tests/native-config-import-preview.test.ts
          bun scripts/check-native-config-import-cli.ts

  state-models:
    name: Runtime state models
    needs: changes
    if: ${{ needs.changes.outputs.build_smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mise for model-helper contract tests
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.12"
          install: false
          cache: false
          env: false
      - name: Validate release workflow syntax
        run: |
          for attempt in 1 2 3; do
            if mise install actionlint@1.7.12; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          mise x actionlint@1.7.12 -- actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/release-prepare.yml .github/workflows/prerelease.yml .github/workflows/bun-crash-experiment.yml
      - name: Fetch pinned model checker
        run: curl --fail --location --retry 2 --max-time 60 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
      - name: Check evidence validation and models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: |
          python3 -m unittest discover -s .ai/skills/hack-repo-tla/tests
          bun test tests/tla-result.test.ts
          bun run test:models
      - name: Check prepared-base benchmark harness controls
        run: python3 -m unittest discover -s tests/python -p test_prepared_base_benchmark.py
      - name: Check native Compose overhead harness controls
        run: python3 -m unittest discover -s tests/python -p test_native_compose_benchmark.py
      - name: Check native frontend acceptance controls
        run: python3 -m unittest discover -s tests/python -p test_native_frontend_acceptance.py
      - name: Check application benchmark protocol controls
        run: |
          python3 scripts/check-application-benchmark-protocol.py
          python3 -m unittest discover -s tests/python -p test_application_benchmark_protocol.py

  runtime-core:
    name: Candidate core (${{ matrix.os }})
    needs: changes
    # Ready PRs follow candidate/guest/launcher/toolchain/CI inputs. Drafts
    # defer both hosts; Rust light PRs keep Linux, heavy tiers allow both hosts.
    if: ${{ needs.changes.outputs.runtime_core == 'true' }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.defer_macos == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/ci-dependency-cache
        with:
          mode: rust
          kind: candidate
          target: .hack-local/target
      - name: Cache pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/candidate-zig
          key: ci-zig-0.15.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Zig for guest helpers
        shell: bash
        run: |
          set -euo pipefail
          # Keep the mise.toml pin; avoid installer fallback to obsolete archive names
          # when the upstream download index is unavailable or malformed.
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              platform=x86_64-linux
              checksum=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
              ;;
            macOS-ARM64)
              platform=aarch64-macos
              checksum=3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
              ;;
            macOS-X64)
              platform=x86_64-macos
              checksum=375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f
              ;;
            *) echo "Unsupported Zig runner platform" >&2; exit 1 ;;
          esac
          archive="zig-${platform}-0.15.2.tar.xz"
          destination="${RUNNER_TEMP}/candidate-zig"
          mkdir -p "$destination"
          if [ ! -f "$destination/$archive" ]; then
            curl --fail --location --retry 3 "https://ziglang.org/download/0.15.2/${archive}" -o "$destination/$archive"
          fi
          (cd "$destination" && echo "$checksum  $archive" | shasum -a 256 --check)
          tar -xf "$destination/$archive" -C "$destination"
          echo "$destination/zig-${platform}-0.15.2" >> "$GITHUB_PATH"
      - name: Build and verify bundle guest
        run: |
          rustup target add aarch64-unknown-linux-musl
          sh scripts/check-native-guest.sh
      - name: Test interactive guest launcher on a real Linux PTY
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = '0.15.2'
          command -v python3
          zig test packages/runtime-core/guest/environment-launcher.zig
          zig build-exe packages/runtime-core/guest/environment-launcher.zig -target x86_64-linux-musl -O ReleaseSmall -femit-bin="$RUNNER_TEMP/interactive-environment-launcher"
          python3 tests/fixtures/environment-launcher-tty.py "$RUNNER_TEMP/interactive-environment-launcher"
      - name: Check candidate formatting
        run: cargo fmt --manifest-path packages/runtime-core/Cargo.toml --check
      - name: Lint candidate core
        run: cargo clippy --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-targets --jobs 2 -- -D warnings
      - name: Test candidate isolation contracts
        run: cargo test --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --jobs 2
      - name: Lint candidate optional features
        run: cargo clippy --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-targets --all-features --jobs 2 -- -D warnings
      - name: Test candidate optional feature contracts
        run: cargo test --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-features --jobs 2
      - name: Build and inspect local candidate
        run: |
          ./scripts/build-hack-local.sh
          ./hack-local info --json
      - name: Check release candidate carries no kill harness
        # The all-features test step built the debug candidate with node-kill-harness,
        # so its marker proves this grep can see the harness when it is compiled in.
        run: |
          marker=node-kill-harness-
          LC_ALL=C grep -q -a "$marker" .hack-local/target/debug/hack-runtime-candidate
          if LC_ALL=C grep -q -a "$marker" .hack-local/target/release/hack-runtime-candidate; then
            echo "release hack-runtime-candidate contains the test-only kill harness" >&2
            exit 1
          fi

  docs-site:
    # The documentation corpus checks, the site build Vercel runs, and an HTTP
    # smoke of that build. `docs site` is a required check, so the job always
    # runs and reports: its work happens when the change touches docs/, site/,
    # scripts/docs/ or this workflow (and on every push), and it passes as a
    # no-op otherwise, instead of leaving a skipped required check.
    name: docs site
    needs: changes
    # Like `test`: report even when the scope job did not succeed, so a failed
    # scope fails this check instead of leaving it skipped.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Report scope
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_SITE: ${{ needs.changes.outputs.docs_site }}
        run: |
          if [ "$CHANGES_RESULT" = "cancelled" ]; then
            echo "change scope was cancelled without failure; nothing to build"
            exit 0
          fi
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change scope did not succeed (result: $CHANGES_RESULT)"
            exit 1
          fi
          if [ "$DOCS_SITE" = "true" ]; then
            echo "docs or site inputs changed: checking the corpus and building the site"
          else
            echo "no docs or site inputs changed: nothing to build"
          fi
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
      - run: bun install --frozen-lockfile
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
        working-directory: site
      - run: bun run docs:prepare
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
      - run: bun run docs:check
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
      - run: bun run docs:typecheck
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
      # DOM test of the full-size diagram control (open, zoom, close).
      - run: bun run --cwd site test
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
      # The Vercel build command (site/vercel.json) after docs:prepare.
      - run: bun run --cwd site build
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
      - name: HTTP smoke of the production build
        if: ${{ needs.changes.outputs.docs_site == 'true' }}
        run: |
          bun run --cwd site start --port 3411 >"$RUNNER_TEMP/docs-site.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3411/docs; then
              break
            fi
            sleep 1
          done
          if ! bun run docs:smoke http://127.0.0.1:3411; then
            cat "$RUNNER_TEMP/docs-site.log"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@v1
        with:
          version: 8.30.1
          run: 'false'
      - name: Scan checked-out commit history
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
        run: |
          "$GITLEAKS_BIN" git . \
            --config .gitleaks.toml \
            --redact \
            --log-opts='--full-history --diff-filter=tuxdb HEAD' \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

  runtime-images:
    needs: changes
    if: ${{ needs.changes.outputs.docker_suite == 'true' && needs.changes.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build full runtime image
        run: |
          bun run scripts/build-node-runtime-image.ts \
            --variant node-runtime \
            --platform linux/amd64 \
            --tag hack-runtime-ci:full
      - name: Smoke full runtime image
        run: |
          docker run --rm --entrypoint hack hack-runtime-ci:full --help >/tmp/hack-full-help.txt
          grep -q "hack" /tmp/hack-full-help.txt
      - name: Build slim runtime image
        run: |
          bun run scripts/build-node-runtime-image.ts \
            --variant slim \
            --platform linux/amd64 \
            --tag hack-runtime-ci:slim
      - name: Smoke slim runtime image defaults
        run: |
          docker run --rm --entrypoint sh hack-runtime-ci:slim -lc 'command -v bun >/dev/null && command -v hack >/dev/null && test -x /usr/local/bin/hack-lifecycle-supervisor && test "${HACK_EXECUTION_MODE}" = "codex" && test "${HACK_DAEMON_DISABLE_DOCKER_EVENTS}" = "1" && hack --help >/tmp/hack-help.txt && grep -q "Usage:" /tmp/hack-help.txt'
      - name: Smoke slim runtime mounted-project env flow
        run: bash scripts/portable-container-smoke.sh hack-runtime-ci:slim linux/amd64

  docker-e2e-shard:
    # One deterministic slice of the default e2e set per runner (tests/e2e/shard.ts).
    name: docker-e2e shard ${{ matrix.shard }}/4
    needs: changes
    if: ${{ needs.changes.outputs.docker_suite == 'true' && needs.changes.outputs.draft != 'true' }}
    strategy:
      # Let every shard finish so one failure still reports the other scenarios.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # The serial job measured 85-125 min on the shared Blacksmith engine. Each shard
    # keeps that whole budget, so it bounds a hung engine, not a slow pass.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create isolated Hack network
        run: docker network create --subnet 172.30.0.0/16 hack-dev
      # The Linux test pool may lack tmux and skip this file.
      # Require one real pass here, where tmux is explicitly installed.
      - name: Verify private tmux input on Linux
        if: matrix.shard == 4
        shell: bash
        run: |
          command -v tmux
          SHELL=/bin/bash bun test tests/tmux-private-input.test.ts 2>&1 | tee "$RUNNER_TEMP/tmux-private-input.log"
          grep -Eq '^ *1 pass$' "$RUNNER_TEMP/tmux-private-input.log"
      - name: Prepare offline cache fixture images
        run: |
          docker pull alpine:3.20
          docker pull alpine:3.22
          docker pull node:24.22.1-bookworm-slim
          # Also the cataloged native file and storage helper image
          # (src/lib/native-compose-storage-witness-docker-artifact.ts).
          docker pull oven/bun:1.4.4-slim
          docker pull postgres:17.6-alpine
          docker pull lucaslorentz/caddy-docker-proxy:2.10.0-alpine
      - uses: dtolnay/rust-toolchain@1.97.1
      # Each shard builds its own binaries (about 20 s), so the hashes it records match what it runs.
      - name: Build current-branch CLI and native config compiler
        run: |
          bun run build
          bun run build:config-compiler
      # The one-off compiler checks run once, on the last shard, off the longest shard's path.
      - name: Verify literal argv through real compiler and Compose normalization
        if: matrix.shard == 4
        run: HACK_TEST_COMPOSE_CONFIG=1 bun test tests/native-compose-renderer-config.test.ts --test-name-pattern '^legacy dollar-pair argv matches real compiler plan and Compose normalization$'
      - name: Verify Compose string argv through real compiler and Compose normalization
        if: matrix.shard == 4
        run: HACK_TEST_COMPOSE_CONFIG=1 bun test tests/native-compose-renderer-config.test.ts --test-name-pattern '^(Compose string words match real compiler and renderer exec argv for selected profiles|raw unpaired dollars cannot become accepted pairs after Compose word splitting)$'
      - name: Verify owned bridge policy and aliases through real compiler and Compose normalization
        if: matrix.shard == 4
        run: HACK_TEST_COMPOSE_CONFIG=1 bun test tests/native-compose-renderer-config.test.ts --test-name-pattern '^one authored bridge keeps internal policy and static aliases through compiler and Compose normalization$'
      # Real Docker CLI against two fake Unix engines (isolated HOME and config; no real engine).
      - name: Verify Docker context endpoint selection against the real Docker CLI
        if: matrix.shard == 4
        run: HACK_TEST_DOCKER_CLI=1 bun test tests/docker-context.test.ts
      # Real Compose parse of every recipe and config example (no engine; dead DOCKER_HOST).
      - name: Verify recipe and config examples with docker compose config
        if: matrix.shard == 4
        shell: bash
        run: |
          HACK_TEST_COMPOSE_CONFIG=1 bun test tests/recipe-examples.test.ts --test-name-pattern '^docker compose config accepts every example Compose file$' 2>&1 | tee "$RUNNER_TEMP/recipe-examples-compose.log"
          grep -Eq '^ *1 pass$' "$RUNNER_TEMP/recipe-examples-compose.log"
      - name: Run local and Docker E2E shard
        env:
          HACK_E2E_PROCESS_POLICY_REFUSAL_CAPSULE: "1"
          HACK_E2E_CAPSULE_DIR: ${{ runner.temp }}/process-policy-capsules
          HACK_E2E_CLI_BIN: ${{ github.workspace }}/dist/hack
          HACK_E2E_SHARD: ${{ matrix.shard }}/4
        run: |
          HACK_E2E_DOCKER_HOST="${DOCKER_HOST:-$(docker context inspect --format '{{.Endpoints.docker.Host}}')}"
          HACK_E2E_NETWORK_SOURCE_REVISION="$(git rev-parse HEAD)"
          HACK_E2E_NETWORK_CLI_SHA256="$(sha256sum dist/hack | cut -d ' ' -f1)"
          HACK_E2E_NETWORK_COMPILER_SHA256="$(sha256sum dist/hack-config-compiler | cut -d ' ' -f1)"
          HACK_E2E_COMPOSE_PLUGIN_PATH="$(docker info --format '{{json .ClientInfo.Plugins}}' | bun -e 'import { realpath } from "node:fs/promises"; const value = await Bun.stdin.json(); const plugin = Array.isArray(value) ? value.find((entry) => entry && Object.hasOwn(entry, "Name") && entry.Name === "compose") : null; if (!(plugin && Object.hasOwn(plugin, "Path") && typeof plugin.Path === "string" && plugin.Path.startsWith("/"))) throw new Error("Installed Compose plugin path is unavailable"); process.stdout.write(await realpath(plugin.Path));')"
          HACK_E2E_COMPOSE_PLUGIN_SHA256="$(sha256sum "$HACK_E2E_COMPOSE_PLUGIN_PATH" | cut -d ' ' -f1)"
          export HACK_E2E_DOCKER_HOST HACK_E2E_NETWORK_SOURCE_REVISION HACK_E2E_NETWORK_CLI_SHA256 HACK_E2E_NETWORK_COMPILER_SHA256 HACK_E2E_COMPOSE_PLUGIN_PATH HACK_E2E_COMPOSE_PLUGIN_SHA256
          HACK_E2E_REQUIRE_DOCKER=1 HACK_E2E_REQUIRE_TMUX=1 bun run test:e2e:local:docker --shard="$HACK_E2E_SHARD"
      - name: Preserve process-policy capsule and startup diagnostic
        # Closed fixed-field JSON only (counts, enums, booleans); the gh log viewer truncates it inline.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-policy-capsules-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/process-policy-capsules
          if-no-files-found: ignore
          retention-days: 14
      - name: Smoke container resource metadata without optional fields
        if: matrix.shard == 4
        run: |
          probe_id=$(docker create --network none --read-only alpine:3.20 true)
          trap 'docker rm -f "$probe_id" >/dev/null' EXIT
          bun scripts/inspect-container-resources.ts --container "$probe_id" > "$RUNNER_TEMP/resource-probe.json"
          bun -e 'const r = await Bun.stdin.json(); if (r.probeStatus !== "not_running" || r.container.healthcheckIntervalNs !== null || r.container.writableLayerBytes !== null) throw new Error("Invalid optional resource metadata");' < "$RUNNER_TEMP/resource-probe.json"
          bun scripts/inspect-container-resources.ts --container "$probe_id" --storage > "$RUNNER_TEMP/resource-probe.json"
          bun -e 'const r = await Bun.stdin.json(); if (typeof r.container.writableLayerBytes !== "number") throw new Error("Missing writable-layer accounting");' < "$RUNNER_TEMP/resource-probe.json"

  docker-e2e:
    # The single docker-e2e signal for the prerelease exact-head gate and branch checks.
    # It always runs: incomplete evidence fails, and shards skipped
    # because the change scope excludes the suite pass; failures, a failed scope
    # and any other skip still fail. Prerelease gates separately require every shard.
    needs: [changes, docker-e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject failed or skipped docker-e2e shards
        env:
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          SUITE: ${{ needs.changes.outputs.docker_suite }}
          SHARD_RESULT: ${{ needs.docker-e2e-shard.result }}
        run: |
          if [ "$PR_DRAFT" = "true" ]; then
            echo "skipped: draft — full pull-request evidence is required before merge"
            exit 1
          fi
          if [ "$CHANGES_RESULT" = "cancelled" ]; then
            echo "change scope was cancelled; evidence is incomplete"
            exit 1
          fi
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change scope did not succeed (result: $CHANGES_RESULT)"
            exit 1
          fi
          if [ "$SUITE" = "false" ] && [ "$SHARD_RESULT" = "skipped" ]; then
            echo "docker-e2e is out of scope for this pull request (scope: $SCOPE)"
            exit 0
          fi
          if [ "$SHARD_RESULT" = "cancelled" ]; then
            echo "shards were cancelled; evidence is incomplete"
            exit 1
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "docker-e2e shards did not all succeed (result: $SHARD_RESULT)"
            exit 1
          fi

  test-shard:
    # One deterministic slice of the `bun run test` file set per runner
    # (scripts/test-shard-plan.ts, HACK-1381). The serial job took 37-42 min and
    # reached the 60 min limit on slow runners; each file now runs in its own
    # `bun test` process with a start/result line, so a hang names its file.
    name: test shard ${{ matrix.shard }}/8
    needs: changes
    if: ${{ needs.changes.outputs.suite == 'true' }}
    strategy:
      # Let every shard finish so one failure still reports the other files.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.test_shards) }}
    # `pooled` (pushes and pull requests, HACK-2028): shards 1-3 run the
    # selected platform-sensitive files on macOS and shards 4-8 the rest on Linux
    # (POOLED_MACOS_SHARDS in scripts/test-shard-plan.ts; the runner refuses a
    # shard on the wrong host). Light PRs defer the macOS pool and report its
    # selected paths; labels opt into tiers. Integration job names stay unchanged.
    runs-on: ${{ (needs.changes.outputs.draft == 'true' || (needs.changes.outputs.test_layout == 'pooled' && matrix.shard > 3)) && 'ubuntu-latest' || 'macos-15' }}
    # Eight shards keep the slower GitHub-hosted macOS jobs below the existing
    # 30 min file-runner deadline; the 40 min job limit bounds a hung runner.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Cache Bun downloads
        uses: ./.github/actions/ci-dependency-cache
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The one-off checks and builds run once, on shard 8 (Linux when pooled).
      - name: Report selected macOS files deferred to the integration run
        if: matrix.shard == 8 && needs.changes.outputs.defer_macos == 'true'
        env:
          HACK_TEST_SELECTION: ${{ needs.changes.outputs.test_files }}
        run: bun scripts/test-shard.ts report-deferred
      - name: Typecheck (Turbo)
        if: matrix.shard == 8
        run: bun run turbo:typecheck
      - name: Privacy check
        if: matrix.shard == 8
        run: bun run privacy:check
      - name: Quality checks (Turbo)
        if: matrix.shard == 8
        run: bun run turbo:check
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Cache matching compiler build
        uses: ./.github/actions/ci-dependency-cache
        with:
          mode: rust
      - name: Prepare matching compiler for private file owner tests
        run: bun run build:config-compiler
      # Runs check:bun-version and test:preflight as `bun run test` does, then
      # verifies that the shards (and, when pooled, the two pools) cover the
      # full test file set, the both-pool files once on each host.
      - name: Tests (shard)
        env:
          HACK_TEST_SHARD: ${{ matrix.shard }}/8
          HACK_TEST_LAYOUT: ${{ needs.changes.outputs.test_layout }}
          HACK_TEST_SELECTION: ${{ needs.changes.outputs.test_files }}
          HACK_TEST_DRAFT: ${{ needs.changes.outputs.draft }}
          HACK_TEST_DEFER_MACOS: ${{ needs.changes.outputs.defer_macos }}
        run: bun scripts/test-shard.ts run --shard="$HACK_TEST_SHARD" --layout="$HACK_TEST_LAYOUT" --durations-out="$RUNNER_TEMP/test-shard-durations.json"
      - name: Preserve measured file durations
        # Per-file seconds only; refresh scripts/test-shard-durations.json with
        # `bun scripts/test-shard.ts update-durations`.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-shard-durations.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build CLI
        if: matrix.shard == 8 && needs.changes.outputs.build_smoke == 'true'
        run: bun run build
      - name: Build release smoke (no tests)
        if: matrix.shard == 8 && needs.changes.outputs.build_smoke == 'true'
        run: bun run build:release --skip-tests --no-clean --out=dist/release-ci

  test-focus:
    # Retain this exact-head required job while PR subsets move to test-shard.
    # It passes as a no-op when no legacy focus is requested. The prerelease
    # gate requires every push job to succeed without skips.
    name: test focus
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Report scope
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          TEST_FOCUS: ${{ needs.changes.outputs.test_focus }}
        run: |
          echo "scope ${SCOPE}; focused tests: ${TEST_FOCUS:-none, the bun shards run}"
      - name: Checkout
        if: ${{ needs.changes.outputs.test_focus != '' }}
        uses: actions/checkout@v4
      - name: Setup Bun
        if: ${{ needs.changes.outputs.test_focus != '' }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        if: ${{ needs.changes.outputs.test_focus != '' }}
        run: bun install --frozen-lockfile
      - name: Privacy check
        if: ${{ needs.changes.outputs.test_focus != '' }}
        run: bun run privacy:check
      - if: ${{ needs.changes.outputs.test_focus != '' }}
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Prepare matching compiler for private file owner tests
        if: ${{ needs.changes.outputs.test_focus != '' }}
        run: bun run build:config-compiler
      - name: Focused tests
        if: ${{ needs.changes.outputs.test_focus != '' }}
        env:
          TEST_FOCUS: ${{ needs.changes.outputs.test_focus }}
        run: bun scripts/test-shard.ts run --focus="$TEST_FOCUS"

  test:
    # The required `test` check (repository ruleset) for `next` and `main`. It
    # always runs. When the change scope runs the suite, every bun shard must
    # succeed; when it runs a focus instead, the focused job must. A cancelled
    # result fails, as do a failure, a failed scope or any skip of
    # the job in scope still fails rather than surfacing as a skipped check.
    needs: [changes, test-shard, test-focus, linux-process-lifetime]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject failed or skipped test shards
        env:
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          SUITE: ${{ needs.changes.outputs.suite }}
          TEST_FOCUS: ${{ needs.changes.outputs.test_focus }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
          FOCUS_RESULT: ${{ needs.test-focus.result }}
          LIFETIME_ENABLED: ${{ needs.changes.outputs.docker_suite }}
          LIFETIME_RESULT: ${{ needs.linux-process-lifetime.result }}
        run: |
          if [ "$PR_DRAFT" = "true" ]; then
            echo "skipped: draft — full pull-request evidence is required before merge"
            exit 1
          fi
          if [ "$CHANGES_RESULT" = "cancelled" ]; then
            echo "change scope was cancelled; evidence is incomplete"
            exit 1
          fi
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change scope did not succeed (result: $CHANGES_RESULT)"
            exit 1
          fi
          if [ "$FOCUS_RESULT" != "success" ]; then
            echo "test focus did not succeed (result: $FOCUS_RESULT)"
            exit 1
          fi
          case "$LIFETIME_ENABLED:$LIFETIME_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Linux process lifetime evidence did not match its plan (enabled: $LIFETIME_ENABLED, result: $LIFETIME_RESULT)" >&2; exit 1 ;;
          esac
          if [ "$SUITE" != "true" ]; then
            if [ -z "$TEST_FOCUS" ]; then
              echo "scope $SCOPE runs neither the bun shards nor a focus"
              exit 1
            fi
            SHARD_RESULT="$FOCUS_RESULT"
            echo "bun shards are out of scope ($SCOPE); gating on the focused tests ($TEST_FOCUS)"
          fi
          if [ "$SHARD_RESULT" = "cancelled" ]; then
            echo "shards were cancelled; evidence is incomplete"
            exit 1
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "test shards did not all succeed (result: $SHARD_RESULT)"
            exit 1
          fi
      - name: selection_mode=${{ needs.changes.outputs.selection_mode }}
        env:
          SELECTION_MODE: ${{ needs.changes.outputs.selection_mode }}
        run: |
          case "$SELECTION_MODE" in
            full|selected) printf 'selection_mode=%s\n' "$SELECTION_MODE" ;;
            *) echo 'Missing selection evidence' >&2; exit 1 ;;
          esac
      - name: ci_evidence=${{ needs.changes.outputs.ci_evidence }}
        env:
          CI_EVIDENCE: ${{ needs.changes.outputs.ci_evidence }}
          SELECTION_MODE: ${{ needs.changes.outputs.selection_mode }}
        run: |
          case "$CI_EVIDENCE:$SELECTION_MODE" in
            release-full:full|scoped:full|scoped:selected) printf 'ci_evidence=%s\n' "$CI_EVIDENCE" ;;
            *) echo 'Invalid release CI evidence' >&2; exit 1 ;;
          esac

  linux-process-lifetime:
    needs: changes
    if: ${{ needs.changes.outputs.docker_suite == 'true' && needs.changes.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Require native regression tools
        run: |
          command -v python3
          command -v lsof
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run process and terminal regressions
        run: bun test tests/daemon-command.test.ts tests/daemon-orphan.test.ts tests/host-exec-lifetime.test.ts tests/host-exec-tty.test.ts tests/shell-observation.test.ts tests/shared-host-lifecycle.test.ts tests/project-shared-helpers.test.ts
      # The daemon install flows run the real CLI, which checks the host's own
      # system PATH (and what /usr/bin links into). GitHub's Ubuntu image
      # leaves trees under /usr and /opt writable by everyone, so this one
      # job makes them owner-writable, as on a stock install, and requires
      # the flows to run: the protected system directory decision then has a
      # hosted Linux check (HACK-2052). The regular test shards skip them.
      - name: Harden runner system trees for the daemon install flows
        run: |
          sudo find /usr /opt -xdev -perm /022 \( -type f -o \( -type d ! -perm -1000 \) \) -print0 > "$RUNNER_TEMP/writable.list"
          echo "removing group/other write from $(tr -cd '\0' < "$RUNNER_TEMP/writable.list" | wc -c) entries"
          sudo xargs -0 -r chmod go-w < "$RUNNER_TEMP/writable.list"
          # Files there owned by another regular account (uid >= UID_MIN, as
          # the product's isSystemAccount draws the line; such as a uid 1000
          # geckodriver reached from /usr/bin) go to root, as on a stock
          # install. System accounts' files stay: the protected system
          # directory rule must still meet them. Links are changed
          # themselves, never followed.
          uid_min=$(awk '$1 == "UID_MIN" { print $2 }' /etc/login.defs 2>/dev/null)
          uid_min=${uid_min:-1000}
          sudo find /usr /opt -xdev -uid +$((uid_min - 1)) ! -uid "$(id -u)" -print0 > "$RUNNER_TEMP/foreign.list"
          echo "giving $(tr -cd '\0' < "$RUNNER_TEMP/foreign.list" | wc -c) entries owned by other regular accounts (uid >= $uid_min) to root"
          sudo xargs -0 -r chown -h root < "$RUNNER_TEMP/foreign.list"
      - name: Run daemon install flows
        env:
          HACK_TEST_REQUIRE_INSTALL_FLOWS: "1"
        run: bun test tests/daemon-systemd-cli.test.ts
      - name: Mount a full-disk and a quota filesystem
        # Real small filesystems for the background command journal: a
        # size-limited tmpfs (ENOSPC) and a tmpfs with a user block quota
        # (EDQUOT, tmpfs quotas need Linux 6.6+). Both belong to the runner
        # user; mounting needs root, so this only runs here.
        run: |
          small="$RUNNER_TEMP/hack-small-fs"
          quota="$RUNNER_TEMP/hack-quota-fs"
          mkdir -p "$small" "$quota"
          sudo mount -t tmpfs -o "size=4m,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$small"
          sudo mount -t tmpfs -o "size=64m,mode=0700,uid=$(id -u),gid=$(id -g),usrquota,usrquota_block_hardlimit=2m" tmpfs "$quota"
          echo "HACK_TEST_SMALL_FS=$small" >> "$GITHUB_ENV"
          echo "HACK_TEST_QUOTA_FS=$quota" >> "$GITHUB_ENV"
      - name: Run background command full-disk and quota regressions
        run: bun test tests/background-command-full-disk.test.ts
