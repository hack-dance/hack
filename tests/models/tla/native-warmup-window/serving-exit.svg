></g><g class="pele-note" data-id="exited----note-10" transform="translate(269.77,329)"><path d="M-98.7,-25H90.7L98.7,-17V25H-98.7Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M90.7,-25V-17H98.7" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV NoticedInTime: 2 s bound</tspan><tspan x="0" y="13.05">Caddy stops with authority</tspan></text></g></g></g></svg>