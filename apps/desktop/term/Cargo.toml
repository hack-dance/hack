[package]
name = "hack-desktop-term"
description = "Terminal surface for the Hack desktop app: app-owned PTY, read-only byte streams, libghostty-vt emulation drawn with GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# libghostty-vt emulation and the GPUI terminal view. Off by default until
# desktop CI provides Zig 0.17.1 on Linux (see DECISION.md, "Build and CI").
ghostty = ["dep:ghostty-vt", "dep:gpui-kit", "dep:sha2", "dep:ttf-parser"]
# Offscreen PNG capture of the spike window (GPUI test-support).
screenshots = ["ghostty", "gpui-kit/test-support", "dep:image"]

[dependencies]
libc.workspace = true
ghostty-vt = { workspace = true, optional = true }
gpui-kit = { workspace = true, optional = true }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }
# Reads glyph outlines from the embedded symbols font. Already in the
# lockfile through GPUI's Linux text system.
ttf-parser = { version = "=0.25.1", optional = true, default-features = false, features = ["std"] }

[build-dependencies]
# Verifies the embedded symbols font against its pinned sha256. Already in
# the lockfile through ghostty-vt-sys's build script.
sha2 = { version = "=0.10.9", optional = true }

# Needs GPUI's real platform, which macOS creates only on the main thread:
# its own `main` runs the cases there (see the file).
[[test]]
name = "render"
harness = false
required-features = ["screenshots"]

[[example]]
name = "term_spike"
required-features = ["ghostty"]

[[example]]
name = "term_bench"
required-features = ["screenshots"]
