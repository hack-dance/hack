<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 581 658" width="581" height="658" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="40.75">Recovery history · bounded</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M271.82,38L271.82,111"/><path class="pele-marker" d="M271.82,118L268.46,110L275.18,110Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M271.82,161L271.82,173C271.82,207 91.06,207 91.06,241L91.06,308C91.06,335.5 263.82,335.5 263.82,363L263.82,369"/><path class="pele-marker" d="M263.82,376L260.46,368L267.18,368Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M271.82,161L271.82,173C271.82,180.57 452.58,183.93 452.58,191.5L452.58,246"/><path class="pele-marker" d="M452.58,253L449.22,245L455.94,245Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M452.58,296L452.58,350.5C452.58,354.96 279.82,359.92 279.82,364.38L279.82,369"/><path class="pele-marker" d="M279.82,376L276.46,368L283.18,368Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M271.82,419L271.82,487L271.82,483.5"/><path class="pele-marker" d="M271.82,490.5L268.46,482.5L275.18,482.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M271.82,533.5L271.82,574"/><path class="pele-marker" d="M271.82,581L268.46,573L275.18,573Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="count-count----note-6"><path d="M306.17,139.5L350.17,139.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="prune----note-7-prune"><path d="M373.4,274.5L417.4,274.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="recovered-recovered----note-8"><path d="M321.17,512L365.17,512"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="206.41" y="58.5" width="130.81" height="20" rx="3" fill="var(--_bg)"/><text x="271.82" y="73.05" text-anchor="middle">prior record complete</text></g><g class="pele-edge-label" data-id="edge1"><rect x="26" y="264.5" width="130.12" height="20" rx="3" fill="var(--_bg)"/><text x="91.06" y="279.05" text-anchor="middle">[fewer than 8 proven]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="419.67" y="193.5" width="65.81" height="20" rx="3" fill="var(--_bg)"/><text x="452.58" y="208.05" text-anchor="middle">[8 proven]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="382.47" y="328.5" width="140.22" height="20" rx="3" fill="var(--_bg)"/><text x="452.58" y="343.05" text-anchor="middle">oldest proven removed</text></g><g class="pele-edge-label" data-id="edge4"><rect x="210.74" y="439.5" width="122.15" height="20" rx="3" fill="var(--_bg)"/><text x="271.82" y="454.05" text-anchor="middle">record moved aside</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(271.82,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="archive" transform="translate(271.82,397.5)"><rect x="-40.17" y="-21.5" width="80.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">archive</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(271.82,590)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="count" transform="translate(271.82,139.5)"><rect x="-34.34" y="-21.5" width="68.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">count</text></g><g class="pele-node pele-state" data-id="prune" transform="translate(452.58,274.5)"><rect x="-35.18" y="-21.5" width="70.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">prune</text></g><g class="pele-node pele-state ok" data-id="recovered" transform="translate(271.82,512)"><rect x="-49.34" y="-21.5" width="98.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">recovered</text></g><g class="pele-note" data-id="count----note-6" transform="translate(453.56,139.5)"><path d="M-103.4,-33.5H95.4L103.4,-25.5V33.5H-103.4Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.4,-33.5V-25.5H103.4" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Counts only regular files named</tspan><tspan x="0" y="4.55">for their own digest whose</tspan><tspan x="0" y="21.55">contents prove them finished.</tspan></text></g><g class="pele-note" data-id="prune----note-7" transform="translate(279.76,274.5)"><path d="M-93.64,-33.5H85.64L93.64,-25.5V33.5H-93.64Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M85.64,-33.5V-25.5H93.64" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Same locks as the recovery;</tspan><tspan x="0" y="4.55">the file removed is the file</tspan><tspan x="0" y="21.55">read (device and inode).</tspan></text></g><g class="pele-note" data-id="recovered----note-8" transform="translate(448.34,512)"><path d="M-83.18,-25H75.18L83.18,-17V25H-83.18Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M75.18,-25V-17H83.18" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Before: at 8 the recovery</tspan><tspan x="0" y="13.05">refused for ever.</tspan></text></g></g></g></svg>