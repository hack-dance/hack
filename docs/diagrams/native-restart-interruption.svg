 prepared intent and interrupted-stop guidance</text></g></g><g class="pele-notes" font-size="13" fill="var(--_a)" stroke="var(--_b)"><g class="pele-note" data-id="i5"><rect x="275.3" y="201" width="334.3" height="32" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" x="442.45" y="221.55" text-anchor="middle">Previously abort was false and generic failure escaped</text></g><g class="pele-note" data-id="i10"><rect x="319.39" y="359" width="246.12" height="32" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" x="442.45" y="379.55" text-anchor="middle">Classify from abort OR child stopSignal</text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="T"><rect x="-45.17" y="561" width="90.34" height="43" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="587.75" text-anchor="middle">Terminal</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="C"><rect x="149.67" y="561" width="122.86" height="43" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="211.1" y="587.75" text-anchor="middle">Runtime child</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="F"><rect x="372.67" y="561" width="139.55" height="43" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="442.45" y="587.75" text-anchor="middle">Restart frontend</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="T"><rect x="-45.17" y="0" width="90.34" height="43" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="26.75" text-anchor="middle">Terminal</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="C"><rect x="149.67" y="0" width="122.86" height="43" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="