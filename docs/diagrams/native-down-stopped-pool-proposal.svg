/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="receipt" transform="translate(506.27,250.5)"><rect x="-38.51" y="-21.5" width="77.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">receipt</text></g><g class="pele-node pele-state ok" data-id="stopped" transform="translate(103.71,568.5)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stopped</text></g><g class="pele-note" data-id="receipt----note-13" transform="translate(337.34,250.5)"><path d="M-86.42,-33.5H78.42L86.42,-25.5V33.5H-86.42Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M78.42,-33.5V-25.5H86.42" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV NoEffectWithoutPool:</tspan><tspan x="0" y="4.55">only lock-free host reads;</tspan><tspan x="0" y="21.55">no runtime effect.</tspan></text></g><g class="pele-note" data-id="stopped----note-12" transform="translate(270.32,568.5)"><path d="M-79.93,-42H71.93L79.93,-34V42H-79.93Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M71.93,-42V-34H79.93" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">INV StoppedIsTrue:</tspan><tspan x="0" y="-3.95">reported stopped only if</tspan><tspan x="0" y="13.05">retained, owner dead,</tspan><tspan x="0" y="30.05">nothing owed.</tspan></text></g></g></g></svg>