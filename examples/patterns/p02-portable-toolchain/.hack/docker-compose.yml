name: pattern-p02
services:
  # One-shot toolchain behind an opt-in profile (HACK-P02). There is no
  # long-running application service in this project.
  toolchain:
    image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
    profiles: [toolchain]
    init: true
    working_dir: /app
    cpus: 2
    mem_limit: 2g
    environment:
      BUN_INSTALL_CACHE_DIR: /cache/bun
    volumes:
      - ..:/app
      - toolchain_dependencies:/app/node_modules
      - toolchain_bun_cache:/cache/bun

volumes:
  toolchain_dependencies: {}
  toolchain_bun_cache: {}
