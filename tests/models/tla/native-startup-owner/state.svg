<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1516 1014" width="1516" height="1014" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="758" y="40.75">Owner · started to ready</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M723.32,38L723.32,99"/><path class="pele-marker" d="M723.32,106L719.96,98L726.68,98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M715.32,149L715.32,157.09C715.32,159.7 490.28,164.9 490.28,167.5L490.28,210"/><path class="pele-marker" d="M490.28,217L486.92,209L493.64,209Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M490.28,247C490.28,252.48 240.53,260.02 240.53,265.5L240.53,337"/><path class="pele-marker" d="M240.53,344L237.17,336L243.89,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M490.28,247C490.28,251.63 942.52,260.88 942.52,265.5L942.52,337"/><path class="pele-marker" d="M942.52,344L939.16,336L945.88,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M240.53,387L240.53,572C240.53,578.94 232.19,578.94 232.19,585.88L232.19,590.5"/><path class="pele-marker" d="M232.19,597.5L228.83,589.5L235.55,589.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M942.52,387L942.52,407.5C942.52,477.75 761.15,477.75 761.15,548L761.15,572C761.15,575.47 248.19,582.41 248.19,585.88L248.19,590.5"/><path class="pele-marker" d="M248.19,597.5L244.83,589.5L251.55,589.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M240.53,387L240.53,416C240.53,485 62.14,485 62.14,554L62.14,677C62.14,705.52 131.03,723 243.44,723C355.85,723 424.75,742.95 424.75,775.5L424.75,781.5"/><path class="pele-marker" d="M424.75,788.5L421.39,780.5L428.11,780.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M942.52,387L942.52,407.5C942.52,502.5 849.27,502.5 849.27,597.5L849.27,640.5C849.27,708 456.75,708 456.75,775.5L456.75,781.5"/><path class="pele-marker" d="M456.75,788.5L453.39,780.5L460.11,780.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M223.85,640.5L223.85,683C223.85,700.36 265.06,711 332.3,711C399.54,711 440.75,735.51 440.75,775.5L440.75,781.5"/><path class="pele-marker" d="M440.75,788.5L437.39,780.5L444.11,780.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M240.53,387L240.53,416C240.53,485 1082.32,485 1082.32,554L1082.32,677C1082.32,698.08 1100.92,711 1131.28,711C1161.64,711 1180.24,726.2 1180.24,751L1180.24,781.5"/><path class="pele-marker" d="M1180.24,788.5L1176.88,780.5L1183.6,780.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M239.85,640.5C239.85,645.13 993.9,654.38 993.9,659L993.9,683C993.9,707.8 1029.31,723 1087.07,723C1144.84,723 1180.24,733.64 1180.24,751L1180.24,781.5"/><path class="pele-marker" d="M1180.24,788.5L1176.88,780.5L1183.6,780.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M942.52,387L942.52,407.5C942.52,502.5 1259.16,502.5 1259.16,597.5L1259.16,640.5C1259.16,695.75 1180.24,695.75 1180.24,751L1180.24,781.5"/><path class="pele-marker" d="M1180.24,788.5L1176.88,780.5L1183.6,780.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M1180.24,788.5L1180.24,751C1180.24,695.75 1347.57,695.75 1347.57,640.5L1347.57,217C1347.57,197.37 731.32,181.63 731.32,162L731.32,156"/><path class="pele-marker" d="M731.32,149L734.68,157L727.96,157Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge13"><path d="M443.06,831.5L443.06,930"/><path class="pele-marker" d="M443.06,937L439.7,929L446.42,929Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="warming-warming----note-14"><path d="M331.74,365.5L375.74,365.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="stopped-stopped----note-15"><path d="M1222.93,810L1266.93,810"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="starting----note-16-starting"><path d="M820.65,365.5L864.65,365.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="702.34" y="58.5" width="41.96" height="20" rx="3" fill="var(--_bg)"/><text x="723.32" y="73.05" text-anchor="middle">Serve</text></g><g class="pele-edge-label" data-id="edge1"><rect x="408.24" y="169.5" width="164.08" height="20" rx="3" fill="var(--_bg)"/><text x="490.28" y="184.05" text-anchor="middle">Started [containers started]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="163.38" y="267.5" width="154.3" height="20" rx="3" fill="var(--_bg)"/><text x="240.53" y="282.05" text-anchor="middle">[WaitForReady = FALSE]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="868.27" y="267.5" width="148.5" height="20" rx="3" fill="var(--_bg)"/><text x="942.52" y="282.05" text-anchor="middle">[WaitForReady = TRUE]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="164.09" y="550" width="152.87" height="20" rx="3" fill="var(--_bg)"/><text x="240.53" y="564.55" text-anchor="middle">Ready [pub = committed]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="691.04" y="550" width="140.24" height="20" rx="3" fill="var(--_bg)"/><text x="761.15" y="564.55" text-anchor="middle">Ready, then up returns</text></g><g class="pele-edge-label" data-id="edge6"><rect x="26" y="609" width="72.27" height="20" rx="3" fill="var(--_bg)"/><text x="62.14" y="623.55" text-anchor="middle">Fail (PR C)</text></g><g class="pele-edge-label" data-id="edge7"><rect x="834.8" y="609" width="28.94" height="20" rx="3" fill="var(--_bg)"/><text x="849.27" y="623.55" text-anchor="middle">Fail</text></g><g class="pele-edge-label" data-id="edge8"><rect x="187.71" y="661" width="72.27" height="20" rx="3" fill="var(--_bg)"/><text x="223.85" y="675.55" text-anchor="middle">Fail (PR C)</text></g><g class="pele-edge-label" data-id="edge9"><rect x="1003.9" y="609" width="156.84" height="20" rx="3" fill="var(--_bg)"/><text x="1082.32" y="623.55" text-anchor="middle">DownRequest, DownStop</text></g><g class="pele-edge-label" data-id="edge10"><rect x="915.48" y="661" width="156.84" height="20" rx="3" fill="var(--_bg)"/><text x="993.9" y="675.55" text-anchor="middle">DownRequest, DownStop</text></g><g class="pele-edge-label" data-id="edge11"><rect x="1180.74" y="609" width="156.84" height="20" rx="3" fill="var(--_bg)"/><text x="1259.16" y="623.55" text-anchor="middle">DownRequest, DownStop</text></g><g class="pele-edge-label" data-id="edge12"><rect x="1293" y="355.5" width="109.15" height="20" rx="3" fill="var(--_bg)"/><text x="1347.57" y="370.05" text-anchor="middle">restart: a new run</text></g><g class="pele-edge-label" data-id="edge13"><rect x="380.53" y="889.5" width="125.05" height="20" rx="3" fill="var(--_bg)"/><text x="443.06" y="904.05" text-anchor="middle">retained or recorded</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(723.32,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state live" data-id="serving" transform="translate(723.32,127.5)"><rect x="-40.17" y="-21.5" width="80.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">serving</text></g><g class="pele-node pele-state-choice" data-id="started_at" transform="translate(490.28,232)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state ok" data-id="ready" transform="translate(235.85,619)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state fail" data-id="failed" transform="translate(443.06,810)"><rect x="-58.92" y="-21.5" width="117.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">failed (PR C)</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(443.06,946)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="warming" transform="translate(240.53,365.5)"><rect x="-91.21" y="-21.5" width="182.42" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">warming · up returned</text></g><g class="pele-node pele-state wait" data-id="starting" transform="translate(942.52,365.5)"><rect x="-77.87" y="-21.5" width="155.74" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">starting · up --wait</text></g><g class="pele-node pele-state idle" data-id="stopped" transform="translate(1180.24,810)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stopped</text></g><g class="pele-note" data-id="warming----note-14" transform="translate(475.15,365.5)"><path d="M-99.42,-50.5H91.42L99.42,-42.5V50.5H-99.42Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.42,-50.5V-42.5H99.42" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">up returns here, in order:</tspan><tspan x="0" y="-12.45">PublishMapping, Bookkeep,</tspan><tspan x="0" y="4.55">Notify, OwnerAccept, Return</tspan><tspan x="0" y="21.55">INV NoReturnWithoutMapping</tspan><tspan x="0" y="38.55">INV NoPrematureReturn</tspan></text></g><g class="pele-note" data-id="starting----note-16" transform="translate(717.61,365.5)"><path d="M-103.04,-42H95.04L103.04,-34V42H-103.04Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.04,-42V-34H103.04" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">--wait: mapping saved here too;</tspan><tspan x="0" y="-3.95">bookkeeping and return wait</tspan><tspan x="0" y="13.05">for Ready</tspan><tspan x="0" y="30.05">INV NoReturnWithoutMapping</tspan></text></g><g class="pele-note" data-id="stopped----note-15" transform="translate(1379,810)"><path d="M-112.07,-59H104.07L112.07,-51V59H-112.07Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M104.07,-59V-51H112.07" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.95">DownRequest cancels the wait</tspan><tspan x="0" y="-20.95">DownStop waits for the service</tspan><tspan x="0" y="-3.95">to commit or withdraw</tspan><tspan x="0" y="13.05">INV DownCancelsWait: no Ready</tspan><tspan x="0" y="30.05">INV DownHooksOnce: hooks once</tspan><tspan x="0" y="47.05">INV NoHalfPublicationAfterStop</tspan></text></g></g></g></svg>