<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 926 714" width="926" height="714" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_Ps_Observer_0"><path d="M225.69,71L225.69,112"/><path class="pele-marker" d="M225.69,119L222.33,111L229.05,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Observer_Fence_0"><path d="M225.69,166L225.69,207"/><path class="pele-marker" d="M225.69,214L222.33,206L229.05,206Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Fence_Status_0"><path d="M205.24,327.16C205.24,343.8 112.03,343.8 112.03,360.45L112.03,404.95"/><path class="pele-marker" d="M112.03,411.95L108.67,403.95L115.39,403.95Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Fence_Busy_0"><path d="M246.15,327.16C246.15,343.8 339.35,343.8 339.35,360.45L339.35,404.95"/><path class="pele-marker" d="M339.35,411.95L335.99,403.95L342.71,403.95Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Up_Lease_0"><path d="M651.55,71L651.55,112"/><path class="pele-marker" d="M651.55,119L648.19,111L654.91,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Lease_Effects_0"><path d="M651.55,166L651.55,246.47"/><path class="pele-marker" d="M651.55,253.47L648.19,245.47L654.91,245.47Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Effects_Ready_0"><path d="M616.76,300.47C616.76,349.71 556.65,349.71 556.65,398.95L556.65,404.95"/><path class="pele-marker" d="M556.65,411.95L553.29,403.95L560.01,403.95Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Effects_Down_0"><path d="M686.34,300.47C686.34,330.46 746.45,330.46 746.45,360.45L746.45,404.95"/><path class="pele-marker" d="M746.45,411.95L743.08,403.95L749.81,403.95Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Down_Proof_0"><path d="M746.45,458.95L746.45,499.95"/><path class="pele-marker" d="M746.45,506.95L743.08,498.95L749.81,498.95Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Proof_Cleanup_0"><path d="M711.26,570.95C711.26,581.2 658.01,581.2 658.01,591.45L658.01,635.95"/><path class="pele-marker" d="M658.01,642.95L654.65,634.95L661.37,634.95Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Proof_Refuse_0"><path d="M781.63,570.95C781.63,581.2 834.88,581.2 834.88,591.45L834.88,635.95"/><path class="pele-marker" d="M834.88,642.95L831.52,634.95L838.24,634.95Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Fence_Status_0"><rect x="97.92" y="362.45" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="112.03" y="377" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_Fence_Busy_0"><rect x="328.12" y="362.45" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="339.35" y="377" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_Effects_Down_0"><rect x="724.75" y="362.45" width="43.4" height="20" rx="3" fill="var(--_bg)"/><text x="746.45" y="377" text-anchor="middle">failure</text></g><g class="pele-edge-label" data-id="L_Proof_Cleanup_0"><rect x="634.14" y="593.45" width="47.74" height="20" rx="3" fill="var(--_bg)"/><text x="658.01" y="608" text-anchor="middle">proved</text></g><g class="pele-edge-label" data-id="L_Proof_Refuse_0"><rect x="804.15" y="593.45" width="61.47" height="20" rx="3" fill="var(--_bg)"/><text x="834.88" y="608" text-anchor="middle">uncertain</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Ps" transform="translate(225.69,47.5)"><rect x="-43.84" y="-23.5" width="87.69" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">hack ps</text></g><g class="pele-node pele-shape-rect" data-id="Observer" transform="translate(225.69,142.5)"><rect x="-85.1" y="-23.5" width="170.21" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Read-only Observer</text></g><g class="pele-node pele-shape-diam" data-id="Fence" transform="translate(225.69,276.97)"><polygon points="0,-62.97 100.76,0 0,62.97 -100.76,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Journal unchanged?</text></g><g class="pele-node pele-shape-rect" data-id="Status" transform="translate(112.03,435.45)"><rect x="-88.03" y="-23.5" width="176.07" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Service state / health</text></g><g class="pele-node pele-shape-rect" data-id="Busy" transform="translate(339.35,435.45)"><rect x="-99.28" y="-23.5" width="198.56" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">runtime_busy: retry read</text></g><g class="pele-node pele-shape-rect" data-id="Up" transform="translate(651.55,47.5)"><rect x="-44.26" y="-23.5" width="88.53" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">hack up</text></g><g class="pele-node pele-shape-rect" data-id="Lease" transform="translate(651.55,142.5)"><rect x="-98.86" y="-23.5" width="197.72" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exclusive provider lease</text></g><g class="pele-node pele-shape-rect" data-id="Effects" transform="translate(651.55,276.97)"><rect x="-86.79" y="-23.5" width="173.58" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Startup effect stages</text></g><g class="pele-node pele-shape-rect" data-id="Ready" transform="translate(556.65,435.45)"><rect x="-78.02" y="-23.5" width="156.05" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:v