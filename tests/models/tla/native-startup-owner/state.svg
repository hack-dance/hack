<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1531 1133" width="1531" height="1133" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="765.5" y="40.75">Owner · started to ready</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M727.85,38L727.85,99"/><path class="pele-marker" d="M727.85,106L724.49,98L731.21,98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M719.85,149L719.85,157.09C719.85,159.7 483.49,164.9 483.49,167.5L483.49,210"/><path class="pele-marker" d="M483.49,217L480.13,209L486.85,209Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M483.49,247C483.49,252.48 233.74,260.02 233.74,265.5L233.74,337"/><path class="pele-marker" d="M233.74,344L230.38,336L237.1,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M483.49,247C483.49,251.63 935.73,260.88 935.73,265.5L935.73,337"/><path class="pele-marker" d="M935.73,344L932.37,336L939.09,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M233.74,387L233.74,590.5"/><path class="pele-marker" d="M233.74,597.5L230.38,589.5L237.1,589.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M935.73,387L935.73,407.5C935.73,477.75 754.37,477.75 754.37,548L754.37,572C754.37,575.47 249.74,582.41 249.74,585.88L249.74,590.5"/><path class="pele-marker" d="M249.74,597.5L246.38,589.5L253.1,589.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M233.74,387L233.74,416C233.74,485 62.14,485 62.14,554L62.14,677C62.14,705.52 130.4,723 241.78,723C353.15,723 421.42,765.56 421.42,835L421.42,841"/><path class="pele-marker" d="M421.42,848L418.06,840L424.78,840Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M935.73,387L935.73,407.5C935.73,502.5 842.49,502.5 842.49,597.5L842.49,640.5C842.49,737.75 453.42,737.75 453.42,835L453.42,841"/><path class="pele-marker" d="M453.42,848L450.06,840L456.78,840Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M228.79,640.5L228.79,683C228.79,700.36 268.43,711 333.11,711C397.78,711 437.42,758.12 437.42,835L437.42,841"/><path class="pele-marker" d="M437.42,848L434.06,840L440.78,840Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M233.74,387L233.74,416C233.74,485 1086.84,485 1086.84,554L1086.84,677C1086.84,698.08 1107.6,711 1141.46,711C1175.32,711 1196.08,726.2 1196.08,751L1196.08,841"/><path class="pele-marker" d="M1196.08,848L1192.72,840L1199.44,840Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M244.79,640.5C244.79,645.13 993.9,654.38 993.9,659L993.9,683C993.9,707.8 1032.31,723 1094.99,723C1157.66,723 1196.08,733.64 1196.08,751L1196.08,841"/><path class="pele-marker" d="M1196.08,848L1192.72,840L1199.44,840Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M935.73,387L935.73,407.5C935.73,502.5 1272.73,502.5 1272.73,597.5L1272.73,640.5C1272.73,695.75 1196.08,695.75 1196.08,751L1196.08,841"/><path class="pele-marker" d="M1196.08,848L1192.72,840L1199.44,840Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge12"><path d="M1196.08,848L1196.08,751C1196.08,695.75 1365.67,695.75 1365.67,640.5L1365.67,217C1365.67,197.79 735.85,181.21 735.85,162L735.85,156"/><path class="pele-marker" d="M735.85,149L739.21,157L732.49,157Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge13"><path d="M439.72,891L439.72,1049"/><path class="pele-marker" d="M439.72,1056L436.36,1048L443.08,1048Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="warming-warming----note-14"><path d="M324.95,365.5L368.95,365.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="stopped-stopped----note-15"><path d="M1238.76,869.5L1282.76,869.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="starting----note-16-starting"><path d="M813.87,365.5L857.87,365.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="706.87" y="58.5" width="41.96" height="20" rx="3" fill="var(--_bg)"/><text x="727.85" y="73.05" text-anchor="middle">Serve</text></g><g class="pele-edge-label" data-id="edge1"><rect x="401.45" y="169.5" width="164.08" height="20" rx="3" fill="var(--_bg)"/><text x="483.49" y="184.05" text-anchor="middle">Started [containers started]</text></g><g class="pele-edge-label" data-id="edge2"><rect x="156.59" y="267.5" width="154.3" height="20" rx="3" fill="var(--_bg)"/><text x="233.74" y="282.05" text-anchor="middle">[WaitForReady = FALSE]</text></g><g class="pele-edge-label" data-id="edge3"><rect x="861.48" y="267.5" width="148.5" height="20" rx="3" fill="var(--_bg)"/><text x="935.73" y="282.05" text-anchor="middle">[WaitForReady = TRUE]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="157.3" y="550" width="152.87" height="20" rx="3" fill="var(--_bg)"/><text x="233.74" y="564.55" text-anchor="middle">Ready [pub = committed]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="684.25" y="550" width="140.24" height="20" rx="3" fill="var(--_bg)"/><text x="754.37" y="564.55" text-anchor="middle">Ready, then up returns</text></g><g class="pele-edge-label" data-id="edge6"><rect x="26" y="609" width="72.27" height="20" rx="3" fill="var(--_bg)"/><text x="62.14" y="623.55" text-anchor="middle">Fail (PR C)</text></g><g class="pele-edge-label" data-id="edge7"><rect x="828.02" y="609" width="28.94" height="20" rx="3" fill="var(--_bg)"/><text x="842.49" y="623.55" text-anchor="middle">Fail</text></g><g class="pele-edge-label" data-id="edge8"><rect x="192.66" y="661" width="72.27" height="20" rx="3" fill="var(--_bg)"/><text x="228.79" y="675.55" text-anchor="middle">Fail (PR C)</text></g><g class="pele-edge-label" data-id="edge9"><rect x="1003.9" y="609" width="165.89" height="20" rx="3" fill="var(--_bg)"/><text x="1086.84" y="623.55" text-anchor="middle">accept + cancel, DownStop</text></g><g class="pele-edge-label" data-id="edge10"><rect x="910.96" y="661" width="165.89" height="20" rx="3" fill="var(--_bg)"/><text x="993.9" y="675.55" text-anchor="middle">accept + cancel, DownStop</text></g><g class="pele-edge-label" data-id="edge11"><rect x="1189.79" y="609" width="165.89" height="20" rx="3" fill="var(--_bg)"/><text x="1272.73" y="623.55" text-anchor="middle">accept + cancel, DownStop</text></g><g class="pele-edge-label" data-id="edge12"><rect x="1311.09" y="355.5" width="109.15" height="20" rx="3" fill="var(--_bg)"/><text x="1365.67" y="370.05" text-anchor="middle">restart: a new run</text></g><g class="pele-edge-label" data-id="edge13"><rect x="377.2" y="1008.5" width="125.05" height="20" rx="3" fill="var(--_bg)"/><text x="439.72" y="1023.05" text-anchor="middle">retained or recorded</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(727.85,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state live" data-id="serving" transform="translate(727.85,127.5)"><rect x="-40.17" y="-21.5" width="80.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">serving</text></g><g class="pele-node pele-state-choice" data-id="started_at" transform="translate(483.49,232)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state ok" data-id="ready" transform="translate(240.79,619)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state fail" data-id="failed" transform="translate(439.72,869.5)"><rect x="-58.92" y="-21.5" width="117.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">failed (PR C)</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(439.72,1065)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="warming" transform="translate(233.74,365.5)"><rect x="-91.21" y="-21.5" width="182.42" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">warming · up returned</text></g><g class="pele-node pele-state wait" data-id="starting" transform="translate(935.73,365.5)"><rect x="-77.87" y="-21.5" width="155.74" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">starting · up --wait</text></g><g class="pele-node pele-state idle" data-id="stopped" transform="translate(1196.08,869.5)"><rect x="-42.68" y="-21.5" width="85.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stopped</text></g><g class="pele-note" data-id="warming----note-14" transform="translate(468.37,365.5)"><path d="M-99.42,-50.5H91.42L99.42,-42.5V50.5H-99.42Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.42,-50.5V-42.5H99.42" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.45">up returns here, in order:</tspan><tspan x="0" y="-12.45">PublishMapping, Bookkeep,</tspan><tspan x="0" y="4.55">Notify, OwnerAccept, Return</tspan><tspan x="0" y="21.55">INV NoReturnWithoutMapping</tspan><tspan x="0" y="38.55">INV NoPrematureReturn</tspan></text></g><g class="pele-note" data-id="starting----note-16" transform="translate(710.83,365.5)"><path d="M-103.04,-42H95.04L103.04,-34V42H-103.04Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M95.04,-42V-34H103.04" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">--wait: mapping saved here too;</tspan><tspan x="0" y="-3.95">bookkeeping and return wait</tspan><tspan x="0" y="13.05">for Ready</tspan><tspan x="0" y="30.05">INV NoReturnWithoutMapping</tspan></text></g><g class="pele-note" data-id="stopped----note-15" transform="translate(1394.83,869.5)"><path d="M-112.07,-118.5H104.07L112.07,-110.5V118.5H-112.07Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M104.07,-118.5V-110.5H112.07" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-97.45">DownRequest queues the stop,</tspan><tspan x="0" y="-80.45">even mid-publication. Owner:</tspan><tspan x="0" y="-63.45">AcceptStop, between passes and</tspan><tspan x="0" y="-46.45">never mid-publication, cancels</tspan><tspan x="0" y="-29.45">the wait. Frontend: its own</tspan><tspan x="0" y="-12.45">FrontendCancel (abort) ends the</tspan><tspan x="0" y="4.55">started chain. DownStop needs</tspan><tspan x="0" y="21.55">both, in either order.</tspan><tspan x="0" y="38.55">INV DownCancelsWait: no Ready</tspan><tspan x="0" y="55.55">INV DownHooksOnce: hooks once</tspan><tspan x="0" y="72.55">INV NoHalfPublicationAfterStop</tspan><tspan x="0" y="89.55">INV StoppedOwnerNotWaiting</tspan><tspan x="0" y="106.55">INV StoppedFrontendCancelled</tspan></text></g></g></g></svg>