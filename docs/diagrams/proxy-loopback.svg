<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 865 1099" width="865" height="1099" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_D_C_0"><path d="M107.02,88C107.02,105.5 180.26,105.5 180.26,123L180.26,129"/><path class="pele-marker" d="M180.26,136L176.9,128L183.62,128Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_O_C_0"><path d="M328.1,88C328.1,105.5 216.47,105.5 216.47,123L216.47,129"/><path class="pele-marker" d="M216.47,136L213.11,128L219.83,128Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C_U_0"><path d="M180.26,200C180.26,210.25 107.02,210.25 107.02,220.5L107.02,303.27"/><path class="pele-marker" d="M107.02,310.27L103.66,302.27L110.38,302.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C_B_0"><path d="M216.47,200C216.47,210.25 342.48,210.25 342.48,220.5L342.48,265"/><path class="pele-marker" d="M342.48,272L339.12,264L345.84,264Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_B_K_0"><path d="M287.32,378.06L287.32,477.53"/><path class="pele-marker" d="M287.32,484.53L283.96,476.53L290.68,476.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_B_P_0"><path d="M369.93,395.37C369.93,414.2 515.05,414.2 515.05,433.03L515.05,477.53"/><path class="pele-marker" d="M515.05,484.53L511.69,476.53L518.41,476.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_P_T_0"><path d="M468.19,531.53C468.19,541.78 348.05,541.78 348.05,552.03L348.05,596.53"/><path class="pele-marker" d="M348.05,603.53L344.69,595.53L351.41,595.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_P_H_0"><path d="M561.92,531.53C561.92,541.78 670.16,541.78 670.16,552.03L670.16,596.53"/><path class="pele-marker" d="M670.16,603.53L666.8,595.53L673.52,595.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_T_S_0"><path d="M323.81,650.53L323.81,955.46C323.81,984.96 408.51,984.96 408.51,1014.46L408.51,1020.46"/><path class="pele-marker" d="M408.51,1