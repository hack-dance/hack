eate, Start, Publish</tspan><tspan x="0" y="13.05">INV Existing IDs stay</tspan></text></g><g class="pele-note" data-id="Degraded----note-20" transform="translate(696.86,542.5)"><path d="M-94.73,-33.5H86.73L94.73,-25.5V33.5H-94.73Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M86.73,-33.5V-25.5H94.73" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">RefuseConcurrent</tspan><tspan x="0" y="4.55">Keep cleanup intent</tspan><tspan x="0" y="21.55">Reply if cancellation pending</tspan></text></g><g class="pele-note" data-id="Cancelling----note-21" transform="translate(450.32,399)"><path d="M-92.93,-42H84.93L92.93,-34V42H-92.93Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M84.93,-42V-34H92.93" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">Wait to stop grace + margin</tspan><tspan x="0" y="-3.95">Rollback reply confirms</tspan><tspan x="0" y="13.05">Commit, timeout or force</tspan><tspan x="0" y="30.05">leave the outcome unknown</tspan></text></g></g></g></svg>