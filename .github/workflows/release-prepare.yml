name: Release Prepare

# Stable releases are prepared from `main` only after CI succeeded in every
# job on the exact head (HACK-1424). The sharded CI run is the test gate; this
# workflow never runs the suite itself. A manual dispatch defaults to a dry
# run that reports what semantic-release would publish without tagging,
# committing or pushing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the next release without tagging, committing or pushing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-prepare-main
  cancel-in-progress: false

jobs:
  semantic-release:
    # A failed, cancelled or pull-request CI run never prepares a release.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require a fully successful CI push run on the exact main head
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PREPARE_EVENT: ${{ github.event_name }}
          RELEASE_PREPARE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_PREPARE_CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_PREPARE_CI_EVENT: ${{ github.event.workflow_run.event }}
          RELEASE_PREPARE_CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: bun scripts/release-prepare-gate.ts

      - name: Typecheck (Turbo)
        run: bun run turbo:typecheck

      - name: Privacy check
        run: bun run privacy:check

      - name: Quality checks (Turbo)
        run: bun run turbo:check

      - name: Run semantic-release (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: bunx semantic-release --dry-run

      - name: Run semantic-release
        if: ${{ github.event_name == 'workflow_run' || !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: bunx semantic-release
