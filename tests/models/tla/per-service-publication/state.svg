g><g class="pele-edge-label" data-id="edge3"><rect x="133.58" y="466.5" width="114.21" height="20" rx="3" fill="var(--_bg)"/><text x="190.69" y="481.05" text-anchor="middle">Authorize [current]</text></g><g class="pele-edge-label" data-id="edge4"><rect x="304.16" y="577.5" width="105.55" height="20" rx="3" fill="var(--_bg)"/><text x="356.94" y="592.05" text-anchor="middle">Bind [authorized]</text></g><g class="pele-edge-label" data-id="edge5"><rect x="488.59" y="636.5" width="114.21" height="20" rx="3" fill="var(--_bg)"/><text x="545.69" y="651.05" text-anchor="middle">Record [observed]</text></g><g class="pele-edge-label" data-id="edge6"><rect x="178.27" y="248" width="111.32" height="20" rx="3" fill="var(--_bg)"/><text x="233.93" y="262.55" text-anchor="middle">EOFExit [aborted]</text></g><g class="pele-edge-label" data-id="edge7"><rect x="284" y="303.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="332.8" y="318.05" text-anchor="middle">Retire [aborted]</text></g><g class="pele-edge-label" data-id="edge8"><rect x="474.4" y="414.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="523.2" y="429.05" text-anchor="middle">Retire [aborted]</text></g><g class="pele-edge-label" data-id="edge9"><rect x="591.99" y="414.5" width="97.6" height="20" rx="3" fill="var(--_bg)"/><text x="640.79" y="429.05" text-anchor="middle">Retire [aborted]</text></g><g class="pele-edge-label" data-id="edge10"><rect x="695.04" y="87.5" width="123.61" height="20" rx="3" fill="var(--_bg)"/><text x="756.84" y="102.05" text-anchor="middle">Abort [owner exited]</text></g><g class="pele-edge-label" data-id="edge11"><rect x="679.87" y="248" width="153.95" height="20" rx="3" fill="var(--_bg)"/><text x="756.84" y="262.55" text-anchor="middle">SelectDeadOwner [proof]</text></g><g class="pele-edge-label" data-id="edge12"><rect x="683.11" y="355.5" width="147.46" height="20" rx="3" fill="var(--_bg)"/><text x="756.84" y="370.05" text-anchor="middle">Settled [children absent]</text>