<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 814 944" width="814" height="944" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-clusters"><g class="pele-cluster" data-id="trial"><rect x="515.56" y="171.91" width="273.7" height="635.42" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="ci"><rect x="24" y="275.37" width="451.56" height="428.51" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="76.75" y="300.12" text-anchor="middle">CI workflow</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_event_scope_0"><path d="M455.88,94.91C455.88,107.66 275.36,107.66 275.36,120.41L275.36,327.37"/><path class="pele-marker" d="M275.36,334.37L272,326.37L278.72,326.37Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scope_four_0"><path d="M259.91,440.23C259.91,455.3 174.42,455.3 174.42,470.38L174.42,514.88"/><path class="pele-marker" d="M174.42,521.88L171.06,513.88L177.78,513.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scope_skip_0"><path d="M290.8,440.23C290.8,455.3 376.29,455.3 376.29,470.38L376.29,514.88"/><path class="pele-marker" d="M376.29,521.88L372.93,513.88L379.66,513.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_four_aggregate_0"><path d="M121.61,568.88L121.61,609.88"/><path class="pele-marker" d="M121.61,616.88L118.25,608.88L124.97,608.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_four_release_0"><path d="M227.22,568.88L227.22,848.33"/><path class="pele-marker" d="M227.22,855.33L223.86,847.33L230.58,847.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_aggregate_release_0"><path d="M121.61,663.88L121.61,848.33"/><path class="pele-marker" d="M121.61,855.33L118.25,847.33L124.97,847.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_event_opt_0"><path d="M471.88,94.91C471.88,107.66 652.41,107.66 652.41,120.41L652.41,223.91"/><path class="pele-marker" d="M652.41,230.91L649.05,222.91L655.77,222.91Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_opt_trialscope_0"><path d="M652.41,376.97L652.41,441.97"/><path class="pele-marker" d="M652.41,448.97L649.05,440.97L655.77,440.97Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_trialscope_six_0"><path d="M652.41,573.33L652.41,638.33"/><path class="pele-marker" d="M652.41,645.33L649.05,637.33L655.77,637.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_six_metrics_0"><path d="M652.41,692.33L652.41,733.33"/><path class="pele-marker" d="M652.41,740.33L649.05,732.33L655.77,732.33Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-cluster-titles"><g class="pele-cluster-title" data-id="trial"><text fill="none" stroke="color-mix(in srgb,var(--_a) 50%,var(--_bg))" stroke-width="5" stroke-linejoin="round" x="605.42" y="196.66" text-anchor="middle">Separate trial workflow</text><text class="pele-cluster-label" fill="var(--_m)" x="605.42" y="196.66" text-anchor="middle">Separate trial workflow</text></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_event_scope_0"><rect x="210.3" y="122.41" width="130.11" height="20" rx="3" fill="var(--_bg)"/><text x="275.36" y="136.96" text-anchor="middle">Push, PR or dispatch</text></g><g class="pele-edge-label" data-id="L_scope_four_0"><rect x="159.22" y="472.38" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="174.42" y="486.93" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_scope_skip_0"><rect x="363.99" y="472.38" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="376.29" y="486.93" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_event_opt_0"><rect x="587.36" y="122.41" width="130.11" height="20" rx="3" fill="var(--_bg)"/><text x="652.41" y="136.96" text-anchor="middle">Push, PR or dispatch</text></g><g class="pele-edge-label" dat