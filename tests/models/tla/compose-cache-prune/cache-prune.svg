<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 366 544" width="366" height="544" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M206.74,38L206.74,75"/><path class="pele-marker" d="M206.74,82L203.38,74L210.1,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M124.62,125L124.62,186"/><path class="pele-marker" d="M124.62,193L121.26,185L127.98,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M288.87,125L288.87,236C288.87,263.5 229.1,263.5 229.1,291L229.1,297"/><path class="pele-marker" d="M229.1,304L225.74,296L232.46,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M124.62,236L124.62,278.5C124.62,285.44 184.39,285.44 184.39,292.38L184.39,297"/><path class="pele-marker" d="M184.39,304L181.03,296L187.75,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M184.39,347C184.39,356.25 131.51,356.25 131.51,365.5L131.51,408"/><path class="pele-marker" d="M131.51,415L128.15,407L134.87,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M229.1,347C229.1,356.25 281.98,356.25 281.98,365.5L281.98,408"/><path class="pele-marker" d="M281.98,415L278.62,407L285.34,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M131.51,458C131.51,473.5 206.74,473.5 206.74,489L206.74,495"/><path class="pele-marker" d="M206.74,502L203.38,494L210.1,494Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M281.98,458C281.98,473.5 206.74,473.5 206.74,489L206.74,495"/><path class="pele-marker" d="M206.74,502L203.38,494L210.1,494Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="45.83" y="145.5" width="157.58" height="20" rx="3" fill="var(--_bg)"/><text x="124.62" y="160.05" text-anchor="middle">Save identity before down</text></g><g class="pele-edge-label" data-id="edge2"><rect x="255.25" y="204.5" width="67.24" height="20" rx="3" fill="var(--_bg)"/><text x="288.87" y="219.05" text-anchor="middle">No receipt</text></g><g class="pele-edge-label" data-id="edge3"><rect x="48.73" y="256.5" width="151.78" height="20" rx="3" fill="var(--_bg)"/><text x="124.62" y="271.05" text-anchor="middle">Stop removes containers</text></g><g class="pele-edge-label" data-id="edge4"><rect x="58.5" y="367.5" width="146.02" height="20" rx="3" fill="var(--_bg)"/><text x="131.51" y="382.05" text-anchor="middle">Proof changed or in use</text></g><g class="pele-edge-label" data-id="edge5"><rect x="224.52" y="367.5" width="114.93" height="20" rx="3" fill="var(--_bg)"/><text x="281.98" y="382.05" text-anchor="middle">Match and confirm</text></g></g><g class="pele-nodes"><g class="pele-node pele-state" data-id="Mounted" transform="translate(206.74,103.5)"><rect x="-105.21" y="-21.5" width="210.43" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Mounted in exact checkout</text></g><g class="pele-node pele-state" data-id="Recorded" transform="translate(124.62,214.5)"><rect x="-100.62" y="-21.5" width="201.25" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Mount evidence recorded</text></g><g class="pele-node pele-state" data-id="Detached" transform="translate(206.74,325.5)"><rect x="-74.36" y="-21.5" width="148.72" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Detached volume</text></g><g class="pele-node pele-state" data-id="Kept" transform="translate(131.51,436.5)"><rect x="-31.43" y="-21.5" width="62.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Kept</text></g><g class="pele-node pele-state" data-id="Removed" transform="translate(281.98,436.5)"><rect x="-48.09" y="-21.5" width="96.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Removed</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(206.74,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(206.74,511)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g></g></svg>