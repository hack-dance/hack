<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 612 600" width="612" height="600" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_S_K_0"><path d="M312.68,71L312.68,112"/><path class="pele-marker" d="M312.68,119L309.32,111L316.04,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_K_P_0"><path d="M290.23,235.08C290.23,252.34 206.92,252.34 206.92,269.61L206.92,314.11"/><path class="pele-marker" d="M206.92,321.11L203.56,313.11L210.28,313.11Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_K_B_0"><path d="M335.13,235.08C335.13,252.34 516.59,252.34 516.59,269.61L516.59,314.11"/><path class="pele-marker" d="M516.59,321.11L513.23,313.11L519.95,313.11Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_P_J_0"><path d="M160.04,368.11C160.04,389.86 100.77,389.86 100.77,411.61L100.77,417.61"/><path class="pele-marker" d="M100.77,424.61L97.41,416.61L104.13,416.61Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_P_C_0"><path d="M253.79,368.11C253.79,385.61 313.06,385.61 313.06,403.11L313.06,409.11"/><path class="pele-marker" d="M313.06,416.11L309.7,408.11L316.42,408.11Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C_R_0"><path d="M313.06,480.11L313.06,521.11"/><path class="pele-marker" d="M313.06,528.11L309.7,520.11L316.42,520.11Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_B_N_0"><path d="M516.59,368.11L516.59,409.11"/><path class="pele-marker" d="M516.59,416.11L513.23,408.11L519.95,408.11Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_K_P_0"><rect x="192.8" y="271.61" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="206.92" y="286.16" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_K_B_0"><rect x="505.36" y="271.61" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="516.59" y="286.16" text-anchor="middle">no</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="S" transform="translate(312.68,47.5)"><rect x="-84.7" y="-23.5" width="169.4" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Read-only snapshot</text></g><g class="pele-node pele-shape-diam" data-id="K" transform="translate(312.68,184.05)"><polygon points="0,-65.05 104.09,0 0,65.05 -104.09,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Phase inputs known?</text></g><g class="pele-node pele-shape-rect" data-id="P" transform="translate(206.92,344.61)"><rect x="-98.87" y="-23.5" width="197.75" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Shared argv preparation</text></g><g class="pele-node pele-shape-rect" data-id="B" transform="translate(516.59,344.61)"><rect x="-70.94" y="-23.5" width="141.89" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Incomplete plan</text></g><g class="pele-node pele-shape-rect" data-id="J" transform="translate(100.77,448.11)"><rect x="-76.77" y="-23.5" width="153.54" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">JSON admin plan</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(313.06,448.11)"><rect x="-95.52" y="-32" width="191.04" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Command confirmation</tspan><tspan x="0" y="15.25">gates</tspan></text></g><g class="pele-node pele-shape-rect" data-id="R" transform="translate(313.06,551.61)"><rect x="-80.53" y="-23.5" width="161.06" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Run prepared argv</text></g><g class="pele-node pele-shape-rect" data-id="N" transform="translate(516.59,448.11)"><rect x="-68.01" y="-32" width="136.02" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Report missing</tspan><tspan x="0" y="15.25">prerequisite</tspan></text></g></g></svg>