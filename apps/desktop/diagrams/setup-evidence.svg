iddle">Missing or skipped</text></g><g class="pele-edge-label" data-id="L_Cards_Safe_0"><rect x="527.43" y="526.66" width="76.63" height="20" rx="3" fill="var(--_bg)"/><text x="565.75" y="541.21" text-anchor="middle">Explicit Run</text></g><g class="pele-edge-label" data-id="L_Cards_Terminal_0"><rect x="287.41" y="526.66" width="105.53" height="20" rx="3" fill="var(--_bg)"/><text x="340.17" y="541.21" text-anchor="middle">Admin command</text></g><g class="pele-edge-label" data-id="L_Cards_Projects_0"><rect x="719.81" y="526.66" width="60.03" height="20" rx="3" fill="var(--_bg)"/><text x="749.82" y="541.21" text-anchor="middle">Continue</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Launch" transform="translate(361.27,47.5)"><rect x="-93.46" y="-23.5" width="186.92" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Launch or check again</text></g><g class="pele-node pele-shape-rect" data-id="Read" transform="translate(700.94,151)"><rect x="-89.29" y="-32" width="178.59" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Bounded background</tspan><tspan x="0" y="15.25">reads</tspan></text></g><g class="pele-node pele-shape-diam" data-id="CLI" transform="translate(354.25,284.33)"><polygon points="0,-53.33 85.33,0 0,53.33 -85.33,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Supported CLI?</text></g><g class="pele-node pele-shape-rect" data-id="Required" transform="translate(190.49,433.16)"><rect x="-78.85" y="-23.5" width="157.71" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Required CLI card</text></g><g class="pele-node pele-shape-rect" data-id="Cards" transform="translate(395.71,433.16)"><rect x="-86.36" y="