"pele-node pele-state" data-id="ProviderWritten" transform="translate(216.37,436.5)"><rect x="-67.67" y="-21.5" width="135.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ProviderWritten</text></g><g class="pele-node pele-state" data-id="OwnerWritten" transform="translate(216.37,547.5)"><rect x="-61.84" y="-21.5" width="123.68" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">OwnerWritten</text></g><g class="pele-node pele-state" data-id="Resized" transform="translate(303.58,658.5)"><rect x="-43.09" y="-21.5" width="86.18" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Resized</text></g></g></svg>