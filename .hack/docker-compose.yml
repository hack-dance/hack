name: hack-cli
services:
  docs:
    pull_policy: build
    build:
      context: ../site
      dockerfile: ../.hack/docs/Dockerfile
    init: true
    working_dir: /app
    cpus: 2
    mem_limit: 6g
    volumes:
      - ../docs:/app/docs:ro
      - ../scripts/docs:/app/scripts/docs:ro
      - ../site/app:/app/site/app:ro
      - ../site/components:/app/site/components:ro
      - ../site/lib:/app/site/lib:ro
      - ./docs/dev.sh:/app/dev.sh:ro
      - docs_dependencies:/app/site/node_modules
      - docs_build:/app/site/.next
    command: [bash, /app/dev.sh]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=3072
    labels:
      caddy: docs.hack-cli.hack.local
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls: internal
    networks:
      - hack-dev
      - default
  deps:
    profiles: [deps]
    image: oven/bun:1.4.4
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    command: bun install --frozen-lockfile
    networks:
      - default

  toolchain:
    pull_policy: build
    profiles: [toolchain]
    build:
      context: ..
      dockerfile: .hack/toolchain/Dockerfile
    init: true
    working_dir: /app
    cpus: 2
    mem_limit: 4g
    volumes:
      - ..:/app
      - toolchain_dependencies:/app/node_modules
      - toolchain_dist:/app/dist
      - toolchain_build:/build
      - toolchain_cargo:/opt/cargo/registry
    environment:
      CARGO_TARGET_DIR: /build/rust
      CARGO_BUILD_JOBS: "2"
      HACK_NO_INTERACTIVE: "1"
      HUSKY: "0"

networks:
  hack-dev:
    external: true

volumes:
  docs_dependencies:
    labels:
      hack.cache.disposable: "true"
  docs_build:
  node_modules:
  toolchain_dependencies:
  toolchain_dist:
  toolchain_build:
  toolchain_cargo:
