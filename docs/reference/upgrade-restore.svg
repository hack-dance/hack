" y="-21.5" width="87.02" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">restored</text></g><g class="pele-note" data-id="conflict----note-18" transform="translate(896.97,563)"><path d="M-88.23,-25H80.23L88.23,-17V25H-88.23Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M80.23,-25V-17H88.23" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Other aside file is reported</tspan><tspan x="0" y="13.05">Nothing is deleted</tspan></text></g><g class="pele-note" data-id="aside----note-16" transform="translate(558.02,353)"><path d="M-75.95,-25H67.95L75.95,-17V25H-75.95Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M67.95,-25V-17H75.95" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Path is empty here</tspan><tspan x="0" y="13.05">Output kept as keptAs</tspan></text></g><g class="pele-note" data-id="restored----note-17" transform="translate(257.4,681)"><path d="M-82.45,-25H74.45L82.45,-17V25H-82.45Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M74.45,-25V-17H82.45" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">No keyed file is left, so a</tspan><tspan x="0" y="13.05">later deletion is refused</tspan></text></g></g></svg>