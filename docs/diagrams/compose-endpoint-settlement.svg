<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 672 503" width="672" height="503" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M224.17,38L224.17,75"/><path class="pele-marker" d="M224.17,82L220.81,74L227.53,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M196.43,125L196.43,138C196.43,165.5 72.99,165.5 72.99,193L72.99,244"/><path class="pele-marker" d="M72.99,251L69.63,243L76.35,243Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M212.43,125L212.43,342.5C212.43,351.75 291.01,351.75 291.01,361L291.01,367"/><path class="pele-marker" d="M291.01,374L287.65,366L294.37,366Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M228.43,125L228.43,138C228.43,154.74 238.62,165 255.24,165C271.87,165 282.05,175.64 282.05,193L282.05,217C282.05,228 353.67,228 353.67,239L353.67,244"/><path class="pele-marker" d="M353.67,251L350.31,243L357.03,243Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M353.67,251L353.67,239C353.67,228 425.29,228 425.29,217L425.29,193C425.29,168.2 390.92,153 334.86,153C278.79,153 244.43,147.01 244.43,137.25L244.43,132"/><path class="pele-marker" d="M244.43,125L247.79,133L241.07,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M353.67,294L353.67,348.5C353.67,355.44 307.01,355.44 307.01,362.38L307.01,367"/><path class="pele-marker" d="M307.01,374L303.65,366L310.37,366Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M72.99,294L72.99,417C72.99,432.5 237.21,432.5 237.21,448L237.21,454"/><path class="pele-marker" d="M237.21,461L233.85,453L240.57,453Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M299.01,417C299.01,432.5 237.21,432.5 237.21,448L237.21,454"/><path class="pele-marker" d="M237.21,461L233.85,453L240.57,453Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Waiting-Waiting----note-8"><path d="M394.68,272.5L438.68,272.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="26" y="195" width="93.98" height="20" rx="3" fill="var(--_bg)"/><text x="72.99" y="209.55" text-anchor="middle">complete proof</text></g><g class="pele-edge-label" data-id="edge2"><rect x="174.11" y="262.5" width="76.64" height="20" rx="3" fill="var(--_bg)"/><text x="212.43" y="277.05" text-anchor="middle">other failure</text></g><g class="pele-edge-label" data-id="edge3"><rect x="222.43" y="195" width="119.25" height="20" rx="3" fill="var(--_bg)"/><text x="282.05" y="209.55" text-anchor="middle">member ID refused</text></g><g class="pele-edge-label" data-id="edge4"><rect x="361.68" y="195" width="127.21" height="20" rx="3" fill="var(--_bg)"/><text x="425.29" y="209.55" text-anchor="middle">retry budget remains</text></g><g class="pele-edge-label" data-id="edge5"><rect x="273.07" y="326.5" width="161.21" height="20" rx="3" fill="var(--_bg)"/><text x="353.67" y="341.05" text-anchor="middle">budget ended or cancelled</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(224.17,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Inspect" transform="translate(224.17,103.5)"><rect x="-40.18" y="-21.5" width="80.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inspect</text></g><g class="pele-node pele-state" data-id="Accepted" transform="translate(72.99,272.5)"><rect x="-47.27" y="-21.5" width="94.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Accepted</text></g><g class="pele-node pele-state" data-id="Refused" transform="translate(299.01,395.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Refused</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(237.21,470)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Waiting" transform="translate(353.67,272.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Waiting</text></g><g class="pele-note" data-id="Waiting----note-8" transform="translate(543.15,272.5)"><path d="M-104.48,-33.5H96.48L104.48,-25.5V33.5H-104.48Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M96.48,-33.5V-25.5H104.48" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Two-second monotonic window.</tspan><tspan x="0" y="4.55">Each probe remains bounded.</tspan><tspan x="0" y="21.55">No placeholder grants authority.</tspan></text></g></g></svg>