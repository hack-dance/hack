name: HackDesktop
options:
  bundleIdPrefix: dance.hack
  deploymentTarget:
    macOS: "14.0"
packages:
  HackDesktop:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.8.1
targets:
  HackDesktop:
    type: application
    platform: macOS
    sources:
      - App
    resources:
      - path: App/BundledCLI
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Avoid XcodeGen rewriting App/Info.plist (it hardcodes the version to 1.0/1).
        # Instead, let Xcode read the plist directly and expand $(MARKETING_VERSION).
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - package: HackDesktop
        product: DashboardFeature
      - package: Sparkle
        product: Sparkle
