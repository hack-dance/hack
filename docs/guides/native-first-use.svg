<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 637 1254" width="637" height="1254" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_Up_Inspect_0"><path d="M384.46,71L384.46,112"/><path class="pele-marker" d="M384.46,119L381.1,111L387.82,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Inspect_Ready_0"><path d="M384.46,166L384.46,207"/><path class="pele-marker" d="M384.46,214L381.1,206L387.82,206Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Ready_Start_0"><path d="M376.46,282.31C376.46,320.81 110.98,320.81 110.98,359.31L110.98,1175.05"/><path class="pele-marker" d="M110.98,1182.05L107.62,1174.05L114.34,1174.05Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Ready_Offer_0"><path d="M392.46,282.31C392.46,295.06 463.68,295.06 463.68,307.81L463.68,352.31"/><path class="pele-marker" d="M463.68,359.31L460.32,351.31L467.04,351.31Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Offer_Refuse_0"><path d="M481.03,467.95C481.03,509.37 546.54,509.37 546.54,550.8L546.54,1175.05"/><path class="pele-marker" d="M546.54,1182.05L543.18,1174.05L549.9,1174.05Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Offer_Consent_0"><path d="M446.32,467.95C446.32,483.62 388.46,483.62 388.46,499.3L388.46,543.8"/><path class="pele-marker" d="M388.46,550.8L385.1,542.8L391.82,542.8Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Consent_Refuse_0"><path d="M421.92,682.93C421.92,729.38 513.13,729.38 513.13,775.84L513.13,1175.05"/><path class="pele-marker" d="M513.13,1182.05L509.77,1174.05L516.49,1174.05Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Consent_Setup_0"><path d="M326.9,665.36L326.91,768.84"/><path class="pele-marker" d="M326.91,775.84L323.55,767.84L330.27,767.84Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Setup_Reinspect_0"><path d="M283.79,822.84C283.79,833.09 235.15,833.09 235.15,843.34L235.15,887.84"/><path class="pele-marker" d="M235.15,894.84L231.79,886.84L238.51,886.84Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Reinspect_Installed_0"><path d="M235.15,941.84L235.15,982.84"/><path class="pele-marker" d="M235.15,989.84L231.79,981.84L238.51,981.84Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Installed_Start_0"><path d="M227.15,1105.05L227.15,1154.55C227.15,1162.23 168.89,1162.23 168.89,1169.92L168.89,1175.05"/><path class="pele-marker" d="M168.89,1182.05L165.53,1174.05L172.25,1174.05Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Installed_Refuse_0"><path d="M274.65,1085.36L274.65,1154.55C274.65,1159.22 476.84,1165.25 476.84,1169.92L476.84,1175.05"/><path class="pele-marker" d="M476.84,1182.05L473.48,1174.05L480.2,1174.05Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Setup_Refuse_0"><path d="M370.02,822.84C370.02,858.84 418.66,858.84 418.66,894.84L418.66,1110.05C418.66,1139.55 492.84,1139.55 492.84,1169.05L492.84,1175.05"/><path class="pele-marker" d="M492.84,1182.05L489.48,1174.05L496.2,1174.05Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Ready_Start_0"><rect x="95.78" y="789.34" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="110.98" y="803.89" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Ready_Offer_0"><rect x="451.37" y="309.81" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="463.68" y="324.36" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Offer_Refuse_0"><rect x="534.23" y="789.34" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="546.54" y="803.89" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Offer_Consent_0"><rect x="373.26" y="501.3" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="388.46" y="515.85" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Consent_Refuse_0"><rect x="500.83" y="908.34" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="513.13" y="922.89" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Consent_Setup_0"><rect x="311.71" y="726.34" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="326.91" y="740.89" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Setup_Reinspect_0"><rect x="206.58" y="845.34" width="57.13" height="20" rx="3" fill="var(--_bg)"/><text x="235.15" y="859.89" text-anchor="middle">Success</text></g><g class="pele-edge-label" data-id="L_Installed_Start_0"><rect x="211.95" y="1132.55" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="227.15" y="1147.1" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Installed_Refuse_0"><rect x="262.34" y="1132.55" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="274.65" y="1147.1" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Setup_Refuse_0"><rect x="356.5" y="908.34" width="124.32" height="20" rx="3" fill="var(--_bg)"/><text x="418.66" y="922.89" text-anchor="middle">Failed or interrupted</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Up" transform="translate(384.46,47.5)"><rect x="-44.26" y="-23.5" width="88.53" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">hack up</text></g><g class="pele-node pele-shape-rect" data-id="Inspect" transform="translate(384.46,142.5)"><rect x="-79.69" y="-23.5" width="159.39" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inspect installation</text></g><g class="pele-node pele-shape-diam" data-id="Ready" transform="translate(384.46,250.65)"><polygon points="0,-36.65 58.65,0 0,36.65 -58.64,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-an