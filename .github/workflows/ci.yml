name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  config-compiler:
    name: Config compiler (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Verify release host architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bun -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected compiler release host");'
      - run: bun run check:config-compiler && bun run test:config-compiler
      - run: bun run build:config-compiler
      - name: Independently validate generated schema shape corpus
        run: |
          python3 -m venv "$RUNNER_TEMP/config-schema"
          "$RUNNER_TEMP/config-schema/bin/python" -m pip install -r scripts/config-schema-requirements.txt
          "$RUNNER_TEMP/config-schema/bin/python" scripts/check-config-schema.py
      - name: Test transport, projections and compiled bundle without host toolchains
        run: |
          bunx ultracite check scripts/build-config-compiler.ts scripts/build-release.ts scripts/check-release-config-compiler.ts scripts/check-config-compiler-cli.ts tests/config-compiler-build.test.ts tests/native-config-compiler.test.ts tests/native-config-command.test.ts tests/native-config-dto.test.ts tests/native-project-inputs.test.ts tests/native-project-inputs-acquisition-race.test.ts tests/release-download-installer.test.ts
          bun test tests/config-compiler-build.test.ts tests/native-config-compiler.test.ts tests/native-config-command.test.ts tests/native-config-dto.test.ts tests/native-project-inputs.test.ts tests/native-project-inputs-acquisition-race.test.ts
          bun run --cwd packages/cli typecheck
          bun test tests/release-download-installer.test.ts
          bun run build:release --skip-tests --out=dist/config-compiler-release
          bun scripts/check-release-config-compiler.ts dist/config-compiler-release
          bun scripts/check-config-compiler-cli.ts
          bunx ultracite check scripts/check-native-env-plan-cli.ts tests/native-env-plan-transport.test.ts tests/native-env-metadata.test.ts
          bun test tests/native-env-plan-transport.test.ts tests/native-env-metadata.test.ts tests/project-env-config.test.ts tests/project-env-metadata.test.ts
          bun scripts/check-native-env-plan-cli.ts
          bunx ultracite check scripts/check-native-host-plan-cli.ts tests/native-host-plan-transport.test.ts src/lib/native-host-plan-protocol.ts
          bun test tests/native-host-plan-transport.test.ts
          bun scripts/check-native-host-plan-cli.ts
          bunx ultracite check scripts/check-native-routing-plan-cli.ts src/lib/native-routing-plan-protocol.ts src/lib/native-routing-inputs.ts tests/native-routing-plan-transport.test.ts tests/native-routing-inputs.test.ts tests/native-routing-input-race.test.ts tests/native-routing-project.test.ts
          bun test tests/native-routing-plan-transport.test.ts tests/native-routing-inputs.test.ts tests/native-routing-input-race.test.ts tests/native-routing-project.test.ts
          bun scripts/check-native-routing-plan-cli.ts
          bunx ultracite check scripts/check-native-endpoint-plan-cli.ts src/lib/native-endpoint-plan-protocol.ts tests/native-endpoint-plan-transport.test.ts tests/native-endpoint-project.test.ts
          bun test tests/native-endpoint-plan-transport.test.ts tests/native-endpoint-project.test.ts
          bun scripts/check-native-endpoint-plan-cli.ts
          bunx ultracite check scripts/check-native-process-plan-cli.ts src/lib/native-process-plan-protocol.ts tests/native-process-plan-transport.test.ts tests/native-process-project.test.ts
          bun test tests/native-process-plan-transport.test.ts tests/native-process-project.test.ts
          bun scripts/check-native-process-plan-cli.ts
          bunx ultracite check scripts/check-native-acquisition-plan-cli.ts src/lib/native-acquisition-plan-protocol.ts tests/native-acquisition-plan-transport.test.ts tests/native-acquisition-project.test.ts
          bun test tests/native-acquisition-plan-transport.test.ts tests/native-acquisition-project.test.ts
          bun scripts/check-native-acquisition-plan-cli.ts
          bunx ultracite check scripts/check-native-config-import-cli.ts tests/native-config-import-plan.test.ts tests/native-config-import-preview.test.ts
          bun test tests/native-config-import-plan.test.ts tests/native-config-import-preview.test.ts
          bun scripts/check-native-config-import-cli.ts

  state-models:
    name: Runtime state models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mise for model-helper contract tests
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.12"
          install: false
          cache: false
          env: false
      - name: Validate release workflow syntax
        run: |
          for attempt in 1 2 3; do
            if mise install actionlint@1.7.12; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          mise x actionlint@1.7.12 -- actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/prerelease.yml
      - name: Fetch pinned model checker
        run: curl --fail --location --retry 2 --max-time 60 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
      - name: Check evidence validation and models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: |
          python3 -m unittest discover -s .ai/skills/hack-repo-tla/tests
          bun test tests/tla-result.test.ts
          bun run test:models
      - name: Check prepared-base benchmark harness controls
        run: python3 -m unittest discover -s tests/python -p test_prepared_base_benchmark.py
      - name: Check native frontend acceptance controls
        run: python3 -m unittest discover -s tests/python -p test_native_frontend_acceptance.py

  runtime-core:
    name: Candidate core (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install pinned Zig for guest helpers
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.12"
          install_args: zig
          add_shims_to_path: false
          cache: false
          env: false
      - name: Check candidate formatting
        run: cargo fmt --manifest-path packages/runtime-core/Cargo.toml --check
      - name: Lint candidate core
        run: cargo clippy --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-targets --jobs 2 -- -D warnings
      - name: Test candidate isolation contracts
        run: cargo test --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --jobs 2
      - name: Lint candidate optional features
        run: mise exec zig -- cargo clippy --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-targets --all-features --jobs 2 -- -D warnings
      - name: Test candidate optional feature contracts
        run: mise exec zig -- cargo test --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-features --jobs 2
      - name: Build and inspect local candidate
        run: |
          mise exec zig -- ./scripts/build-hack-local.sh
          ./hack-local info --json

  secret-scan:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@v1
        with:
          version: 8.30.1
          run: 'false'
      - name: Scan checked-out commit history
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
        run: |
          "$GITLEAKS_BIN" git . \
            --config .gitleaks.toml \
            --redact \
            --log-opts='--full-history --diff-filter=tuxdb HEAD' \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

  runtime-images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Install dependencies
        run: bun install
      - name: Build full runtime image
        run: |
          bun run scripts/build-node-runtime-image.ts \
            --variant node-runtime \
            --platform linux/amd64 \
            --tag hack-runtime-ci:full
      - name: Smoke full runtime image
        run: |
          docker run --rm --entrypoint hack hack-runtime-ci:full --help >/tmp/hack-full-help.txt
          grep -q "hack" /tmp/hack-full-help.txt
      - name: Build slim runtime image
        run: |
          bun run scripts/build-node-runtime-image.ts \
            --variant slim \
            --platform linux/amd64 \
            --tag hack-runtime-ci:slim
      - name: Smoke slim runtime image defaults
        run: |
          docker run --rm --entrypoint sh hack-runtime-ci:slim -lc 'command -v bun >/dev/null && command -v hack >/dev/null && test "${HACK_EXECUTION_MODE}" = "codex" && test "${HACK_DAEMON_DISABLE_DOCKER_EVENTS}" = "1" && hack --help >/tmp/hack-help.txt && grep -q "Usage:" /tmp/hack-help.txt'
      - name: Smoke slim runtime mounted-project env flow
        run: bash scripts/portable-container-smoke.sh hack-runtime-ci:slim linux/amd64

  docker-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install dependencies
        run: bun install
      - name: Create isolated Hack network
        run: docker network create --subnet 172.30.0.0/16 hack-dev
      - name: Prepare offline cache fixture images
        run: |
          docker pull alpine:3.20
          docker pull alpine:3.22
          docker pull node:24.11.0-bookworm-slim
          docker pull oven/bun:1.4.2-slim
          docker pull postgres:17.6-alpine
          docker pull lucaslorentz/caddy-docker-proxy:2.10.0-alpine
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build current-branch CLI and native config compiler
        run: |
          bun run build
          bun run build:config-compiler
      - name: Run local and Docker E2E
        env:
          HACK_E2E_CLI_BIN: ${{ github.workspace }}/dist/hack
        run: |
          HACK_E2E_DOCKER_HOST="${DOCKER_HOST:-$(docker context inspect --format '{{.Endpoints.docker.Host}}')}"
          HACK_E2E_NETWORK_SOURCE_REVISION="$(git rev-parse HEAD)"
          HACK_E2E_NETWORK_CLI_SHA256="$(sha256sum dist/hack | cut -d ' ' -f1)"
          HACK_E2E_NETWORK_COMPILER_SHA256="$(sha256sum dist/hack-config-compiler | cut -d ' ' -f1)"
          HACK_E2E_COMPOSE_PLUGIN_PATH="$(docker info --format '{{json .ClientInfo.Plugins}}' | bun -e 'import { realpath } from "node:fs/promises"; const value = await Bun.stdin.json(); const plugin = Array.isArray(value) ? value.find((entry) => entry && Object.hasOwn(entry, "Name") && entry.Name === "compose") : null; if (!(plugin && Object.hasOwn(plugin, "Path") && typeof plugin.Path === "string" && plugin.Path.startsWith("/"))) throw new Error("Installed Compose plugin path is unavailable"); process.stdout.write(await realpath(plugin.Path));')"
          HACK_E2E_COMPOSE_PLUGIN_SHA256="$(sha256sum "$HACK_E2E_COMPOSE_PLUGIN_PATH" | cut -d ' ' -f1)"
          export HACK_E2E_DOCKER_HOST HACK_E2E_NETWORK_SOURCE_REVISION HACK_E2E_NETWORK_CLI_SHA256 HACK_E2E_NETWORK_COMPILER_SHA256 HACK_E2E_COMPOSE_PLUGIN_PATH HACK_E2E_COMPOSE_PLUGIN_SHA256
          HACK_E2E_REQUIRE_DOCKER=1 HACK_E2E_REQUIRE_TMUX=1 bun run test:e2e:local:docker
      - name: Smoke container resource metadata without optional fields
        run: |
          probe_id=$(docker create --network none --read-only alpine:3.20 true)
          trap 'docker rm -f "$probe_id" >/dev/null' EXIT
          bun scripts/inspect-container-resources.ts --container "$probe_id" > "$RUNNER_TEMP/resource-probe.json"
          bun -e 'const r = await Bun.stdin.json(); if (r.probeStatus !== "not_running" || r.container.healthcheckIntervalNs !== null || r.container.writableLayerBytes !== null) throw new Error("Invalid optional resource metadata");' < "$RUNNER_TEMP/resource-probe.json"
          bun scripts/inspect-container-resources.ts --container "$probe_id" --storage > "$RUNNER_TEMP/resource-probe.json"
          bun -e 'const r = await Bun.stdin.json(); if (typeof r.container.writableLayerBytes !== "number") throw new Error("Missing writable-layer accounting");' < "$RUNNER_TEMP/resource-probe.json"

  test:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (Turbo)
        run: bun run turbo:typecheck
      - name: Privacy check
        run: bun run privacy:check
      - name: Quality checks (Turbo)
        run: bun run turbo:check
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Prepare matching compiler for private file owner tests
        run: bun run build:config-compiler
      - name: Tests (Turbo)
        run: bun run turbo:test
      - name: Build CLI
        run: bun run build
      - name: Build release smoke (no tests)
        run: bun run build:release --skip-tests --no-clean --out=dist/release-ci

  linux-process-lifetime:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"
      - name: Require native regression tools
        run: |
          command -v python3
          command -v lsof
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run process and terminal regressions
        run: bun test tests/daemon-command.test.ts tests/daemon-orphan.test.ts tests/host-exec-lifetime.test.ts tests/host-exec-tty.test.ts tests/shell-observation.test.ts
