<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 484 482" width="484" height="482" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M273.83,38C273.83,53.5 171.63,53.5 171.63,69L171.63,75"/><path class="pele-marker" d="M171.63,82L168.27,74L174.99,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M166.56,125L166.56,134.63C166.56,140.81 95.31,140.81 95.31,147L95.31,171C95.31,176.63 166.56,176.63 166.56,182.25L166.56,186"/><path class="pele-marker" d="M166.56,193L163.2,185L169.93,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M182.56,236L182.56,278.5C182.56,285.44 122.57,285.44 122.57,292.38L122.57,297"/><path class="pele-marker" d="M122.57,304L119.21,296L125.93,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M106.57,304L106.57,291C106.57,263.5 54.57,263.5 54.57,236L54.57,153C54.57,145.13 150.56,145.13 150.56,137.25L150.56,132"/><path class="pele-marker" d="M150.56,125L153.92,133L147.2,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M182.56,193L182.56,132"/><path class="pele-marker" d="M182.56,125L185.92,133L179.2,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M198.56,193L198.56,183.38C198.56,177.19 279.2,177.19 279.2,171L279.2,147C279.2,141.38 198.56,141.38 198.56,135.75L198.56,132"/><path class="pele-marker" d="M198.56,125L201.92,133L195.2,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M273.83,38C273.83,53.5 398.24,53.5 398.24,69L398.24,75"/><path class="pele-marker" d="M398.24,82L394.88,74L401.6,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M398.24,125L398.24,186"/><path class="pele-marker" d="M398.24,193L394.88,185L401.6,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M398.24,236L398.24,297"/><path class="pele-marker" d="M398.24,304L394.88,296L401.6,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M398.24,347L398.24,408"/><path class="pele-marker" d="M398.24,415L394.88,407L401.6,407Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="64.57" y="149" width="61.48" height="20" rx="3" fill="var(--_bg)"/><text x="95.31" y="163.55" text-anchor="middle">negotiate</text></g><g class="pele-edge-label" data-id="edge2"><rect x="152.2" y="256.5" width="60.73" height="20" rx="3" fill="var(--_bg)"/><text x="182.56" y="271.05" text-anchor="middle">link stalls</text></g><g class="pele-edge-label" data-id="edge3"><rect x="26" y="204.5" width="57.14" height="20" rx="3" fill="var(--_bg)"/><text x="54.57" y="219.05" text-anchor="middle">deadline</text></g><g class="pele-edge-label" data-id="edge4"><rect x="146.05" y="149" width="73.03" height="20" rx="3" fill="var(--_bg)"/><text x="182.56" y="163.55" text-anchor="middle">host restart</text></g><g class="pele-edge-label" data-id="edge5"><rect x="239.08" y="149" width="80.25" height="20" rx="3" fill="var(--_bg)"/><text x="279.2" y="163.55" text-anchor="middle">guest restart</text></g><g class="pele-edge-label" data-id="edge7"><rect x="339.33" y="149" width="117.82" height="20" rx="3" fill="var(--_bg)"/><text x="398.24" y="163.55" text-anchor="middle">reserve and spawn</text></g><g class="pele-edge-label" data-id="edge8"><rect x="366.07" y="256.5" width="64.35" height="20" rx="3" fill="var(--_bg)"/><text x="398.24" y="271.05" text-anchor="middle">reap child</text></g><g class="pele-edge-label" data-id="edge9"><rect x="340.78" y="367.5" width="114.93" height="20" rx="3" fill="var(--_bg)"/><text x="398.24" y="382.05" text-anchor="middle">host records result</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(273.83,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Disconnected" transform="translate(171.63,103.5)"><rect x="-61.43" y="-21.5" width="122.87" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Disconnected</text></g><g class="pele-node pele-state" data-id="Connected" transform="translate(182.56,214.5)"><rect x="-52.27" y="-21.5" width="104.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Connected</text></g><g class="pele-node pele-state" data-id="HalfOpen" transform="translate(114.57,325.5)"><rect x="-47.68" y="-21.5" width="95.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">HalfOpen</text></g><g class="pele-node pele-state" data-id="Absent" transform="translate(398.24,103.5)"><rect x="-39.35" y="-21.5" width="78.69" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Absent</text></g><g class="pele-node pele-state" data-id="Running" transform="translate(398.24,214.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Running</text></g><g class="pele-node pele-state" data-id="Terminal" transform="translate(398.24,325.5)"><rect x="-45.17" y="-21.5" width="90.34" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Terminal</text></g><g class="pele-node pele-state" data-id="Released" transform="translate(398.24,436.5)"><rect x="-47.68" y="-21.5" width="95.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Released</text></g></g></svg>