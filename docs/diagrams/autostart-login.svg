<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-sequence" viewBox="0 0 700 725" width="700" height="725" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="sequence" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g transform="translate(58.35,59)"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="291.56" y="-18.25">Autostart at login</tspan></text><g class="pele-lifelines" fill="none" stroke="var(--_b)"><path class="pele-lifeline" data-id="Login" d="M0,43V599"/><path class="pele-lifeline" data-id="Daemon" d="M151.14,43V599"/><path class="pele-lifeline" data-id="Engine" d="M347.1,43V599"/><path class="pele-lifeline" data-id="Registry" d="M469.95,43V599"/><path class="pele-lifeline" data-id="CLI" d="M585.46,43V599"/></g><g class="pele-frames" font-size="13" stroke="var(--_b)"><g class="pele-frame pele-frame-opt"><rect x="131.14" y="169" width="474.32" height="70" fill="none" style="rx:var(--_r)"/><rect x="131.14" y="169" width="31.11" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="146.69" y="182.85" text-anchor="middle" font-size="11" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">opt</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="245.03" y="183.55" text-anchor="middle">[Routing already installed]</text></g><g class="pele-frame pele-frame-alt"><rect x="131.14" y="357" width="474.32" height="174" fill="none" style="rx:var(--_r)"/><path d="M131.14,463H605.46" stroke-dasharray="4 4"/><rect x="136.14" y="467" width="132.45" height="16" rx="3" fill="var(--_bg)" stroke="none"/><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="202.37" y="479.55" text-anchor="middle">[Running or unknown]</text><rect x="131.14" y="357" width="26.84" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="144.56" y="370.85" text-anchor="middle" font-size="11" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">alt</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="224.5" y="371.55" text-anchor="middle">[Confirmed stopped]</text></g><g class="pele-frame pele-frame-loop"><rect x="121.14" y="251" width="494.32" height="328" fill="none" style="rx:var(--_r)"/><rect x="121.14" y="251" width="37.22" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="139.75" y="264.85" text-anchor="middle" font-size="11" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">loop</text><rect x="163.36" y="253" width="207.59" height="16" rx="3" fill="var(--_bg)" stroke="none"/><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="267.16" y="265.55" text-anchor="middle">[Unpaused projects in stable order]</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i1"><path d="M8,85H144.14"/><path class="pele-marker" d="M151.14,85L143.14,88.36L143.14,81.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="77" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="88.85" text-anchor="middle" font-size="11" fill="var(--_bg)" stroke="none">1</text></g></g><g class="pele-edge pele-message" data-id="i2"><path d="M159.14,121H462.95"/><path class="pele-marker" d="M469.95,121L461.95,124.36L461.95,117.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="143.14" y="113" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="151.14" y="124.85" text-anchor="middle" font-size="11" fill="var(--_bg)" stroke="none">2</text></g></g><g class="pele-edge pele-message" data-id="i3"><path d="M159.14,157H340.1"/><path class="pele-marker" d="M347.1,157L339.1,160.36L339.1,153.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="143.14" y="149" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="151.14" y="160.85" text-anchor="middle" font-size="11" fill="var(--_bg)" stroke="none">3</text></g></g><g class="pele-edge pele-message" data-id="i5"><path d="M159.14,227H578.46"/><path class="pele-marker" d="M585.46,227L577.46,230.36L577.46,223.64Z" fill="var(--_l)" stroke="n