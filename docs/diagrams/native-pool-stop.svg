<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1306 963" width="1306" height="963" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="653" y="40.75">PoolStop · run and pool stop</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M321.15,38L321.15,75"/><path class="pele-marker" d="M321.15,82L317.79,74L324.51,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M321.15,125L321.15,186"/><path class="pele-marker" d="M321.15,193L317.79,185L324.51,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M313.56,849L313.56,837C313.56,803 215.99,803 215.99,769L215.99,304C215.99,276.5 298.39,276.5 298.39,249L298.39,243"/><path class="pele-marker" d="M298.39,236L301.75,244L295.03,244Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M313.56,236L313.56,842"/><path class="pele-marker" d="M313.56,849L310.2,841L316.92,841Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M328.73,236L328.73,249C328.73,276.5 691.03,276.5 691.03,304L691.03,420"/><path class="pele-marker" d="M691.03,427L687.67,419L694.39,419Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M343.9,236L343.9,244.09C343.9,246.7 841.76,251.9 841.76,254.5L841.76,297"/><path class="pele-marker" d="M841.76,304L838.4,296L845.12,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M841.76,347L841.76,389.5C841.76,402.25 691.03,402.25 691.03,415L691.03,420"/><path class="pele-marker" d="M691.03,427L687.67,419L694.39,419Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M691.03,470L691.03,555"/><path class="pele-marker" d="M691.03,562L687.67,554L694.39,554Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M691.03,605L691.03,617C691.03,625.36 403.79,633.14 403.79,641.5L403.79,769C403.79,803 313.56,803 313.56,837L313.56,842"/><path class="pele-marker" d="M313.56,849L310.2,841L316.92,841Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M691.03,605L691.03,617C691.03,626.25 592.59,626.25 592.59,635.5L592.59,698.5"/><path class="pele-marker" d="M592.59,705.5L589.23,697.5L595.95,697.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M691.03,605L691.03,617C691.03,621.63 993.27,630.88 993.27,635.5L993.27,698.5"/><path class="pele-marker" d="M993.27,705.5L989.91,697.5L996.63,697.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M592.59,748.5L592.59,811.5C592.59,820.82 313.56,827.68 313.56,837L313.56,842"/><path class="pele-marker" d="M313.56,849L310.2,841L316.92,841Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="orphaned----note-12-orphaned"><path d="M599.34,448.5L643.34,448.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="recover-recover----note-13"><path d="M732.04,583.5L776.04,583.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="stranded-stranded----note-14"><path d="M1038.45,727L1082.45,727"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="finalizing-finalizing----note-15"><path d="M637.77,727L681.77,727"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="retained----note-16-retained"><path d="M226.46,870.5L270.46,870.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="294.38" y="145.5" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="321.15" y="160.05" text-anchor="middle">hack up</text></g><g class="pele-edge-label" data-id="edge2"><rect x="189.23" y="573.5" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="215.99" y="588.05" text-anchor="middle">hack up</text></g><g class="pele-edge-label" data-id="edge3"><rect x="278.49" y="438.5" width="70.14" height="20" rx="3" fill="var(--_bg)"/><text x="313.56" y="453.05" text-anchor="middle">hack down</text></g><g class="pele-edge-label" data-id="edge4"><rect x="612.98" y="315.5" width="156.11" height="20" rx="3" fill="var(--_bg)"/><text x="691.03" y="330.05" text-anchor="middle">runtime down, owner dies</text></g><g class="pele-edge-label" data-id="edge5"><rect x="781.41" y="256.5" width="120.7" height="20" rx="3" fill="var(--_bg)"/><text x="841.76" y="271.05" text-anchor="middle">VM or provider dies</text></g><g class="pele-edge-label" data-id="edge6"><rect x="781.41" y="367.5" width="120.71" height="20" rx="3" fill="var(--_bg)"/><text x="841.76" y="382.05" text-anchor="middle">hack native recover</text></g><g class="pele-edge-label" data-id="edge7"><rect x="617.31" y="502.5" width="147.44" height="20" rx="3" fill="var(--_bg)"/><text x="691.03" y="517.05" text-anchor="middle">hack up, down --recover</text></g><g class="pele-edge-label" data-id="edge8"><rect x="323.56" y="717" width="160.46" height="20" rx="3" fill="var(--_bg)"/><text x="403.79" y="731.55" text-anchor="middle">[boot ok, no HTTPS lease]</text></g><g class="pele-edge-label" data-id="edge9"><rect x="521.4" y="637.5" width="142.39" height="20" rx="3" fill="var(--_bg)"/><text x="592.59" y="652.05" text-anchor="middle">[boot ok, HTTPS lease]</text></g><g class="pele-edge-label" data-id="edge10"><rect x="956.75" y="637.5" width="73.04" height="20" rx="3" fill="var(--_bg)"/><text x="993.27" y="652.05" text-anchor="middle">[older boot]</text></g><g class="pele-edge-label" data-id="edge11"><rect x="512.37" y="789.5" width="160.45" height="20" rx="3" fill="var(--_bg)"/><text x="592.59" y="804.05" text-anchor="middle">lease released or archived</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(321.15,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="none" transform="translate(321.15,103.5)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">none</text></g><g class="pele-node pele-state ok" data-id="ready" transform="translate(321.15,214.5)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state wait" data-id="crashed" transform="translate(841.76,325.5)"><rect x="-42.68" y="-21.5" width="85.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">crashed</text></g><g class="pele-node pele-state" data-id="retained" transform="translate(313.56,870.5)"><rect x="-43.1" y="-21.5" width="86.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retained</text></g><g class="pele-node pele-state wait" data-id="orphaned" transform="translate(691.03,448.5)"><rect x="-47.69" y="-21.5" width="95.38" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">orphaned</text></g><g class="pele-node pele-state" data-id="recover" transform="translate(691.03,583.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">recover</text></g><g class="pele-node pele-state wait" data-id="finalizing" transform="translate(592.59,727)"><rect x="-45.17" y="-21.5" width="90.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">finalizing</text></g><g class="pele-node pele-state fail" data-id="stranded" transform="translate(993.27,727)"><rect x="-45.18" y="-21.5" width="90.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stranded</text></g><g class="pele-note" data-id="retained----note-16" transform="translate(125.23,870.5)"><path d="M-101.23,-33.5H93.23L101.23,-25.5V33.5H-101.23Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.23,-33.5V-25.5H101.23" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV NoDeadEnd: some named</tspan><tspan x="0" y="4.55">command always acts.</tspan><tspan x="0" y="21.55">PROP Recovers.</tspan></text></g><g class="pele-note" data-id="orphaned----note-12" transform="translate(499.54,448.5)"><path d="M-99.8,-33.5H91.8L99.8,-25.5V33.5H-99.8Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.8,-33.5V-25.5H99.8" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Receipt still ready-observed,</tspan><tspan x="0" y="4.55">owner dead, publication left.</tspan><tspan x="0" y="21.55">Pool stopped or in a new boot.</tspan></text></g><g class="pele-note" data-id="recover----note-13" transform="translate(867.51,583.5)"><path d="M-91.47,-33.5H83.47L91.47,-25.5V33.5H-91.47Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M83.47,-33.5V-25.5H91.47" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">runtime up first, then the</tspan><tspan x="0" y="4.55">existing recovery as its own</tspan><tspan x="0" y="21.55">request, data kept.</tspan></text></g><g class="pele-note" data-id="finalizing----note-15" transform="translate(794.93,727)"><path d="M-113.16,-42H105.16L113.16,-34V42H-113.16Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M105.16,-42V-34H113.16" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-20.95">Graph stopped, HTTPS lease held.</tspan><tspan x="0" y="-3.95">The old owner retires when its</tspan><tspan x="0" y="13.05">boot ends; up refuses until</tspan><tspan x="0" y="30.05">down --recover finishes.</tspan></text></g><g class="pele-note" data-id="stranded----note-14" transform="translate(1181.9,727)"><path d="M-99.44,-33.5H91.44L99.44,-25.5V33.5H-99.44Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.44,-33.5V-25.5H99.44" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Known gap: another boot, or a</tspan><tspan x="0" y="4.55">stop mid-recovery, came first.</tspan><tspan x="0" y="21.55">Follow-up: any-boot.</tspan></text></g></g></g></svg>