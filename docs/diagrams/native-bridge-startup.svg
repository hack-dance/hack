<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 949 1340" width="949" height="1340" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="474.5" y="40.75">Native bridge startup</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_ready_budget_0"><path d="M510.81,106L510.81,147"/><path class="pele-marker" d="M510.81,154L507.45,146L514.17,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_budget_before_0"><path d="M510.81,201L510.81,242"/><path class="pele-marker" d="M510.81,249L507.45,241L514.17,241Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_before_timeout_0"><path d="M516.51,357.31L516.51,370.31C516.51,401.59 679,401.59 679,432.88L679,945.95C679,970.64 379.72,970.64 379.72,995.33L379.72,1001.33"/><path class="pele-marker" d="M379.72,1008.33L376.36,1000.33L383.08,1000.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_before_check_0"><path d="M497.11,352.31L497.11,364.83C497.11,368.96 90.35,377.24 90.35,381.38L90.35,425.88"/><path class="pele-marker" d="M90.35,432.88L86.99,424.88L93.71,424.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_check_inspect_0"><path d="M104.69,479.88C104.69,497.38 242.95,497.38 242.95,514.88L242.95,520.88"/><path class="pele-marker" d="M242.95,527.88L239.59,519.88L246.31,519.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_check_fail_0"><path d="M82.35,479.88L82.35,806.16"/><path class="pele-marker" d="M82.35,813.16L78.99,805.16L85.71,805.16Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_inspect_fail_0"><path d="M229.99,574.88L229.99,693.88C229.99,747.02 122.99,747.02 122.99,800.16L122.99,806.16"/><path class="pele-marker" d="M122.99,813.16L119.63,805.16L126.35,805.16Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_inspect_recheck_0"><path d="M270.23,574.88C270.23,585.13 390.43,585.13 390.43,595.38L390.43,639.88"/><path class="pele-marker" d="M390.43,646.88L387.07,638.88L393.79,638.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_recheck_fail_0"><path d="M382.43,693.88L382.43,738.38C382.43,769.27 138.99,769.27 138.99,800.16L138.99,806.16"/><path class="pele-marker" d="M138.99,813.16L135.63,805.16L142.35,805.16Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_recheck_deadline_0"><path d="M451.77,693.88L451.77,758.88"/><path class="pele-marker" d="M451.77,765.88L448.41,757.88L455.13,757.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_deadline_timeout_0"><path d="M423.81,889.98C423.81,908.96 339.45,908.96 339.45,927.95L339.45,1001.33"/><path class="pele-marker" d="M339.45,1008.33L336.09,1000.33L342.81,1000.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_deadline_complete_0"><path d="M479.72,889.98C479.72,908.96 654.89,908.96 654.89,927.95L654.89,972.45"/><path class="pele-marker" d="M654.89,979.45L651.53,971.45L658.25,971.45Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_complete_wait_0"><path d="M612.83,1074.92L612.83,1166.21"/><path class="pele-marker" d="M612.83,1173.21L609.47,1165.21L616.19,1165.21Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_wait_before_0"><path d="M641.02,1173.21L641.02,1160.21C641.02,1149.96 787.08,1149.96 787.08,1139.71L787.08,432.88C787.08,396.59 532.51,396.59 532.51,360.31L532.51,354.31"/><path class="pele-marker" d="M532.51,347.31L535.87,355.31L529.15,355.31Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_complete_audit_0"><path d="M662.89,1096.21L662.89,1145.71C662.89,1151.4 828.98,1155.39 828.98,1161.08L828.98,1166.21"/><path class="pele-marker" d="M828.98,1173.21L825.62,1165.21L832.34,1165.21Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_fail_stop_0"><path d="M116.22,860.16L116.22,1101.21C116.22,1130.71 192.11,1130.71 192.11,1160.21L192.11,1166.21"/><path class="pele-marker" d="M192.11,1173.21L188.75,1165.21L195.47,1165.21Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_timeout_stop_0"><path d="M347.45,1072.33C347.45,1116.27 265.83,1116.27 265.83,1160.21L265.83,1166.21"/><path class="pele-marker" d="M265.83,1173.21L262.47,1165.21L269.19,1165.21Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_stop_retained_0"><path d="M228.97,1220.21L228.97,1261.21"/><path class="pele-marker" d="M228.97,1268.21L225.61,1260.21L232.33,1260.21Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_before_timeout_0"><rect x="667.78" y="541.38" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="679" y="555.92" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_before_check_0"><rect x="76.23" y="383.38" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="90.35" y="397.93" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_check_fail_0"><rect x="31.01" y="541.38" width="102.67" height="20" rx="3" fill="var(--_bg)"/><text x="82.35" y="555.92" text-anchor="middle">identity changed</text></g><g class="pele-edge-label" data-id="L_inspect_fail_0"><rect x="184.07" y="660.38" width="91.82" height="20" rx="3" fill="var(--_bg)"/><text x="229.99" y="674.93" text-anchor="middle">unsafe identity</text></g><g class="pele-edge-label" data-id="L_inspect_recheck_0"><rect x="337.66" y="597.38" width="105.55" height="20" rx="3" fill="var(--_bg)"/><text x="390.43" y="611.92" text-anchor="middle">ready or pending</text></g><g class="pele-edge-label" data-id="L_recheck_fail_0"><rect x="331.1" y="716.38" width="102.67" height="20" rx="3" fill="var(--_bg)"/><text x="382.43" y="730.93" text-anchor="middle">identity changed</text></g><g class="pele-edge-label" data-id="L_deadline_timeout_0"><rect x="328.23" y="929.95" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="339.45" y="944.5" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_deadline_complete_0"><rect x="640.78" y="929.95" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="654.89" y="944.5" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_complete_wait_0"><rect x="601.6" y="1123.71" width="22.46" height="20" rx="3" fill="var(--_bg)"/><text x="612.83" y="1138.26" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_complete_audit_0"><rect x="648.78" y="1123.71" width="28.23" height="20" rx="3" fill="var(--_bg)"/><text x="662.89" y="1138.26" text-anchor="middle">yes</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect live" data-id="ready" transform="translate(510.81,82.5)"><rect x="-58.85" y="-23.5" width="117.71" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Guest ready</text></g><g class="pele-node pele-shape-rect" data-id="budget" transform="translate(510.81,177.5)"><rect x="-87.82" y="-23.5" width="175.65" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Deadline: 10s + slots</text></g><g class="pele-node pele-shape-diam" data-id="before" transform="translate(510.81,304.94)"><polygon points="0,-55.94 89.5,0 0,55.94 -89.5,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Before deadline?</text></g><g class="pele-node pele-shape-rect fail" data-id="timeout" transform="translate(347.45,1040.33)"><rect x="-84.27" y="-32" width="168.54" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Timeout with socket</tspan><tspan x="0" y="15.25">counts</tspan></text></g><g class="pele-node pele-shape-rect live" data-id="check" transform="translate(90.35,456.38)"><rect x="-66.34" y="-23.5" width="132.69" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Verify provider</text></g><g class="pele-node pele-shape-rect live" data-id="inspect" transform="translate(242.95,551.38)"><rect x="-79.28" y="-23.5" width="158.55" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inspect all sockets</text></g><g class="pele-node pele-shape-rect fail" data-id="fail" transform="translate(116.22,836.66)"><rect x="-66.77" y="-23.5" width="133.55" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Refuse startup</text></g><g class="pele-node pele-shape-rect live" data-id="recheck" transform="translate(390.43,670.38)"><rect x="-76.35" y="-23.5" width="152.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Recheck provider</text></g><g class="pele-node pele-shape-diam" data-id="deadline" transform="translate(451.77,836.66)"><polygon points="0,-70.79 113.26,0 0,70.79 -113.26,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Before socket deadline?</text></g><g class="pele-node pele-shape-diam" data-id="complete" transform="translate(654.89,1040.33)"><polygon points="0,-60.88 97.41,0 0,60.88 -97.4,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">All sockets private?</text></g><g class="pele-node pele-shape-rect wait" data-id="wait" transform="translate(620.83,1196.71)"><rect x="-72.19" y="-23.5" width="144.38" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Wait up to 50ms</text></g><g class="pele-node pele-shape-rect ok" data-id="audit" transform="translate(828.98,1196.71)"><rect x="-95.96" y="-23.5" width="191.93" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Full audit then adoption</text></g><g class="pele-node pele-shape-rect" data-id="stop" transform="translate(228.97,1196.71)"><rect x="-88.86" y="-23.5" width="177.72" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Verified provider stop</text></g><g class="pele-node pele-shape-rect idle" data-id="retained" transform="translate(228.97,1291.71)"><rect x="-94.28" y="-23.5" width="188.57" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Retain failure evidence</text></g></g></svg>