name: web-postgres
services:
  # Installs dependencies once, inside Linux, into the shared node_modules volume.
  deps:
    image: oven/bun:1.4.4-slim
    working_dir: /app
    command: ["bun", "install", "--frozen-lockfile"]
    volumes:
      - ..:/app
      - node_modules:/app/node_modules

  web:
    image: oven/bun:1.4.4-slim
    working_dir: /app
    # A dev server stops at once on `hack down`: init passes it the stop signal.
    init: true
    stop_grace_period: 2s
    command: ["bun", "run", "dev"]
    volumes:
      - ..:/app
      - node_modules:/app/node_modules:ro
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    labels:
      caddy: web-postgres.hack.local
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.tls: internal
    networks:
      - hack-dev
      - default

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    # Checked every 250ms while starting, then every 10s once healthy.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
      start_period: 30s
      # Requires Docker Engine 25+. On older engines, remove start_interval to check at interval.
      start_interval: 250ms
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  node_modules: {}
  db-data: {}

networks:
  hack-dev:
    external: true
