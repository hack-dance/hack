-_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Known limits</text></g><g class="pele-node pele-shape-rect" data-id="R" transform="translate(501.29,162.5)"><rect x="-69.27" y="-23.5" width="138.54" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Reference map</text></g><g class="pele-node pele-shape-rect" data-id="I" transform="translate(220.44,325.5)"><rect x="-75.52" y="-23.5" width="151.04" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Prerelease install</text></g><g class="pele-node pele-shape-rect" data-id="A" transform="translate(417.31,325.5)"><rect x="-81.35" y="-23.5" width="162.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Command contract</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(601.26,325.5)"><rect x="-62.59" y="-23.5" width="125.19" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Config import</text></g><g class="pele-node pele-shape-rect" data-id="F" transform="translate(767.7,325.5)"><rect x="-63.85" y="-23.5" width="127.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Full reference</text></g><g class="pele-node pele-shape-rect" data-id="U" transform="translate(676.48,47.5)"><rect x="-66.35" y="-23.5" width="132.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Old site routes</text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(676.48,162.5)"><rect x="-49.67" y="-23.5" width="99.35" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--