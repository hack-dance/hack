<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1008 811" width="1008" height="811" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="504" y="40.75">PoolStop · run and pool stop</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M357.55,38L357.55,75"/><path class="pele-marker" d="M357.55,82L354.19,74L360.91,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M357.55,125L357.55,186"/><path class="pele-marker" d="M357.55,193L354.19,185L360.91,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M313.56,697L313.56,685C313.56,651 186.77,651 186.77,617L186.77,304C186.77,276.5 334.79,276.5 334.79,249L334.79,243"/><path class="pele-marker" d="M334.79,236L338.15,244L331.43,244Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M349.96,236L349.96,249C349.96,276.5 268.6,276.5 268.6,304L268.6,617C268.6,651 313.56,651 313.56,685L313.56,690"/><path class="pele-marker" d="M313.56,697L310.2,689L316.92,689Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M365.13,236L365.13,383.5C365.13,398.78 624.96,399.72 624.96,415L624.96,420"/><path class="pele-marker" d="M624.96,427L621.6,419L628.32,419Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M380.3,236L380.3,244.09C380.3,246.7 700.33,251.9 700.33,254.5L700.33,297"/><path class="pele-marker" d="M700.33,304L696.97,296L703.69,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M700.33,347C700.33,356.25 624.96,356.25 624.96,365.5L624.96,420"/><path class="pele-marker" d="M624.96,427L621.6,419L628.32,419Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M624.96,470L624.96,555"/><path class="pele-marker" d="M624.96,562L621.6,554L628.32,554Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M624.96,605L624.96,617C624.96,626.25 560.74,626.25 560.74,635.5L560.74,659.5C560.74,670.02 313.56,674.48 313.56,685L313.56,690"/><path class="pele-marker" d="M313.56,697L310.2,689L316.92,689Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M624.96,605L624.96,617C624.96,626.25 689.18,626.25 689.18,635.5L689.18,690"/><path class="pele-marker" d="M689.18,697L685.82,689L692.54,689Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="orphaned----note-10-orphaned"><path d="M533.28,448.5L577.28,448.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="recover-recover----note-11"><path d="M665.97,583.5L709.97,583.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="stranded-stranded----note-12"><path d="M734.37,718.5L778.37,718.5"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="retained----note-13-retained"><path d="M226.46,718.5L270.46,718.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="330.78" y="145.5" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="357.55" y="160.05" text-anchor="middle">hack up</text></g><g class="pele-edge-label" data-id="edge2"><rect x="160.01" y="438.5" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="186.77" y="453.05" text-anchor="middle">hack up</text></g><g class="pele-edge-label" data-id="edge3"><rect x="233.53" y="438.5" width="70.14" height="20" rx="3" fill="var(--_bg)"/><text x="268.6" y="453.05" text-anchor="middle">hack down</text></g><g class="pele-edge-label" data-id="edge4"><rect x="287.08" y="315.5" width="156.11" height="20" rx="3" fill="var(--_bg)"/><text x="365.13" y="330.05" text-anchor="middle">runtime down, owner dies</text></g><g class="pele-edge-label" data-id="edge5"><rect x="639.98" y="256.5" width="120.7" height="20" rx="3" fill="var(--_bg)"/><text x="700.33" y="271.05" text-anchor="middle">VM or provider dies</text></g><g class="pele-edge-label" data-id="edge6"><rect x="564.61" y="367.5" width="120.71" height="20" rx="3" fill="var(--_bg)"/><text x="624.96" y="382.05" text-anchor="middle">hack native recover</text></g><g class="pele-edge-label" data-id="edge7"><rect x="551.24" y="502.5" width="147.44" height="20" rx="3" fill="var(--_bg)"/><text x="624.96" y="517.05" text-anchor="middle">hack up, down --recover</text></g><g class="pele-edge-label" data-id="edge8"><rect x="488.83" y="637.5" width="143.84" height="20" rx="3" fill="var(--_bg)"/><text x="560.74" y="652.05" text-anchor="middle">[same or previous boot]</text></g><g class="pele-edge-label" data-id="edge9"><rect x="652.66" y="637.5" width="73.04" height="20" rx="3" fill="var(--_bg)"/><text x="689.18" y="652.05" text-anchor="middle">[older boot]</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(357.55,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="none" transform="translate(357.55,103.5)"><rect x="-32.68" y="-21.5" width="65.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">none</text></g><g class="pele-node pele-state ok" data-id="ready" transform="translate(357.55,214.5)"><rect x="-34.76" y="-21.5" width="69.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ready</text></g><g class="pele-node pele-state wait" data-id="crashed" transform="translate(700.33,325.5)"><rect x="-42.68" y="-21.5" width="85.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">crashed</text></g><g class="pele-node pele-state" data-id="retained" transform="translate(313.56,718.5)"><rect x="-43.1" y="-21.5" width="86.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">retained</text></g><g class="pele-node pele-state wait" data-id="orphaned" transform="translate(624.96,448.5)"><rect x="-47.69" y="-21.5" width="95.38" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">orphaned</text></g><g class="pele-node pele-state" data-id="recover" transform="translate(624.96,583.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">recover</text></g><g class="pele-node pele-state fail" data-id="stranded" transform="translate(689.18,718.5)"><rect x="-45.18" y="-21.5" width="90.37" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">stranded</text></g><g class="pele-note" data-id="retained----note-13" transform="translate(125.23,718.5)"><path d="M-101.23,-33.5H93.23L101.23,-25.5V33.5H-101.23Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.23,-33.5V-25.5H101.23" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">INV NoDeadEnd: some named</tspan><tspan x="0" y="4.55">command always acts.</tspan><tspan x="0" y="21.55">PROP Recovers.</tspan></text></g><g class="pele-note" data-id="orphaned----note-10" transform="translate(433.47,448.5)"><path d="M-99.8,-33.5H91.8L99.8,-25.5V33.5H-99.8Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M91.8,-33.5V-25.5H99.8" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Receipt still ready-observed,</tspan><tspan x="0" y="4.55">owner dead, publication left.</tspan><tspan x="0" y="21.55">Pool stopped or in a new boot.</tspan></text></g><g class="pele-note" data-id="recover----note-11" transform="translate(805.06,583.5)"><path d="M-95.1,-33.5H87.1L95.1,-25.5V33.5H-95.1Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M87.1,-33.5V-25.5H95.1" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Starts a stopped pool, then</tspan><tspan x="0" y="4.55">the existing recovery with</tspan><tspan x="0" y="21.55">data kept (RecoverStopped).</tspan></text></g><g class="pele-note" data-id="stranded----note-12" transform="translate(880.7,718.5)"><path d="M-102.33,-33.5H94.33L102.33,-25.5V33.5H-102.33Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M94.33,-33.5V-25.5H102.33" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-12.45">Known gap: another boot came</tspan><tspan x="0" y="4.55">first. Follow-up recovers from</tspan><tspan x="0" y="21.55">any earlier boot (any-boot).</tspan></text></g></g></g></svg>