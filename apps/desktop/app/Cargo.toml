[package]
name = "hack-desktop"
description = "Minimal native desktop app for Hack (unsupported preview)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hack-desktop"
path = "src/main.rs"

[features]
# Offscreen rendering of fixture states to PNG (used for design evidence).
screenshots = ["gpui-kit/test-support", "dep:image", "hack-desktop-ui/screenshots"]
# The terminal panel (libghostty-vt): logs, container and host shells on
# app-owned PTYs. Always built on macOS (see the macOS dependency below and
# build.rs); elsewhere this feature turns it on. Either way it needs the
# inputs term/scripts/provision-ghostty.sh fetches (scripts/build.sh runs it).
# Without the panel the window keeps its Logs tab.
terminal = ["dep:hack-desktop-term", "hack-desktop-term/ghostty"]

[dependencies]
serde_json.workspace = true
hack-desktop-core.workspace = true
hack-desktop-ui.workspace = true
hack-desktop-term = { workspace = true, optional = true }
gpui-kit.workspace = true
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# Copying an env value marks the clipboard item concealed (the
# org.nspasteboard.ConcealedType convention), which GPUI's clipboard API
# cannot. All three are already in Cargo.lock through GPUI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSArray"] }
# The terminal panel is part of the macOS app, not an opt-in feature: the
# owner's build does not depend on a flag. build.rs turns on `hack_terminal`.
hack-desktop-term = { workspace = true, features = ["ghostty"] }
