<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 422 854" width="422" height="854" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_S_P_0"><path d="M209.21,71L209.21,112"/><path class="pele-marker" d="M209.21,119L205.85,111L212.57,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_P_C_0"><path d="M209.21,166L209.21,207"/><path class="pele-marker" d="M209.21,214L205.85,206L212.57,206Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C_D_0"><path d="M209.21,261L209.21,302"/><path class="pele-marker" d="M209.21,309L205.85,301L212.57,301Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_D_N_0"><path d="M193.27,415.58C193.27,430.81 114.95,430.81 114.95,446.04L114.95,490.54"/><path class="pele-marker" d="M114.95,497.54L111.59,489.54L118.31,489.54Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_D_E_0"><path d="M225.15,415.58C225.15,430.81 303.48,430.81 303.48,446.04L303.48,490.54"/><path class="pele-marker" d="M303.48,497.54L300.12,489.54L306.84,489.54Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_N_O_0"><path d="M114.95,544.54L114.95,585.54"/><path class="pele-marker" d="M114.95,592.54L111.59,584.54L118.31,584.54Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_O_K_0"><path d="M114.95,639.54L114.95,680.54"/><path class="pele-marker" d="M114.95,687.54L111.59,679.54L118.31,679.54Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_K_X_0"><path d="M114.95,734.54L114.95,775.54"/><path class="pele-marker" d="M114.95,782.54L111.59,774.54L118.31,774.54Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_D_N_0"><rect x="102.64" y="448.04" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="114.95" y="462.59" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_D_E_0"><rect x="288.28" y="448.04" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="303.48" y="462.59" text-anchor="middle">Yes</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="S" transform="translate(209.21,47.5)"><rect x="-66.36" y="-23.5" width="132.72" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Status request</text></g><g class="pele-node pele-shape-rect" data-id="P" transform="translate(209.21,142.5)"><rect x="-59.26" y="-23.5" width="118.52" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Project rows</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(209.21,237.5)"><rect x="-92.62" y="-23.5" width="185.24" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Caddy address lookup</text></g><g class="pele-node pele-shape-diam" data-id="D" transform="translate(209.21,367.27)"><polygon points="0,-58.27 93.24,0 0,58.27 -93.23,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Docker on PATH?</text></g><g class="pele-node pele-shape-rect" data-id="N" transform="translate(114.95,521.04)"><rect x="-54.26" y="-23.5" width="108.53" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Return null</text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(303.48,521.04)"><rect x="-94.27" y="-23.5" width="188.55" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Existing Docker lookup</text></g><g class="pele-node pele-shape-rect" data-id="O" transform="translate(114.95,616.04)"><rect x="-90.94" y="-23.5" width="181.89" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Omit optional address</text></g><g class="pele-node pele-shape-rect" data-id="K" transform="translate(114.95,711.04)"><rect x="-83.86" y="-23.5" width="167.73" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Keep project details</text></g><g class="pele-node pele-shape-rect" data-id="X" transform="translate(114.95,806.04)"><rect x="-47.17" y="-23.5" width="94.35" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exit zero</text></g></g></svg>