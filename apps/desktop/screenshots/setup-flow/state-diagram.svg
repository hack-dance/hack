<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 874 1269" width="874" height="1269" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="437" y="40.75">Desktop setup · navigation</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M447.03,38L447.03,75"/><path class="pele-marker" d="M447.03,82L443.67,74L450.39,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M447.03,112L447.03,124.25C447.03,134.01 395,140 310.1,140C225.2,140 173.16,159.76 173.16,192L173.16,216C173.16,220.38 288.87,222.87 288.87,227.25L288.87,231"/><path class="pele-marker" d="M288.87,238L285.51,230L292.23,230Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M304.87,238L304.87,192C304.87,167.2 331.88,152 375.95,152C420.02,152 447.03,141.74 447.03,125L447.03,119"/><path class="pele-marker" d="M447.03,112L450.39,120L443.67,120Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M447.03,112L447.03,152C447.03,172 434.91,172 434.91,192L434.91,231"/><path class="pele-marker" d="M434.91,238L431.55,230L438.27,230Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M434.91,281L434.91,323.5C434.91,329.75 558.21,331.13 558.21,337.38L558.21,342"/><path class="pele-marker" d="M558.21,349L554.85,341L561.57,341Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M447.03,112L447.03,125C447.03,161.5 574.21,161.5 574.21,198L574.21,342"/><path class="pele-marker" d="M574.21,349L570.85,341L577.57,341Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M562.21,392L562.21,453"/><path class="pele-marker" d="M562.21,460L558.85,452L565.57,452Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge