<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 835 1046" width="835" height="1046" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-clusters"><g class="pele-cluster" data-id="trial"><rect x="536.62" y="171.91" width="273.7" height="635.42" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="ci"><rect x="45.06" y="275.37" width="451.56" height="428.51" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="97.81" y="300.12" text-anchor="middle">CI workflow</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_event_scope_0"><path d="M476.94,94.91C476.94,107.66 296.41,107.66 296.41,120.41L296.41,327.37"/><path class="pele-marker" d="M296.41,334.37L293.05,326.37L299.77,326.37Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scope_four_0"><path d="M280.97,440.23C280.97,455.3 195.47,455.3 195.47,470.38L195.47,514.88"/><path class="pele-marker" d="M195.47,521.88L192.11,513.88L198.83,513.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scope_skip_0"><path d="M311.86,440.23C311.86,455.3 397.35,455.3 397.35,470.38L397.35,514.88"/><path class="pele-marker" d="M397.35,521.88L393.99,513.88L400.71,513.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_four_aggregate_0"><path d="M142.67,568.88L142.67,609.88"/><path class="pele-marker" d="M142.67,616.88L139.31,608.88L146.03,608.88Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_four_evidence_0"><path d="M248.28,568.88L248.28,848.33"/><path class="pele-marker" d="M248.28,855.33L244.92,847.33L251.64,847.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_aggregate_evidence_0"><path d="M142.67,663.88L142.67,848.33"/><path class="pele-marker" d="M142.67,855.33L139.31,847.33L146.03,847.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_evidence_prerelease_0"><path d="M141.11,902.33C141.11,912.58 94.94,912.58 94.94,922.83L94.94,967.33"/><path class="pele-marker" d="M94.94,974.33L91.58,966.33L98.3,966.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_evidence_release_0"><path d="M249.84,902.33C249.84,912.58 296.01,912.58 296.01,922.83L296.01,967.33"/><path class="pele-marker" d="M296.01,974.33L292.65,966.33L299.37,966.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_event_opt_0"><path d="M492.94,94.91C492.94,107.66 673.47,107.66 673.47,120.41L673.47,223.91"/><path class="pele-marker" d="M673.47,230.91L670.11,222.91L676.83,222.91Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_opt_trialscope_0"><path d="M673.47,376.97L673.47,441.97"/><path class="pele-marker" d="M673.47,448.97L670.11,440.97L676.83,440.97Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_trialscope_six_0"><path d="M673.47,573.33L673.47,638.33"/><path class="pele-marker" d="M673.47,645.33L670.11,637.33L676.83,637.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_six_metrics_0"><path d="M673.47,692.33L673.47,733.33"/><path class="pele-marker" d="M673.47,740.33L670.11,732.33L676.83,732.33Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-cluster-titles"><g class="pele-cluster-title" data-id="trial"><text fill="none" stroke="color-mix(in srgb,var(--_a) 50%,var(--_bg))" stroke-width="5" stroke-linejoin="round" x="626.48" y="196.66" text-anchor="middle">Separate trial workflow</text><text class="pele-cluster-label" fill="var(--_m)" x="626.48" y="196.66" text-anchor="middle">Separate trial workflow</text></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_event_scope_0"><rect x="231.36" y="122.41" width="130.11" height="20" rx="3" fill="var(--_bg)"/><text x="296.41" y="136.96" text-anchor="middle">Push, PR or dispatch</text></g><g class="pele-edge-label" data-id="L_scope_four_0"><rect x="180.27" y="472.38" width="30.4" height="20" rx="3" fill="var(--_bg)"/><tex