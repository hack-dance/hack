<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 543 812" width="543" height="812" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="dark"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="271.5" y="40.75">Env values and plaintext boundaries</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_layers_cli_0"><path d="M128.64,106C128.64,123.5 260.87,123.5 260.87,141L260.87,147"/><path class="pele-marker" d="M260.87,154L257.51,146L264.23,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyFile_cli_0"><path d="M287.4,106L287.4,147"/><path class="pele-marker" d="M287.4,154L284.04,146L290.76,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_keyEnv_cli_0"><path d="M456.35,106C456.35,123.5 318.75,123.5 318.75,141L318.75,147"/><path class="pele-marker" d="M318.75,154L315.39,146L322.11,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cli_filter_0"><path d="M274.23,201L274.23,337"/><path class="pele-marker" d="M274.23,344L270.87,336L277.59,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_filter_child_0"><path d="M289.81,408L289.81,449"/><path class="pele-marker" d="M289.81,456L286.45,448L293.17,448Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cli_mux_0"><path d="M318.75,201C318.75,218.5 360.24,218.5 360.24,236L360.24,242"/><path class="pele-marker" d="M360.24,249L356.88,241L363.6,241Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_mux_filter_0"><path d="M360.24,296L360.24,337"/><path class="pele-marker" d="M360.24,344L356.88,336L363.6,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_child_output_0"><path d="M276.3,503C276.3,527 190.04,527 190.04,551L190.04,693C190.04,710.5 202.17,710.5 202.17,728L202.17,734"/><path class="pele-marker" d="M202.17,741L198.81,733L205.53,733Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_layers_output_0"><path d="M95.03,106L95.03,693C95.03,710.5 186.17,710.5 186.17,728L186.17,734" stroke-dasharray="3 4"/><path class="pele-marker" d="M186.17,741L182.81,733L189.53,733Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_child_disk_0"><path d="M303.33,503C303.33,520.5 367.41,520.5 367.41,538L367.41,544"/><path class="pele-marker" d="M367.41,551L364.05,543L370.77,543Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_disk_scan_0"><path d="M356.38,598C356.38,615.5 275.22,615.5 275.22,633L275.22,639"/><path class="pele-marker" d="M275.22,646L271.86,638L278.58,638Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scan_output_0"><path d="M275.22,693C275.22,710.5 249.79,710.5 249.79,728L249.79,734"/><path class="pele-marker" d="M249.79,741L246.43,733L253.15,733Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_disk_output_0"><path d="M378.44,598C378.44,622 424.21,622 424.21,646L424.21,693C424.21,710.5 265.79,710.5 265.79,728L265.79,734"/><path class="pele-marker" d="M265.79,741L262.43,733L269.15,733Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_layers_output_0"><rect x="26" y="366" width="138.05" height="20" rx="3" fill="var(--_bg)"/><text x="95.03" y="380.55" text-anchor="middle">Error kind and location</text></g><g class="pele-edge-label" data-id="L_disk_output_0"><rect x="362.4" y="659.5" width="123.61" height="20" rx="3" fill="var(--_bg)"/><text x="424.21" y="674.05" text-anchor="middle">Native: no redaction</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="layers" transform="translate(103.03,82.5)"><rect x="-77.61" y="-23.5" width="155.22" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Project env inputs</text></g><g class="pele-node pele-shape-rect live" data-id="cli" transform="translate(289.81,177.5)"><rect x="-80.94" y="-23.5" width="161.88" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Resolve env in CLI</text></g><g class="pele-node pele-shape-rect" data-id="keyFile" transform="translate(287.4,82.5)"><rect x="-66.76" y="-23.5" width="133.53" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Project key file</text></g><g class="pele-node pele-shape-rect" data-id="keyEnv" transform="translate(456.35,82.5)"><rect x="-62.18" y="-23.5" width="124.37" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Key from env</text></g><g class="pele-node pele-shape-rect ok" data-id="filter" transform="translate(289.81,376)"><rect x="-83.01" y="-32" width="166.02" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Filter user-child key</tspan><tspan x="0" y="15.25">material</tspan></text></g><g class="pele-node pele-shape-rect live" data-id="child" transform="translate(289.81,479.5)"><rect x="-65.51" y="-23.5" width="131.03" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">User child env</text></g><g class="pele-node pele-shape-rect wait" data-id="mux" transform="translate(360.24,272.5)"><rect x="-58.01" y="-23.5" width="116.03" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Mux env file</text></g><g class="pele-node pele-shape-rect wait" data-id="output" transform="translate(219.32,764.5)"><rect x="-73.03" y="-23.5" width="146.06" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Logs and results</text></g><g class="pele-node pele-shape-rect wait" data-id="disk" transform="translate(367.41,574.5)"><rect x="-63.03" y="-23.5" width="126.06" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stored output</text></g><g class="pele-node pele-shape-rect" data-id="scan" transform="translate(275.22,669.5)"><rect x="-57.18" y="-23.5" width="114.36" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Partial scan</text></g></g></svg>