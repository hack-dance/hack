<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 513 734" width="513" height="734" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="256.5" y="40.75">Observe projects without registration writes</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_CLI_Registry_0"><path d="M208.43,106C208.43,127.75 160.8,127.75 160.8,149.5L160.8,155.5"/><path class="pele-marker" d="M160.8,162.5L157.44,154.5L164.16,154.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_CLI_Runtime_0"><path d="M302.13,106C302.13,123.5 349.76,123.5 349.76,141L349.76,147"/><path class="pele-marker" d="M349.76,154L346.4,146L353.12,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Registry_Views_0"><path d="M160.8,209.5C160.8,231.25 212.58,231.25 212.58,253L212.58,259"/><path class="pele-marker" d="M212.58,266L209.22,258L215.94,258Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Runtime_Views_0"><path d="M349.76,218C349.76,235.5 297.97,235.5 297.97,253L297.97,259"/><path class="pele-marker" d="M297.97,266L294.61,258L301.33,258Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Views_Native_0"><path d="M255.28,330L255.28,371"/><path class="pele-marker" d="M255.28,378L251.92,370L258.64,370Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Native_Unknown_0"><path d="M247.09,473.28C247.09,486.09 129.12,486.09 129.12,498.9L129.12,543.4"/><path class="pele-marker" d="M129.12,550.4L125.76,542.4L132.48,542.4Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Native_Project_0"><path d="M263.47,473.28C263.47,486.09 381.44,486.09 381.44,498.9L381.44,551.9"/><path class="pele-marker" d="M381.44,558.9L378.08,550.9L384.8,550.9Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Unknown_JSON_0"><path d="M129.12,614.4C129.12,631.9 213.44,631.9 213.44,649.4L213.44,655.4"/><path class="pele-marker" d="M213.44,662.4L210.08,654.4L216.8,654.4Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Project_JSON_0"><path d="M381.44,605.9C381.44,627.65 297.12,627.65 297.12,649.4L297.12,655.4"/><path class="pele-marker" d="M297.12,662.4L293.76,654.4L300.48,654.4Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Native_Unknown_0"><rect x="113.92" y="500.9" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="129.12" y="515.45" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Native_Project_0"><rect x="369.13" y="500.9" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="381.44" y="515.45" text-anchor="middle">No</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="CLI" transform="translate(255.28,82.5)"><rect x="-98.85" y="-23.5" width="197.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">projects --json --observe</text></g><g class="pele-node pele-shape-rect" data-id="Registry" transform="translate(160.8,186)"><rect x="-62.59" y="-23.5" width="125.19" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Read registry</text></g><g class="pele-node pele-shape-rect" data-id="Runtime" transform="translate(349.76,186)"><rect x="-86.36" y="-32" width="172.73" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Read Docker ps and</tspan><tspan x="0" y="15.25">inspect</tspan></text></g><g class="pele-node pele-shape-rect" data-id="Views" transform="translate(255.28,298)"><rect x="-94.69" y="-32" width="189.39" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Build registered project</tspan><tspan x="0" y="15.25">views</tspan></text></g><g class="pele-node pele-shape-diam" data-id="Native" transform="translate(255.28,428.2)"><polygon points="0,-50.2 80.32,0 0,50.2 -80.32,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Native inputs?</text></g><g class="pele-node pele-shape-rect" data-id="Unknown" transform="translate(129.12,582.4)"><rect x="-105.12" y="-32" width="210.24" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Keep row, native observer</tspan><tspan x="0" y="15.25">required</tspan></text></g><g class="pele-node pele-shape-rect" data-id="Project" transform="translate(381.44,582.4)"><rect x="-107.2" y="-23.5" width="214.4" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Project activity or unknown</text></g><g class="pele-node pele-shape-rect" data-id="JSON" transform="translate(255.28,685.9)"><rect x="-93.84" y="-23.5" width="187.68" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Full or summary JSON</text></g></g></svg>