<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 531 746" width="531" height="746" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="265.5" y="40.75">Shared command drawer</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M222.46,38L222.46,75"/><path class="pele-marker" d="M222.46,82L219.1,74L225.82,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M222.46,125L222.46,193L222.46,189.5"/><path class="pele-marker" d="M222.46,196.5L219.1,188.5L225.82,188.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M222.46,239.5L222.46,285.5C222.46,292.44 147.51,292.44 147.51,299.38L147.51,304"/><path class="pele-marker" d="M147.51,311L144.15,303L150.87,303Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M222.46,239.5L222.46,243C222.46,255.25 297.41,255.25 297.41,267.5L297.41,415"/><path class="pele-marker" d="M297.41,422L294.05,414L300.77,414Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M139.51,354C139.51,363.25 80.58,363.25 80.58,372.5L80.58,415"/><path class="pele-marker" d="M80.58,422L77.22,414L83.94,414Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M155.51,354C155.51,363.25 214.44,363.25 214.44,372.5L214.44,396.5C214.44,403.44 281.41,403.44 281.41,410.38L281.41,415"/><path class="pele-marker" d="M281.41,422L278.05,414L284.77,414Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M80.58,465L80.58,507.5C80.58,513.62 206.46,515.26 206.46,521.38L206.46,526"/><path class="pele-marker" d="M206.46,533L203.1,525L209.82,525Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M283.4,465L283.4,507.5C283.4,514.44 222.46,514.44 222.46,521.38L222.46,526"/><path class="pele-marker" d="M222.46,533L219.1,525L225.82,525Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M206.46,576L206.46,585.63C206.46,591.81 163.25,591.81 163.25,598L163.25,622C163.25,627.63 206.46,627.63 206.46,633.25L206.46,637"/><path class="pele-marker" d="M206.46,644L203.1,636L209.82,636Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M222.46,644L222.46,634.38C222.46,628.19 265.67,628.19 265.67,622L265.67,598C265.67,592.38 222.46,592.38 222.46,586.75L222.46,583"/><path class="pele-marker" d="M222.46,576L225.82,584L219.1,584Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Running-Running----note-10"><path d="M266.39,218L310.39,218"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="206.54" y="145.5" width="31.84" height="20" rx="3" fill="var(--_bg)"/><text x="222.46" y="160.05" text-anchor="middle">Run</text></g><g class="pele-edge-label" data-id="edge2"><rect x="202.2" y="263.5" width="40.51" height="20" rx="3" fill="var(--_bg)"/><text x="222.46" y="278.05" text-anchor="middle">Exit 0</text></g><g class="pele-edge-label" data-id="edge3"><rect x="224.77" y="322.5" width="145.27" height="20" rx="3" fill="var(--_bg)"/><text x="297.41" y="337.05" text-anchor="middle">Nonzero or launch error</text></g><g class="pele-edge-label" data-id="edge4"><rect x="35.4" y="374.5" width="90.37" height="20" rx="3" fill="var(--_bg)"/><text x="80.58" y="389.05" text-anchor="middle">Check passed</text></g><g class="pele-edge-label" data-id="edge5"><rect x="145.77" y="374.5" width="137.35" height="20" rx="3" fill="var(--_bg)"/><text x="214.44" y="389.05" text-anchor="middle">Check needs attention</text></g><g class="pele-edge-label" data-id="edge6"><rect x="26" y="485.5" width="109.17" height="20" rx="3" fill="var(--_bg)"/><text x="80.58" y="500.05" text-anchor="middle">After 1.5 seconds</text></g><g class="pele-edge-label" data-id="edge7"><rect x="241.11" y="485.5" width="84.57" height="20" rx="3" fill="var(--_bg)"/><text x="283.4" y="500.05" text-anchor="middle">Close drawer</text></g><g class="pele-edge-label" data-id="edge8"><rect x="123.12" y="600" width="80.27" height="20" rx="3" fill="var(--_bg)"/><text x="163.25" y="614.55" text-anchor="middle">Show output</text></g><g class="pele-edge-label" data-id="edge9"><rect x="223.38" y="600" width="84.57" height="20" rx="3" fill="var(--_bg)"/><text x="265.67" y="614.55" text-anchor="middle">Close drawer</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(222.46,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Ready" transform="translate(222.46,103.5)"><rect x="-37.67" y="-21.5" width="75.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Ready</text></g><g class="pele-node pele-state wait" data-id="Checking" transform="translate(147.51,332.5)"><rect x="-47.26" y="-21.5" width="94.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Checking</text></g><g class="pele-node pele-state fail" data-id="Failed" transform="translate(283.4,443.5)"><rect x="-36.42" y="-21.5" width="72.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Failed</text></g><g class="pele-node pele-state ok" data-id="Closing" transform="translate(80.58,443.5)"><rect x="-41" y="-21.5" width="82.01" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Closing</text></g><g class="pele-node pele-state" data-id="Closed" transform="translate(214.46,554.5)"><rect x="-39.34" y="-21.5" width="78.68" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Closed</text></g><g class="pele-node pele-state" data-id="History" transform="translate(214.46,665.5)"><rect x="-39.33" y="-21.5" width="78.66" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">History</text></g><g class="pele-node pele-state" data-id="Running" transform="translate(222.46,218)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Running</text></g><g class="pele-note" data-id="Running----note-10" transform="translate(408.37,218)"><path d="M-97.98,-25H89.98L97.98,-17V25H-97.98Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M89.98,-25V-17H97.98" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Closing hides the drawer.</tspan><tspan x="0" y="13.05">The command keeps running.</tspan></text></g></g></g></svg>