<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 900 517" width="900" height="517" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="450" y="40.75">Native HTTPS route lookup</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M462.33,38C462.33,53.5 227.77,53.5 227.77,69L227.77,75"/><path class="pele-marker" d="M227.77,82L224.41,74L231.13,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M211.77,125L211.77,134.63C211.77,139.61 88.88,142.02 88.88,147L88.88,171C88.88,176.63 150.32,176.63 150.32,182.25L150.32,186"/><path class="pele-marker" d="M150.32,193L146.96,185L153.68,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M166.32,193L166.32,183.38C166.32,177.19 227.77,177.19 227.77,171L227.77,132"/><path class="pele-marker" d="M227.77,125L231.13,133L224.41,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M158.32,236L158.32,278.5C158.32,285.44 215.45,285.44 215.45,292.38L215.45,297"/><path class="pele-marker" d="M215.45,304L212.09,296L218.81,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M231.45,304L231.45,291C231.45,281.75 293.78,281.75 293.78,272.5L293.78,153C293.78,145.13 243.77,145.13 243.77,137.25L243.77,132"/><path class="pele-marker" d="M243.77,125L247.13,133L240.41,133Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M462.33,38C462.33,53.5 672.77,53.5 672.77,69L672.77,75"/><path class="pele-marker" d="M672.77,82L669.41,74L676.13,74Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M656.77,125C656.77,136 492.42,136 492.42,147L492.42,186"/><path class="pele-marker" d="M492.42,193L489.06,185L495.78,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M672.77,125L672.77,186"/><path class="pele-marker" d="M672.77,193L669.41,185L676.13,185Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M688.77,125C688.77,139 818.29,139 818.29,153L818.29,347C818.29,374.5 784.04,374.5 784.04,402L784.04,408"/><path class="pele-marker" d="M784.04,415L780.68,407L787.4,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M492.42,236L492.42,297"/><path class="pele-marker" d="M492.42,304L489.06,296L495.78,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M471.3,347C471.3,356.25 406.35,356.25 406.35,365.5L406.35,408"/><path class="pele-marker" d="M406.35,415L402.99,407L409.71,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M513.54,347C513.54,356.25 578.49,356.25 578.49,365.5L578.49,389.5C578.49,393.56 768.04,399.31 768.04,403.38L768.04,408"/><path class="pele-marker" d="M768.04,415L764.68,407L771.4,407Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge1"><rect x="26" y="149" width="125.75" height="20" rx="3" fill="var(--_bg)"/><text x="88.88" y="163.55" text-anchor="middle">claim, stage or retire</text></g><g class="pele-edge-label" data-id="edge2"><rect x="171.75" y="149" width="112.03" height="20" rx="3" fill="var(--_bg)"/><text x="227.77" y="163.55" text-anchor="middle">rename to commit</text></g><g class="pele-edge-label" data-id="edge3"><rect x="79.18" y="256.5" width="158.29" height="20" rx="3" fill="var(--_bg)"/><text x="158.32" y="271.05" text-anchor="middle">interrupted before rename</text></g><g class="pele-edge-label" data-id="edge4"><rect x="237.04" y="204.5" width="113.48" height="20" rx="3" fill="var(--_bg)"/><text x="293.78" y="219.05" text-anchor="middle">validated recovery</text></g><g class="pele-edge-label" data-id="edge6"><rect x="433.15" y="149" width="118.53" height="20" rx="3" fill="var(--_bg)"/><text x="492.42" y="163.55" text-anchor="middle">verify live publisher</text></g><g class="pele-edge-label" data-id="edge7"><rect x="612.78" y="149" width="119.97" height="20" rx="3" fill="var(--_bg)"/><text x="672.77" y="163.55" text-anchor="middle">no committed claim</text></g><g class="pele-edge-label" data-id="edge8"><rect x="763.35" y="204.5" width="109.88" height="20" rx="3" fill="var(--_bg)"/><text x="818.29" y="219.05" text-anchor="middle">observation failed</text></g><g class="pele-edge-label" data-id="edge9"><rect x="426.28" y="256.5" width="132.27" height="20" rx="3" fill="var(--_bg)"/><text x="492.42" y="271.05" text-anchor="middle">reopen committed file</text></g><g class="pele-edge-label" data-id="edge10"><rect x="320.71" y="367.5" width="171.27" height="20" rx="3" fill="var(--_bg)"/><text x="406.35" y="382.05" text-anchor="middle">same claim and live process</text></g><g class="pele-edge-label" data-id="edge11"><rect x="511.98" y="367.5" width="133.01" height="20" rx="3" fill="var(--_bg)"/><text x="578.49" y="382.05" text-anchor="middle">changed or unverified</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(462.33,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Committed" transform="translate(227.77,103.5)"><rect x="-52.25" y="-21.5" width="104.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Committed</text></g><g class="pele-node pele-state wait" data-id="Pending" transform="translate(158.32,214.5)"><rect x="-43.52" y="-21.5" width="87.04" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Pending</text></g><g class="pele-node pele-state" data-id="Retained" transform="translate(223.45,325.5)"><rect x="-46.01" y="-21.5" width="92.03" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Retained</text></g><g class="pele-node pele-state" data-id="FirstSnapshot" transform="translate(672.77,103.5)"><rect x="-62.27" y="-21.5" width="124.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">FirstSnapshot</text></g><g class="pele-node pele-state" data-id="PublisherObserved" transform="translate(492.42,214.5)"><rect x="-79.77" y="-21.5" width="159.55" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">PublisherObserved</text></g><g class="pele-node pele-state" data-id="MissingClaim" transform="translate(672.77,214.5)"><rect x="-60.58" y="-21.5" width="121.16" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">MissingClaim</text></g><g class="pele-node pele-state fail" data-id="Unverified" transform="translate(776.04,436.5)"><rect x="-49.76" y="-21.5" width="99.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Unverified</text></g><g class="pele-node pele-state" data-id="SecondSnapshot" transform="translate(492.42,325.5)"><rect x="-73.12" y="-21.5" width="146.24" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">SecondSnapshot</text></g><g class="pele-node pele-state ok" data-id="Allowed" transform="translate(406.35,436.5)"><rect x="-42.26" y="-21.5" width="84.52" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Allowed</text></g></g></g></svg>