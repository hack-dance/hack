bel" x="0" y="5.25" text-anchor="middle">ReceiptWritten</text></g><g class="pele-node pele-state" data-id="ComputeAbsent" transform="translate(261.74,672.5)"><rect x="-69.78" y="-21.5" width="139.55" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ComputeAbsent</text></g><g class="pele-node pele-state" data-id="Stopped" transform="translate(261.74,783.5)"><rect x="-43.94" y="-21.5" width="87.88" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stopped</text></g><g class="pele-node pele-state ok" data-id="Restored" transform="translate(162.48,894.5)"><rect x="-46.43" y="-21.5" width="92.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Restored</text></g><g class="pele-node pele-state fail" data-id="Refused" transform="translate(360.99,894.5)"><rect x="-43.93" y="-21.5" width="87.86" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Refused</text></g><g class="pele-node pele-state" data-id="CleanupIntent" transform="translate(261.74,218)"><rect x="-62.69" y="-21.5" width="125.39" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">CleanupIntent</text></g><g class="pele-node pele-state" data-id="ShutdownWritten" transform="translate(101.68,558)"><rect x="-73.1" y="-21.5" width="146.21" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">ShutdownWritten</text></g><g class="pele-note" data-id="CleanupIntent----note-12" transform="translate(469.65,218)"><path d="M-101.22,-25H93.22L101.22,-17V25H-101.22Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M93.22,-25V-17H101.22" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">Crash before FinishCleanup</tspan><tspan x="0" y="13.05">resumes from committed state.</tspan></text></g><g class="pele-note" data-id="ShutdownWritten----note-11" transform="translate(306.29,558)"><path d="M-87.5,-25H79.5L87.5,-17V25H-87.5Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M79.5,-25V-17H87.5" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-3.95">INV IdentifiableByRestore</tspan><tspan x="0" y="13.05">Receipt ID equals stop ID.</tspan></text></g></g></g></svg>