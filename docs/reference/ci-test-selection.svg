<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 1397 686" width="1397" height="686" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_event_full_0"><path d="M565.68,89.91C565.68,98.24 118.69,112.09 118.69,120.41L118.69,197.71"/><path class="pele-marker" d="M118.69,204.71L115.33,196.71L122.05,196.71Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_full_release_0"><path d="M118.69,268.71L118.69,366.51"/><path class="pele-marker" d="M118.69,373.51L115.33,365.51L122.05,365.51Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_event_labels_0"><path d="M581.68,99.91L581.68,187.59"/><path class="pele-marker" d="M581.68,194.59L578.32,186.59L585.04,186.59Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_labels_light_0"><path d="M565.68,268.83C565.68,295.42 353.1,295.42 353.1,322.01L353.1,366.51"/><path class="pele-marker" d="M353.1,373.51L349.74,365.51L356.46,365.51Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_light_deferred_0"><path d="M353.1,437.51L353.1,478.51"/><path class="pele-marker" d="M353.1,485.51L349.74,477.51L356.46,477.51Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_deferred_prgate_0"><path d="M353.1,549.51C353.1,567.01 538.56,567.01 538.56,584.51L538.56,590.51"/><path class="pele-marker" d="M538.56,597.51L535.2,589.51L541.92,589.51Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_labels_tier_0"><path d="M581.68,278.83L581.68,375.01"/><path class="pele-marker" d="M581.68,382.01L578.32,374.01L585.04,374.01Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_labels_allpr_0"><path d="M597.68,268.83C597.68,295.42 798.56,295.42 798.56,322.01L798.56,375.01"/><path class="pele-marker" d="M798.56,382.01L795.2,374.01L801.92,374.01Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_tier_prgate_0"><path d="M581.68,429.01L581.68,590.51"/><path class="pele-marker" d="M581.68,597.51L578.32,589.51L585.04,589.51Z" fill="var(--