# Hack desktop app (HACK-2214): unsupported preview.
# Separate from the default gates and the release workflow, and not a
# required check. Linux build of the app plus the `core` unit tests.
name: Desktop app

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [next]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Desktop app (Linux build, core tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Core tests (no daemon, no Docker)
        env:
          HACK_DAEMON_AUTOSTART_DISABLE: "1"
        run: cargo test --locked -p hack-desktop-core
      - name: Clippy
        run: cargo clippy --locked --all-targets --features hack-desktop/screenshots -- -D warnings
      - name: Build app
        run: cargo build --locked -p hack-desktop
