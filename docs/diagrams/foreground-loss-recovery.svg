fresh up, Preparing]</text></g><g class="pele-edge-label" data-id="edge14"><rect x="379.44" y="1065" width="94.68" height="20" rx="3" fill="var(--_bg)"/><text x="426.78" y="1079.55" text-anchor="middle">down --recover</text></g><g class="pele-edge-label" data-id="edge15"><rect x="530.57" y="1176" width="53.53" height="20" rx="3" fill="var(--_bg)"/><text x="557.33" y="1190.55" text-anchor="middle">hack up</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(430.78,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state wait" data-id="Requested" transform="translate(430.78,238.5)"><rect x="-52.27" y="-21.5" width="104.54" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Requested</text></g><g class="pele-node pele-state live" data-id="Serving" transform="translate(229.91,484.5)"><rect x="-41.42" y="-21.5" width="82.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Serving</text></g><g class="pele-node pele-state fail" data-id="Lost" transform="translate(466.46,730.5)"><rect x="-30.17" y="-21.5" width="60.35" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Lost</text></g><g class="pele-node pele-state-choice" data-id="advice" transform="translate(466.46,811)"><polygon points="0,-15 15,0 0,15 -15,0" fill="var(--_s)" stroke="var(--_b)"/></g><g class="pele-node pele-state wait" data-id="Up" transform="translate(557.33,1134)"><rect x="-28" y="-21.5" width="56" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)" style="stroke-width:1.6px;"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Up</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(488.03,1343.5)"