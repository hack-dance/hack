name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  # PR updates supersede earlier runs. Pushes need unique groups: even with
  # cancellation disabled, a shared group replaces an older pending run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Pull-request change scope (scripts/ci-change-scope.ts, HACK-1960). Pushes
    # to next/main and an unavailable diff are always `full`: every job and every
    # config compiler host. Pull requests run the config compiler on Linux only
    # and skip the jobs that cannot see their change (docs-only, TypeScript-only
    # and runtime-core-only scopes). Every run splits the bun shards into macOS
    # and Linux pools (HACK-2028). The `test` and `docker-e2e` fan-ins still
    # report on every run.
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      compiler_hosts: ${{ steps.scope.outputs.compiler_hosts }}
      compiler_rust: ${{ steps.scope.outputs.compiler_rust }}
      runtime_core: ${{ steps.scope.outputs.runtime_core }}
      suite: ${{ steps.scope.outputs.suite }}
      test_layout: ${{ steps.scope.outputs.test_layout }}
      test_focus: ${{ steps.scope.outputs.test_focus }}
      docs_site: ${{ steps.scope.outputs.docs_site }}
    steps:
      # A pull-request checkout is GitHub's merge commit; its first parent is
      # the base tip, so HEAD^1..HEAD is exactly the pull request's change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun scripts/ci-change-scope.ts --event="$EVENT_NAME"

  config-compiler:
    name: Config compiler (${{ matrix.os }})
    needs: changes
    # Pull requests build and check on Linux x64 only; pushes and release
    # builds (release.yml, prerelease.yml) cover every compiler release host.
    if: ${{ needs.changes.outputs.compiler_hosts != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.compiler_hosts) }}
    runs-on: ${{ matrix.os }}
    # Intel needs time for full compiler, schema and bundle verification.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 30 || 15 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Verify release host architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bun -e 'if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected compiler release host");'
      # TypeScript-only pull requests cannot change the compiler crate, which
      # reads nothing outside packages/config-compiler.
      - name: Check and test the compiler crate
        if: ${{ needs.changes.outputs.compiler_rust == 'true' }}
        run: bun run check:config-compiler && bun run test:config-compiler
      - run: bun run build:config-compiler
      # Intentionally permanent: the owner test emits closed stage tokens only, never values.
      - name: Test private file sources and owner with the matching compiler
        env:
          HACK_TEST_NATIVE_FILE_OWNER_DIAGNOSTICS: "1"
        run: bun test tests/native-compose-file-sources.test.ts tests/native-compose-file-owner.test.ts
      - name: Test explicit imported jobs and readiness with the matching compiler
        run: HACK_TEST_NATIVE_COMPILER_BINARY="$PWD/dist/hack-config-compiler" bun test tests/native-config-import-jobs.test.ts tests/native-config-import-readiness.test.ts
      # The test shards run on macOS, where this test skips. Fail if it skips here too.
      - name: Test the native Linux primary-checkout listing refusal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bun test tests/project-env-local-inheritance.test.ts --test-name-pattern 'on Linux, a primary checkout' 2>&1 | tee "$RUNNER_TEMP/listing-refusal.log"
          grep -Eq '^ *1 pass$' "$RUNNER_TEMP/listing-refusal.log"
      - name: Independently validate generated schema shape corpus
        run: |
          python3 -m venv "$RUNNER_TEMP/config-schema"
          "$RUNNER_TEMP/config-schema/bin/python" -m pip install -r scripts/config-schema-requirements.txt
          "$RUNNER_TEMP/config-schema/bin/python" scripts/check-config-schema.py
      - name: Test transport, projections and compiled bundle without host toolchains
        run: |
          bunx ultracite check scripts/build-config-compiler.ts scripts/build-release.ts scripts/check-release-config-compiler.ts scripts/check-config-compiler-cli.ts tests/config-compiler-build.test.ts tests/native-config-compiler.test.ts tests/native-config-command.test.ts tests/native-config-dto.test.ts tests/native-project-inputs.test.ts tests/native-project-inputs-acquisition-race.test.ts tests/release-download-installer.test.ts
          bun test tests/config-compiler-build.test.ts tests/native-config-compiler.test.ts tests/native-config-command.test.ts tests/native-config-dto.test.ts tests/native-project-inputs.test.ts tests/native-project-inputs-acquisition-race.test.ts
          bun run --cwd packages/cli typecheck
          bun test tests/release-download-installer.test.ts
          bun run build:release --skip-tests --out=dist/config-compiler-release
          bun scripts/check-release-config-compiler.ts dist/config-compiler-release
          bun scripts/check-config-compiler-cli.ts
          bunx ultracite check scripts/check-native-env-plan-cli.ts tests/native-env-plan-transport.test.ts tests/native-env-metadata.test.ts
          bun test tests/native-env-plan-transport.test.ts tests/native-env-metadata.test.ts tests/project-env-config.test.ts tests/project-env-metadata.test.ts
          bun scripts/check-native-env-plan-cli.ts
          bunx ultracite check scripts/check-native-host-plan-cli.ts tests/native-host-plan-transport.test.ts src/lib/native-host-plan-protocol.ts
          bun test tests/native-host-plan-transport.test.ts
          bun scripts/check-native-host-plan-cli.ts
          bunx ultracite check scripts/check-native-routing-plan-cli.ts src/lib/native-routing-plan-protocol.ts src/lib/native-routing-inputs.ts tests/native-routing-plan-transport.test.ts tests/native-routing-inputs.test.ts tests/native-routing-input-race.test.ts tests/native-routing-project.test.ts
          bun test tests/native-routing-plan-transport.test.ts tests/native-routing-inputs.test.ts tests/native-routing-input-race.test.ts tests/native-routing-project.test.ts
          bun scripts/check-native-routing-plan-cli.ts
          bunx ultracite check scripts/check-native-endpoint-plan-cli.ts src/lib/native-endpoint-plan-protocol.ts tests/native-endpoint-plan-transport.test.ts tests/native-endpoint-project.test.ts
          bun test tests/native-endpoint-plan-transport.test.ts tests/native-endpoint-project.test.ts
          bun scripts/check-native-endpoint-plan-cli.ts
          bunx ultracite check scripts/check-native-process-plan-cli.ts src/lib/native-process-plan-protocol.ts tests/native-process-plan-transport.test.ts tests/native-process-project.test.ts
          bun test tests/native-process-plan-transport.test.ts tests/native-process-project.test.ts
          bun scripts/check-native-process-plan-cli.ts
          bunx ultracite check scripts/check-native-acquisition-plan-cli.ts src/lib/native-acquisition-plan-protocol.ts tests/native-acquisition-plan-transport.test.ts tests/native-acquisition-project.test.ts
          bun test tests/native-acquisition-plan-transport.test.ts tests/native-acquisition-project.test.ts
          bun scripts/check-native-acquisition-plan-cli.ts
          bunx ultracite check scripts/check-native-config-import-cli.ts tests/native-config-import-plan.test.ts tests/native-config-import-preview.test.ts
          bun test tests/native-config-import-plan.test.ts tests/native-config-import-preview.test.ts
          bun scripts/check-native-config-import-cli.ts

  state-models:
    name: Runtime state models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mise for model-helper contract tests
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.12"
          install: false
          cache: false
          env: false
      - name: Validate release workflow syntax
        run: |
          for attempt in 1 2 3; do
            if mise install actionlint@1.7.12; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          mise x actionlint@1.7.12 -- actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/release-prepare.yml .github/workflows/prerelease.yml .github/workflows/bun-crash-experiment.yml
      - name: Fetch pinned model checker
        run: curl --fail --location --retry 2 --max-time 60 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
      - name: Check evidence validation and models
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: |
          python3 -m unittest discover -s .ai/skills/hack-repo-tla/tests
          bun test tests/tla-result.test.ts
          bun run test:models
      - name: Check prepared-base benchmark harness controls
        run: python3 -m unittest discover -s tests/python -p test_prepared_base_benchmark.py
      - name: Check native Compose overhead harness controls
        run: python3 -m unittest discover -s tests/python -p test_native_compose_benchmark.py
      - name: Check native frontend acceptance controls
        run: python3 -m unittest discover -s tests/python -p test_native_frontend_acceptance.py
      - name: Check application benchmark protocol controls
        run: |
          python3 scripts/check-application-benchmark-protocol.py
          python3 -m unittest discover -s tests/python -p test_application_benchmark_protocol.py

  runtime-core:
    name: Candidate core (${{ matrix.os }})
    needs: changes
    # Skipped only for pull requests that change no Rust, toolchain or
    # workflow file: the crate reads nothing outside packages/runtime-core.
    if: ${{ needs.changes.outputs.runtime_core == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install pinned Zig for guest helpers
        shell: bash
        run: |
          set -euo pipefail
          # Keep the mise.toml pin; avoid installer fallback to obsolete archive names
          # when the upstream download index is unavailable or malformed.
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              platform=x86_64-linux
              checksum=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
              ;;
            macOS-ARM64)
              platform=aarch64-macos
              checksum=3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
              ;;
            macOS-X64)
              platform=x86_64-macos
              checksum=375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f
              ;;
            *) echo "Unsupported Zig runner platform" >&2; exit 1 ;;
          esac
          archive="zig-${platform}-0.15.2.tar.xz"
          destination="${RUNNER_TEMP}/candidate-zig"
          mkdir -p "$destination"
          curl --fail --location --retry 3 "https://ziglang.org/download/0.15.2/${archive}" -o "$destination/$archive"
          (cd "$destination" && echo "$checksum  $archive" | shasum -a 256 --check)
          tar -xf "$destination/$archive" -C "$destination"
          echo "$destination/zig-${platform}-0.15.2" >> "$GITHUB_PATH"
      - name: Check candidate formatting
        run: cargo fmt --manifest-path packages/runtime-core/Cargo.toml --check
      - name: Lint candidate core
        run: cargo clippy --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-targets --jobs 2 -- -D warnings
      - name: Test candidate isolation contracts
        run: cargo test --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --jobs 2
      - name: Lint candidate optional features
        run: cargo clippy --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-targets --all-features --jobs 2 -- -D warnings
      - name: Test candidate optional feature contracts
        run: cargo test --locked --manifest-path packages/runtime-core/Cargo.toml --target-dir .hack-local/target --all-features --jobs 2
      - name: Build and inspect local candidate
        run: |
          ./scripts/build-hack-local.sh
          ./hack-local info --json
      - name: Check release candidate carries no kill harness
        # The all-features test step built the debug candidate with node-kill-harness,
        # so its marker proves this grep can see the harness when it is compiled in.
        run: |
          marker=node-kill-harness-
          LC_ALL=C grep -q -a "$marker" .hack-local/target/debug/hack-runtime-candidate
          if LC_ALL=C grep -q -a "$marker" .hack-local/target/release/hack-runtime-candidate; then
            echo "release hack-runtime-candidate contains the test-only kill harness" >&2
            exit 1
          fi

  docs-site:
    # The documentation corpus checks, the site build Vercel runs, and an HTTP
    # smoke of that build. Pull requests run it only when they change docs/,
    # site/, scripts/docs/ or this workflow; pushes always run it.
    name: docs site
    needs: changes
    if: ${{ needs.changes.outputs.docs_site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run docs:prepare
      - run: bun run docs:check
      - run: bun run docs:typecheck
      # The Vercel build command (site/vercel.json) after docs:prepare.
      - run: bun run --cwd site build
      - name: HTTP smoke of the production build
        run: |
          bun run --cwd site start --port 3411 >"$RUNNER_TEMP/docs-site.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3411/docs; then
              break
            fi
            sleep 1
          done
          if ! bun run docs:smoke http://127.0.0.1:3411; then
            cat "$RUNNER_TEMP/docs-site.log"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@v1
        with:
          version: 8.30.1
          run: 'false'
      - name: Scan checked-out commit history
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
        run: |
          "$GITLEAKS_BIN" git . \
            --config .gitleaks.toml \
            --redact \
            --log-opts='--full-history --diff-filter=tuxdb HEAD' \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

  runtime-images:
    needs: changes
    if: ${{ needs.changes.outputs.suite == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build full runtime image
        run: |
          bun run scripts/build-node-runtime-image.ts \
            --variant node-runtime \
            --platform linux/amd64 \
            --tag hack-runtime-ci:full
      - name: Smoke full runtime image
        run: |
          docker run --rm --entrypoint hack hack-runtime-ci:full --help >/tmp/hack-full-help.txt
          grep -q "hack" /tmp/hack-full-help.txt
      - name: Build slim runtime image
        run: |
          bun run scripts/build-node-runtime-image.ts \
            --variant slim \
            --platform linux/amd64 \
            --tag hack-runtime-ci:slim
      - name: Smoke slim runtime image defaults
        run: |
          docker run --rm --entrypoint sh hack-runtime-ci:slim -lc 'command -v bun >/dev/null && command -v hack >/dev/null && test "${HACK_EXECUTION_MODE}" = "codex" && test "${HACK_DAEMON_DISABLE_DOCKER_EVENTS}" = "1" && hack --help >/tmp/hack-help.txt && grep -q "Usage:" /tmp/hack-help.txt'
      - name: Smoke slim runtime mounted-project env flow
        run: bash scripts/portable-container-smoke.sh hack-runtime-ci:slim linux/amd64

  docker-e2e-shard:
    # One deterministic slice of the default e2e set per runner (tests/e2e/shard.ts).
    name: docker-e2e shard ${{ matrix.shard }}/4
    needs: changes
    if: ${{ needs.changes.outputs.suite == 'true' }}
    strategy:
      # Let every shard finish so one failure still reports the other scenarios.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # The serial job measured 85-125 min on the shared Blacksmith engine. Each shard
    # keeps that whole budget, so it bounds a hung engine, not a slow pass.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Docker E2E shard
        uses: ./.github/actions/docker-e2e-shard
        with:
          shard: ${{ matrix.shard }}
          count: "4"
          extra-shard: "4"

  docker-e2e:
    # The single docker-e2e signal for the prerelease exact-head gate and branch checks.
    # It always runs: cancelled-only results are non-failures, and shards skipped
    # because the change scope excludes the suite pass; failures, a failed scope
    # and any other skip still fail. Prerelease gates separately require every shard.
    needs: [changes, docker-e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject failed or skipped docker-e2e shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          SUITE: ${{ needs.changes.outputs.suite }}
          SHARD_RESULT: ${{ needs.docker-e2e-shard.result }}
        run: |
          if [ "$CHANGES_RESULT" = "cancelled" ]; then
            echo "change scope was cancelled without failure; aggregate is non-failing"
            exit 0
          fi
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change scope did not succeed (result: $CHANGES_RESULT)"
            exit 1
          fi
          if [ "$SUITE" = "false" ] && [ "$SHARD_RESULT" = "skipped" ]; then
            echo "docker-e2e is out of scope for this pull request (scope: $SCOPE)"
            exit 0
          fi
          if [ "$SHARD_RESULT" = "cancelled" ]; then
            echo "shards were cancelled without failure; aggregate is non-failing"
            exit 0
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "docker-e2e shards did not all succeed (result: $SHARD_RESULT)"
            exit 1
          fi

  test-shard:
    # One deterministic slice of the `bun run test` file set per runner
    # (scripts/test-shard-plan.ts, HACK-1381). The serial job took 37-42 min and
    # reached the 60 min limit on slow runners; each file now runs in its own
    # `bun test` process with a start/result line, so a hang names its file.
    name: test shard ${{ matrix.shard }}/8
    needs: changes
    if: ${{ needs.changes.outputs.suite == 'true' }}
    strategy:
      # Let every shard finish so one failure still reports the other files.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # `pooled` (pushes and pull requests, HACK-2028): shards 1-3 run the
    # platform-sensitive files on macOS and shards 4-8 the rest on Linux
    # (POOLED_MACOS_SHARDS in scripts/test-shard-plan.ts; the runner refuses a
    # shard on the wrong host). Release and prerelease build hosts are unchanged.
    runs-on: ${{ (needs.changes.outputs.test_layout == 'pooled' && matrix.shard > 3) && 'ubuntu-latest' || 'macos-15' }}
    # Eight shards keep the slower GitHub-hosted macOS jobs below the existing
    # 30 min file-runner deadline; the 40 min job limit bounds a hung runner.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The one-off checks and builds run once, on shard 8 (Linux when pooled).
      - name: Typecheck (Turbo)
        if: matrix.shard == 8
        run: bun run turbo:typecheck
      - name: Privacy check
        if: matrix.shard == 8
        run: bun run privacy:check
      - name: Quality checks (Turbo)
        if: matrix.shard == 8
        run: bun run turbo:check
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Prepare matching compiler for private file owner tests
        run: bun run build:config-compiler
      # Runs check:bun-version and test:preflight as `bun run test` does, then
      # verifies that the shards (and, when pooled, the two pools) cover the
      # full test file set exactly once.
      - name: Tests (shard)
        env:
          HACK_TEST_SHARD: ${{ matrix.shard }}/8
          HACK_TEST_LAYOUT: ${{ needs.changes.outputs.test_layout }}
        run: bun scripts/test-shard.ts run --shard="$HACK_TEST_SHARD" --layout="$HACK_TEST_LAYOUT" --durations-out="$RUNNER_TEMP/test-shard-durations.json"
      - name: Preserve measured file durations
        # Per-file seconds only; refresh scripts/test-shard-durations.json with
        # `bun scripts/test-shard.ts update-durations`.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-shard-durations.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build CLI
        if: matrix.shard == 8
        run: bun run build
      - name: Build release smoke (no tests)
        if: matrix.shard == 8
        run: bun run build:release --skip-tests --no-clean --out=dist/release-ci

  test-focus:
    # Docs-only and runtime-core-only pull requests run, instead of the bun
    # shards, every test file that names those sources (scripts/test-shard-plan.ts
    # FOCUS_SOURCE). It always runs and passes as a no-op otherwise, because the
    # prerelease gate requires every job of a push run to succeed without skips.
    name: test focus
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Report scope
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          TEST_FOCUS: ${{ needs.changes.outputs.test_focus }}
        run: |
          echo "scope ${SCOPE}; focused tests: ${TEST_FOCUS:-none, the bun shards run}"
      - name: Checkout
        if: ${{ needs.changes.outputs.test_focus != '' }}
        uses: actions/checkout@v4
      - name: Setup Bun
        if: ${{ needs.changes.outputs.test_focus != '' }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        if: ${{ needs.changes.outputs.test_focus != '' }}
        run: bun install --frozen-lockfile
      - name: Privacy check
        if: ${{ needs.changes.outputs.test_focus != '' }}
        run: bun run privacy:check
      - if: ${{ needs.changes.outputs.test_focus != '' }}
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Prepare matching compiler for private file owner tests
        if: ${{ needs.changes.outputs.test_focus != '' }}
        run: bun run build:config-compiler
      - name: Focused tests
        if: ${{ needs.changes.outputs.test_focus != '' }}
        env:
          TEST_FOCUS: ${{ needs.changes.outputs.test_focus }}
        run: bun scripts/test-shard.ts run --focus="$TEST_FOCUS"

  test:
    # The required `test` check (repository ruleset) for `next` and `main`. It
    # always runs. When the change scope runs the suite, every bun shard must
    # succeed; when it runs a focus instead, the focused job must. A cancelled
    # result is a non-failure, while a failure, a failed scope or any skip of
    # the job in scope still fails rather than surfacing as a skipped check.
    needs: [changes, test-shard, test-focus]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject failed or skipped test shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          SUITE: ${{ needs.changes.outputs.suite }}
          TEST_FOCUS: ${{ needs.changes.outputs.test_focus }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
          FOCUS_RESULT: ${{ needs.test-focus.result }}
        run: |
          if [ "$CHANGES_RESULT" = "cancelled" ]; then
            echo "change scope was cancelled without failure; aggregate is non-failing"
            exit 0
          fi
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change scope did not succeed (result: $CHANGES_RESULT)"
            exit 1
          fi
          if [ "$FOCUS_RESULT" != "success" ] && [ "$FOCUS_RESULT" != "cancelled" ]; then
            echo "test focus did not succeed (result: $FOCUS_RESULT)"
            exit 1
          fi
          if [ "$SUITE" != "true" ]; then
            if [ -z "$TEST_FOCUS" ]; then
              echo "scope $SCOPE runs neither the bun shards nor a focus"
              exit 1
            fi
            SHARD_RESULT="$FOCUS_RESULT"
            echo "bun shards are out of scope ($SCOPE); gating on the focused tests ($TEST_FOCUS)"
          fi
          if [ "$SHARD_RESULT" = "cancelled" ]; then
            echo "shards were cancelled without failure; aggregate is non-failing"
            exit 0
          fi
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "test shards did not all succeed (result: $SHARD_RESULT)"
            exit 1
          fi

  linux-process-lifetime:
    needs: changes
    if: ${{ needs.changes.outputs.suite == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"
      - name: Require native regression tools
        run: |
          command -v python3
          command -v lsof
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run process and terminal regressions
        run: bun test tests/daemon-command.test.ts tests/daemon-orphan.test.ts tests/host-exec-lifetime.test.ts tests/host-exec-tty.test.ts tests/shell-observation.test.ts tests/shared-host-lifecycle.test.ts tests/project-shared-helpers.test.ts
