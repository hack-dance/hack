<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 573 719" width="573" height="719" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="286.5" y="40.75">NSS observe-only read admission</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_discover_guard_0"><path d="M232.15,106L232.15,147"/><path class="pele-marker" d="M232.15,154L228.79,146L235.51,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_guard_unknown_0"><path d="M210.95,268.25C210.95,285.13 119.95,285.13 119.95,302L119.95,346.5"/><path class="pele-marker" d="M119.95,353.5L116.59,345.5L123.31,345.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_guard_query_0"><path d="M253.35,268.25C253.35,285.13 344.35,285.13 344.35,302L344.35,346.5"/><path class="pele-marker" d="M344.35,353.5L340.99,345.5L347.71,345.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_query_recheck_0"><path d="M344.35,400.5L344.35,441.5"/><path class="pele-marker" d="M344.35,448.5L340.99,440.5L347.71,440.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_recheck_discard_0"><path d="M323.49,562.25C323.49,579.02 230.28,579.02 230.28,595.79L230.28,640.29"/><path class="pele-marker" d="M230.28,647.29L226.92,639.29L233.64,639.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_recheck_result_0"><path d="M365.21,562.25C365.21,579.02 458.42,579.02 458.42,595.79L458.42,640.29"/><path class="pele-marker" d="M458.42,647.29L455.06,639.29L461.78,639.29Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_guard_unknown_0"><rect x="107.64" y="304" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="119.95" y="318.55" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_guard_query_0"><rect x="329.15" y="304" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="344.35" y="318.55" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_recheck_discard_0"><rect x="217.97" y="597.79" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="230.28" y="612.34" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_recheck_result_0"><rect x="443.22" y="597.79" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="458.42" y="612.34" text-anchor="middle">Yes</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="discover" transform="translate(232.15,82.5)"><rect x="-103.44" y="-23.5" width="206.88" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Discover selected profiles</text></g><g class="pele-node pele-shape-diam" data-id="guard" transform="translate(232.15,217.75)"><polygon points="0,-63.75 102,0 0,63.75 -102,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Read safety proven?</text></g><g class="pele-node pele-shape-rect wait" data-id="unknown" transform="translate(119.95,377)"><rect x="-95.95" y="-23.5" width="191.9" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Unknown without query</text></g><g class="pele-node pele-shape-rect" data-id="query" transform="translate(344.35,377)"><rect x="-88.45" y="-23.5" width="176.91" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Query SQL database</text></g><g class="pele-node pele-shape-diam" data-id="recheck" transform="translate(344.35,511.9)"><polygon points="0,-63.39 101.43,0 0,63.39 -101.43,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Pinned identities</tspan><tspan x="0" y="15.25">unchanged?</tspan></text></g><g class="pele-node pele-shape-rect wait" data-id="discard" transform="translate(230.28,670.79)"><rect x="-98.02" y="-23.5" width="196.05" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Unknown; discard result</text></g><g class="pele-node pele-shape-rect ok" data-id="result" transform="translate(458.42,670.79)"><rect x="-90.12" y="-23.5" width="180.24" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Report database trust</text></g></g></svg>